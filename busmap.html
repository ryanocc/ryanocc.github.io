<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TfGM – Stops With No Service</title>
  <meta http-equiv="Cache-Control" content="no-store" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    :root{
      --bg:#0b0b0e;
      --text:#e9e9ef;
      --accent:#ffd100;       /* TfGM yellow */
      --liveGreen:#19c37d;
      --errorRed:#ff4d4f;
      --border:#23232c;
      --markerFill:#ffd100;
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }

    body{
      margin:0; padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Barlow Semi Condensed", system-ui, sans-serif;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    /* Header */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 24px;
      background:#0b0b0e;
      border-bottom:1px solid #1d1d25;
      gap:16px;
    }
    .leftHeader, .rightHeader{
      display:flex; align-items:center; gap:16px;
    }
    .title{
      margin:0;
      font-size:44px;
      font-weight:900;
      letter-spacing:-0.3px;
    }
    .subtitle{
      font-size:18px; font-weight:700; opacity:0.8;
    }
    .status-pill{
      padding:10px 16px;
      border-radius:999px;
      font-size:18px;
      font-weight:800;
      background:var(--liveGreen);
      color:#000;
      box-shadow:0 0 0 2px rgba(255,255,255,0.08),
                 0 4px 14px rgba(0,0,0,0.25);
      transition:background .2s ease,color .2s ease;
      white-space:nowrap;
    }
    .status-error{
      background:var(--errorRed);
      color:#fff;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#14141a;
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 12px;
      font-weight:800;
      font-size:16px;
      color:#cfd0d9;
      white-space:nowrap;
    }
    .badge .dot{
      width:10px; height:10px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 0 1px #000 inset;
    }

    main{
      padding:0 24px 24px;
      display:flex; flex-direction:column;
      flex:1 1 auto; min-height:0;
    }

    .mapWrap{
      margin-top:14px;
      flex:1 1 auto;
      min-height:0;
      border-radius:16px;
      overflow:hidden;
      border:2px solid #22222b;
      box-shadow:
        0 6px 18px rgba(0,0,0,0.45),
        0 1px 0 rgba(255,255,255,0.04) inset;
    }

    #map{ width:100%; height:100%; }

    /* Leaflet popup dark style */
    .leaflet-container a{ color:#111; }
    .leaflet-popup-content-wrapper{
      background:#0f0f14;
      color:#f0f0f5;
      border-radius:12px;
      border:1px solid #2a2a33;
    }
    .leaflet-popup-tip{ background:#0f0f14; }

    .popupTitle{
      font-weight:900;
      font-size:18px;
      margin-bottom:4px;
    }
    .popupSub{
      font-size:14px;
      opacity:0.85;
    }
    .routesRow{
      margin-top:8px;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .rBadge{
      background:#ffd100;
      color:#000;
      padding:2px 8px;
      border-radius:999px;
      font-weight:900;
      font-size:14px;
      letter-spacing:-0.2px;
      box-shadow:0 0 0 1px rgba(0,0,0,0.6) inset;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="leftHeader">
      <h1 class="title">Stops With No Service</h1>
      <div class="subtitle">Live TfGM Situations</div>

      <div class="badge" title="Affected stops">
        <span class="dot"></span>
        <span id="stopsCount">0</span> stops
        <span style="opacity:.7;">/</span>
        <span id="stopsPlottable">0</span> mapped
      </div>
    </div>

    <div class="rightHeader">
      <div id="statusPill" class="status-pill">Live • --:--:--</div>
    </div>
  </header>

  <main>
    <div class="mapWrap">
      <div id="map" role="application" aria-label="Map of stops with no service"></div>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ========= CONFIG ========= */
    const API_KEY = "17889546a31fddeef67fca78252fb66951aedf1a";
    const FEED_URL =
      `https://occproxy-6dem.vercel.app/api/proxy?url=` +
      `https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;

    const REFRESH_MS = 60000; // 60 seconds

    const $ = s => document.querySelector(s);
    const parseISO = s => s ? new Date(s) : null;
    const normArr = v => Array.isArray(v) ? v : (v ? [v] : []);

    /* ========= STATUS PILL ========= */
    function fmtFull(d){
      return new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d);
    }
    function setStatus(ok){
      const pill = $("#statusPill");
      const t = fmtFull(new Date());
      if(ok){
        pill.classList.remove("status-error");
        pill.textContent = `Live • ${t}`;
      } else {
        pill.classList.add("status-error");
        pill.textContent = `Error • ${t}`;
      }
    }

    /* ========= VALIDITY FILTERS ========= */
    function isTfGM(sit){
      const ref = (sit?.ParticipantRef || "").trim().toLowerCase();
      return ref === "tfgm";
    }

    function isCurrentlyValid(sit){
      const now = new Date();
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

      if(!s) return false;
      if(s > now) return false;
      if(e && e < now) return false;
      return true;  // includes UFN
    }

    /* ========= FEED PARSING ========= */
    function extractSituationsJSON(json){
      const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
      if(!sd) return [];
      const sed = Array.isArray(sd.SituationExchangeDelivery)
        ? sd.SituationExchangeDelivery
        : sd.SituationExchangeDelivery ? [sd.SituationExchangeDelivery] : [];

      const out=[];
      for(const d of sed){
        const pe = d?.Situations?.PtSituationElement;
        if(Array.isArray(pe)) out.push(...pe);
        else if(pe) out.push(pe);
      }
      return out;
    }

    function extractSituationsXML(doc){
      const els = [...doc.querySelectorAll("PtSituationElement")];
      return els.map(el=>{
        const T = s => el.querySelector(s)?.textContent?.trim() || null;

        const stopsXML = [...el.querySelectorAll("Affects > StopPoints > AffectedStopPoint")];
        const stops = stopsXML.map(n=>{
          const ref = n.querySelector("StopPointRef")?.textContent?.trim() || null;
          const name = n.querySelector("StopPointName")?.textContent?.trim()
                     || n.querySelector("StopPointName > Value")?.textContent?.trim()
                     || null;
          const lat = parseFloat(
              n.querySelector("LocationForDisplay > Latitude")?.textContent ||
              n.querySelector("Location > Latitude")?.textContent || ""
          );
          const lon = parseFloat(
              n.querySelector("LocationForDisplay > Longitude")?.textContent ||
              n.querySelector("Location > Longitude")?.textContent || ""
          );
          return { ref, name, lat: isFinite(lat)?lat:null, lon: isFinite(lon)?lon:null };
        });

        const callNodes = [...el.querySelectorAll("AffectedVehicleJourney > AffectedCall")];
        const callStops = callNodes.map(n=>{
          const ref = n.querySelector("StopPointRef")?.textContent?.trim() || null;
          const name = n.querySelector("StopPointName")?.textContent?.trim()
                     || n.querySelector("PlaceName")?.textContent?.trim()
                     || null;
          return { ref, name, lat:null, lon:null };
        });

        const lines = [...el.querySelectorAll("AffectedVehicleJourney > LineRef, LineRef, PublishedLineName")]
                        .map(n=>n.textContent.trim()).filter(Boolean);

        return {
          ParticipantRef: T("ParticipantRef"),
          ValidityPeriod: {
            StartTime: T("ValidityPeriod > StartTime") || T("StartTime"),
            EndTime:   T("ValidityPeriod > EndTime")   || T("EndTime"),
          },
          Summary: T("Summary") || T("Description"),
          Affects: {
            StopPoints: { AffectedStopPoint: stops }
          },
          __affectedCallsStops: callStops,
          __lineRefs: lines
        };
      });
    }

    /* ========= DEDUPE STOPS ========= */
    function collectStops(situations){
      const stopsMap = new Map();

      for(const sit of situations){
        const stops1 = normArr(sit?.Affects?.StopPoints?.AffectedStopPoint);
        const stops2 = normArr(sit?.__affectedCallsStops);

        const all = [...stops1, ...stops2];

        // Routes = just lines associated with sit
        const routes = new Set(normArr(sit?.__lineRefs).map(String));

        for(const s of all){
          if(!s) continue;
          const ref = (s.ref || s.StopPointRef || "").trim();
          if(!ref) continue;

          const name = s.name || s.StopPointName || null;
          const lat = s.lat ?? null;
          const lon = s.lon ?? null;

          if(!stopsMap.has(ref)){
            stopsMap.set(ref, { ref, name, lat, lon, routes:new Set(), count:0 });
          }
          const entry = stopsMap.get(ref);

          routes.forEach(r => entry.routes.add(r));
          entry.count++;

          if(entry.lat == null && isFinite(lat)) entry.lat = lat;
          if(entry.lon == null && isFinite(lon)) entry.lon = lon;
          if((!entry.name || entry.name === "null") && name) entry.name = name;
        }
      }

      return stopsMap;
    }

    /* ========= MAP SETUP ========= */
    let map;
    let layerGroup;

    function initMap(){
      map = L.map("map", { preferCanvas:true });
      L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
          attribution:"&copy; OpenStreetMap &copy; CARTO",
          subdomains:"abcd",
          maxZoom:19
        }
      ).addTo(map);

      layerGroup = L.layerGroup().addTo(map);
      map.setView([53.4808, -2.2426], 10);
    }

    function updateStopsBadge(total, plottable){
      $("#stopsCount").textContent = String(total);
      $("#stopsPlottable").textContent = String(plottable);
    }

    function plotStops(stopsMap){
      layerGroup.clearLayers();

      const markers = [];
      let total=0, plotted=0;

      stopsMap.forEach(st=>{
        total++;
        if(!(isFinite(st.lat) && isFinite(st.lon))) return;

        plotted++;

        const popup = `
          <div class="popupTitle">${st.name || st.ref}</div>
          <div class="popupSub">${st.ref}</div>
          ${
            st.routes.size ?
            `<div class="routesRow">${[...st.routes].map(r=>`<span class="rBadge">${r}</span>`).join("")}</div>` 
            : ""
          }
        `;

        const marker = L.circleMarker([st.lat, st.lon], {
          radius:7,
          color:"black",
          weight:2,
          fillColor:getComputedStyle(document.documentElement).getPropertyValue("--markerFill").trim(),
          fillOpacity:0.95
        }).bindPopup(popup);

        marker.addTo(layerGroup);
        markers.push(marker);
      });

      if(markers.length){
        const fg = L.featureGroup(markers);
        map.fitBounds(fg.getBounds().pad(0.15), { animate:false });
      } else {
        map.setView([53.4808,-2.2426], 10);
      }

      updateStopsBadge(total, plotted);
    }

    /* ========= MAIN FETCH ========= */
    async function fetchData(){
      try{
        const res = await fetch(FEED_URL,{cache:"no-store"});
        if(!res.ok) throw new Error(res.status);

        let parsed;
        try{
          parsed = { type:"json", data: await res.clone().json() };
        }catch{
          parsed = { type:"xml", data: new DOMParser().parseFromString(await res.text(),"application/xml") };
        }

        let situations =
          parsed.type==="json"
            ? extractSituationsJSON(parsed.data)
            : extractSituationsXML(parsed.data);

        // Filter: ParticipantRef == TfGM AND currently valid
        situations = situations
          .filter(isTfGM)
          .filter(isCurrentlyValid);

        const stopsMap = collectStops(situations);
        plotStops(stopsMap);

        setStatus(true);

      }catch(e){
        console.error(e);
        setStatus(false);
      }
    }

    /* ========= STARTUP ========= */
    window.addEventListener("load", ()=>{
      initMap();
      fetchData();
      setInterval(fetchData, REFRESH_MS);
      setTimeout(()=>map.invalidateSize(),50);
    });

    window.addEventListener("resize", ()=>{
      if(map) map.invalidateSize();
    });
  </script>

</body>
</html>
