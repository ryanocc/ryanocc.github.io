<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blob March Tool (Route Erases Behind Blob)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- MapLibre (CSS + JS). Including CSS prevents common marker drift issues on zoom. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>

  <style>
    html, body { height: 100%; width: 100%; margin: 0; padding: 0; }
    #map { position: absolute; inset: 0; }

    /* Panel */
    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      width: 390px;
      max-width: calc(100vw - 24px);
      background: rgba(10, 12, 18, 0.82);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .panel header {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .panel header strong { font-size: 14px; }

    .hdrRight {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .hint {
      font-size: 12px;
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
    }

    .minBtn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 9px;
      line-height: 1;
      font-weight: 900;
      font-size: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.92);
      cursor: pointer;
      flex: 0 0 auto;
    }
    .minBtn:hover { filter: brightness(1.15); }
    .minBtn:active { transform: translateY(1px); }

    .panel .content { padding: 12px; display: grid; gap: 10px; }
    .panel.isMinimized .content { display: none; }
    .panel.isMinimized { width: 270px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    label { font-size: 12px; opacity: 0.85; display: block; margin-bottom: 4px; }
    input, select, button, textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #fff;
      padding: 10px;
      font-size: 13px;
      outline: none;
    }
    textarea { resize: vertical; }

    button {
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
    }
    button:hover { filter: brightness(1.12); }
    button:active { transform: translateY(1px); }

    .btnWarn { background: linear-gradient(180deg, rgba(255,210,64,0.22), rgba(255,210,64,0.08)); }
    .btnDanger { background: linear-gradient(180deg, rgba(255,80,80,0.22), rgba(255,80,80,0.08)); }
    .btnGood { background: linear-gradient(180deg, rgba(80,255,160,0.18), rgba(80,255,160,0.07)); }

    .small { font-size: 12px; opacity: 0.8; line-height: 1.35; }

    /* Blob */
    .blob {
      width: var(--size, 78px);
      height: var(--size, 78px);
      border-radius: 999px;
      display: grid;
      place-items: center;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      position: relative;

      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.38), rgba(255,255,255,0.05) 45%, rgba(0,0,0,0) 70%),
        radial-gradient(circle at 65% 65%, rgba(0,0,0,0.18), rgba(0,0,0,0) 55%),
        var(--color, rgba(255, 210, 64, 0.92));

      box-shadow:
        0 12px 26px rgba(0,0,0,0.35),
        inset 0 0 0 2px rgba(0,0,0,0.18),
        inset 0 0 0 1px rgba(255,255,255,0.18);
    }
    .blob:active { cursor: grabbing; }

    .blob .initials {
      font-weight: 900;
      font-size: calc(var(--size, 78px) * 0.42);
      text-transform: uppercase;
      color: rgba(0,0,0,0.82);
      text-shadow: 0 1px 0 rgba(255,255,255,0.25);
      line-height: 1;
    }

    .blob .tag {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 18, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.92);
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }

    .readout {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(10, 12, 18, 0.72);
      color: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      max-width: calc(100vw - 24px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.28);
      backdrop-filter: blur(8px);
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="panel" id="panel">
    <header>
      <strong>Blob March Tool</strong>
      <div class="hdrRight">
        <span class="hint" id="modeHint">Place mode: click map</span>
        <button id="minBtn" type="button" class="minBtn" aria-expanded="true" aria-label="Minimise panel">–</button>
      </div>
    </header>

    <div class="content">
      <div class="row">
        <div>
          <label for="initials">Initials (2 letters)</label>
          <input id="initials" maxlength="2" placeholder="PM" value="PM" />
        </div>
        <div>
          <label for="label">Label (optional)</label>
          <input id="label" placeholder="March" value="March" />
        </div>
      </div>

      <div class="row3">
        <div>
          <label for="color">Color</label>
          <input id="color" type="color" value="#FFD240" />
        </div>
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="60">Small</option>
            <option value="78" selected>Medium</option>
            <option value="98">Large</option>
          </select>
        </div>
        <div>
          <label for="tagToggle">Tag</label>
          <select id="tagToggle">
            <option value="on" selected>Show</option>
            <option value="off">Hide</option>
          </select>
        </div>
      </div>

      <div class="row">
        <button id="placeModeBtn" class="btnGood" type="button">Place Mode: ON</button>
        <button id="createAtCenterBtn" type="button">Create at Center</button>
      </div>

      <div>
        <label for="blobList">Blobs</label>
        <select id="blobList"></select>
      </div>

      <div class="row">
        <button id="routeModeBtn" class="btnWarn" type="button">Route Draw: OFF</button>
        <button id="snapToggleBtn" type="button">Snap to Route: ON</button>
      </div>

      <div class="row">
        <button id="resetRouteBtn" class="btnGood" type="button">Reset Route</button>
        <button id="clearRouteBtn" class="btnDanger" type="button">Clear Route</button>
      </div>

      <div class="row">
        <button id="deleteBtn" class="btnDanger" type="button">Delete Blob</button>
        <button id="flyToBtn" type="button">Fly to Blob</button>
      </div>

      <div class="row">
        <button id="exportBtn" type="button">Export GeoJSON</button>
        <button id="importBtn" type="button">Import GeoJSON</button>
      </div>

      <textarea id="ioBox" rows="4" placeholder="Export appears here. Paste GeoJSON here then click Import."></textarea>

      <div class="small">
        <b>Route drawing:</b> click to add points, <b>double‑click</b> to finish.<br>
        <b>Dragging:</b> blob snaps onto route; the line behind the blob is erased.
      </div>
    </div>
  </div>

  <div class="readout" id="readout">No blob selected.</div>

  <script>
    // --- Map ---
    const styleUrl = "https://api.maptiler.com/maps/uk-openzoomstack-road/style.json?key=ileJHPYoUxyL17ZpmERr";
    const map = new maplibregl.Map({
      container: "map",
      style: styleUrl,
      center: [-0.1276, 51.5072], // London
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    // --- UI ---
    const panelEl = document.getElementById("panel");
    const minBtn = document.getElementById("minBtn");
    const modeHint = document.getElementById("modeHint");

    const initialsEl = document.getElementById("initials");
    const labelEl = document.getElementById("label");
    const colorEl = document.getElementById("color");
    const sizeEl = document.getElementById("size");
    const tagToggleEl = document.getElementById("tagToggle");

    const placeModeBtn = document.getElementById("placeModeBtn");
    const createAtCenterBtn = document.getElementById("createAtCenterBtn");
    const blobListEl = document.getElementById("blobList");

    const routeModeBtn = document.getElementById("routeModeBtn");
    const snapToggleBtn = document.getElementById("snapToggleBtn");
    const resetRouteBtn = document.getElementById("resetRouteBtn");
    const clearRouteBtn = document.getElementById("clearRouteBtn");

    const deleteBtn = document.getElementById("deleteBtn");
    const flyToBtn = document.getElementById("flyToBtn");

    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const ioBox = document.getElementById("ioBox");

    const readout = document.getElementById("readout");

    // --- Minimise panel ---
    function setMinimized(isMin) {
      panelEl.classList.toggle("isMinimized", isMin);
      minBtn.textContent = isMin ? "+" : "–";
      minBtn.setAttribute("aria-expanded", String(!isMin));
      minBtn.setAttribute("aria-label", isMin ? "Restore panel" : "Minimise panel");
    }
    minBtn.addEventListener("click", () => {
      setMinimized(!panelEl.classList.contains("isMinimized"));
    });

    // --- State ---
    let placeMode = true;
    let routeDrawMode = false;
    let snapToRoute = true;

    // Each blob:
    // routeMaster = full proposed route (does not change unless redrawn)
    // routeRemaining = visible route (shrinks/erases behind blob as it moves)
    let blobs = []; // {id, marker, initials, label, color, size, showTag, routeMaster[], routeRemaining[], _lastEraseSeg}
    let selectedId = null;

    // --- Helpers ---
    function sanitizeInitials(v) {
      return (v || "").replace(/[^a-zA-Z]/g, "").toUpperCase().slice(0, 2);
    }
    function rgbaFromHex(hex, alpha = 0.92) {
      const h = (hex || "#FFD240").replace("#", "");
      const r = parseInt(h.slice(0,2), 16);
      const g = parseInt(h.slice(2,4), 16);
      const b = parseInt(h.slice(4,6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }
    function getSelectedBlob() {
      return blobs.find(b => b.id === selectedId) || null;
    }

    // GeoJSON route layer
    function ensureRouteLayer() {
      if (map.getSource("routes")) return;
      map.addSource("routes", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });
      map.addLayer({
        id: "routes-line",
        type: "line",
        source: "routes",
        paint: {
          "line-color": ["get", "color"],
          "line-width": 5,
          "line-opacity": 0.85
        }
      });
    }

    function refreshRouteSource() {
      if (!map.getSource("routes")) return;
      const features = [];
      blobs.forEach(b => {
        if (b.routeRemaining && b.routeRemaining.length >= 2) {
          features.push({
            type: "Feature",
            geometry: { type: "LineString", coordinates: b.routeRemaining },
            properties: { id: b.id, color: b.color }
          });
        }
      });
      map.getSource("routes").setData({ type: "FeatureCollection", features });
    }

    // Nearest point on polyline (returns snapped point + segment index + t)
    function nearestPointOnRouteDetailed(lngLat, routeCoords) {
      if (!routeCoords || routeCoords.length < 2) return null;

      const p = map.project(lngLat);
      let best = { dist2: Infinity, snapped: null, segIndex: 0, t: 0 };

      for (let i = 0; i < routeCoords.length - 1; i++) {
        const a = map.project({ lng: routeCoords[i][0], lat: routeCoords[i][1] });
        const b = map.project({ lng: routeCoords[i+1][0], lat: routeCoords[i+1][1] });

        const abx = b.x - a.x, aby = b.y - a.y;
        const apx = p.x - a.x, apy = p.y - a.y;
        const ab2 = abx*abx + aby*aby || 1e-9;

        let t = (apx*abx + apy*aby) / ab2;
        t = Math.max(0, Math.min(1, t));

        const x = a.x + t*abx, y = a.y + t*aby;
        const dx = p.x - x, dy = p.y - y;
        const dist2 = dx*dx + dy*dy;

        if (dist2 < best.dist2) {
          best.dist2 = dist2;
          best.snapped = map.unproject({ x, y });
          best.segIndex = i;
          best.t = t;
        }
      }
      return best;
    }

    function makeBlobElement({ initials, label, color, size, showTag }) {
      const el = document.createElement("div");
      el.className = "blob";
      el.style.setProperty("--size", `${size}px`);
      el.style.setProperty("--color", rgbaFromHex(color, 0.92));

      const text = document.createElement("div");
      text.className = "initials";
      text.textContent = initials;
      el.appendChild(text);

      if (showTag && label) {
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = label;
        el.appendChild(tag);
      }
      return el;
    }

    function updateReadout() {
      const b = getSelectedBlob();
      if (!b) { readout.textContent = "No blob selected."; return; }
      const ll = b.marker.getLngLat();
      readout.textContent =
        `Selected: ${b.initials}${b.label ? " — " + b.label : ""}\n` +
        `Lng: ${ll.lng.toFixed(6)}  Lat: ${ll.lat.toFixed(6)}\n` +
        `Route full: ${b.routeMaster.length} pts | Remaining: ${b.routeRemaining.length} pts`;
    }

    function updateBlobList() {
      blobListEl.innerHTML = "";
      blobs.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b.id;
        opt.textContent = `${b.initials}${b.label ? " — " + b.label : ""}`;
        blobListEl.appendChild(opt);
      });
      if (!selectedId && blobs.length) selectedId = blobs[0].id;
      if (selectedId) blobListEl.value = selectedId;
      updateReadout();
      refreshRouteSource();
    }

    function selectBlob(id) {
      selectedId = id;
      updateBlobList();
    }

    // --- Modes ---
    function setPlaceMode(on) {
      placeMode = on;
      placeModeBtn.textContent = `Place Mode: ${placeMode ? "ON" : "OFF"}`;
      placeModeBtn.classList.toggle("btnGood", placeMode);
      if (placeMode && !routeDrawMode) modeHint.textContent = "Place mode: click map";
      if (!placeMode && !routeDrawMode) modeHint.textContent = "Drag blobs / manage routes";
    }

    function setRouteDrawMode(on) {
      routeDrawMode = on;
      routeModeBtn.textContent = `Route Draw: ${routeDrawMode ? "ON" : "OFF"}`;
      routeModeBtn.classList.toggle("btnWarn", routeDrawMode);

      if (routeDrawMode) {
        modeHint.textContent = "Route draw: click points, double‑click finish";
        map.doubleClickZoom.disable();
      } else {
        map.doubleClickZoom.enable();
        modeHint.textContent = placeMode ? "Place mode: click map" : "Drag blobs / manage routes";
      }
    }

    // --- Create blob ---
    function createBlobAt(lngLatArr) {
      const initials = sanitizeInitials(initialsEl.value) || "??";
      const label = (labelEl.value || "").trim();
      const color = colorEl.value || "#FFD240";
      const size = parseInt(sizeEl.value, 10) || 78;
      const showTag = tagToggleEl.value === "on";

      const el = makeBlobElement({ initials, label, color, size, showTag });

      const marker = new maplibregl.Marker({ element: el, draggable: true })
        .setLngLat(lngLatArr)
        .addTo(map);

      const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

      const blob = {
        id, marker, initials, label, color, size, showTag,
        routeMaster: [],
        routeRemaining: [],
        _lastEraseSeg: -1
      };
      blobs.push(blob);

      el.addEventListener("click", (e) => { e.stopPropagation(); selectBlob(id); });

      marker.on("dragstart", () => selectBlob(id));

      marker.on("drag", () => {
        const b = blobs.find(x => x.id === id);
        if (!b) return;

        if (snapToRoute && b.routeRemaining.length >= 2) {
          const current = b.marker.getLngLat();
          const hit = nearestPointOnRouteDetailed(current, b.routeRemaining);
          if (hit && hit.snapped) {
            // snap marker onto route
            b.marker.setLngLat(hit.snapped);

            // erase route behind the blob: keep only from snapped point forward
            const i = hit.segIndex;
            const progressedEnough = (i !== b._lastEraseSeg) || (hit.t > 0.25);

            if (progressedEnough) {
              const snappedCoord = [hit.snapped.lng, hit.snapped.lat];
              const forward = b.routeRemaining.slice(i + 1);
              b.routeRemaining = [snappedCoord, ...forward];
              b._lastEraseSeg = i;
              refreshRouteSource();
            }
          }
        }

        if (selectedId === id) updateReadout();
      });

      marker.on("dragend", () => {
        if (selectedId === id) updateReadout();
        refreshRouteSource();
      });

      selectBlob(id);
    }

    // --- Map interactions ---
    map.on("click", (e) => {
      if (routeDrawMode) {
        const b = getSelectedBlob();
        if (!b) return;

        b.routeMaster.push([e.lngLat.lng, e.lngLat.lat]);
        b.routeRemaining = b.routeMaster.slice();
        b._lastEraseSeg = -1;

        refreshRouteSource();
        updateReadout();
        return;
      }

      if (placeMode) createBlobAt([e.lngLat.lng, e.lngLat.lat]);
    });

    map.on("dblclick", (e) => {
      if (!routeDrawMode) return;
      e.preventDefault();
      setRouteDrawMode(false);
    });

    // --- Buttons ---
    placeModeBtn.addEventListener("click", () => setPlaceMode(!placeMode));

    createAtCenterBtn.addEventListener("click", () => {
      const c = map.getCenter();
      createBlobAt([c.lng, c.lat]);
    });

    blobListEl.addEventListener("change", () => selectBlob(blobListEl.value));

    routeModeBtn.addEventListener("click", () => {
      if (!routeDrawMode) setPlaceMode(false);
      setRouteDrawMode(!routeDrawMode);
    });

    snapToggleBtn.addEventListener("click", () => {
      snapToRoute = !snapToRoute;
      snapToggleBtn.textContent = `Snap to Route: ${snapToRoute ? "ON" : "OFF"}`;
    });

    resetRouteBtn.addEventListener("click", () => {
      const b = getSelectedBlob();
      if (!b) return;
      b.routeRemaining = b.routeMaster.slice();
      b._lastEraseSeg = -1;
      refreshRouteSource();
      updateReadout();
    });

    clearRouteBtn.addEventListener("click", () => {
      const b = getSelectedBlob();
      if (!b) return;
      b.routeMaster = [];
      b.routeRemaining = [];
      b._lastEraseSeg = -1;
      refreshRouteSource();
      updateReadout();
    });

    deleteBtn.addEventListener("click", () => {
      const idx = blobs.findIndex(b => b.id === selectedId);
      if (idx === -1) return;
      blobs[idx].marker.remove();
      blobs.splice(idx, 1);
      selectedId = blobs.length ? blobs[Math.max(0, idx - 1)].id : null;
      updateBlobList();
    });

    flyToBtn.addEventListener("click", () => {
      const b = getSelectedBlob();
      if (!b) return;
      const ll = b.marker.getLngLat();
      map.flyTo({ center: [ll.lng, ll.lat], zoom: Math.max(map.getZoom(), 14) });
    });

    exportBtn.addEventListener("click", () => {
      const fc = {
        type: "FeatureCollection",
        features: blobs.map(b => {
          const ll = b.marker.getLngLat();
          return {
            type: "Feature",
            geometry: { type: "Point", coordinates: [ll.lng, ll.lat] },
            properties: {
              id: b.id,
              initials: b.initials,
              label: b.label,
              color: b.color,
              size: b.size,
              showTag: b.showTag,
              routeMaster: b.routeMaster,
              routeRemaining: b.routeRemaining
            }
          };
        })
      };
      ioBox.value = JSON.stringify(fc, null, 2);
    });

    importBtn.addEventListener("click", () => {
      let data;
      try { data = JSON.parse(ioBox.value); } catch { alert("Invalid JSON"); return; }
      if (!data || data.type !== "FeatureCollection" || !Array.isArray(data.features)) {
        alert("GeoJSON must be a FeatureCollection with features.");
        return;
      }

      blobs.forEach(b => b.marker.remove());
      blobs = [];
      selectedId = null;

      data.features.forEach(f => {
        if (!f || f.type !== "Feature" || !f.geometry || f.geometry.type !== "Point") return;
        const coords = f.geometry.coordinates;
        if (!Array.isArray(coords) || coords.length < 2) return;

        const p = f.properties || {};
        initialsEl.value = (p.initials || "??");
        labelEl.value = (p.label || "");
        colorEl.value = (/^#[0-9A-Fa-f]{6}$/.test(p.color) ? p.color : "#FFD240");
        sizeEl.value = (p.size ? String(p.size) : "78");
        tagToggleEl.value = (p.showTag === false ? "off" : "on");

        createBlobAt([coords[0], coords[1]]);
        const b = getSelectedBlob();
        if (b) {
          b.routeMaster = Array.isArray(p.routeMaster) ? p.routeMaster : [];
          b.routeRemaining = Array.isArray(p.routeRemaining) ? p.routeRemaining : b.routeMaster.slice();
          b._lastEraseSeg = -1;
        }
      });

      updateBlobList();
    });

    // --- Init ---
    map.on("load", () => {
      ensureRouteLayer();
      const c = map.getCenter();
      createBlobAt([c.lng, c.lat]);
      updateBlobList();

      setPlaceMode(true);
      setRouteDrawMode(false);
      snapToggleBtn.textContent = `Snap to Route: ${snapToRoute ? "ON" : "OFF"}`;
      setMinimized(false);
    });
  </script>
</body>
</html>
