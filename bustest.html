<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unplanned Diversions</title>
  <meta http-equiv="Cache-Control" content="no-store" />

  <!-- Font: Barlow Semi Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;

      /* Bee Network operator colours */
      --op-BNML:#ff4d4f;   /* red */
      --op-BNGN:#003C6E;   /* blue (GNW) */
      --op-BNSM:#ff9a1f;   /* orange */
      --op-BNDB:#9AC331;   /* DB (brand distinct colour) */
      --op-BNVB:#7a3ffe;   /* purple */
      --op-BNFM:#ff66b3;   /* pink */

      --neutral:#16161b;
      --neutralElev:#1b1b22;

      /* Unified route badge accent */
      --accent:#FFE04A;       /* TfGM yellow */

      /* Overlay backgrounds */
      --alert-add-bg: var(--accent); /* yellow */
      --alert-remove-bg: #19c37d;    /* green */

      /* Status pill colours */
      --liveGreen:#42BE4B;
      --errorRed:#EA5540;

      /* Grid/card */
      --gridGap:20px;
      --cardRadius:24px;
      --cardHeight: 420px;    /* JS sets exact value for 2 rows */

      /* Summary metrics */
      --summary-line-height: 1.3;

      /* Route badge sizing */
      --route-font: clamp(44px, 5.6vw, 80px);
      --route-pad-v: 8px;
      --route-pad-h: 16px;
      --route-radius: 12px;

      /* area height equal to single route badge height */
      --route-rect-h: calc(var(--route-font) + (var(--route-pad-v) * 2));
      /* compact font for multi grid tiles */
      --route-mini-font: clamp(18px, 2.2vw, 28px);

      /* Pager progress duration (JS sets this to PAGE_INTERVAL_MS) */
      --page-interval: 10000ms;
    }

    *{ box-sizing:border-box; }
    html, body { height: 100%; }

    /* ----------- PAGE LAYOUT ----------- */
    body{
      margin:0; padding:0; background:var(--bg);
      color:var(--text);
      font-family:"Barlow Semi Condensed", system-ui, sans-serif;
      overflow:hidden;             /* no page scroll */
      display:flex;                /* flex column layout */
      flex-direction:column;
    }

    /* ----------- HEADER ----------- */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start; /* allow left to stack */
      padding:16px 24px;
      background:#0b0b0e;
      border-bottom:1px solid #1d1d25;
    }
    .leftHeader{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:8px;
      min-width:0;
    }
    .title{
      margin:0;
      font-size:56px;        /* control-room size */
      font-weight:900;
      letter-spacing:-0.3px;
      line-height:1;
    }

    /* Operator totals + page indicator under title */
    .status-meta{
      font-size:14px;
      font-weight:700;
      color:var(--muted);
      letter-spacing:0.2px;
      text-shadow: 0 1px 0 rgba(0,0,0,0.25);
      display:flex;
      align-items:center;
      gap:8px;
      line-height:1.15;
    }
    .status-meta .opCounts{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .status-meta .opCounts span{
      position:relative;
      padding-left:14px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }
    .status-meta .opCounts span::before{
      content:"";
      position:absolute;
      left:0; top:50%;
      width:8px; height:8px; border-radius:50%;
      transform:translateY(-50%);
      background:#cfcfd6;
      box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset;
    }
    .status-meta .sep{
      opacity:.6;
      user-select:none;
    }
    /* Dots per operator */
    .status-meta .opCounts span[data-op="BNML"]::before{ background: var(--op-BNML); }
    .status-meta .opCounts span[data-op="BNGN"]::before{ background: var(--op-BNGN); }
    .status-meta .opCounts span[data-op="BNSM"]::before{ background: var(--op-BNSM); }
    .status-meta .opCounts span[data-op="BNDB"]::before{ background: var(--op-BNDB); }
    .status-meta .opCounts span[data-op="BNVB"]::before{ background: var(--op-BNVB); }
    .status-meta .opCounts span[data-op="BNFM"]::before{ background: var(--op-BNFM); }

    /* Bee + Live pill wrapper (right side) */
    .statusWrapper{
      display:flex;
      align-items:center;
      gap:16px;
      flex-shrink:0;
    }
    #beeLogo{
      width:64px;
      height:64px;
      object-fit:contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      transition: transform 0.2s ease-out;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{
      animation: wibble 650ms ease-out;
    }

    .status-pill{
      padding:10px 16px;
      border-radius:999px;
      font-size:18px;
      font-weight:800;
      background:var(--liveGreen);
      color:#000;
      box-shadow:0 0 0 2px rgba(255,255,255,0.08),
                 0 4px 14px rgba(0,0,0,0.25);
      transition:background .2s ease,color .2s ease;
    }
    .status-error{
      background:var(--errorRed);
      color:#fff;
    }

    /* ----------- MAIN ----------- */
    main{
      padding:0 24px 24px; /* bottom padding only */
      display:flex;
      flex-direction:column;
      flex:1 1 auto;
      min-height:0;
    }

    /* ----------- FIXED 3×2 GRID ----------- */
    #grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);  /* 3 wide */
      gap:var(--gridGap);
      flex:1;
      height:100%;
      overflow:hidden; /* keep grid non-scroll */
      align-content:start; /* don't distribute leftover space between rows */
    }

    /* ----------- CARD ----------- */
    .chip{
      position:relative;
      border:3px solid #2a2a33;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00) 60%),
        var(--neutralElev);
      border-radius:var(--cardRadius);
      display:flex;
      flex-direction:column;
      padding:24px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45);
      height:var(--cardHeight);
      min-height:var(--cardHeight);
      max-height:var(--cardHeight);
      overflow:hidden; /* no overflow lines */
    }
    .chip:hover{
      transform:translateY(-1px);
      transition:transform .15s ease;
    }

    /* Highlight all UFNs; >24h also gets pulse-ufn */
    .chip.ufn{
      border-color: rgba(255,77,79,0.85) !important; /* stronger red */
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45),
        0 0 0 4px rgba(255,77,79,0.10);
    }

    @keyframes pulseRed {
      0% {
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 10px 25px rgba(0,0,0,0.35),
          0 0 0 0 rgba(255,77,79,0.4);
        border-color: rgba(255,77,79,0.55);
      }
      50% {
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 10px 25px rgba(0,0,0,0.35),
          0 0 0 10px rgba(255,77,79,0.12);
        border-color: rgba(255,77,79,0.95);
      }
      100% {
        box-shadow:
          0 1px 0 rgba(255,255,255,0.04) inset,
          0 10px 25px rgba(0,0,0,0.35),
          0 0 0 0 rgba(255,77,79,0.0);
        border-color: rgba(255,77,79,0.55);
      }
    }
    .chip.pulse-ufn {
      border-color: var(--errorRed);
      animation: pulseRed 1200ms ease-in-out infinite;
    }

    /* Header: ROUTE AREA + operator stack */
    .chipHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:0;
      width:100%;
    }

    /* left column: route area */
    .headerLeft{
      display:flex;
      flex-direction:column;
      gap:8px;
      flex:1 1 auto;
      min-width:0; /* allow text to ellipsis correctly */
    }

    /* ROUTE DISPLAY */
    .routesArea{
      width:100%;
      height:var(--route-rect-h);
      display:flex;
      align-items:center;       /* centre single badge vertically */
      justify-content:flex-start;
      max-width:100%;
      flex:1 1 auto;
    }

    /* Single route badge */
    .route{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      background:var(--accent);   /* Unified yellow for all operators */
      color:#000;
      padding:var(--route-pad-v) var(--route-pad-h);
      border-radius:var(--route-radius);
      letter-spacing:-0.5px;
      line-height:1;
      min-width:3ch;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:var(--route-font);
      width:100%;
    }

    /* Multi route grid: 2 columns x 3 rows */
    .routesGrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap:8px;
      width:100%;
      height:100%;
      align-items:stretch;
      justify-items:stretch;
    }
    .route-mini{
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      background:var(--accent);
      color:#000;
      border-radius:var(--route-radius);
      letter-spacing:-0.3px;
      line-height:1;
      padding:6px 10px;
      font-size:var(--route-mini-font);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Glass empty chips to pad the multi-route grid */
    .route-mini--glass{
      background: rgba(255,255,255,0.06);
      border: 2px dashed rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.22);
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius: var(--route-radius);
      letter-spacing:-0.3px;
      line-height:1;
      padding:6px 10px;
      font-size: var(--route-mini-font);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      font-weight: 800;
    }
    .route-mini--glass:hover{
      border-color: rgba(255,255,255,0.20);
    }

    /* Right column stack (Operator + Emoji Reason) */
    .rightCol{
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:stretch;
      width:max-content;     /* both chips share the same intrinsic width */
    }

    .reasonEmojiChip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:2px solid rgba(255,255,255,0.18);
      font-size:28px;
      font-weight:800;
      color:#e6e6ee;
      white-space:nowrap;
      width:100%;
      line-height:1;
    }

    .operatorTag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:2px solid rgba(255,255,255,0.18);
      font-size:28px;
      font-weight:800;
      color:#e6e6ee;
      white-space:nowrap;
      width:100%;           /* Ensures operator chip defines the column width */
      line-height:1;
    }
    .operatorDot{
      width:18px; height:18px; border-radius:50%;
      background:#cfcfd6; /* neutral by default; per-operator colour set in JS if single-op */
      box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset;
      display:inline-block;
      flex-shrink:0;
      transition: background-color 400ms ease, background 400ms ease;
    }

    /* Body: one-line details "xxxxx // TOWN" */
    .detailsLine{
      font-size:clamp(26px, 2.6vw, 32px);
      line-height: var(--summary-line-height);
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      margin:6px 2px 12px 2px;
    }
    .detailsLine .town{
      font-weight:900;
    }

    /* Footer: time lines */
    .times{
      margin-top:auto;
      padding-top:12px;
      border-top:2px solid rgba(255,255,255,0.15);
    }
    .timeLine{
      font-size:clamp(24px, 2.2vw, 30px);
      font-weight:900;       /* base (overridden within .times for card rows) */
      color:#d9d9e2;         /* base (overridden within .times for card rows) */
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      gap:8px;
    }
    /* Make Started //, Ends //, Duration // softer in cards,
       but keep the VALUES bold & white */
    .times .timeLine{
      font-weight:600;
      color: rgba(233,233,239,0.65);
    }
    .times .timeLine .timePrefix{
      font-weight:600;
      color: rgba(233,233,239,0.55);
    }
    .times .timeLine .timeValue{
      font-weight:900;
      color:#ffffff;
    }
    /* If Ends // value is UFN, make the entire line yellow (prefix + value) */
    .times .timeLine.ufn{
      color: var(--accent);
    }
    .times .timeLine.ufn .timePrefix,
    .times .timeLine.ufn .timeValue{
      color: var(--accent);
    }

    .timeLine .ufn-warning{
      margin-left:8px;
      display:inline-block;
      animation: ufnFlash 1.2s infinite;
    }
    @keyframes ufnFlash {
      0%, 60%   { opacity: 1; transform: scale(1); }
      70%       { opacity: .35; transform: scale(0.98); }
      100%      { opacity: 1; transform: scale(1); }
    }

    /* Optional subtle operator tints (backgrounds) */
    .op-BNML{ background:linear-gradient(180deg, rgba(255,77,79,0.08), transparent), var(--neutralElev); }
    .op-BNGN{ background:linear-gradient(180deg, rgba(58,122,254,0.10), transparent), var(--neutralElev); }
    .op-BNSM{ background:linear-gradient(180deg, rgba(255,154,31,0.10), transparent), var(--neutralElev); }
    .op-BNDB{
      background: linear-gradient(180deg, rgba(47,137,255,0.10), transparent), var(--neutralElev);
      border-color: rgba(47,137,255,0.35);
    }
    @supports (background: color-mix(in oklab, red, blue)) {
      .op-BNDB{
        background: linear-gradient(
                     180deg,
                     color-mix(in oklab, var(--op-BNDB) 18%, transparent),
                     transparent
                   ), var(--neutralElev);
        border-color: color-mix(in oklab, var(--op-BNDB) 35%, #2a2a33);
      }
    }
    .op-BNVB{ background:linear-gradient(180deg, rgba(122,63,254,0.12), transparent), var(--neutralElev); }
    .op-BNFM{ background:linear-gradient(180deg, rgba(255,102,179,0.12), transparent), var(--neutralElev); }

    /* ----------- FULLSCREEN ALERT OVERLAY ----------- */
    #divertOverlay{
      position:fixed;
      inset:0;
      background:var(--alert-add-bg); /* default yellow */
      color:#000;
      display:none;             /* toggled by .show */
      align-items:center;
      justify-content:center;
      z-index:9999;
      padding:6vh 5vw;
    }
    #divertOverlay.show{
      display:flex;
      animation: overlayFadeIn 220ms ease-out;
    }
    #divertOverlay.ov-add{    background:var(--alert-add-bg); }
    #divertOverlay.ov-remove{ background:var(--alert-remove-bg); }

    @keyframes overlayFadeIn{
      from{ opacity:0; }
      to{ opacity:1; }
    }
    .ov-card{
      width:min(1200px, 100%);
      text-align:center;
    }
    .ov-kicker{
      font-weight:900;
      letter-spacing:1.2px;
      font-size:clamp(80px, 2vw, 120px);
      text-transform:uppercase;
      margin-bottom:8px;
    }
    .ov-route{
      font-weight:900;
      font-size:clamp(120px, 14vw, 220px);
      line-height:0.9;
      letter-spacing:-2px;
      margin:8px 0 10px;
    }
    .ov-summary{
      font-size:clamp(28px, 3vw, 44px);
      font-weight:800;
      color:#000;
      margin:10px 0 8px;
    }
    .ov-times{
      font-size:clamp(22px, 2.2vw, 30px);
      font-weight:900;
      color:#000;
      display:flex;
      flex-direction:column;
      gap:4px;
      align-items:center;
      justify-content:center;
    }

    /* --- Thin yellow progress line at page bottom --- */
    #pageProgress{
      position:fixed;
      left:0; right:0; bottom:0;
      height:4px;
      background:var(--accent);
      transform-origin:left center;
      transform:scaleX(0);
      opacity:0.9;
      z-index:9998; /* keep below overlay (9999), above content */
      pointer-events:none;
      display:none; /* hidden when not paging */
      will-change:transform;
    }
    #pageProgress.run{
      animation: pageProgress var(--page-interval) linear forwards;
    }
    @keyframes pageProgress{
      from{ transform:scaleX(0); }
      to  { transform:scaleX(1); }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="leftHeader">
      <h1 class="title">TfGM Travel Alerts - Diversions</h1>

      <!-- Operator counts + Page indicator (under title) -->
      <div id="statusMeta" class="status-meta" aria-live="polite">
        <span class="opCounts">
          <span data-op="BNML">ML 0</span> •
          <span data-op="BNGN">GN 0</span> •
          <span data-op="BNSM">SC 0</span> •
          <span data-op="BNDB">DB 0</span> •
          <span data-op="BNVB">VB 0</span> •
          <span data-op="BNFM">FB 0</span>
        </span>
        <span class="sep">|</span>
        <span id="metricPage">Pg 0/0</span>
      </div>
    </div>

    <!-- Right side: bee + live pill only -->
    <div class="statusWrapper">
      <img id="beeLogo" src="https://tfgm.com/static/android-chrome-192x192.png" alt="Bee Network logo" width="64" height="64" decoding="async">
      <div id="statusPill" class="status-pill">Pulling from DfT</div>
    </div>
  </header>

  <main>
    <div id="grid"></div>
  </main>

  <!-- Fullscreen Alert Overlay -->
  <div id="divertOverlay" class="ov-add" aria-hidden="true">
    <div class="ov-card" role="dialog" aria-label="Diversion alert">
      <div id="ovKicker" class="ov-kicker">NEW DIVERTS</div>
      <div id="ovRoute" class="ov-route">–</div>
      <div id="ovSummary" class="ov-summary">–</div>
      <div id="ovTimes" class="ov-times"></div>
    </div>
  </div>

  <!-- Page turn progress (fills over the dwell interval) -->
  <div id="pageProgress" aria-hidden="true"></div>

  <script>
    /* ===========================
       CONFIG
    =========================== */
    const API_KEY = "17889546a31fddeef67fca78252fb66951aedf1a";
    const BODS_URL =
      `https://occproxy-6dem.vercel.app/api/proxy?url=https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;

    /* TfGM Bee Network operator refs (strict) */
    const BEE_OPERATORS = ["BNML","BNGN","BNSM","BNDB","BNVB","BNFM"];

    /* Behaviour flags */
    const UNPLANNED_ONLY = true;
    const PAGE_INTERVAL_MS = 10000; // page dwell (10s)
    const FEED_REFRESH_MS = 60000;  // feed refresh (60s)

    /* Diversion keyword matching */
    const DIVERSION_MATCHERS = ["divert","diversion","diversions"];

    /* UFN >24h helper */
    const DAY_MS = 24 * 60 * 60 * 1000; /* UFN >24h: pin & pulse */

    /* Pager */
    let pagerTimer = null;

    /* New/Removed diversion detection */
    let firstFetchDone = false;
    let lastItemsIndex = new Map();  // id -> item (previous poll)

    /* Overlay queue control */
    let overlayQueue = [];
    let overlayShowing = false;

    /* VISIBILITY QUEUE */
    let pageVisible = true;

    /* Set CSS duration for the progress bar to match page dwell */
    document.documentElement.style.setProperty('--page-interval', PAGE_INTERVAL_MS + 'ms');

    /* Helpers */
    const $ = s => document.querySelector(s);
    const parseISO = s => s ? new Date(s) : null;

    function fmtHM(d){
      return new Intl.DateTimeFormat(undefined,
        {hour:"2-digit",minute:"2-digit"}).format(d);
    }

    function setStatusPill(ok, { animate = false } = {}){
      const pill = $("#statusPill");
      const bee = $("#beeLogo");
      const t = new Intl.DateTimeFormat(undefined,
        {hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());
      if(ok){
        pill.classList.remove("status-error");
        pill.textContent = `Live • ${t}`;
        if (animate && bee){
          bee.classList.remove("bee-wibble");
          void bee.offsetWidth;   // reflow to restart animation
          bee.classList.add("bee-wibble");
        }
      } else {
        pill.classList.add("status-error");
        pill.textContent = `Error • ${t}`;
      }
    }

    /* Operator short-code mapping (kept as in your original) */
    const OP_MAP = { BNML:"ML", BNGN:"GN", BNSM:"SC", BNDB:"DB", BNVB:"VB", BNFM:"FB" };
    function mapOperators(list){
      return list.map(ref => OP_MAP[ref] || ref);
    }
    const OP_COLOR_MAP = {
      BNML:"var(--op-BNML)", BNGN:"var(--op-BNGN)", BNSM:"var(--op-BNSM)",
      BNDB:"var(--op-BNDB)", BNVB:"var(--op-BNVB)", BNFM:"var(--op-BNFM)"
    };

    /* --- status meta updaters (counts + page indicator) --- */
    function updateOperatorCounts(counts){
      (BEE_OPERATORS || []).forEach(op => {
        const el = document.querySelector(`.status-meta .opCounts span[data-op="${op}"]`);
        if (el){
          const code = OP_MAP[op] || op;
          const val = counts && Number.isFinite(counts[op]) ? counts[op] : 0;
          el.textContent = `${code} ${val}`;
        }
      });
    }
    function updatePageIndicator(){
      const el = document.getElementById('metricPage');
      if(!el) return;
      const totalPages = Array.isArray(pager.pages) ? pager.pages.length : 0;
      const curr = totalPages > 0 ? (pager.pageIndex + 1) : 0;
      el.textContent = `Pg ${curr}/${totalPages}`;
    }

    /* --- bottom progress bar control --- */
    function restartProgressBar(){
      const bar = document.getElementById('pageProgress');
      if (!bar) return;
      const shouldShow = Array.isArray(pager.pages) && pager.pages.length > 1;
      if (!shouldShow){
        bar.classList.remove('run');
        bar.style.display = 'none';
        bar.style.transform = 'scaleX(0)';
        return;
      }
      bar.style.display = 'block';
      bar.classList.remove('run');
      void bar.offsetWidth; // reflow to reset animation
      bar.classList.add('run');
    }

    /* ---------- Date label helpers ---------- */
    function isToday(d){
      const now = new Date();
      return d.getFullYear() === now.getFullYear() &&
             d.getMonth() === now.getMonth() &&
             d.getDate() === now.getDate();
    }
    function isYesterday(d){
      const now = new Date();
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      return d.getFullYear() === y.getFullYear() &&
             d.getMonth() === y.getMonth() &&
             d.getDate() === y.getDate();
    }
    function isTomorrow(d){
      const now = new Date();
      const t = new Date(now);
      t.setDate(now.getDate() + 1);
      return d.getFullYear() === t.getFullYear() &&
             d.getMonth() === t.getMonth() &&
             d.getDate() === t.getDate();
    }
    function weekBoundsOfToday(){
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      // Monday start (Mon=1..Sun=7)
      const weekday = (start.getDay()+6) % 7; // 0 = Monday
      start.setDate(start.getDate() - weekday);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      end.setHours(23,59,59,999);
      return {start, end};
    }
    function inThisWeek(d){
      const {start, end} = weekBoundsOfToday();
      return d >= start && d <= end;
    }
    function ordinal(n){
      const s = ["th","st","nd","rd"], v = n % 100;
      return n + (s[(v-20)%10] || s[v] || s[0]);
    }
    function fullMonth(d){
      return new Intl.DateTimeFormat(undefined, { month: 'long' }).format(d);
    }
    function fullWeekday(d){
      return new Intl.DateTimeFormat(undefined, { weekday: 'long' }).format(d);
    }

    function formatLabelForDate(d){
      if(!d) return null;
      if(isToday(d)) return `${fmtHM(d)} Today`;
      if(isYesterday(d)) return `Yesterday`;
      if(isTomorrow(d)) return `Tomorrow`;
      if(inThisWeek(d)) return fullWeekday(d); // Monday, Tuesday...
      return `${ordinal(d.getDate())} ${fullMonth(d)}`; // 3rd February
    }

    function isStartOfService(d){ return d && d.getHours() === 0 && d.getMinutes() === 0; }
    function isEndOfService(d){ return d && d.getHours() === 23 && d.getMinutes() === 59; }

    /* ---------- single-unit, rounded duration ---------- */
    function formatSingleUnitDuration(start, end){
      if(!start) return "—";
      const now = new Date();
      const endTime = end || now;
      let ms = endTime - start;
      if (ms < 0) return "—";
      const s = ms / 1000;
      if (s < 60) return `${Math.round(s)}s`;
      const m = s / 60;
      if (m < 60) return `${Math.round(m)}m`;
      const h = m / 60;
      if (h < 24) return `${Math.round(h)}h`;
      const d = h / 24;
      return `${Math.round(d)}d`;
    }

    /* Stable-ish Situation ID */
    function getSituationId(sit){
      const a = sit?.SituationNumber || sit?.SituationRef;
      const b = sit?.ParticipantRef || "";
      const st = sit?.ValidityPeriod?.StartTime || sit?.StartTime || "";
      const sum = (sit?.Summary || sit?.Description || "").slice(0,80);
      return String(a || `${b}|${st}|${sum}`).trim();
    }

    /* Collect *all* operator refs (deduped) */
    function getOperatorRefs(sit){
      const refs = new Set();
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      const add = v => { if(v) refs.add(String(v).trim().toUpperCase()); };

      if(Array.isArray(avj)){
        for(const j of avj) add(j?.OperatorRef);
      } else if(avj){
        add(avj?.OperatorRef);
      }
      if(Array.isArray(sit.__operatorRefs)){
        sit.__operatorRefs.forEach(add);
      }
      return [...refs];
    }

    /* Single operator ref for background tint (optional) */
    function getSingleOperatorRef(sit){
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      if(Array.isArray(avj) && avj.length && avj[0]?.OperatorRef) return String(avj[0].OperatorRef);
      if(avj && avj.OperatorRef) return String(avj.OperatorRef);
      if(sit?.OperatorRef) return String(sit.OperatorRef);
      if(sit?.__operatorRefs && sit.__operatorRefs.length) return sit.__operatorRefs[0];
      return null;
    }

    /* Line refs */
    function getLineRefs(sit){
      const lines = new Set();
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      const pushVal = (val)=>{
        if(val == null) return;
        const s = String(val).trim();
        if(s) lines.add(s);
      };
      if(Array.isArray(avj)){
        for(const j of avj){
          pushVal(j?.LineRef || j?.PublishedLineName || j?.LineName);
        }
      }else if(avj){
        pushVal(avj?.LineRef || avj?.PublishedLineName || j?.LineName);
      }
      if(Array.isArray(sit.__lineRefs)){
        for(const v of sit.__lineRefs) pushVal(v);
      }
      if(lines.size === 0){
        const fallback = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef;
        if(fallback) pushVal(fallback);
      }
      return Array.from(lines);
    }

    /* Diversion filtering and validity */
    function isDiversion(sit){
      const txt = (sit.Description || sit.Summary || "").toLowerCase();
      return ["divert","diversion","diversions"].some(k => txt.includes(k));
    }
    function isCurrentlyValid(sit){
      const now = new Date();
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
      if(!s) return false;
      if(s > now) return false;
      if(e && e < now) return false;
      return true;
    }
    function extractSituationsFromJSON(json){
      const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
      if(!sd) return [];
      const sed = Array.isArray(sd.SituationExchangeDelivery)
        ? sd.SituationExchangeDelivery
        : [sd.SituationExchangeDelivery].filter(Boolean);
      const out=[];
      for(const d of sed){
        const pe = d?.Situations?.PtSituationElement;
        if(Array.isArray(pe)) out.push(...pe);
        else if(pe) out.push(pe);
      }
      return out;
    }
    function extractSituationsFromXML(doc){
      const els = [...doc.querySelectorAll("PtSituationElement")];
      return els.map(el=>{
        const T = s => el.querySelector(s)?.textContent?.trim() || null;
        const opsRef = [...el.querySelectorAll("AffectedVehicleJourney > OperatorRef, OperatorRef")]
                        .map(n=>n.textContent.trim()).filter(Boolean);
        const lines  = [...el.querySelectorAll("AffectedVehicleJourney > LineRef, PublishedLineName, LineName")]
                        .map(n=>n.textContent.trim()).filter(Boolean);
        return {
          Summary: T("Summary") || T("Description"),
          Description: T("Description"),
          Severity: T("Severity") || "unknown",
          Planned: T("Planned"),
          SituationNumber: T("SituationNumber") || T("SituationRef"),
          ParticipantRef: T("ParticipantRef"),
          ValidityPeriod: {
            StartTime: T("ValidityPeriod > StartTime") || T("StartTime"),
            EndTime:   T("ValidityPeriod > EndTime")   || T("EndTime"),
          },
          CreationTime: T("CreationTime") || T("RecordedAtTime") || T("VersionedAtTime"),
          Affects: {
            VehicleJourneys: {
              AffectedVehicleJourney: lines.length
                ? lines.map((ln)=>({ OperatorRef: opsRef[0] || null, LineRef: ln }))
                : []
            }
          },
          __operatorRefs: opsRef,
          __lineRefs: lines
        };
      });
    }

    /* -------- Paging -------- */
    const pager={pages:[],pageIndex:0,pageSize:6,total:0};
    function chunk(arr,size){
      if (!Array.isArray(arr) || arr.length === 0) return []; // real empty => no pages
      const out=[];
      for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
      return out;
    }

    /* Geometry-based card sizing: exact 2 rows, no cutoff */
    function setFixedGridSizing(){
      const grid = $("#grid");
      const main = document.querySelector("main");
      if(!grid || !main) return;

      const csGrid = getComputedStyle(grid);
      const csMain = getComputedStyle(main);

      const rowGap = parseFloat(csGrid.rowGap || csGrid.gap || "20") || 20;
      const pb     = parseFloat(csMain.paddingBottom || "0") || 0;

      const mainRect = main.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();

      // Height available for the grid content inside main (exclude bottom padding)
      const available = Math.max(0, Math.floor((mainRect.bottom - pb) - gridRect.top));

      // Two rows + one rowGap must equal available
      const safety  = 1; // minimal to avoid sub-pixel overflow
      const perRowH = Math.max(200, Math.floor((available - rowGap) / 2) - safety);

      document.documentElement.style.setProperty("--cardHeight", perRowH + "px");
    }

    /* ---------- Times footer builder ---------- */
    function buildTimesLines(sit){
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

      // START
      let startVal = "—";
      if (s){
        if (isStartOfService(s)) {
          startVal = "Start of Service";
        } else {
          startVal = formatLabelForDate(s);
        }
      }
      const startLine = `Started // ${startVal || "—"}`;

      // END / UFN
      let endVal = "—";
      if (e){
        if (isEndOfService(e)) {
          endVal = "End of Service";
        } else {
          endVal = formatLabelForDate(e);
        }
      } else {
        endVal = "UFN";
      }
      const endLine = `Ends // ${endVal}`;

      // DURATION (single-unit, rounded)
      const durationVal = formatSingleUnitDuration(s, e);
      const durationLine = `Duration // ${durationVal}`;

      return { startLine, endLine, durationLine, startDate:s, endDate:e };
    }

    /* -------- Overlay helpers -------- */
    function showDivertOverlay(item, { mode = "add", durationMs = 10000 } = {}){
      const overlay = $("#divertOverlay");
      const elKicker = $("#ovKicker");
      const elRoute = $("#ovRoute");
      const elSummary = $("#ovSummary");
      const elTimes = $("#ovTimes");

      overlay.classList.remove("ov-add","ov-remove");

      if(mode === "remove"){
        // DIVERT END (green)
        overlay.classList.add("ov-remove");
        elKicker.textContent = "DIVERT END";
        const routes = (item.routes && item.routes.length) ? item.routes : ["?"];
        elRoute.textContent = routes.join(" • ");
        elSummary.textContent = "";

        // Simple total diverted time
        elTimes.replaceChildren();
        const start = item.startMs ? new Date(item.startMs) : null;
        const end   = item.endMs ? new Date(item.endMs) : new Date();
        const dLine = `Duration // ${formatSingleUnitDuration(start, end)}`;
        const d = document.createElement("div");
        d.textContent = dLine;
        d.className = "timeLine";
        elTimes.appendChild(d);

      } else {
        // NEW TRAVEL ALERT (yellow)
        overlay.classList.add("ov-add");
        elKicker.textContent = "NEW TRAVEL ALERT";
        const routes = (item.routes && item.routes.length) ? item.routes : ["?"];
        elRoute.textContent = routes.join(" • ");
        elSummary.textContent = item.summary || "Travel alert";

        // Show only Ends line (UFN or date) to keep overlay succinct
        elTimes.replaceChildren();
        if(item.timeLines?.endLine){
          let endText = String(item.timeLines.endLine);
          // if it has UFN, normalize to just "Ends // UFN"
          if (endText.toUpperCase().includes("UFN")) endText = "Ends // UFN";
          const e = document.createElement("div");
          e.className = "timeLine";
          e.textContent = endText;
          // append flashing warning on UFN
          if (endText.endsWith("UFN")) {
            const warn = document.createElement("span");
            warn.className = "ufn-warning";
            warn.setAttribute("aria-label","ongoing");
            warn.textContent = " ⚠️";
            e.appendChild(warn);
          }
          elTimes.appendChild(e);
        }
      }

      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      overlayShowing = true;

      setTimeout(() => {
        overlay.classList.remove("show");
        overlay.setAttribute("aria-hidden", "true");
        overlayShowing = false;
        processOverlayQueue(); // show next if queued
      }, durationMs);
    }

    function enqueueOverlays(arr){
      if(!arr || !arr.length) return;
      overlayQueue.push(...arr);
      processOverlayQueue();
    }
    function processOverlayQueue(){
      if (!pageVisible) return;
      if (overlayShowing) return;
      const next = overlayQueue.shift();
      if (!next) return;
      showDivertOverlay(next.item, { mode: next.mode, durationMs: 10000 });
    }

    /* Colour cycling helpers (multi-operator dots) */
    let colorCycleTimers = [];
    function clearColorCycles(){
      colorCycleTimers.forEach(id => clearInterval(id));
      colorCycleTimers = [];
    }
    function startDotColorCycle(dotEl, operatorRefs, { intervalMs = 1200 } = {}){
      const uniqueRefs = [...new Set((operatorRefs || [])
        .map(r => String(r).toUpperCase())
        .filter(Boolean))];
      const colors = uniqueRefs.map(ref => OP_COLOR_MAP[ref]).filter(Boolean);
      if(colors.length <= 1) return;
      let i = 0;
      dotEl.style.background = colors[0];
      const id = setInterval(() => {
        i = (i + 1) % colors.length;
        dotEl.style.background = colors[i];
      }, intervalMs);
      colorCycleTimers.push(id);
    }

    /* Summary parsing: "xxxxx, TOWN - REASON" */
    function parseSummaryParts(summaryText){
      if(!summaryText) return null;
      const str = String(summaryText);
      const hyIdx = str.indexOf(" - ");
      if(hyIdx === -1) return null;
      const left = str.slice(0, hyIdx).trim();
      const reason = str.slice(hyIdx + 3).trim();
      const lastComma = left.lastIndexOf(",");
      if(lastComma === -1) return null;
      const place = left.slice(0, lastComma).trim();
      const town  = left.slice(lastComma + 1).trim();
      if(!place || !town || !reason) return null;
      return { place, town, reason };
    }
    function getReasonEmoji(text){
      if(!text) return "⚠️";
      const s = String(text).toLowerCase();
      if (/\broad\s?works\b/.test(s) || /\bworks\b/.test(s)) return "🚧";
      if (/\bclosed\b|\bclosure\b/.test(s)) return "⛔";
      if (/\bcongestion\b/.test(s)) return "🚗";
      if (/\bdivert(?:ed|ing)?\b|\bdiversion(s)?\b/.test(s)) return "🔀";
      if (/\brtc\b|\bcollision\b/.test(s)) return "💥";
      if (/\bincident\b|\bpolice\b|\bfire\b/.test(s)) return "🚨";
      return "⚠️";
    }

    /* --- Helpers for time line splitting & HTML safety --- */
    function splitLine(line){
      const idx = line.indexOf(" // ");
      if (idx === -1) return [line, ""];
      return [line.slice(0, idx), line.slice(idx + 4)];
    }
    function escapeHtml(s){
      return String(s ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }

    /* -------- Render & paging -------- */
    function renderPage(){
      const grid = $("#grid");
      const pg = pager.pages[pager.pageIndex] || [];

      clearColorCycles();
      grid.innerHTML = "";

      for(const it of pg){
        const oc = operatorTintClass(it.singleOperatorForTint);

        const chip = document.createElement("div");
        chip.className = "chip " + oc.cls;
        if (it.isUFN) chip.classList.add("ufn");
        if (it.ufnOver24h) chip.classList.add("pulse-ufn");

        const inner = document.createElement("div");
        inner.className = "chipContent " + (oc.dark ? "on-dark" : "");

        // Header container
        const header = document.createElement("div");
        header.className = "chipHeader";

        // ===== Left column: routes =====
        const headerLeft = document.createElement("div");
        headerLeft.className = "headerLeft";

        const routesArea = document.createElement("div");
        routesArea.className = "routesArea";
        routesArea.title = (it.routes || []).join(", ");

        const routes = Array.isArray(it.routes) && it.routes.length ? it.routes : ["?"];

        if (routes.length === 1) {
          const badge = document.createElement("div");
          badge.className = "route";
          badge.textContent = String(routes[0]);
          routesArea.appendChild(badge);
        } else {
          const gridRoutes = document.createElement("div");
          gridRoutes.className = "routesGrid";

          const MAX_SLOTS = 6;
          const overflow = Math.max(0, routes.length - MAX_SLOTS);
          const toShow = overflow > 0 ? routes.slice(0, MAX_SLOTS - 1) : routes.slice(0, MAX_SLOTS);

          toShow.forEach(rt => {
            const cell = document.createElement("div");
            cell.className = "route-mini";
            cell.textContent = String(rt);
            gridRoutes.appendChild(cell);
          });

          if (overflow > 0) {
            const cell = document.createElement("div");
            cell.className = "route-mini";
            cell.textContent = `+${overflow}`;
            gridRoutes.appendChild(cell);
          } else {
            const pad = MAX_SLOTS - toShow.length;
            for (let i = 0; i < pad; i++) {
              const filler = document.createElement("div");
              filler.className = "route-mini route-mini--glass";
              filler.textContent = "";
              gridRoutes.appendChild(filler);
            }
          }
          routesArea.appendChild(gridRoutes);
        }
        headerLeft.appendChild(routesArea);

        // ===== Right column: operator + emoji reason =====
        const rightCol = document.createElement("div");
        rightCol.className = "rightCol";

        // Operator pill
        const opTag = document.createElement("div");
        opTag.className = "operatorTag";
        opTag.title = (it.operatorRefs || []).join(", ");

        const dot = document.createElement("span");
        dot.className = "operatorDot";

        const opCodes = mapOperators(it.operatorRefs || []);
        if(opCodes.length === 1){
          const ref = (it.operatorRefs[0] || "").toUpperCase();
          dot.style.background = OP_COLOR_MAP[ref] || "#cfcfd6";
          opTag.appendChild(dot);
          opTag.appendChild(document.createTextNode(" " + opCodes[0]));
        } else {
          dot.style.background = "#cfcfd6";
          opTag.appendChild(dot);
          opTag.appendChild(document.createTextNode(" " + (opCodes.length ? opCodes.join(", ") : "—")));
          startDotColorCycle(dot, it.operatorRefs);
        }
        rightCol.appendChild(opTag);

        // Reason emoji chip (kept as emoji; title for full text)
        const parsed = parseSummaryParts(it.summary);
        const reasonText = (parsed && parsed.reason) ? parsed.reason : (it.summary || "");
        const reasonEmoji = getReasonEmoji(reasonText);
        const reasonEmojiChip = document.createElement("div");
        reasonEmojiChip.className = "reasonEmojiChip";
        reasonEmojiChip.textContent = reasonEmoji;
        reasonEmojiChip.title = reasonText || "Reason";
        reasonEmojiChip.setAttribute("aria-label", `Reason: ${reasonText || 'unknown'}`);
        rightCol.appendChild(reasonEmojiChip);

        // Assemble header
        header.append(headerLeft, rightCol);

        // ===== Details line ("place // TOWN") or fallback to summary =====
        let detailsEl;
        if(parsed){
          detailsEl = document.createElement("div");
          detailsEl.className = "detailsLine";
          const placeSpan = document.createElement("span");
          placeSpan.textContent = parsed.place;
          const sep = document.createElement("span");
          sep.textContent = " // ";
          const townSpan = document.createElement("span");
          townSpan.className = "town";
          townSpan.textContent = parsed.town;
          detailsEl.append(placeSpan, sep, townSpan);
        } else {
          detailsEl = document.createElement("div");
          detailsEl.className = "detailsLine";
          detailsEl.textContent = it.summary || "";
        }

        // ===== Times (Started //, Ends //, Duration //) =====
        const times = document.createElement("div");
        times.className = "times";

        // Helpers for splitting lines and building HTML
        const [startLabel, startValue] = splitLine(it.timeLines.startLine);
        const [endLabel, endValue] = splitLine(it.timeLines.endLine);
        const [durLabel, durValue] = splitLine(it.timeLines.durationLine);

        const startDiv = document.createElement("div");
        startDiv.className = "timeLine";
        startDiv.innerHTML =
          `<span class="timePrefix">${escapeHtml(startLabel)} //</span> ` +
          `<span class="timeValue">${escapeHtml(startValue)}</span>`;
        times.appendChild(startDiv);

        const endDiv = document.createElement("div");
        endDiv.className = "timeLine";
        const isUFN = String(endValue || "").trim().toUpperCase() === "UFN";
        if (isUFN) endDiv.classList.add("ufn");
        endDiv.innerHTML =
          `<span class="timePrefix">${escapeHtml(endLabel)} //</span> ` +
          `<span class="timeValue">${escapeHtml(endValue)}</span>`;
        if (isUFN) {
          const warn = document.createElement("span");
          warn.className = "ufn-warning";
          warn.setAttribute("aria-label","ongoing");
          warn.textContent = " ⚠️";
          endDiv.appendChild(warn);
        }
        times.appendChild(endDiv);

        const durDiv = document.createElement("div");
        durDiv.className = "timeLine";
        durDiv.innerHTML =
          `<span class="timePrefix">${escapeHtml(durLabel)} //</span> ` +
          `<span class="timeValue">${escapeHtml(durValue)}</span>`;
        times.appendChild(durDiv);

        inner.append(header, detailsEl, times);
        chip.append(inner);
        grid.append(chip);
      }

      // keep page indicator accurate on each render
      updatePageIndicator();
    }

    /* --- pager controls (idempotent) --- */
    function stopPager(){
      if (pagerTimer){
        clearInterval(pagerTimer);
        pagerTimer = null;
      }
    }
    function startPager(){
      if (!pager.pages || pager.pages.length <= 1){
        stopPager();
        restartProgressBar(); // hides if single/no page
        return;
      }
      stopPager();
      restartProgressBar(); // reset line at cycle start
      pagerTimer = setInterval(()=>{
        pager.pageIndex = (pager.pageIndex + 1) % pager.pages.length;
        renderPage();
        setStatusPill(true, { animate:false });
        requestAnimationFrame(setFixedGridSizing);
        updatePageIndicator();   // update "Pg a/b"
        restartProgressBar();    // refill progress line
      }, PAGE_INTERVAL_MS);
    }

    function operatorTintClass(ref){
      switch((ref||"").toUpperCase()){
        case "BNML": return {cls:"op-BNML", dark:false};
        case "BNGN": return {cls:"op-BNGN", dark:true};
        case "BNSM": return {cls:"op-BNSM", dark:false};
        case "BNDB": return {cls:"op-BNDB", dark:true};
        case "BNVB": return {cls:"op-BNVB", dark:true};
        case "BNFM": return {cls:"op-BNFM", dark:false};
        default:     return {cls:"",       dark:true};
      }
    }

    /* Count filtered items per operator (each item can increment multiple ops) */
    function computeOperatorCounts(items){
      const counts = { BNML:0, BNGN:0, BNSM:0, BNDB:0, BNVB:0, BNFM:0 };
      if(!Array.isArray(items)) return counts;
      for(const it of items){
        const refs = (it.operatorRefs || []).map(r => String(r).toUpperCase());
        const uniq = [...new Set(refs)];
        for(const r of uniq){
          if (BEE_OPERATORS.includes(r)) counts[r] = (counts[r] || 0) + 1;
        }
      }
      return counts;
    }

    /* -------- Fetch & Render -------- */
    async function fetchAll(){
      try{
        const res = await fetch(BODS_URL, { cache:"no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);

        let parsed;
        try{
          parsed = { type:"json", data: await res.clone().json() };
        }catch{
          parsed = { type:"xml", data: (new DOMParser()).parseFromString(await res.text(),"application/xml") };
        }

        let situations = parsed.type==="json"
          ? extractSituationsFromJSON(parsed.data)
          : extractSituationsFromXML(parsed.data);

        /* Strict operator filter: include if any operator is a Bee operator */
        situations = situations.filter(sit=>{
          const refs = getOperatorRefs(sit);
          const single = getSingleOperatorRef(sit);
          const anyBee = (refs && refs.some(r => BEE_OPERATORS.includes(r))) ||
                         (single && BEE_OPERATORS.includes(single.toUpperCase()));
          return !!anyBee;
        });

        /* Diversions only */
        situations = situations.filter(isDiversion);

        /* Only currently valid */
        situations = situations.filter(isCurrentlyValid);

        /* ±7 day window */
        situations = situations.filter(sit=>{
          const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
          const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

          const now = new Date();
          const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
          const endOfToday   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59,999);

          const windowStart = new Date(startOfToday.getTime() - 7*24*60*60*1000);
          const windowEnd   = new Date(endOfToday.getTime()   + 7*24*60*60*1000);

          const inWindow = d => d && d >= windowStart && d <= windowEnd;
          return inWindow(s) || inWindow(e);
        });

        /* Only unplanned */
        if(UNPLANNED_ONLY) {
          situations = situations.filter(sit=>{
            const p = sit?.Planned;
            return (p === false) || (typeof p === "string" && p.trim().toLowerCase() === "false");
          });
        }

        /* Map to items + UFN >24h pinning */
        const nowMs = Date.now();

        let items = situations.map(s=>{
          const operatorRefs = getOperatorRefs(s);
          const routes = getLineRefs(s);
          const st = parseISO(s?.ValidityPeriod?.StartTime || s?.StartTime);
          const en = parseISO(s?.ValidityPeriod?.EndTime   || s?.EndTime);

          const startMs = st ? st.getTime() : 0;
          const endMs   = en ? en.getTime() : null;

          const isUFN = (endMs == null);
          const ufnOver24h = isUFN && startMs > 0 && (nowMs - startMs) >= DAY_MS;

          const timeLines = buildTimesLines(s);

          return {
            id: getSituationId(s),
            operatorRefs,
            singleOperatorForTint: getSingleOperatorRef(s) || "",
            routes: routes.length ? routes.map(String) : ["?"],
            timeLines,
            summary: (s.Summary || s.Description || "").trim(),
            startMs,
            endMs,
            isUFN,
            ufnOver24h
          };
        })
        /* Sort */
        .sort((a, b) => {
          if (a.ufnOver24h && !b.ufnOver24h) return -1;
          if (!a.ufnOver24h && b.ufnOver24h) return 1;
          if (a.ufnOver24h && b.ufnOver24h) return a.startMs - b.startMs; // older first

          if (a.isUFN && !b.isUFN) return -1;
          if (!a.isUFN && b.isUFN) return 1;

          if (a.isUFN && b.isUFN) return b.startMs - a.startMs;

          const aEnd = a.endMs ?? Number.POSITIVE_INFINITY;
          const bEnd = b.endMs ?? Number.POSITIVE_INFINITY;
          if (aEnd !== bEnd) return aEnd - bEnd;

          return b.startMs - a.startMs;
        });

        /* Build current index for diffing */
        const currIndex = new Map(items.map(it => [it.id, it]));

        /* Detect new and removed (after first load) */
        let newOnes = [];
        let removedOnes = [];
        if(firstFetchDone){
          newOnes = items.filter(it => !lastItemsIndex.has(it.id));
          removedOnes = [...lastItemsIndex.values()].filter(prev => !currIndex.has(prev.id));
        }

        /* Update tracking */
        lastItemsIndex = currIndex;
        firstFetchDone = true;

        /* Page building: fixed 6 per page for 3×2 grid */
        const prevIndex = pager.pageIndex || 0;

        pager.pageSize = 6;
        pager.pages = chunk(items, pager.pageSize);
        pager.total = items.length;

        // Clamp page index
        if (pager.pages.length === 0){
          pager.pageIndex = 0;
        } else {
          pager.pageIndex = Math.min(prevIndex, pager.pages.length - 1);
        }

        // Update operator counts + page indicator for header
        const opCounts = computeOperatorCounts(items); // counts over filtered items displayed by this tool
        updateOperatorCounts(opCounts);
        updatePageIndicator();

        // Render & start timers
        requestAnimationFrame(()=>{
          setFixedGridSizing();
          renderPage();
          setStatusPill(true, { animate: true });
          startPager(); // idempotent; also handles progress bar show/hide
        });

        // Enqueue overlays: new then removed
        if(newOnes.length){
          enqueueOverlays(newOnes.map(item => ({ mode:"add", item })));
        }
        if(removedOnes.length){
          enqueueOverlays(removedOnes.map(item => ({ mode:"remove", item })));
        }

      }catch(e){
        console.error(e);
        setStatusPill(false, { animate: false });
      }
    }

    /* Start */
    fetchAll();
    setInterval(fetchAll, FEED_REFRESH_MS);

    /* Reflow on resize and after fonts ready */
    window.addEventListener("resize", ()=>{
      requestAnimationFrame(setFixedGridSizing);
    });
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(()=> requestAnimationFrame(setFixedGridSizing));
    }
    window.addEventListener("load", () => requestAnimationFrame(setFixedGridSizing) );

    /* VISIBILITY QUEUE (also pause/resume paging + progress bar) */
    document.addEventListener("visibilitychange", () => {
      pageVisible = !document.hidden;
      if (pageVisible) {
        startPager();
        restartProgressBar();
        processOverlayQueue();
      } else {
        stopPager();
      }
    });

    /* Keyboard tests: K = new (yellow), D = diverted end (green) */
    window.addEventListener("keydown", (e)=>{
      const key = String(e.key).toLowerCase();
      if(key === "k"){
        const sampleAdd = {
          routes: ["36", "37", "38", "39", "40", "41", "42"],
          summary: "Multiple routes diverted via Deansgate, MANCHESTER - Incident at St Peter's Square.",
          timeLines: {
            endLine: "Ends // UFN"
          }
        };
        enqueueOverlays([{ mode:"add", item: sampleAdd }]);
      }
      if(key === "d"){
        const start = new Date(Date.now() - (2 * 60 * 60 * 1000)); // 2 hours ago
        const now = new Date();
        const sampleRemove = {
          routes: ["36"],
          startMs: start.getTime(),
          endMs: now.getTime()
        };
        enqueueOverlays([{ mode:"remove", item: sampleRemove }]);
      }
    });
  </script>
</body>
