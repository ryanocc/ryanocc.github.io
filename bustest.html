<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bee Network - Key Travel Alerts</title>
  <meta http-equiv="Cache-Control" content="no-store" />

  <!-- Performance: preconnect for font hosts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;

      --op-BNML:#ff4d4f;
      --op-BNGN:#003C6E;
      --op-BNSM:#ff9a1f;
      --op-BNDB:#9AC331;
      --op-BNVB:#7a3ffe;
      --op-BNFM:#ff66b3;

      --neutral:#16161b;
      --neutralElev:#1b1b22;

      --accent:#FFE04A;
      --alert-add-bg: var(--accent);
      --alert-remove-bg: #19c37d;

      --liveGreen:#42BE4B;
      --errorRed:#EA5540;

      --gridGap:20px;
      --cardRadius:24px;
      --cardHeight: 420px;

      --route-mini-font: clamp(24px, 3.2vw, 34px);
      --route-rect-h: calc(var(--route-mini-font) * 4.2 + 8px + 8px);

      /* gets set dynamically */
      --page-interval: 10000ms;
    }

    *{
      box-sizing:border-box;
      font-family:"IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,sans-serif;
    }

    html, body { height: 100%; }

    body{
      margin:0; padding:0; background:var(--bg);
      color:var(--text);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    /* ----------- HEADER ----------- */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:16px 24px;
      background:#0b0b0e;
      border-bottom:1px solid #1d1d25;
    }
    .leftHeader{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:8px;
      min-width:0;
    }
    .title{
      margin:0;
      font-size:56px;
      font-weight:900;
      letter-spacing:-0.3px;
      line-height:1;
    }
    .status-meta{
      font-size:20px;
      font-weight:700;
      color:var(--muted);
      letter-spacing:0.2px;
      text-shadow: 0 1px 0 rgba(0,0,0,0.25);
      display:flex;
      align-items:center;
      gap:8px;
      line-height:1;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .statusWrapper{
      display:flex;
      align-items:center;
      gap:16px;
      flex-shrink:0;
      margin-right: 0;
    }
    .topbar { padding-right: 0; }

    #beeLogo{
      width:64px; height:64px; object-fit:contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      transition: transform 0.2s ease-out;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{ animation: wibble 650ms ease-out; }

    .status-pill{
      padding:10px 16px;
      border-radius:999px 0px 0px 999px;
      font-size:18px;
      font-weight:800;
      background:var(--liveGreen);
      color:#000;
      box-shadow:0 0 0 2px rgba(255,255,255,0.08),
                 0 4px 14px rgba(0,0,0,0.25);
      transition:background .2s ease,color .2s ease;
      white-space:nowrap;
    }
    .status-error{ background:var(--errorRed); color:#fff; }

    /* ----------- MAIN ----------- */
    main{
      padding:0 24px 24px;
      display:flex;
      flex-direction:column;
      flex:1 1 auto;
      min-height:0;
    }

    /* ----------- FIXED 3×2 GRID ----------- */
    #grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:var(--gridGap);
      flex:1;
      height:100%;
      overflow:hidden;
      align-content:start;
    }

    /* FULL-FRAME EMPTY STATE */
    #grid.empty{
      display:flex !important;
      align-items:center;
      justify-content:center;
    }
    .emptyStateText{
      font-weight: 1000;
      letter-spacing:-0.6px;
      font-size: clamp(64px, 6vw, 110px);
      line-height: 1.05;
      color: rgba(233,233,239,0.86);
      text-align:center;
      padding: 0 4vw;
      text-shadow: 0 3px 14px rgba(0,0,0,0.45);
      user-select:none;
    }

    /* ----------- CARD ----------- */
    .chip{
      position:relative;
      border:3px solid #2a2a33;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00) 60%),
        var(--neutralElev);
      border-radius:var(--cardRadius);
      display:flex;
      flex-direction:column;
      padding:10px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45);
      height:var(--cardHeight);
      min-height:var(--cardHeight);
      max-height:var(--cardHeight);
      overflow:hidden;
    }

    .chip.ufn{
      border-color: rgba(255,77,79,0.85) !important;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45),
        0 0 0 4px rgba(255,77,79,0.10);
    }

    @keyframes pulseRed {
      0% { box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 25px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,77,79,0.4); border-color: rgba(255,77,79,0.55); }
      50% { box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 25px rgba(0,0,0,0.35), 0 0 0 10px rgba(255,77,79,0.12); border-color: rgba(255,77,79,0.95); }
      100%{ box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 25px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,77,79,0.0); border-color: rgba(255,77,79,0.55); }
    }
    .chip.pulse-ufn { border-color: var(--errorRed); animation: pulseRed 1200ms ease-in-out infinite; }

    .chipHeader{
      display:flex; align-items:flex-start; justify-content:space-between; gap:14px; width:100%;
    }
    .headerLeft{ display:flex; flex-direction:column; gap:8px; flex:1 1 auto; min-width:0; }

    .routesArea{
      width:100%; height:var(--route-rect-h);
      display:flex; align-items:center; justify-content:flex-start;
      max-width:100%; flex:1 1 auto;
    }

    .routesGrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap:8px; width:100%; height:100%;
      align-items:stretch; justify-items:stretch;
    }

    .route-mini{
      display:flex; align-items:center; justify-content:center;
      font-family:"Oswald","IBM Plex Sans Condensed",system-ui,sans-serif;
      font-weight:700;
      background:var(--accent);
      color:#000;
      border-radius:12px;
      letter-spacing:0.3px;
      line-height:1;
      padding:6px 10px;
      font-size: var(--route-mini-font);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      text-transform:uppercase;
      font-variant-numeric: tabular-nums;
    }

    .route-mini--glass{
      background: rgba(255,255,255,0.06);
      border: 2px dashed rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.22);
      display:flex; align-items:center; justify-content:center;
      border-radius:12px;
      padding:6px 10px;
      font-size: var(--route-mini-font);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      font-weight: 800;
    }

    .rightCol{ display:flex; flex-direction:column; gap:8px; align-items:stretch; width:max-content; }
    .reasonEmojiChip,
    .operatorTag{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:8px 14px; border-radius:999px;
      background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.18);
      font-size:28px; font-weight:800; color:#e6e6ee; white-space:nowrap; width:100%; line-height:1;
    }
    .operatorTag{ justify-content:flex-start; }
    .operatorDot{
      width:18px; height:18px; border-radius:50%;
      background:#cfcfd6; box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset;
      display:inline-block; flex-shrink:0;
      transition: background-color 400ms ease, background 400ms ease;
    }

    .detailsLine{
      font-size:clamp(26px, 2.6vw, 32px);
      line-height: 1.05;
      color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin:12px 2px 12px 2px;
    }

    .times{
      margin-top:auto; padding-top:14px; border-top:2px solid rgba(255,255,255,0.15);
    }
    .timeLine{
      font-size:clamp(24px, 2.2vw, 30px);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      display:flex; align-items:center; gap:8px;
      line-height:1;
    }
    .times .timeLine{ font-weight:600; color: rgba(233,233,239,0.65); }
    .times .timeLine .timePrefix{ font-weight:600; color: rgba(233,233,239,0.55); }
    .times .timeLine .timeValue{ font-weight:900; color:#ffffff; }
    .times .timeLine.ufn{ color: var(--accent); }
    .times .timeLine.ufn .timePrefix,
    .times .timeLine.ufn .timeValue{ color: var(--accent); }
    .timeLine .ufn-warning{ margin-left:-6px; display:inline-block; animation: ufnFlash 1.2s infinite; }
    @keyframes ufnFlash { 0%,60%{opacity:1;transform:scale(1);} 70%{opacity:.35;transform:scale(0.98);} 100%{opacity:1;transform:scale(1);} }

    /* FULLSCREEN OVERLAY */
    #divertOverlay{
      position:fixed; inset:0; background:var(--accent); color:#000;
      display:none; align-items:center; justify-content:center; z-index:9999; padding:6vh 5vw;
    }
    #divertOverlay.show{ display:flex; animation: overlayFadeIn 220ms ease-out; }
    @keyframes overlayFadeIn{ from{ opacity:0; } to{ opacity:1; } }

    .ov-card{ width:min(1200px, 100%); text-align:center; }
    .ov-kicker{ font-weight: 1000; letter-spacing: 1.4px; font-size: clamp(80px, 10vw, 140px); text-transform: uppercase; margin-bottom: 12px; }
    .ov-reason{
      display:inline-flex; align-items:center; gap:10px;
      background:#000; color:var(--accent);
      border: 2px solid rgba(0,0,0,0.9);
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 1000;
      font-size: clamp(24px, 3vw, 38px);
      box-shadow: 0 10px 26px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,0.06) inset;
      margin: 0 auto 14px;
      user-select: none;
    }
    .ov-reason-emoji{ font-size: 1.2em; line-height: 1; }
    .ov-location{ font-weight:1000; letter-spacing:-0.6px; font-size: clamp(42px, 5.2vw, 84px); line-height: 1; margin: 10px 0 18px; }

    .ov-routes{
      display:flex; flex-wrap:nowrap; gap:18px; justify-content:center; align-items:center;
      padding-top:22px; padding-bottom:26px; margin:8px auto 18px;
      max-width:1200px; overflow:visible; white-space:nowrap;
    }
    .ov-route-chip{
      position: relative;
      display:inline-flex;
      align-items:center; justify-content:center;
      background:#000; color:var(--accent);
      border-radius:18px;
      border:4px solid rgba(0,0,0,0.95);
      padding:24px 32px;
      font-family:"Oswald","IBM Plex Sans Condensed",system-ui,sans-serif !important;
      font-weight:700 !important;
      letter-spacing:0.4px;
      font-size: clamp(52px, 7vw, 95px);
      line-height:1;
      box-shadow: 0 12px 32px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,0.06) inset;
      user-select:none;
      min-width:6ch;
      text-transform:uppercase;
      font-variant-numeric: tabular-nums;
    }
    .ov-route-badge{
      position:absolute;
      top:-14px !important;
      right:-22px !important;
      background:none !important;
      border:none !important;
      width:auto !important;
      height:auto !important;
      box-shadow:none !important;
      padding:0 !important;
      margin:0 !important;
      font-size:0.6em !important;
    }

    .ov-operator{
      display:inline-flex; align-items:center; gap:12px;
      background:#000; color:var(--accent);
      border:2px solid rgba(0,0,0,0.9); border-radius:999px;
      font-weight:1000; font-size: clamp(26px, 3vw, 40px);
      padding:12px 20px; margin-top:10px;
      box-shadow: 0 12px 30px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,0.06) inset;
    }
    .ov-operator .operatorDot{ width:22px; height:22px; border-radius:50%; box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset; flex-shrink:0; }
    .ov-duration{ font-weight:1000; letter-spacing:-0.2px; font-size: clamp(28px, 3vw, 48px); line-height:1; margin:6px 0 0; }

    #divertOverlay.ov-add    { background: var(--accent); color:#000; }
    #divertOverlay.ov-remove { background: #19c37d;       color:#000; }

    @keyframes overlayDropOut {
      0%   { opacity: 1;   transform: translateY(0)    scale(1); }
      40%  { opacity: 0.65;transform: translateY(20px) scale(0.99); }
      100% { opacity: 0;   transform: translateY(60px) scale(0.98); }
    }
    #divertOverlay.closing .ov-card { animation: overlayDropOut 260ms ease-out forwards; }
    #divertOverlay.closing { pointer-events: none; }

    /* Bottom progress */
    #pageProgress{
      position:fixed; left:0; right:0; bottom:0; height:4px; background:var(--accent);
      transform-origin:left center; transform:scaleX(0); opacity:0.9; z-index:9998;
      pointer-events:none; display:none; will-change:transform;
    }
    #pageProgress.run{ animation: pageProgress var(--page-interval) linear forwards; }
    @keyframes pageProgress{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="leftHeader">
      <h1 class="title">Bee Network - Key Travel Alerts</h1>
      <div id="statusMeta" class="status-meta" aria-live="polite">
        <span id="metricPage">Checking Pages</span>
      </div>
    </div>

    <div class="statusWrapper">
      <img id="beeLogo" src="https://tfgm.com/static/android-chrome-192x192.png" alt="Bee Network logo" width="64" height="64" decoding="async">
      <div id="statusPill" class="status-pill">Pulling from DfT</div>
    </div>
  </header>

  <main>
    <div id="grid"></div>
  </main>

  <!-- Fullscreen Alert Overlay -->
  <div id="divertOverlay" class="ov-add" aria-hidden="true" aria-live="assertive">
    <div class="ov-card" role="dialog" aria-label="Travel alert">
      <div id="ovKicker" class="ov-kicker">NEW DIVERT</div>

      <div id="ovReason" class="ov-reason" aria-label="Reason" hidden>
        <span class="ov-reason-emoji" aria-hidden="true">⚠️</span>
        <span class="ov-reason-text">Reason</span>
      </div>

      <div id="ovLocation" class="ov-location" hidden>–</div>
      <div id="ovRoutes" class="ov-routes"></div>
      <div id="ovOperator" class="ov-operator" aria-label="Operator" hidden></div>
      <div id="ovDuration" class="ov-duration" hidden>On diversion for —</div>
    </div>
  </div>

  <div id="pageProgress" aria-hidden="true"></div>

<script>
/* ===========================
   CONFIG
=========================== */
const API_BASE = "https://renderexpress-ebb0.onrender.com";
const BODS_URL = `${API_BASE}/api/bods-siri-sx`;

const BEE_OPERATORS = ["BNML","BNGN","BNSM","BNDB","BNVB","BNFM"];

// UFN section respects this; TODAY section ignores this (per your request)
const UNPLANNED_ONLY = true;

// Timing
const PAGE_DURATION_UFN_MS   = 120000; // 2 minutes
const PAGE_DURATION_OTHER_MS = 10000;  // 10 seconds

const FEED_REFRESH_MS = 45000;
const DAY_MS = 24 * 60 * 60 * 1000;

// Long-term high-impact threshold
const LONG_TERM_ROUTE_THRESHOLD = 5;

// CSS progress duration updated dynamically
document.documentElement.style.setProperty('--page-interval', PAGE_DURATION_OTHER_MS + 'ms');

/* Helpers */
const $ = s => document.querySelector(s);
const parseISO = s => s ? new Date(s) : null;

function withCacheBust(url){
  const sep = url.includes("?") ? "&" : "?";
  return `${url}${sep}ts=${Date.now()}`;
}

function setStatusPill(ok, { animate = false } = {}){
  const pill = $("#statusPill");
  const bee = $("#beeLogo");
  const t = new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());
  if(ok){
    pill.classList.remove("status-error");
    pill.textContent = `LIVE • ${t}`;
    if (animate && bee){
      bee.classList.remove("bee-wibble");
      void bee.offsetWidth;
      bee.classList.add("bee-wibble");
    }
  } else {
    pill.classList.add("status-error");
    pill.textContent = `Error • ${t}`;
  }
}

/* Operator short-code mapping */
const OP_MAP = { BNML:"ML", BNGN:"GN", BNSM:"SC", BNDB:"DB", BNVB:"VB", BNFM:"FB" };
function mapOperators(list){ return list.map(ref => OP_MAP[ref] || ref); }

const OP_COLOR_MAP = {
  BNML:"var(--op-BNML)", BNGN:"var(--op-BNGN)", BNSM:"var(--op-BNSM)",
  BNDB:"var(--op-BNDB)", BNVB:"var(--op-BNVB)", BNFM:"var(--op-BNFM)"
};

/* ===========================
   DATE LABELS
=========================== */
function isToday(d){
  const n=new Date();
  return d && d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function isYesterday(d){
  const n=new Date(), y=new Date(n);
  y.setDate(n.getDate()-1);
  return d && d.getFullYear()===y.getFullYear() && d.getMonth()===y.getMonth() && d.getDate()===y.getDate();
}
function isTomorrow(d){
  const n=new Date(), t=new Date(n);
  t.setDate(n.getDate()+1);
  return d && d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function weekBoundsOfToday(){
  const n=new Date();
  const s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const wd=(s.getDay()+6)%7;
  s.setDate(s.getDate()-wd);
  const e=new Date(s);
  e.setDate(s.getDate()+6);
  e.setHours(23,59,59,999);
  return {start:s,end:e};
}
function inThisWeek(d){
  const {start,end}=weekBoundsOfToday();
  return d && d>=start && d<=end;
}
function ordinal(n){
  const s=["th","st","nd","rd"], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function fullMonth(d){
  return new Intl.DateTimeFormat(undefined, { month: 'long' }).format(d);
}
function fullWeekday(d){
  return new Intl.DateTimeFormat(undefined, { weekday: 'long' }).format(d);
}
function fmtHM(d){
  return new Intl.DateTimeFormat(undefined, {hour:"2-digit",minute:"2-digit"}).format(d);
}
function formatLabelForDate(d){
  if(!d) return "—";
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  if (sameYear){
    if (isToday(d))     return `${fmtHM(d)} Today`;
    if (isYesterday(d)) return `Yesterday`;
    if (isTomorrow(d))  return `Tomorrow`;
    if (inThisWeek(d))  return fullWeekday(d);
    return `${ordinal(d.getDate())} ${fullMonth(d)}`;
  }
  return `${ordinal(d.getDate())} ${fullMonth(d)} ${d.getFullYear()}`;
}

function startOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0,0,0,0);
}
function endOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23,59,59,999);
}

function isStartOfService(d){ return d && d.getHours()===0 && d.getMinutes()===0; }
function isEndOfService(d){ return d && d.getHours()===23 && d.getMinutes()===59; }

function formatSingleUnitDuration(start, end){
  if(!start) return "—";
  const now = new Date();
  const endTime = end || now;
  let ms = endTime - start;
  if (ms < 0) return "—";
  const sec = ms / 1000;
  if (sec < 60) return `${Math.round(sec)}s`;
  const min = sec / 60;
  if (min < 60) return `${Math.round(min)}m`;
  const hr = min / 60;
  if (hr < 24) return `${Math.round(hr)}h`;
  const day = hr / 24;
  return `${Math.round(day)}d`;
}

function buildTimesLines(sit){
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

  let startVal = "—";
  if (s){
    startVal = (isToday(s) && isStartOfService(s)) ? "Start of Service" : formatLabelForDate(s);
  }
  const startLine = `Started // ${startVal}`;

  let endVal = "—";
  if (e){
    endVal = (isToday(e) && isEndOfService(e)) ? "End of Service" : formatLabelForDate(e);
  } else {
    endVal = "UFN";
  }
  const endLine = `Ends // ${endVal}`;

  const durationLine = `Duration // ${formatSingleUnitDuration(s, e)}`;
  return { startLine, endLine, durationLine, startDate:s, endDate:e };
}

/* ===========================
   NETWORK EXTRACTORS (BUS ONLY)
=========================== */
function getNetworkAffectedLines(sit){
  const out = [];
  const nets = sit?.Affects?.Networks?.AffectedNetwork;
  const list = Array.isArray(nets) ? nets : (nets ? [nets] : []);
  for(const n of list){
    const lines = n?.AffectedLine;
    const llist = Array.isArray(lines) ? lines : (lines ? [lines] : []);
    for(const ln of llist){
      const opRef = ln?.AffectedOperator?.OperatorRef || ln?.AffectedOperatorRef || null;
      const lineRef = ln?.LineRef || ln?.PublishedLineName || null;
      const pubName = ln?.PublishedLineName || ln?.LineName || null;
      out.push({ opRef, lineRef, pubName });
    }
  }
  return out;
}

function getOperatorRefs(sit){
  const refs = new Set();
  const add = v => { if(v) refs.add(String(v).trim().toUpperCase()); };

  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
  if(Array.isArray(avj)){
    for(const j of avj) add(j?.OperatorRef);
  } else if(avj){
    add(avj?.OperatorRef);
  }

  for(const x of getNetworkAffectedLines(sit)) add(x.opRef);
  if(Array.isArray(sit.__operatorRefs)) sit.__operatorRefs.forEach(add);
  return [...refs];
}

function getLineRefs(sit){
  const lines = new Set();
  const pushVal = (val)=>{
    if(val == null) return;
    const s = String(val).trim();
    if(s) lines.add(s);
  };

  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
  if(Array.isArray(avj)){
    for(const j of avj) pushVal(j?.LineRef || j?.PublishedLineName || j?.LineName);
  } else if(avj){
    pushVal(avj?.LineRef || avj?.PublishedLineName || avj?.LineName);
  }

  for(const x of getNetworkAffectedLines(sit)) pushVal(x.lineRef || x.pubName);

  if(Array.isArray(sit.__lineRefs)){
    for(const v of sit.__lineRefs) pushVal(v);
  }

  return Array.from(lines);
}

function isDiversion(sit){
  const txt = (sit.Description || sit.Summary || "").toLowerCase();
  return txt.includes("divert") || txt.includes("diversion");
}

function isCurrentlyValid(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
  if(!s) return false;
  if(s > now) return false;
  if(e && e < now) return false;
  return true;
}

function isBusOperator(sit){
  const refs = getOperatorRefs(sit);
  return refs && refs.some(r => BEE_OPERATORS.includes(r));
}

function isUnplanned(sit){
  const p = sit?.Planned;
  return (p === false) || (typeof p === "string" && p.trim().toLowerCase() === "false");
}

function getSituationId(sit){
  const a  = sit?.SituationNumber || sit?.SituationRef;
  const b  = sit?.ParticipantRef || "";
  const st = sit?.ValidityPeriod?.StartTime || sit?.StartTime || "";
  const sum = (sit?.Summary || sit?.Description || "").slice(0,80);
  return String(a || `${b}|${st}|${sum}`).trim();
}

/* ===========================
   ROUTE CHIPS (+X preserved)
=========================== */
function formatRouteChipLabel(raw){
  const s = String(raw ?? "").trim();
  if (!s) return "?";
  if (/^\+\d+$/i.test(s)) return s;
  if (/^\d+[a-z]?$/i.test(s)) return s.toUpperCase();
  const clean = s.replace(/[^A-Za-z0-9]/g, "");
  const out = (clean || s).slice(0,3).toUpperCase();
  return out || "?";
}

function renderRoutesAs2x2Grid(routesArea, routes){
  const MAX_SLOTS = 4;
  const gridRoutes = document.createElement("div");
  gridRoutes.className = "routesGrid";

  const list = Array.isArray(routes) ? routes : ["?"];
  const count = list.length;

  const addCell = (routeObj, glass=false) => {
    const cell = document.createElement("div");
    cell.className = glass ? "route-mini route-mini--glass" : "route-mini";

    if (!glass){
      const raw = (routeObj && typeof routeObj === "object") ? routeObj.raw : routeObj;
      cell.textContent = formatRouteChipLabel(raw);
    } else {
      cell.textContent = "";
    }
    gridRoutes.appendChild(cell);
  };

  if (count <= MAX_SLOTS) {
    list.forEach(rt => addCell(rt, false));
    for (let i = count; i < MAX_SLOTS; i++) addCell("", true);
  } else {
    for (let i = 0; i < 3; i++) addCell(list[i], false);
    addCell(`+${count - 3}`, false);
  }

  routesArea.replaceChildren(gridRoutes);
}

/* ===========================
   UI HELPERS
=========================== */
function splitLine(line){
  const idx = line.indexOf(" // ");
  if (idx === -1) return [line, ""];
  return [line.slice(0, idx), line.slice(idx + 4)];
}
function escapeHtml(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

/* ===========================
   PAGER (SECTIONED + NO RESET ON REFRESH)
=========================== */
let pagerTimer = null;
let lastPageSignature = "";
const pager = { pages: [], pageIndex: 0, pageSize: 6, totalPages: 0 };
let busDivertedRouteTotal = 0;

function chunk(arr,size){
  if (!Array.isArray(arr) || arr.length === 0) return [];
  const out=[]; for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size)); return out;
}

function pageDurationForIndex(idx){
  const pg = pager.pages[idx];
  if (!pg) return PAGE_DURATION_OTHER_MS;
  return (pg.section === "UFN DIVERTS") ? PAGE_DURATION_UFN_MS : PAGE_DURATION_OTHER_MS;
}

function updatePageIndicator(){
  const el = document.getElementById('metricPage');
  if(!el) return;
  const totalPages = Array.isArray(pager.pages) ? pager.pages.length : 0;
  const curr = totalPages > 0 ? (pager.pageIndex + 1) : 0;
  const pg = pager.pages[pager.pageIndex] || {};
  const sectionLabel = pg.section || "—";
  el.textContent = `Page ${curr}/${totalPages} • ${sectionLabel} • Bus routes diverted: ${busDivertedRouteTotal}`;
}

function restartProgressBar(){
  const bar = document.getElementById('pageProgress');
  if (!bar) return;

  const shouldShow = Array.isArray(pager.pages) && pager.pages.length > 1;
  if (!shouldShow){
    bar.classList.remove('run');
    bar.style.display = 'none';
    bar.style.transform = 'scaleX(0)';
    return;
  }

  const dur = pageDurationForIndex(pager.pageIndex);
  document.documentElement.style.setProperty('--page-interval', dur + 'ms');

  bar.style.display = 'block';
  bar.classList.remove('run');
  void bar.offsetWidth;
  bar.classList.add('run');
}

function stopPager(){
  if (pagerTimer){
    clearTimeout(pagerTimer);
    pagerTimer = null;
  }
}

function scheduleNextAdvance(){
  stopPager();
  if (!pager.pages || pager.pages.length <= 1){
    restartProgressBar();
    return;
  }
  restartProgressBar();
  pagerTimer = setTimeout(() => {
    pager.pageIndex = (pager.pageIndex + 1) % pager.pages.length;
    renderPage();
    setStatusPill(true, { animate:false });
    updatePageIndicator();
    scheduleNextAdvance();
  }, pageDurationForIndex(pager.pageIndex));
}

/* ===========================
   OVERLAY QUEUE (BUS UFN ONLY)
=========================== */
let overlayQueue = [];
let overlayShowing = false;
let firstFetchDone = false;
let lastLiveIndex = new Map();

function computeOverlayDurationMs(item){
  const count = (item?.routesRender && item.routesRender.length) ? item.routesRender.length : 1;
  if (count === 1) return 10000;
  if (count <= 4)  return 15000;
  return 20000;
}
function enqueueOverlays(arr){
  if(!arr || !arr.length) return;
  overlayQueue.push(...arr);
  processOverlayQueue();
}
function processOverlayQueue(){
  if (overlayShowing) return;
  const next = overlayQueue.shift();
  if (!next) return;
  const duration = computeOverlayDurationMs(next.item);
  showDivertOverlay(next.item, { mode: next.mode, durationMs: duration });
}

/* Overlay routes line (2 chips + +N) */
function renderOverlayRoutesOneLine(container, routesRender, mode){
  if (!container) return;
  const list = Array.isArray(routesRender) && routesRender.length ? routesRender : ["?"];
  container.replaceChildren();

  const n = list.length;

  if (n <= 1){
    container.appendChild(buildOverlayRouteChip(list[0] ?? "?", mode));
    return;
  }
  if (n <= 3){
    for (let i = 0; i < n; i++){
      container.appendChild(buildOverlayRouteChip(list[i], mode));
    }
    return;
  }

  container.appendChild(buildOverlayRouteChip(list[0], mode));
  container.appendChild(buildOverlayRouteChip(list[1], mode));
  container.appendChild(buildPlusChip(n - 2));
}

function buildOverlayRouteChip(routeObj, mode){
  const chip = document.createElement("div");
  chip.className = "ov-route-chip";
  const raw = (routeObj && typeof routeObj === "object") ? routeObj.raw : routeObj;
  chip.textContent = formatRouteChipLabel(raw);

  const badge = document.createElement("span");
  badge.className = "ov-route-badge";
  badge.setAttribute("aria-hidden", "true");
  badge.textContent = mode === "remove" ? "👍" : "🔀";
  chip.appendChild(badge);
  return chip;
}

function buildPlusChip(remaining){
  const plus = document.createElement("div");
  plus.className = "ov-route-chip";
  plus.textContent = `+${remaining}`;
  plus.setAttribute("aria-label", `${remaining} more routes`);
  return plus;
}

function getReasonEmoji(text){
  if(!text) return "⚠️";
  const s = String(text).toLowerCase();
  if (/\broad\s?works\b/.test(s) || /\bworks\b/.test(s)) return "👷";
  if (/\bclosed\b|\bclosure\b/.test(s)) return "⛔";
  if (/\bcongestion\b/.test(s)) return "🚗🚗";
  if (/\b(asb|behaviour|youths?|vandalism)\b/i.test(s)) return "💢";
  if (/\bdivert(?:ed|ing)?\b|\bdiversion(s)?\b/.test(s)) return "🔀";
  if (/\brtc\b|\bcollision\b|\baccident\b/.test(s)) return "💥";
  if (/\bparked\b|\bparking\b/i.test(s)) return "🅿️";
  if (/\bincident\b|\bpolice\b|\bfire\b/.test(s)) return "🚨";
  if (/\b(water|river|flood|mains|burst)\b/i.test(s)) return "💧";
  return "⚠️";
}

function showDivertOverlay(item, { mode = "add", durationMs = 10000 } = {}){
  const overlay  = $("#divertOverlay");
  const elKicker = $("#ovKicker");
  const elReason = $("#ovReason");
  const elReasonEmoji = elReason?.querySelector(".ov-reason-emoji");
  const elReasonText  = elReason?.querySelector(".ov-reason-text");
  const elLoc    = $("#ovLocation");
  const elRoutes = $("#ovRoutes");
  const elOp     = $("#ovOperator");
  const elDur    = $("#ovDuration");

  overlay.classList.remove("ov-add","ov-remove","closing");

  elReason.hidden = true;
  elLoc.hidden    = true;
  elOp.hidden     = true;
  elDur.hidden    = true;

  const reasonTextRaw = item.summary || "";

  if (mode === "add") {
    if (!item?.isUFN) return;

    overlay.classList.add("ov-add");
    elKicker.textContent = "NEW DIVERT";

    if (elReason && elReasonEmoji && elReasonText){
      elReasonEmoji.textContent = getReasonEmoji(reasonTextRaw);
      elReasonText.textContent  = reasonTextRaw;
      elReason.hidden = false;
    }

    elLoc.textContent = item.summary || "Travel alert";
    elLoc.hidden = false;

    renderOverlayRoutesOneLine(elRoutes, item.routesRender, "add");

    elOp.replaceChildren();
    const dot = document.createElement("span");
    dot.className = "operatorDot";
    elOp.appendChild(dot);

    const refs  = (item.operatorRefs || []).map(r => String(r).toUpperCase());
    const codes = mapOperators(refs);
    elOp.append(document.createTextNode(" " + (codes.length ? codes.join(", ") : "—")));
    dot.style.background = OP_COLOR_MAP[refs[0]] || "#cfcfd6";
    elOp.hidden = false;

  } else if (mode === "remove") {
    overlay.classList.add("ov-remove");
    elKicker.textContent = "DIVERT ENDED";

    if (elReason && elReasonEmoji && elReasonText){
      elReasonEmoji.textContent = getReasonEmoji(reasonTextRaw);
      elReasonText.textContent  = reasonTextRaw;
      elReason.hidden = false;
    }

    elLoc.textContent = item.summary || "Travel alert";
    elLoc.hidden = false;

    renderOverlayRoutesOneLine(elRoutes, item.routesRender, "remove");

    const start = item.startMs ? new Date(item.startMs) : null;
    const end   = item.endMs   ? new Date(item.endMs)   : new Date();
    elDur.textContent = `On diversion for ${formatSingleUnitDuration(start, end)}`;
    elDur.hidden = false;
  }

  overlay.classList.add("show");
  overlay.setAttribute("aria-hidden", "false");
  overlayShowing = true;

  setTimeout(() => {
    overlay.classList.add("closing");
    setTimeout(() => {
      overlay.classList.remove("show", "closing");
      overlay.setAttribute("aria-hidden", "true");
      overlayShowing = false;
      processOverlayQueue();
    }, 300);
  }, durationMs);
}

/* ===========================
   MAP SITUATION -> ITEM (BUS ONLY)
=========================== */
function mapSituationToItem(s){
  const operatorRefs = getOperatorRefs(s);
  const st = parseISO(s?.ValidityPeriod?.StartTime || s?.StartTime);
  const en = parseISO(s?.ValidityPeriod?.EndTime   || s?.EndTime);
  const nowMs = Date.now();
  const startMs = st ? st.getTime() : 0;
  const endMs   = en ? en.getTime() : null;

  const isUFN = (endMs == null);
  const ufnOver24h = isUFN && startMs > 0 && (nowMs - startMs) >= DAY_MS;

  const timeLines = buildTimesLines(s);

  const busRoutes = getLineRefs(s);
  const routesTitle = busRoutes.length ? busRoutes.map(String) : ["?"];
  const routesRender = busRoutes.length ? busRoutes.map(String) : ["?"];

  return {
    id: getSituationId(s),
    operatorRefs,
    routesTitle,
    routesRender,
    summary: (s.Summary || s.Description || "").trim(),
    timeLines,
    startMs,
    endMs,
    isUFN,
    ufnOver24h,
    routeCount: routesTitle.length
  };
}

/* ===========================
   FETCHALL (JSON-first, XML fallback)
   + SECTION PAGING
   + TODAY ignores UNPLANNED_ONLY
   + Long-term threshold 5
   + CRITICAL FIX: refresh doesn't reset pager unless pages changed
=========================== */
async function fetchAll(){
  try{
    const res = await fetch(withCacheBust(BODS_URL), {
      cache:"no-store",
      headers: { "Accept": "application/json, application/xml;q=0.8, text/xml;q=0.7" }
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    let parsed;
    const clone = res.clone();
    try{
      parsed = { type:"json", data: await res.json() };
    }catch{
      const txt = await clone.text();
      parsed = { type:"xml", data: (new DOMParser()).parseFromString(txt, "application/xml") };
    }

    const extractSituationsFromJSON = (json) => {
      const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
      if(!sd) return [];
      const sed = Array.isArray(sd.SituationExchangeDelivery)
        ? sd.SituationExchangeDelivery
        : [sd.SituationExchangeDelivery].filter(Boolean);
      const out=[];
      for(const d of sed){
        const pe = d?.Situations?.PtSituationElement;
        if(Array.isArray(pe)) out.push(...pe);
        else if(pe) out.push(pe);
      }
      return out;
    };

    const extractSituationsFromXML = (doc) => {
      const els = [...doc.querySelectorAll("PtSituationElement")];
      const T = (el, sel) => el.querySelector(sel)?.textContent?.trim() || null;

      const readAffectedNetworks = (el) => {
        const nets = [...el.querySelectorAll("Affects > Networks > AffectedNetwork")];
        if (!nets.length) return null;

        const mapped = nets.map(n => {
          const affectedLines = [...n.querySelectorAll("AffectedLine")].map(ln => {
            const opRef = ln.querySelector("AffectedOperator > OperatorRef")?.textContent?.trim() || null;
            const lineRef = ln.querySelector("LineRef")?.textContent?.trim() || null;
            const pubName = ln.querySelector("PublishedLineName")?.textContent?.trim() || null;
            const lineName = ln.querySelector("LineName")?.textContent?.trim() || null;
            return {
              AffectedOperator: opRef ? { OperatorRef: opRef } : undefined,
              LineRef: lineRef || pubName || lineName || null,
              PublishedLineName: pubName || null,
              LineName: lineName || null
            };
          });

          return { AffectedLine: affectedLines.length ? affectedLines : undefined };
        });

        return mapped.length ? mapped : null;
      };

      return els.map(el=>{
        const opsRef = [
          ...el.querySelectorAll(
            "AffectedVehicleJourney > OperatorRef, OperatorRef, " +
            "Affects > Networks AffectedOperator > OperatorRef, " +
            "Affects > Networks > AffectedNetwork > AffectedLine > AffectedOperator > OperatorRef"
          )
        ].map(n=>n.textContent.trim()).filter(Boolean);

        const lines  = [
          ...el.querySelectorAll(
            "AffectedVehicleJourney > LineRef, PublishedLineName, LineName, " +
            "Affects > Networks > AffectedNetwork > AffectedLine > LineRef, " +
            "Affects > Networks > AffectedNetwork > AffectedLine > PublishedLineName"
          )
        ].map(n=>n.textContent.trim()).filter(Boolean);

        const networks = readAffectedNetworks(el);

        return {
          Summary: T(el,"Summary") || T(el,"Description"),
          Description: T(el,"Description"),
          Severity: T(el,"Severity") || "unknown",
          Planned: T(el,"Planned"),
          SituationNumber: T(el,"SituationNumber") || T(el,"SituationRef"),
          ParticipantRef: T(el,"ParticipantRef"),
          ValidityPeriod: {
            StartTime: T(el,"ValidityPeriod > StartTime") || T(el,"StartTime"),
            EndTime:   T(el,"ValidityPeriod > EndTime")   || T(el,"EndTime")
          },
          CreationTime: T(el,"CreationTime") || T(el,"RecordedAtTime") || T(el,"VersionedAtTime"),
          Affects: networks ? { Networks: { AffectedNetwork: networks } } : undefined,
          __operatorRefs: opsRef,
          __lineRefs: lines
        };
      });
    };

    // All situations
    let allSituations = (parsed.type==="json")
      ? extractSituationsFromJSON(parsed.data)
      : extractSituationsFromXML(parsed.data);

    // Only bus diversions
    allSituations = allSituations.filter(sit => (isBusOperator(sit) && isDiversion(sit)));

    // Live only
    const liveBusAll = allSituations.filter(isCurrentlyValid);

    // Bases
    const baseUnplanned = UNPLANNED_ONLY ? liveBusAll.filter(isUnplanned) : liveBusAll; // for UFN section + overlays
    const baseAll = liveBusAll; // for TODAY + LONG-TERM

    // Section bounds (defined before use)
    const todayStart = startOfToday();
    const todayEnd   = endOfToday();

    // SECTION 1: UFN (respects unplanned-only)
    const ufnSits = baseUnplanned.filter(sit => {
      const e = parseISO(sit?.ValidityPeriod?.EndTime || sit?.EndTime);
      return !e;
    });

    // SECTION 2: Starting/Ending Today (IGNORES unplanned-only)
    const todaySits = baseAll.filter(sit => {
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
      if (!s || !e) return false; // excludes UFN
      return isToday(s) || isToday(e);
    });

    // Dedup IDs so long-term doesn't repeat ones already in today/ufn
    const ufnIds = new Set(ufnSits.map(getSituationId));
    const todayIds = new Set(todaySits.map(getSituationId));

    // SECTION 3: Long term high impact (>=5 routes), spans across today, planned+unplanned
    const longTermSits = baseAll.filter(sit => {
      const id = getSituationId(sit);
      if (ufnIds.has(id) || todayIds.has(id)) return false;
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
      if (!s || !e) return false;
      const routes = getLineRefs(sit) || [];
      if ((routes.length || 0) < LONG_TERM_ROUTE_THRESHOLD) return false;
      return (s < todayStart) && (e > todayEnd);
    });

    // Items
    const ufnItems      = ufnSits.map(mapSituationToItem);
    const todayItems    = todaySits.map(mapSituationToItem);
    const longTermItems = longTermSits.map(mapSituationToItem);

    // Total unique diverted routes across ALL LIVE
    const busSet = new Set();
    for (const sit of liveBusAll){
      const routes = getLineRefs(sit) || [];
      for (const r of routes){
        const v = String(r || "").trim();
        if (v) busSet.add(v.toUpperCase());
      }
    }
    busDivertedRouteTotal = busSet.size;

    // Sorts
    function sortUFN(a,b){
      if (a.ufnOver24h && !b.ufnOver24h) return -1;
      if (!a.ufnOver24h && b.ufnOver24h) return 1;
      if (a.ufnOver24h && b.ufnOver24h) return a.startMs - b.startMs;
      return b.startMs - a.startMs;
    }
    function sortToday(a,b){
      const aEnd = a.endMs ?? Number.POSITIVE_INFINITY;
      const bEnd = b.endMs ?? Number.POSITIVE_INFINITY;
      if (aEnd !== bEnd) return aEnd - bEnd;
      return b.startMs - a.startMs;
    }
    function sortLongTerm(a,b){
      if ((b.routeCount||0) !== (a.routeCount||0)) return (b.routeCount||0) - (a.routeCount||0);
      const aEnd = a.endMs ?? Number.POSITIVE_INFINITY;
      const bEnd = b.endMs ?? Number.POSITIVE_INFINITY;
      if (aEnd !== bEnd) return aEnd - bEnd;
      return b.startMs - a.startMs;
    }

    ufnItems.sort(sortUFN);
    todayItems.sort(sortToday);
    longTermItems.sort(sortLongTerm);

    // Build sectioned pages (with placeholders)
    function buildSectionPages(sectionLabel, items, emptyMessage){
      if (!items.length){
        return [{ section: sectionLabel, items: [{ placeholder:true, message: emptyMessage }] }];
      }
      return chunk(items, pager.pageSize).map(ch => ({ section: sectionLabel, items: ch }));
    }

    const pagesUFN   = buildSectionPages("UFN DIVERTS", ufnItems, "No UFN Diverts ✅");
    const pagesToday = buildSectionPages("STARTING / ENDING TODAY", todayItems, "No Diverts Starting or Ending today");
    const pagesLong  = buildSectionPages("LONG TERM HIGH IMPACT", longTermItems, "No Long Term Diverts");

    // Preserve index where possible
    const prevIndex = pager.pageIndex || 0;
    const oldIndex = pager.pageIndex || 0;

    pager.pageSize = 6;
    pager.pages = [...pagesUFN, ...pagesToday, ...pagesLong];
    pager.totalPages = pager.pages.length;
    pager.pageIndex = pager.pages.length ? Math.min(prevIndex, pager.pages.length - 1) : 0;

    // Signature: section + item count per page (detect structural change)
    const pageSignature = pager.pages.map(p => `${p.section}:${(p.items||[]).length}`).join("|");
    const pageIndexChanged = (pager.pageIndex !== oldIndex);

    // Render always (so data updates show even without restarting pager)
    renderPage();
    setStatusPill(true, { animate:true });
    updatePageIndicator();

    // CRITICAL FIX:
    // Only restart pager/progress when:
    // - pages structure changed (signature)
    // - pageIndex clamped/changed
    // - no timer yet running
    const shouldRestartPager = (!pagerTimer) || (pageSignature !== lastPageSignature) || pageIndexChanged;

    if (shouldRestartPager){
      lastPageSignature = pageSignature;
      scheduleNextAdvance();
    }

    // Overlay detection (UFN only, respects unplanned-only)
    const liveUFNForOverlay = baseUnplanned
      .map(mapSituationToItem)
      .filter(it => it.isUFN);

    const currLiveIndex = new Map(liveUFNForOverlay.map(it => [it.id, it]));

    let newOnes = [];
    let removedOnes = [];
    if(firstFetchDone){
      newOnes     = liveUFNForOverlay.filter(it => !lastLiveIndex.has(it.id));
      removedOnes = [...lastLiveIndex.values()].filter(prev => !currLiveIndex.has(prev.id));
    }
    lastLiveIndex = currLiveIndex;
    firstFetchDone = true;

    if (newOnes.length){
      enqueueOverlays(newOnes.map(item => ({ mode:"add", item })));
    }

    const now = Date.now();
    if (removedOnes.length){
      const endedNow = removedOnes.map(it => {
        if (!it.endMs) it.endMs = now;
        return it;
      });
      enqueueOverlays(endedNow.map(item => ({ mode:"remove", item })));
    }

  }catch(e){
    console.error(e);
    setStatusPill(false);
  }
}

/* Start */
fetchAll();
setInterval(fetchAll, FEED_REFRESH_MS);
</script>
