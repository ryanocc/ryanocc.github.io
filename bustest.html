<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bee Network - Bus Diversion Alerts</title>
  <meta http-equiv="Cache-Control" content="no-store" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">

  <!-- MapLibre GL -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>

  <style>
    :root{
      --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;

      --op-BNML:#ff4d4f;
      --op-BNGN:#003C6E;
      --op-BNSM:#ff9a1f;
      --op-BNDB:#9AC331;
      --op-BNVB:#7a3ffe;
      --op-BNFM:#ff66b3;

      --neutral:#16161b;
      --neutralElev:#1b1b22;

      --accent:#FFE04A;

      --liveGreen:#42BE4B;
      --errorRed:#EA5540;

      --gridGap:20px;
      --cardRadius:24px;

      --route-mini-font: clamp(26px, 3.4vw, 38px);

      --pillTop:16px;
      --pillGap:16px;

      --page-interval: 20000ms;

      /* TfGM overlay colours (can be swapped to official values later if needed) */
      --tfgmRed: var(--errorRed);
      --tfgmGreen: var(--liveGreen);
    }

    *{ box-sizing:border-box; font-family:"IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,sans-serif; }
    html, body { height: 100%; }
    body{
      margin:0; padding:0; background:var(--bg); color:var(--text);
      overflow:hidden; display:flex; flex-direction:column; position:relative;
    }

    /* ===== Top-right status ===== */
    .statusWrapper{
      position:absolute; top:var(--pillTop); right:0; z-index:1000;
      display:flex; align-items:center; gap:var(--pillGap);
      pointer-events:none;
    }
    #beeLogo{
      width:64px; height:64px; min-width:64px; min-height:64px;
      object-fit:contain; pointer-events:auto;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      transition: transform 0.2s ease-out;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{ animation: wibble 650ms ease-out; }

    .status-pill{
      padding:10px 16px;
      font-size:18px; font-weight:800;
      border-radius:999px 0 0 999px;
      background:var(--liveGreen); color:#000;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.25);
      white-space:nowrap; pointer-events:auto;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
      transition: width 260ms ease, padding 260ms ease, border-radius 260ms ease, background-color 200ms ease, color 200ms ease;
    }
    .status-error{ background:var(--errorRed); color:#fff; }

    .status-pill.is-compact{
      width:28px; height:40px; padding:0; color:transparent;
      border-radius:999px 0 0 999px;
    }
    .status-pill.is-compact::before{
      content:""; width:10px; height:10px; border-radius:999px;
      background:rgba(0,0,0,0.65);
    }
    .status-pill.status-error.is-compact::before{ background:rgba(255,255,255,0.9); }

    /* ===== Header ===== */
    .topbar{
      padding:12px 24px;
      border-bottom:1px solid #1d1d25;
      background:var(--bg);
      flex:0 0 auto;
    }
    .leftHeader{
      display:flex; flex-direction:column; gap:6px;
      min-width:0;
      padding-right:240px;
    }
    .title{
      margin:0;
      font-size:56px;
      font-weight:900;
      letter-spacing:-0.3px;
      line-height:1.1;
      padding-bottom:0.08em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .status-meta{
      font-size:20px;
      font-weight:700;
      color:var(--muted);
      letter-spacing:0.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    main{
      padding:0 24px 18px;
      display:flex;
      flex-direction:column;
      flex:1 1 auto;
      min-height:0;
    }

    #grid{
      margin-top:12px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      grid-template-rows:repeat(2, minmax(0, 1fr));
      gap:var(--gridGap);
      flex:1;
      min-height:0;
      overflow:hidden;
      align-content:stretch;

      opacity: 1;
      transform: translateY(0);
      transition: opacity 260ms ease, transform 260ms ease;
    }
    #grid.page-out{ opacity:0; transform: translateY(14px); }
    #grid.page-in{ opacity:1; transform: translateY(0); }

    /* ✅ Critical: MapLibre canvas must not have transformed ancestors */
    #grid.mapMode, #grid.mapMode.page-in, #grid.mapMode.page-out { transform:none !important; }

    #grid.empty{
      display:flex !important;
      align-items:center;
      justify-content:center;
    }
    .emptyStateText{
      font-weight: 1000;
      letter-spacing:-0.6px;
      font-size: clamp(64px, 6vw, 110px);
      line-height: 1.05;
      color: rgba(233,233,239,0.86);
      text-align:center;
      padding: 0 4vw;
      text-shadow: 0 3px 14px rgba(0,0,0,0.45);
      user-select:none;
    }

    /* ===== Card styling ===== */
    .chip{
      position:relative;
      border:3px solid #2a2a33;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00) 60%),
        var(--neutralElev);
      border-radius:var(--cardRadius);
      display:flex;
      flex-direction:column;
      padding:10px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45);
      height:100%;
      min-height:0;
      overflow:hidden;
      min-width:0;
    }
    .chip.ufn{
      border-color: rgba(255,77,79,0.85) !important;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45),
        0 0 0 4px rgba(255,77,79,0.10);
    }
    @keyframes pulseRed {
      0% { box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 25px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,77,79,0.35); border-color: rgba(255,77,79,0.55); }
      50% { box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 25px rgba(0,0,0,0.35), 0 0 0 10px rgba(255,77,79,0.12); border-color: rgba(255,77,79,0.95); }
      100%{ box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 10px 25px rgba(0,0,0,0.35), 0 0 0 0 rgba(255,77,79,0.0); border-color: rgba(255,77,79,0.55); }
    }
    .chip.pulse-ufn { border-color: var(--errorRed); animation: pulseRed 1200ms ease-in-out infinite; }

    .chipTop{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; gap:6px; min-width:0; }
    .chipHeader{
      display:flex; align-items:stretch; justify-content:space-between;
      gap:14px; width:100%; flex:1 1 auto; min-height:0; min-width:0; overflow:hidden;
    }
    .headerLeft{ display:flex; flex-direction:column; flex:1 1 0; min-width:0; min-height:0; }

    .routesArea{ flex:1 1 auto; min-height:0; display:flex; align-items:stretch; }
    .routesGrid{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap:8px;
      width:100%;
      height:100%;
      min-height:0;
    }
    .route-mini{
      display:flex; align-items:center; justify-content:center;
      font-family:"Oswald","IBM Plex Sans Condensed",system-ui,sans-serif;
      font-weight:700;
      background:var(--accent);
      color:#000;
      border-radius:12px;
      letter-spacing:0.3px;
      line-height:1;
      padding:6px 10px;
      font-size: var(--route-mini-font);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      text-transform:uppercase;
      font-variant-numeric: tabular-nums;
    }
    .route-mini--glass{
      background: rgba(255,255,255,0.06);
      border: 2px dashed rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.22);
      display:flex; align-items:center; justify-content:center;
      border-radius:12px;
      padding:6px 10px;
      font-size: var(--route-mini-font);
      font-weight: 800;
    }

    .rightCol{
      display:flex; flex-direction:column; gap:8px;
      align-items:stretch;
      flex: 0 0 15%;
      max-width: 15%;
      min-width: 0;
    }
    .operatorTag, .reasonEmojiChip{
      width:100%; max-width:100%;
      height:50px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:2px solid rgba(255,255,255,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      flex-shrink:0;
      line-height:1;
      overflow:hidden;
      min-width:0;
    }
    .operatorDot{
      width:16px; height:16px; border-radius:50%;
      background:#cfcfd6;
      box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset;
      flex-shrink:0;
    }
    .operatorCode{
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 0.4px;
      line-height: 1;
      width: 2.2ch;
      text-transform: uppercase;
      text-align:center;
      flex:0 0 auto;
      font-variant-numeric: tabular-nums;
      color:#fff;
    }
    .reasonEmojiChip{ font-size:28px; font-weight:800; color:#e6e6ee; }

    .detailsLine{
      margin-top:auto;
      font-size:clamp(26px, 2.4vw, 32px);
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }
    .locSep{ opacity:0.75; font-weight:800; padding:0 6px; }
    .locTown{ font-weight:1000; color:#ffffff; letter-spacing:0.2px; }

    .times{
      border-top:2px solid rgba(255,255,255,0.15);
      padding-top:10px;
      flex:0 0 auto;
    }
    .timeLine{
      font-size:clamp(24px, 2.2vw, 30px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      display:flex;
      align-items:center;
      gap:8px;
      line-height:1;
    }
    .timePrefix{ font-weight:600; color: rgba(233,233,239,0.55); }
    .timeValue{ font-weight:900; color:#ffffff; }
    .timeLine.ufn .timePrefix,
    .timeLine.ufn .timeValue{ color: var(--accent); }
    .ufn-warning{ margin-left:-6px; display:inline-block; animation: ufnFlash 1.2s infinite; }
    @keyframes ufnFlash { 0%,60%{opacity:1;transform:scale(1);} 70%{opacity:.35;transform:scale(0.98);} 100%{opacity:1;transform:scale(1);} }

    /* Progress bar */
    #pageProgress{
      position:fixed; left:0; right:0; bottom:0;
      height:4px; background:var(--accent);
      transform-origin:left center; transform:scaleX(0); opacity:0.9;
      z-index:30; pointer-events:none; display:none;
      will-change:transform;
    }
    #pageProgress.run{ animation: pageProgress var(--page-interval) linear forwards; }
    @keyframes pageProgress{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }

    /* ===== Map page ===== */
    #grid.mapMode{ display:block !important; position:relative; }
    .mapFrame{
      width:100%; height:100%;
      border-radius: var(--cardRadius);
      overflow:hidden;
      border:3px solid #2a2a33;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45);
      background: #0a0a0d;
      position:relative;
    }
    #stopClosureMap{ width:100%; height:100%; }

    .mapEmptyOverlay{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      text-align:center; padding:0 6vw;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.65));
      font-weight:1000; letter-spacing:-0.6px;
      font-size: clamp(54px, 5.5vw, 96px);
      color: rgba(233,233,239,0.92);
      text-shadow: 0 3px 14px rgba(0,0,0,0.45);
      user-select:none;
      pointer-events:none;
      z-index: 5;
    }

    /* Hover popup styling */
    .maplibregl-popup-content{
      font-family:"IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,sans-serif;
      background: rgba(0,0,0,0.90);
      color:#fff;
      border: 2px solid rgba(255,224,74,0.60);
      border-radius: 14px;
      box-shadow:0 12px 30px rgba(0,0,0,0.55);
      padding: 10px 12px;
    }
    .maplibregl-popup-tip{
      border-top-color: rgba(0,0,0,0.90) !important;
    }

/* =========================================================
   ✅ FULLSCREEN OVERLAY ALERT (BEE NETWORK / TFGM STYLE)
========================================================= */

#ufnOverlay{
  position:fixed;
  inset:0;
  z-index:5000;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  pointer-events:none;
  transition: opacity 180ms ease;

  background:
    radial-gradient(circle at 18% 16%, rgba(255,224,74,0.08), transparent 28%),
    radial-gradient(circle at 82% 24%, rgba(255,255,255,0.05), transparent 30%),
    rgba(7,7,10,0.86);
  backdrop-filter: blur(5px);
}

#ufnOverlay.show{
  opacity:1;
  pointer-events:auto;
}

.ufnOverlayShell{
  position:relative;
  width:min(95vw, 1760px);
  height:min(88vh, 940px);
  display:flex;
  align-items:stretch;
  justify-content:center;
  filter: drop-shadow(0 24px 44px rgba(0,0,0,0.45));
}

.ufnOverlayShell::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:32px;
  pointer-events:none;
  background:
    radial-gradient(circle at top right, rgba(255,224,74,0.08), transparent 32%),
    linear-gradient(135deg, rgba(255,255,255,0.035), rgba(255,255,255,0.00) 42%);
  z-index:0;
}

.ufnOverlayRail{
  position:relative;
  z-index:1;
  width:22px;
  border-radius:32px 0 0 32px;
  background: linear-gradient(180deg, #FFE04A 0%, #F7D11B 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.18),
    0 0 28px rgba(255,224,74,0.26);
}

.ufnOverlayCard{
  position:relative;
  z-index:1;
  flex:1 1 auto;
  padding: clamp(28px, 4vw, 56px);
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.00) 16%),
    linear-gradient(135deg, rgba(255,224,74,0.04), rgba(255,255,255,0.00) 36%),
    #14161b;
  border: 2px solid rgba(255,255,255,0.08);
  border-left:none;
  border-radius:0 32px 32px 0;
  overflow:hidden;
}

.ufnOverlayCard::after{
  content:"";
  position:absolute;
  inset:-20% -30%;
  pointer-events:none;
  opacity:0;
  background:
    linear-gradient(
      115deg,
      transparent 0%,
      transparent 42%,
      rgba(255,255,255,0.06) 48%,
      rgba(255,255,255,0.16) 50%,
      rgba(255,255,255,0.06) 52%,
      transparent 58%,
      transparent 100%
    );
  transform: translateX(-45%) skewX(-12deg);
}

#ufnOverlay.show .ufnOverlayCard::after{
  animation: ovSheen 900ms 180ms ease-out both;
}

@keyframes ovSheen{
  0%{
    opacity:0;
    transform: translateX(-45%) skewX(-12deg);
  }
  20%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform: translateX(38%) skewX(-12deg);
  }
}

#ufnOverlay.is-added.show .ufnOverlayShell{
  animation: ovShellIn 560ms cubic-bezier(0.16, 1.2, 0.3, 1) both;
}

#ufnOverlay.is-exit.show .ufnOverlayShell{
  animation: ovShellIn 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.ufnBrandRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom: 16px;
}

.ufnBrandLockup{
  display:flex;
  align-items:center;
  gap:16px;
  min-width:0;
}

.ufnBrandBee{
  width:72px;
  height:72px;
  object-fit:contain;
  flex:0 0 auto;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.26));
}

.ufnBrandText{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.ufnBrandMain{
  font-weight:1000;
  letter-spacing:-0.4px;
  line-height:1;
  font-size: clamp(28px, 2vw, 42px);
  color:#fff;
}

.ufnBrandSub{
  margin-top:4px;
  font-weight:700;
  letter-spacing:0.2px;
  line-height:1.1;
  font-size: clamp(14px, 1vw, 20px);
  color: rgba(255,255,255,0.68);
}

.ufnOverlayBadge{
  flex:0 0 auto;
  padding: 12px 20px;
  border-radius:999px;
  font-weight:1000;
  font-size: clamp(20px, 1.6vw, 30px);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  white-space: nowrap;
  border: 2px solid rgba(255,255,255,0.16);
  background: rgba(255,224,74,0.14);
  color:#FFE04A;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}



.ufnOverlayTop{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom: 18px;
}

.ufnOverlayTitle{
  margin:0;
  font-weight:1000;
  letter-spacing:-1.2px;
  line-height:0.94;
  font-size: clamp(58px, 7.2vw, 136px);
  text-transform: uppercase;
  color:#fff;
  text-wrap:balance;
}

.ufnOverlayRoutes{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  margin: 8px 0 22px;
}

.ufnRoutePill{
  font-family:"Oswald","IBM Plex Sans Condensed",system-ui,sans-serif;
  font-weight:800;
  border-radius: 999px;
  padding: 14px 22px;
  font-size: clamp(34px, 3.5vw, 72px);
  line-height:1;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  box-shadow: 0 14px 28px rgba(0,0,0,0.24);
  background: #FFE04A;
  color:#000;
  border: 2px solid rgba(0,0,0,0.08);
}

.ufnOverlayLoc{
  margin: 0 0 22px;
  font-weight:1000;
  letter-spacing:-0.5px;
  line-height:1.02;
  font-size: clamp(34px, 3.2vw, 74px);
  color:#fff;
  text-shadow: 0 10px 30px rgba(0,0,0,0.26);
  word-break: break-word;
  max-width: 92%;
}

.ufnOverlayMeta{
  display:flex;
  flex-wrap:wrap;
  gap: 14px 20px;
  margin-top:auto;
  padding-top: 22px;
  border-top: 2px solid rgba(255,255,255,0.08);
}

.ufnMetaItem{
  display:flex;
  align-items:center;
  gap:12px;
  padding: 12px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color:#fff;
  font-weight:900;
  font-size: clamp(20px, 1.5vw, 28px);
}

.ufnMetaLabel{
  color: rgba(255,255,255,0.62);
  font-weight:800;
  text-transform: uppercase;
  letter-spacing:0.4px;
}

/* NEW / ADDED */
#ufnOverlay.is-added .ufnOverlayRail{
  background: linear-gradient(180deg, #FFE04A 0%, #F7D11B 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.18),
    0 0 28px rgba(255,224,74,0.28);
}
#ufnOverlay.is-added .ufnOverlayBadge{
  background: rgba(255,224,74,0.16);
  color:#FFE04A;
}


/* ENDED / CLEARED */
#ufnOverlay.is-exit .ufnOverlayRail{
  background: linear-gradient(180deg, #42BE4B 0%, #2f9438 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.18),
    0 0 28px rgba(66,190,75,0.22);
}
#ufnOverlay.is-exit .ufnOverlayBadge{
  background: rgba(66,190,75,0.14);
  color:#7FE387;
}

#ufnOverlay.is-exit .ufnRoutePill{
  background: rgba(255,255,255,0.06);
  color:#fff;
  border:2px solid rgba(66,190,75,0.40);
}

/* =========================================
   ENTRANCE ANIMATION - BRANDED / STAGGERED
========================================= */

#ufnOverlay{
  --ov-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ov-ease-pop: cubic-bezier(0.16, 1.2, 0.3, 1);
}

/* Initial hidden states */
.ufnOverlayShell,
.ufnOverlayRail,
.ufnBrandRow,

<script>
/* ===========================
   CONFIG
=========================== */
const API_BASE = "https://renderexpress-ebb0.onrender.com";
const BODS_URL = `${API_BASE}/api/bods-siri-sx`;

const BEE_OPERATORS = ["BNML","BNGN","BNSM","BNDB","BNVB","BNFM"];
const UNPLANNED_ONLY = true; // defined; not used

const PAGE_DURATION_UFN_MS   = 60000;
const PAGE_DURATION_OTHER_MS = 20000;
const PAGE_DURATION_STOPCLOSURE_MAP_MS = 10000;

const FEED_REFRESH_MS = 45000;
const DAY_MS = 24 * 60 * 60 * 1000;
const LONG_TERM_ROUTE_THRESHOLD = 5;

/* Overlay timing */
const OVERLAY_SHOW_MS = 8500;
const OVERLAY_GAP_MS  = 450;

// MapTiler (raster tiles)
const MAPTILER_KEY = "ileJHPYoUxyL17ZpmERr";
const STOP_MAP_STYLE_OBJ = {
  version: 8,
  sources: {
    "mt-raster": {
      type: "raster",
      tileSize: 256,
      tiles: [
        `https://api.maptiler.com/maps/uk-openzoomstack-night/256/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`
      ]
    }
  },
  layers: [
    { id: "mt-raster", type: "raster", source: "mt-raster" }
  ]
};

document.documentElement.style.setProperty('--page-interval', PAGE_DURATION_OTHER_MS + 'ms');

const $ = s => document.querySelector(s);
const parseISO = s => s ? new Date(s) : null;

/* ===========================
   DATE HELPERS
=========================== */
function startOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0,0,0,0);
}
function endOfToday(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 23,59,59,999);
}
function isToday(d){
  const n=new Date();
  return d && d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function isYesterday(d){
  const n=new Date(), y=new Date(n);
  y.setDate(n.getDate()-1);
  return d && d.getFullYear()===y.getFullYear() && d.getMonth()===y.getMonth() && d.getDate()===y.getDate();
}
function isTomorrow(d){
  const n=new Date(), t=new Date(n);
  t.setDate(n.getDate()+1);
  return d && d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}
function weekBoundsOfToday(){
  const n=new Date();
  const s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const wd=(s.getDay()+6)%7;
  s.setDate(s.getDate()-wd);
  const e=new Date(s);
  e.setDate(s.getDate()+6);
  e.setHours(23,59,59,999);
  return {start:s,end:e};
}
function inThisWeek(d){
  const {start,end}=weekBoundsOfToday();
  return d && d>=start && d<=end;
}
function ordinal(n){
  const s=["th","st","nd","rd"], v=n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function fullMonth(d){
  return new Intl.DateTimeFormat(undefined, { month: 'long' }).format(d);
}
function fullWeekday(d){
  return new Intl.DateTimeFormat(undefined, { weekday: 'long' }).format(d);
}
function fmtHM(d){
  return new Intl.DateTimeFormat(undefined, {hour:"2-digit",minute:"2-digit"}).format(d);
}
function formatLabelForDate(d){
  if(!d) return "—";
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  if (sameYear){
    if (isToday(d))     return `${fmtHM(d)} Today`;
    if (isYesterday(d)) return `Yesterday`;
    if (isTomorrow(d))  return `Tomorrow`;
    if (inThisWeek(d))  return fullWeekday(d);
    return `${ordinal(d.getDate())} ${fullMonth(d)}`;
  }
  return `${ordinal(d.getDate())} ${fullMonth(d)} ${d.getFullYear()}`;
}
function isStartOfService(d){ return d && d.getHours()===0 && d.getMinutes()===0; }
function isEndOfService(d){ return d && d.getHours()===23 && d.getMinutes()===59; }

/* ===========================
   STATUS PILL
=========================== */
const STALE_AFTER_MS = Math.max(FEED_REFRESH_MS * 2, 120000);
const HOURLY_POP_MS  = 20000;

let lastOkAt = 0;
let lastOkLabel = "";
let staleActive = false;
let hourlyTimer = null;
let staleWatchTimer = null;

function nowHHMMSS(){
  return new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());
}
function collapseToSemi(){
  const pill = $("#statusPill");
  if(!pill) return;
  pill.classList.add("is-compact");
  pill.textContent = "";
}
function expandPill(text){
  const pill = $("#statusPill");
  if(!pill) return;
  pill.classList.remove("is-compact");
  pill.textContent = text;
}
function enterStaleMode(){
  if (staleActive) return;
  staleActive = true;
  const pill = $("#statusPill");
  if(!pill) return;
  pill.classList.add("status-error");
  collapseToSemi();
  setTimeout(() => {
    const t = lastOkLabel || nowHHMMSS();
    expandPill(`STALE : ${t}`);
  }, 180);
}
function exitStaleMode(){
  staleActive = false;
  const pill = $("#statusPill");
  if(!pill) return;
  pill.classList.remove("status-error");
  collapseToSemi();
}
function startStaleWatchdog(){
  if (staleWatchTimer) clearInterval(staleWatchTimer);
  staleWatchTimer = setInterval(() => {
    if (!lastOkAt) return;
    if ((Date.now() - lastOkAt) > STALE_AFTER_MS) enterStaleMode();
  }, 2000);
}
function startHourlyPop(){
  if (hourlyTimer) clearTimeout(hourlyTimer);

  function msUntilNextHour(){
    const now = new Date();
    const next = new Date(now);
    next.setMinutes(0,0,0);
    next.setHours(now.getHours() + 1);
    return next - now;
  }
  function pop(){
    if (!lastOkAt || staleActive) { schedule(); return; }
    expandPill(`LIVE • ${lastOkLabel}`);
    setTimeout(() => {
      if (!staleActive) collapseToSemi();
      schedule();
    }, HOURLY_POP_MS);
  }
  function schedule(){ hourlyTimer = setTimeout(pop, msUntilNextHour()); }
  schedule();
}
function setStatusPill(ok, { animate = false, heartbeat = false } = {}){
  const pill = $("#statusPill");
  const bee  = $("#beeLogo");
  if(!pill) return;

  if(ok){
    if (!heartbeat){
      lastOkAt = Date.now();
      lastOkLabel = nowHHMMSS();
    }
    if (staleActive) exitStaleMode();

    pill.classList.remove("status-error");
    collapseToSemi();

    if (animate && bee){
      bee.classList.remove("bee-wibble");
      void bee.offsetWidth;
      bee.classList.add("bee-wibble");
    }
  } else {
    enterStaleMode();
  }
}
collapseToSemi();
startStaleWatchdog();
startHourlyPop();

/* ===========================
   TEXT/HTML HELPERS
=========================== */
function escapeHtml(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
function normaliseSummary(s){ return String(s || "").replace(/\s+/g, " ").trim(); }
function extractStreetTown(summaryRaw){
  let raw = normaliseSummary(summaryRaw);
  if (!raw) return { street:"", town:"", ok:false };
  const idx = Math.max(raw.lastIndexOf(" - "), raw.lastIndexOf(" – "), raw.lastIndexOf(" — "));
  if (idx !== -1) raw = raw.slice(0, idx).trim();
  return { street: raw, town:"", ok:false };
}
function buildLocationHTML(street, town){
  const st = escapeHtml(street || "");
  const tw = escapeHtml((town || "").toUpperCase());
  if (st && tw) return `${st}<span class="locSep">//</span><span class="locTown">${tw}</span>`;
  return st || tw || "";
}

/* ===========================
   SECTION TITLES
=========================== */
const SECTION_TITLE_MAP = {
  "UFN DIVERTS": "UFN Diversions",
  "STARTING / ENDING TODAY": "Diversions Starting/Ending Today",
  "LONG TERM HIGH IMPACT": "Long Term High Impact Diversions",
  "BUS STOP CLOSURES MAP": "Bus Stop Closures"
};
function prettySectionTitle(section){
  const key = String(section || "").trim();
  return SECTION_TITLE_MAP[key] || key || "Checking…";
}

/* ===========================
   BUS EXTRACTORS
=========================== */
const OP_MAP = { BNML:"ML", BNGN:"GN", BNSM:"SC", BNDB:"DB", BNVB:"VB", BNFM:"FB" };
function mapOperators(list){ return list.map(ref => OP_MAP[ref] || ref); }
const OP_COLOR_MAP = {
  BNML:"var(--op-BNML)", BNGN:"var(--op-BNGN)", BNSM:"var(--op-BNSM)",
  BNDB:"var(--op-BNDB)", BNVB:"var(--op-BNVB)", BNFM:"var(--op-BNFM)"
};

function getNetworkAffectedLines(sit){
  const out = [];
  const nets = sit?.Affects?.Networks?.AffectedNetwork;
  const list = Array.isArray(nets) ? nets : (nets ? [nets] : []);
  for(const n of list){
    const lines = n?.AffectedLine;
    const llist = Array.isArray(lines) ? lines : (lines ? [lines] : []);
    for(const ln of llist){
      const opRef = ln?.AffectedOperator?.OperatorRef || ln?.AffectedOperatorRef || null;
      const lineRef = ln?.LineRef || ln?.PublishedLineName || null;
      const pubName = ln?.PublishedLineName || ln?.LineName || null;
      out.push({ opRef, lineRef, pubName });
    }
  }
  return out;
}
function getOperatorRefs(sit){
  const refs = new Set();
  const add = v => { if(v) refs.add(String(v).trim().toUpperCase()); };

  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
  if(Array.isArray(avj)){
    for(const j of avj) add(j?.OperatorRef);
  } else if(avj){
    add(avj?.OperatorRef);
  }

  for(const x of getNetworkAffectedLines(sit)) add(x.opRef);
  if(Array.isArray(sit.__operatorRefs)) sit.__operatorRefs.forEach(add);
  return [...refs];
}
function getLineRefs(sit){
  const lines = new Set();
  const pushVal = (val)=>{
    if(val == null) return;
    const s = String(val).trim();
    if(s) lines.add(s);
  };

  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
  if(Array.isArray(avj)){
    for(const j of avj) pushVal(j?.LineRef || j?.PublishedLineName || j?.LineName);
  } else if(avj){
    pushVal(avj?.LineRef || avj?.PublishedLineName || avj?.LineName);
  }

  for(const x of getNetworkAffectedLines(sit)) pushVal(x.lineRef || x.pubName);
  if(Array.isArray(sit.__lineRefs)){ for(const v of sit.__lineRefs) pushVal(v); }
  return Array.from(lines);
}
function isBusOperator(sit){
  const refs = getOperatorRefs(sit);
  return refs && refs.some(r => BEE_OPERATORS.includes(r));
}
function isDiversion(sit){
  const txt = (sit.Description || sit.Summary || "").toLowerCase();
  return txt.includes("divert") || txt.includes("diversion");
}
function isStopClosure(sit){
  const txt = (sit.Summary || sit.Description || "");
  return /bus\s*stop\s*closur/i.test(txt);
}
function isCurrentlyValid(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
  if(!s) return false;
  if(s > now) return false;
  if(e && e < now) return false;
  return true;
}
function isTfGMParticipant(sit){
  const v = (sit?.ParticipantRef?.value ?? sit?.ParticipantRef ?? "").toString().trim().toLowerCase();
  return v === "tfgm";
}
function getSituationId(sit){
  const a  = sit?.SituationNumber || sit?.SituationRef;
  const b  = sit?.ParticipantRef || "";
  const st = sit?.ValidityPeriod?.StartTime || sit?.StartTime || "";
  const sum = (sit?.Summary || sit?.Description || "").slice(0,80);
  return String(a || `${b}|${st}|${sum}`).trim();
}

/* ===========================
   STOP POINT EXTRACTOR
=========================== */
function getAffectedStopPoints(sit){
  const out = [];
  let raw =
    sit?.Affects?.StopPoints?.AffectedStopPoint ??
    sit?.Affects?.StopPoints ??
    null;

  let list = [];
  if (Array.isArray(raw)) list = raw;
  else if (raw && raw.AffectedStopPoint)
    list = Array.isArray(raw.AffectedStopPoint) ? raw.AffectedStopPoint : [raw.AffectedStopPoint];
  else if (raw) list = [raw];

  for (const sp of list){
    if (!sp) continue;
    const ref  = String(sp.StopPointRef || "");
    const name = String(sp.StopPointName || "");
    const loc  = sp.Location || null;

    const lon  = loc?.Longitude ?? null;
    const lat  = loc?.Latitude  ?? null;
    const lonNum = (lon != null) ? Number(lon) : NaN;
    const latNum = (lat != null) ? Number(lat) : NaN;

    if (!Number.isFinite(lonNum) || !Number.isFinite(latNum)) continue;
    if (Math.abs(lonNum) > 180 || Math.abs(latNum) > 90) continue;

    out.push({ ref, name, lon: lonNum, lat: latNum });
  }
  return out;
}

/* ===========================
   DURATION LINES
=========================== */
function formatSingleUnitDuration(start, end){
  if(!start) return "—";
  const now = new Date();
  const endTime = end || now;
  const ms = endTime - start;
  if (ms < 0) return "—";
  const sec = ms / 1000;
  if (sec < 60) return `${Math.round(sec)}s`;
  const min = sec / 60;
  if (min < 60) return `${Math.round(min)}m`;
  const hr = min / 60;
  if (hr < 24) return `${Math.round(hr)}h`;
  return `${Math.round(hr/24)}d`;
}
function buildTimesLines(sit){
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

  let startVal = "—";
  if (s){
    startVal = (isToday(s) && isStartOfService(s)) ? "Start of Service" : formatLabelForDate(s);
  }
  const startLine = `Started // ${startVal}`;

  let endVal = "—";
  if (e){
    endVal = (isToday(e) && isEndOfService(e)) ? "End of Service" : formatLabelForDate(e);
  } else {
    endVal = "UFN";
  }
  const endLine = `Ends // ${endVal}`;
  const durationLine = `Duration // ${formatSingleUnitDuration(s, e)}`;
  return { startLine, endLine, durationLine, startDate:s, endDate:e };
}

/* ===========================
   ROUTE CHIPS
=========================== */
function formatRouteChipLabel(raw){
  const s = String(raw ?? "").trim();
  if (!s) return "?";
  if (/^\+\d+$/i.test(s)) return s;
  if (/^\d+[a-z]?$/i.test(s)) return s.toUpperCase();
  const clean = s.replace(/[^A-Za-z0-9]/g, "");
  const out = (clean || s).slice(0,3).toUpperCase();
  return out || "?";
}
function renderRoutesAs2x2Grid(routesArea, routes){
  const MAX_SLOTS = 4;
  const gridRoutes = document.createElement("div");
  gridRoutes.className = "routesGrid";

  const list = Array.isArray(routes) ? routes : ["?"];
  const count = list.length;

  const addCell = (val, glass=false) => {
    const cell = document.createElement("div");
    cell.className = glass ? "route-mini route-mini--glass" : "route-mini";
    cell.textContent = glass ? "" : formatRouteChipLabel(val);
    gridRoutes.appendChild(cell);
  };

  if (count <= MAX_SLOTS){
    list.forEach(rt => addCell(rt,false));
    for(let i=count;i<MAX_SLOTS;i++) addCell("", true);
  } else {
    for(let i=0;i<3;i++) addCell(list[i], false);
    addCell(`+${count-3}`, false);
  }

  routesArea.replaceChildren(gridRoutes);
}

   REASON EMOJI
=========================== */
function getReasonEmoji(text){
  if(!text) return "⚠️";
  const s = String(text).toLowerCase();
  if (/\broad\s?works\b/.test(s) || /\bworks\b/.test(s)) return "👷";
  if (/\bclosed\b|\bclosure\b/.test(s)) return "⛔";
  if (/\bcongestion\b/.test(s)) return "🚗";
  if (/\b(asb|behaviour|youths?|vandalism)\b/i.test(s)) return "💢";
  if (/\bdivert(?:ed|ing)?\b|\bdiversion(s)?\b/.test(s)) return "🔀";
  if (/\brtc\b|\bcollision\b|\baccident\b/.test(s)) return "💥";
  if (/\bparked\b|\bparking\b|\bpoorly\b|\bbadly\b/i.test(s)) return "🅿️";
  if (/\bincident\b|\bpolice\b|\bfire\b/.test(s)) return "🚨";
  if (/\b(water|river|flood|mains|burst)\b/i.test(s)) return "💧";
  return "⚠️";
}

=========================== */
let opCycleTimers = [];
function clearOpCycles(){
  if (opCycleTimers.length){
    opCycleTimers.forEach(clearInterval);
    opCycleTimers = [];
  }
}
function startOperatorCycle(opTag, refs){
  const dot = opTag.querySelector(".operatorDot");
  const codeEl = opTag.querySelector(".operatorCode");
  if (!dot || !codeEl) return;

  const cleanedRefs = (refs || []).map(r => String(r).trim().toUpperCase()).filter(Boolean);
  const uniqRefs = Array.from(new Set(cleanedRefs));
  const codes = mapOperators(uniqRefs);

  if (!uniqRefs.length){
    dot.style.background = "#cfcfd6";
    codeEl.textContent = "—";
    return;
  }

  let idx = 0;
  const apply = () => {
    const ref = uniqRefs[idx] || uniqRefs[0];
    const code = codes[idx] || codes[0] || "—";
    dot.style.background = OP_COLOR_MAP[ref] || "#cfcfd6";
    codeEl.textContent = code;
  };
  apply();

  if (uniqRefs.length === 1) return;
  const timer = setInterval(() => {
    idx = (idx + 1) % uniqRefs.length;
    apply();
  }, 2400);
  opCycleTimers.push(timer);
}

function hideOverlay(){

  if (!ov) return;
  ov.classList.remove("show");

function enqueueOverlay(kind, item){
  overlayQueue.push({ kind, item });
  pumpOverlayQueue();
}

function pumpOverlayQueue(){
  if (overlayShowing) return;
  if (!overlayQueue.length) return;

  overlayShowing = true;
  const next = overlayQueue.shift();

  showOverlayNow(next.kind, next.item);

  setTimeout(() => {
    hideOverlay();
    setTimeout(() => {
      overlayShowing = false;
      pumpOverlayQueue();
    }, OVERLAY_GAP_MS);
  }, OVERLAY_SHOW_MS);
}

function restartProgressBar(){
  const bar = document.getElementById('pageProgress');
  if (!bar) return;

  const shouldShow = Array.isArray(pager.pages) && pager.pages.length > 1;
  if (!shouldShow){
    bar.classList.remove('run');
    bar.style.display = 'none';
    bar.style.transform = 'scaleX(0)';
    return;
  }

  const dur = pageDurationForIndex(pager.pageIndex);
  document.documentElement.style.setProperty('--page-interval', dur + 'ms');

  bar.style.display = 'block';
  bar.classList.remove('run');
  void bar.offsetWidth;
  bar.classList.add('run');
}
function stopPager(){
  if (pagerTimer){
    clearTimeout(pagerTimer);
    pagerTimer = null;
  }
}
function scheduleNextAdvance(){
  stopPager();
  if (!pager.pages || pager.pages.length <= 1){
    restartProgressBar();
    return;
  }
  restartProgressBar();
  pagerTimer = setTimeout(() => {
    pager.pageIndex = (pager.pageIndex + 1) % pager.pages.length;
    renderPageWithTransition();
    setStatusPill(true, { animate:false, heartbeat:true });
    updatePageIndicator();
    scheduleNextAdvance();
  }, pageDurationForIndex(pager.pageIndex));
}
function renderPageWithTransition(){

function gotoPage(newIndex){
  if (!Array.isArray(pager.pages) || pager.pages.length === 0) return;
  const n = pager.pages.length;
  pager.pageIndex = ((newIndex % n) + n) % n;
  renderPageWithTransition();
  setStatusPill(true, { animate:false, heartbeat:true });
  updatePageIndicator();
  scheduleNextAdvance();
}

function makeRedXStyleImage(size = 32, stroke = 6, color = "#ff2d2d") {
  const c = document.createElement("canvas");
  c.width = size;
  c.height = size;
  const ctx = c.getContext("2d");

  ctx.save();
  ctx.translate(size / 2, size / 2);
  ctx.lineCap = "round";

  ctx.strokeStyle = "rgba(0,0,0,0.65)";
  ctx.lineWidth = stroke + 3;
  ctx.beginPath();
  ctx.moveTo(-size * 0.32, -size * 0.32);
  ctx.lineTo( size * 0.32,  size * 0.32);
  ctx.moveTo( size * 0.32, -size * 0.32);
  ctx.lineTo(-size * 0.32,  size * 0.32);
  ctx.stroke();

  ctx.strokeStyle = color;
  ctx.lineWidth = stroke;
  ctx.beginPath();
  ctx.moveTo(-size * 0.32, -size * 0.32);
  ctx.lineTo( size * 0.32,  size * 0.32);
  ctx.moveTo( size * 0.32, -size * 0.32);
  ctx.lineTo(-size * 0.32,  size * 0.32);
  ctx.stroke();

  ctx.restore();

  const img = ctx.getImageData(0, 0, size, size);
  return {
    width: size,
    height: size,
    data: new Uint8Array(img.data.buffer)
  };
}

function pointsToFeatureCollection(points) {
  const pts = Array.isArray(points) ? points : [];
  return {
    type: "FeatureCollection",
    features: pts.map(p => ({
      type: "Feature",
      geometry: { type: "Point", coordinates: [p.lon, p.lat] },
      properties: {
        name: p.name || "",
        ref: p.ref || ""
      }
    }))
  };
}

function ensureStopMap(container) {
  if (stopMap && stopMap.getContainer && stopMap.getContainer() === container) return;

  stopMapReady = false;

  stopMap = new maplibregl.Map({
    container,
    style: STOP_MAP_STYLE_OBJ,
    center: [-2.24, 53.48],
    zoom: 9,
    interactive: true,
    keyboard: false,
    attributionControl: false
  });
  stopMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");

  stopHoverPopup = new maplibregl.Popup({
    closeButton: false,
    closeOnClick: false,
    offset: 14
  });

  stopMap.on("style.load", () => {
    if (stopMap.hasImage("red-x")) {
      try { stopMap.removeImage("red-x"); } catch {}
    }
    stopMap.addImage("red-x", makeRedXStyleImage(32, 6, "#ff2d2d"), { pixelRatio: 2 });

    if (!stopMap.getSource("stop-closures")) {
      stopMap.addSource("stop-closures", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] }
      });

      stopMap.addLayer({
        id: "stop-closures-x",
        type: "symbol",
        source: "stop-closures",
        layout: {
          "icon-image": "red-x",
          "icon-size": 1,
          "icon-allow-overlap": true,
          "icon-ignore-placement": true
        }
      });

      stopMap.on("mousemove", "stop-closures-x", (e) => {
        stopMap.getCanvas().style.cursor = "pointer";
        const f = e.features && e.features[0];
        if (!f) return;

        const coords = f.geometry.coordinates.slice();
        const name = (f.properties && f.properties.name) ? String(f.properties.name) : "";
        const ref  = (f.properties && f.properties.ref)  ? String(f.properties.ref)  : "";

        const label = name || ref || "Bus stop";
        const html =
          `<div style="font-weight:1000">${escapeHtml(label)}</div>` +
          (ref ? `<div style="opacity:.85;margin-top:2px">Ref: ${escapeHtml(ref)}</div>` : "");

        stopHoverPopup.setLngLat(coords).setHTML(html).addTo(stopMap);
      });

      stopMap.on("mouseleave", "stop-closures-x", () => {
        stopMap.getCanvas().style.cursor = "";
        stopHoverPopup.remove();
      });
    }

    stopMapReady = true;
  });
}

function updateStopMap(points) {
  if (!stopMap) return;

  const fc = pointsToFeatureCollection(points);
  const apply = () => {
    const src = stopMap.getSource("stop-closures");
    if (src && src.setData) src.setData(fc);

    const features = fc.features || [];
    if (!features.length) {
      stopMap.jumpTo({ center: [-2.24, 53.48], zoom: 9 });
      return;
    }

    if (features.length === 1) {
      const c = features[0].geometry.coordinates;
      stopMap.easeTo({ center: c, zoom: 15, duration: 650 });
      return;
    }

    const b = new maplibregl.LngLatBounds();
    for (const f of features) b.extend(f.geometry.coordinates);

    stopMap.fitBounds(b, {
      padding: { top: 90, left: 90, right: 90, bottom: 90 },
      duration: 650,
      maxZoom: 16
    });
  };

  if (!stopMapReady) {
    stopMap.once("style.load", () => setTimeout(apply, 0));
    return;
  }
  apply();
}

/* ===========================
   FETCHALL (JSON-first, XML fallback)
=========================== */
async function fetchAll(){
  try{
    const res = await fetch(BODS_URL + (BODS_URL.includes("?") ? "&" : "?") + "ts=" + Date.now(), {
      cache:"no-store",
      headers: { "Accept": "application/json, application/xml;q=0.8, text/xml;q=0.7" }
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    let parsed;
    const clone = res.clone();
    try{
      parsed = { type:"json", data: await res.json() };
    }catch{
      const txt = await clone.text();
      parsed = { type:"xml", data: (new DOMParser()).parseFromString(txt, "application/xml") };
    }

    const extractSituationsFromJSON = (json) => {
      const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
      if(!sd) return [];
      const sed = Array.isArray(sd.SituationExchangeDelivery)
        ? sd.SituationExchangeDelivery
        : [sd.SituationExchangeDelivery].filter(Boolean);
      const out=[];
      for(const d of sed){
        const pe = d?.Situations?.PtSituationElement;
        if(Array.isArray(pe)) out.push(...pe);
        else if(pe) out.push(pe);
      }
      return out;
    };

    const extractSituationsFromXML = (doc) => {
      const els = [...doc.querySelectorAll("PtSituationElement")];
      const T = (el, sel) => el.querySelector(sel)?.textContent?.trim() || null;

      const readAffectedNetworks = (el) => {
        const nets = [...el.querySelectorAll("Affects > Networks > AffectedNetwork")];
        if (!nets.length) return null;
        const mapped = nets.map(n => {
          const affectedLines = [...n.querySelectorAll("AffectedLine")].map(ln => {
            const opRef = ln.querySelector("AffectedOperator > OperatorRef")?.textContent?.trim() || null;
            const lineRef = ln.querySelector("LineRef")?.textContent?.trim() || null;
            const pubName = ln.querySelector("PublishedLineName")?.textContent?.trim() || null;
            const lineName = ln.querySelector("LineName")?.textContent?.trim() || null;
            return {
              AffectedOperator: opRef ? { OperatorRef: opRef } : undefined,
              LineRef: lineRef || pubName || lineName || null,
              PublishedLineName: pubName || null,
              LineName: lineName || null
            };
          });
          return { AffectedLine: affectedLines.length ? affectedLines : undefined };
        });
        return mapped.length ? mapped : null;
      };

      const readAffectedStopPoints = (el) => {
        const sps = [...el.querySelectorAll("Affects > StopPoints > AffectedStopPoint")];
        if (!sps.length) return null;

        const mapped = sps.map(sp => {
          const ref = sp.querySelector("StopPointRef")?.textContent?.trim() || null;
          const name = sp.querySelector("StopPointName")?.textContent?.trim() || null;
          const lon = sp.querySelector("Location > Longitude")?.textContent?.trim() || null;
          const lat = sp.querySelector("Location > Latitude")?.textContent?.trim() || null;
          return {
            StopPointRef: ref,
            StopPointName: name,
            Location: (lon && lat) ? { Longitude: lon, Latitude: lat } : undefined
          };
        });

        return mapped.length ? mapped : null;
      };

      return els.map(el=>{
        const opsRef = [
          ...el.querySelectorAll(
            "AffectedVehicleJourney > OperatorRef, OperatorRef, " +
            "Affects > Networks AffectedOperator > OperatorRef, " +
            "Affects > Networks > AffectedNetwork > AffectedLine > AffectedOperator > OperatorRef"
          )
        ].map(n=>n.textContent.trim()).filter(Boolean);

        const lines  = [
          ...el.querySelectorAll(
            "AffectedVehicleJourney > LineRef, PublishedLineName, LineName, " +
            "Affects > Networks > AffectedNetwork > AffectedLine > LineRef, " +
            "Affects > Networks > AffectedNetwork > AffectedLine > PublishedLineName"
          )
        ].map(n=>n.textContent.trim()).filter(Boolean);

        const networks = readAffectedNetworks(el);
        const stopPoints = readAffectedStopPoints(el);

        const affects = {};
        if (networks) affects.Networks = { AffectedNetwork: networks };
        if (stopPoints) affects.StopPoints = { AffectedStopPoint: stopPoints };

        return {
          Summary: T(el,"Summary") || T(el,"Description"),
          Description: T(el,"Description"),
          Planned: T(el,"Planned"),
          SituationNumber: T(el,"SituationNumber") || T(el,"SituationRef"),
          ParticipantRef: T(el,"ParticipantRef"),
          ValidityPeriod: {
            StartTime: T(el,"ValidityPeriod > StartTime") || T(el,"StartTime"),
            EndTime:   T(el,"ValidityPeriod > EndTime")   || T(el,"EndTime")
          },
          Affects: Object.keys(affects).length ? affects : undefined,
          __operatorRefs: opsRef,
          __lineRefs: lines
        };
      });
    };

    let allSituations = (parsed.type==="json")
      ? extractSituationsFromJSON(parsed.data)
      : extractSituationsFromXML(parsed.data);

    const busSituations = allSituations.filter(sit => isBusOperator(sit));
    const diversionSituations   = busSituations.filter(sit => isDiversion(sit));
    const stopClosureSituations = busSituations.filter(sit => isStopClosure(sit));

    const liveDiversions = diversionSituations.filter(isCurrentlyValid);
    const baseAll = liveDiversions;

    const liveStopClosures = stopClosureSituations
      .filter(isCurrentlyValid)
      .filter(isTfGMParticipant);

    const todayStart = startOfToday();
    const todayEnd   = endOfToday();

    // ✅ UFN (no EndTime)
    const ufnSits = baseAll.filter(sit => {
      const e = parseISO(sit?.ValidityPeriod?.EndTime || sit?.EndTime);
      return !e;
    });

    /* =========================================================
       ✅ UFN OVERLAY DIFF (RULES)
       - Added overlay: new in UFN set
       - Exit overlay: was UFN, now NOT LIVE at all (vanished without end time)
         (If given a future EndTime, it remains live => NO exit overlay)
    ========================================================= */
    const currentLiveDiversionIds = new Set(baseAll.map(getSituationId));
    const currentUfnIds = new Set(ufnSits.map(getSituationId));

    const currentUfnItemMap = new Map();
    for (const sit of ufnSits){
      const item = mapSituationToItem(sit);
      currentUfnItemMap.set(item.id, item);
    }

    // Update test list (newest first)
    latestUfnItemsForTest = Array.from(currentUfnItemMap.values()).sort((a,b)=> (b.startMs - a.startMs));

    if (bootstrappedOnce){
      for (const id of currentUfnIds){
        if (!prevUfnIds.has(id)){
          const item = currentUfnItemMap.get(id);
          if (item) enqueueOverlay("added", item);
        }
      }
      for (const id of prevUfnIds){
        if (!currentLiveDiversionIds.has(id)){
          const item = prevUfnItemById.get(id);
          if (item) enqueueOverlay("exit", item);
        }
      }
    }

    prevUfnIds = currentUfnIds;
    prevUfnItemById = currentUfnItemMap;
    bootstrappedOnce = true;
    /* ========================================================= */

    const todaySits = baseAll.filter(sit => {
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
      if (!s || !e) return false;
      return isToday(s) || isToday(e);
    });

    const ufnIds = new Set(ufnSits.map(getSituationId));
    const todayIds = new Set(todaySits.map(getSituationId));

    const longTermSits = baseAll.filter(sit => {
      const id = getSituationId(sit);
      if (ufnIds.has(id) || todayIds.has(id)) return false;
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
      if (!s || !e) return false;
      const routes = getLineRefs(sit) || [];
      if ((routes.length || 0) < LONG_TERM_ROUTE_THRESHOLD) return false;
      return (s < todayStart) && (e > todayEnd);
    });

    const ufnItems      = ufnSits.map(mapSituationToItem).sort((a,b)=> (b.startMs - a.startMs));
    const todayItems    = todaySits.map(mapSituationToItem).sort((a,b)=> ((a.endMs ?? Infinity) - (b.endMs ?? Infinity)));
    const longTermItems = longTermSits.map(mapSituationToItem).sort((a,b)=> (b.routeCount - a.routeCount));

    function buildSectionPages(sectionLabel, items, emptyMessage){
      if (!items.length){
        return [{ section: sectionLabel, items: [{ placeholder:true, message: emptyMessage }] }];
      }
      return chunk(items, pager.pageSize).map(ch => ({ section: sectionLabel, items: ch }));
    }

    const pagesUFN   = buildSectionPages("UFN DIVERTS", ufnItems, "No UFN Diversions ✅");
    const pagesToday = buildSectionPages("STARTING / ENDING TODAY", todayItems, "No Diversions Starting/Ending today");
    const pagesLong  = buildSectionPages("LONG TERM HIGH IMPACT", longTermItems, "No Long Term Diversions");

    // Stop closure points (map page)
    const stopPointsAll = [];
    for (const sit of liveStopClosures) stopPointsAll.push(...getAffectedStopPoints(sit));

    const uniq = new Map();
    for (const p of stopPointsAll){
      const key = p.ref ? `ref:${p.ref}` : `xy:${p.lon.toFixed(6)},${p.lat.toFixed(6)}`;
      if (!uniq.has(key)) uniq.set(key, p);
    }
    const stopPointsUnique = [...uniq.values()];

    const pageStopMap = [{
      section: "BUS STOP CLOSURES MAP",
      mapPage: true,
      points: stopPointsUnique,
      emptyMessage: "No TfGM Bus Stop Closures ✅"
    }];

    const prevIndex = pager.pageIndex || 0;
    const oldIndex = pager.pageIndex || 0;

    pager.pages = [...pagesUFN, ...pagesToday, ...pagesLong, ...pageStopMap];
    pager.totalPages = pager.pages.length;
    pager.pageIndex = pager.pages.length ? Math.min(prevIndex, pager.pages.length - 1) : 0;

    const pageSignature = pager.pages
      .map(p => p.mapPage ? `${p.section}:map:${(p.points||[]).length}` : `${p.section}:${(p.items||[]).length}`)
      .join("|");
    const pageIndexChanged = (pager.pageIndex !== oldIndex);

    renderPage();
    setStatusPill(true, { animate:true });
    updatePageIndicator();

    const shouldRestartPager = (!pagerTimer) || (pageSignature !== lastPageSignature) || pageIndexChanged;
    if (shouldRestartPager){
      lastPageSignature = pageSignature;
      scheduleNextAdvance();
    }

  }catch(e){
    console.error(e);
    setStatusPill(false);
  }
}

/* ===========================
   START
=========================== */
fetchAll();
setInterval(fetchAll, FEED_REFRESH_MS);
</script>
