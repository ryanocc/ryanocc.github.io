<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>OCC Dashboard - Live Traffic Accidents</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css"
  >

  <script src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js"></script>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;800&display=swap"
  >

  <style>
    :root {
      --bg: #000;
      --text: #f2f2f2;
      --bottom-pad: 12px;
      --chip-height: 28px;
      --chip-bg: rgba(0, 0, 0, 0.76);
      --chip-border: rgba(255, 255, 255, 0.14);
      --chip-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      --ui-font:
        "IBM Plex Sans Condensed",
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .maplibregl-ctrl-group button {
      filter: invert(1) hue-rotate(180deg);
    }

    .maplibregl-ctrl-attrib {
      display: none !important;
    }

    #bottomStatusRow {
      position: absolute;
      right: var(--bottom-pad);
      bottom: var(--bottom-pad);
      left: var(--bottom-pad);
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    #feedStatusChip,
    #attribChip {
      min-height: var(--chip-height);
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--chip-bg);
      box-shadow:
        0 0 0 1px var(--chip-border) inset,
        var(--chip-shadow);
      white-space: nowrap;
      pointer-events: auto;
    }

    #feedStatusChip {
      margin-right: auto;
      gap: 8px;
      color: #ddd;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    #feedStatusIndicator {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #7b7b7b;
      box-shadow: 0 0 7px rgba(123, 123, 123, 0.7);
    }

    #feedStatusChip[data-state="ok"] #feedStatusIndicator {
      background: #42be4b;
      box-shadow: 0 0 8px rgba(66, 190, 75, 0.85);
    }

    #feedStatusChip[data-state="loading"] #feedStatusIndicator {
      background: #ffe04a;
      box-shadow: 0 0 8px rgba(255, 224, 74, 0.85);
    }

    #feedStatusChip[data-state="error"] #feedStatusIndicator {
      background: #ff4d4f;
      box-shadow: 0 0 8px rgba(255, 77, 79, 0.85);
    }

    #attribChip {
      color: #ddd;
      font-size: 12px;
      line-height: 1;
    }

    #attribChip a {
      color: #fff;
      text-decoration: none;
      opacity: 0.92;
    }

    #attribChip a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    @media (max-width: 620px) {
      #bottomStatusRow {
        align-items: flex-end;
        flex-direction: column;
      }

      #feedStatusChip {
        align-self: flex-start;
        margin-right: 0;
      }

      #attribChip {
        align-self: flex-end;
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div
    id="bottomStatusRow"
    aria-label="Feed status and map attribution"
  >
    <div
      id="feedStatusChip"
      data-state="loading"
      aria-live="polite"
    >
      <span
        id="feedStatusIndicator"
        aria-hidden="true"
      ></span>

      <span id="feedStatusText">Loading accident feed...</span>
    </div>

    <div
      id="attribChip"
      aria-label="Map attribution"
    ></div>
  </div>

  <script>
    "use strict";

    /*
     * Direct GitHub Pages accident feed.
     * No Netlify functions or proxy are used.
     */
    const ACCIDENT_FEED_URL =
      "https://ryanocc.github.io/data/waze-accidents.json";

    const MAP_STYLE_URL =
      "https://api.maptiler.com/maps/019c7761-a6b7-72d1-a48e-14ef5b3caf94/style.json?key=ileJHPYoUxyL17ZpmERr";

    const REFRESH_MS = 30 * 1000;

    const NON_MWAY_MERGE_METERS = 500;
    const MWAY_MERGE_METERS = 500;
    const HIGH_CONF_MIN = 4;

    const GM_BOUNDS = [
      [-2.75, 53.33],
      [-1.95, 53.62]
    ];

    const ACCIDENT_SOURCE_ID = "accidents";

    const EMPTY_FEATURE_COLLECTION = {
      type: "FeatureCollection",
      features: []
    };

    const map = new maplibregl.Map({
      container: "map",
      style: MAP_STYLE_URL,
      center: [-2.3297, 53.5],
      zoom: 10.44,
      pitch: 0,
      bearing: 0,
      attributionControl: true
    });

    let refreshTimer = null;
    let fetchController = null;
    let attributionObserver = null;

    function withCacheBust(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}ts=${Date.now()}`;
    }

    function cleanResponseText(value) {
      return String(value || "")
        .replace(/^\uFEFF/, "")
        .trim();
    }

    async function fetchAccidentFeed(signal) {
      const response = await fetch(
        withCacheBust(ACCIDENT_FEED_URL),
        {
          method: "GET",
          cache: "no-store",
          signal
        }
      );

      if (!response.ok) {
        throw new Error(
          `Accident feed returned HTTP ${response.status}`
        );
      }

      const text = cleanResponseText(
        await response.text()
      );

      if (!text) {
        throw new Error(
          "Accident feed returned an empty response"
        );
      }

      let data;

      try {
        data = JSON.parse(text);
      } catch (error) {
        throw new Error(
          "Accident feed returned invalid JSON"
        );
      }

      if (!Array.isArray(data.incidents)) {
        throw new Error(
          "Accident feed does not contain an incidents array"
        );
      }

      return data;
    }

    function toRadians(degrees) {
      return degrees * Math.PI / 180;
    }

    function haversineMeters(first, second) {
      const [longitude1, latitude1] = first;
      const [longitude2, latitude2] = second;

      const earthRadiusMetres = 6371000;

      const latitudeDifference = toRadians(
        latitude2 - latitude1
      );

      const longitudeDifference = toRadians(
        longitude2 - longitude1
      );

      const calculation =
        Math.sin(latitudeDifference / 2) ** 2 +
        Math.cos(toRadians(latitude1)) *
        Math.cos(toRadians(latitude2)) *
        Math.sin(longitudeDifference / 2) ** 2;

      return 2 *
        earthRadiusMetres *
        Math.atan2(
          Math.sqrt(calculation),
          Math.sqrt(1 - calculation)
        );
    }

    /*
     * Feed point format:
     * "53.480916 -2.569054"
     *
     * This is latitude followed by longitude.
     * MapLibre requires longitude followed by latitude.
     */
    function parseIncidentPoint(pointValue) {
      if (typeof pointValue !== "string") {
        return null;
      }

      const parts = pointValue
        .trim()
        .split(/\s+/);

      if (parts.length < 2) {
        return null;
      }

      const latitude = Number(parts[0]);
      const longitude = Number(parts[1]);

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {
        return null;
      }

      if (
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
      ) {
        return null;
      }

      return [longitude, latitude];
    }

    function readIncidentType(incident) {
      return String(
        incident?.type || ""
      ).toUpperCase();
    }

    function readIncidentSubtype(incident) {
      return String(
        incident?.subtype || ""
      ).toUpperCase();
    }

    function isAccidentIncident(incident) {
      return (
        readIncidentType(incident).includes("ACCIDENT") ||
        readIncidentSubtype(incident).includes("ACCIDENT")
      );
    }

    function isMotorwayIncident(incident) {
      const searchableText = [
        incident?.road,
        incident?.title,
        incident?.type,
        incident?.subtype
      ]
        .filter(Boolean)
        .join(" ");

      return (
        /\bM\d{1,3}\b/i.test(searchableText) ||
        /\bA\d{1,4}\s*\(M\)/i.test(searchableText)
      );
    }

    function incidentsToAccidentPoints(feed) {
      const points = [];

      for (const incident of feed.incidents) {
        if (!isAccidentIncident(incident)) {
          continue;
        }

        const coordinate = parseIncidentPoint(
          incident.point
        );

        if (!coordinate) {
          continue;
        }

        const confidence = Number(
          incident.confidence
        );

        const reliability = Number(
          incident.reliability
        );

        points.push({
          id: String(
            incident.id || ""
          ),

          coordinate,

          confidence10:
            Number.isFinite(confidence)
              ? Math.max(0, confidence)
              : 0,

          reliability10:
            Number.isFinite(reliability)
              ? Math.max(0, reliability)
              : 0,

          isMotorway:
            isMotorwayIncident(incident),

          road: String(
            incident.road || ""
          ),

          city: String(
            incident.city || ""
          ),

          subtype: String(
            incident.subtype || ""
          ),

          published: String(
            incident.published || ""
          )
        });
      }

      return points;
    }

    function clusterPointsSpatially(
      points,
      thresholdForPair
    ) {
      if (!points.length) {
        return [];
      }

      const parent = points.map(
        (_, index) => index
      );

      function find(index) {
        let root = index;

        while (parent[root] !== root) {
          root = parent[root];
        }

        while (parent[index] !== index) {
          const next = parent[index];
          parent[index] = root;
          index = next;
        }

        return root;
      }

      function union(firstIndex, secondIndex) {
        const firstRoot = find(firstIndex);
        const secondRoot = find(secondIndex);

        if (firstRoot !== secondRoot) {
          parent[secondRoot] = firstRoot;
        }
      }

      const maximumThreshold = Math.max(
        NON_MWAY_MERGE_METERS,
        MWAY_MERGE_METERS
      );

      const meanLatitude =
        points.reduce(
          (total, point) =>
            total + point.coordinate[1],
          0
        ) / points.length;

      const metresPerLatitudeDegree = 111320;

      const metresPerLongitudeDegree = Math.max(
        1,
        metresPerLatitudeDegree *
          Math.cos(toRadians(meanLatitude))
      );

      const cellWidth =
        maximumThreshold /
        metresPerLongitudeDegree;

      const cellHeight =
        maximumThreshold /
        metresPerLatitudeDegree;

      const grid = new Map();

      for (
        let pointIndex = 0;
        pointIndex < points.length;
        pointIndex += 1
      ) {
        const point = points[pointIndex];

        const cellX = Math.floor(
          point.coordinate[0] / cellWidth
        );

        const cellY = Math.floor(
          point.coordinate[1] / cellHeight
        );

        for (
          let offsetX = -1;
          offsetX <= 1;
          offsetX += 1
        ) {
          for (
            let offsetY = -1;
            offsetY <= 1;
            offsetY += 1
          ) {
            const nearbyPoints = grid.get(
              `${cellX + offsetX}:${cellY + offsetY}`
            );

            if (!nearbyPoints) {
              continue;
            }

            for (
              const nearbyIndex of nearbyPoints
            ) {
              const mergeThreshold =
                thresholdForPair(
                  point,
                  points[nearbyIndex]
                );

              const distance = haversineMeters(
                point.coordinate,
                points[nearbyIndex].coordinate
              );

              if (distance <= mergeThreshold) {
                union(
                  pointIndex,
                  nearbyIndex
                );
              }
            }
          }
        }

        const cellKey = `${cellX}:${cellY}`;

        if (!grid.has(cellKey)) {
          grid.set(cellKey, []);
        }

        grid.get(cellKey).push(pointIndex);
      }

      const groups = new Map();

      points.forEach((point, index) => {
        const root = find(index);

        if (!groups.has(root)) {
          groups.set(root, []);
        }

        groups.get(root).push(point);
      });

      return [...groups.values()];
    }

    function averageCoordinate(members) {
      const totals = members.reduce(
        (result, member) => {
          result[0] += member.coordinate[0];
          result[1] += member.coordinate[1];
          return result;
        },
        [0, 0]
      );

      return [
        totals[0] / members.length,
        totals[1] / members.length
      ];
    }

    function calculateEffectiveConfidence(members) {
      const highestConfidence = Math.max(
        0,
        ...members.map(
          member => member.confidence10
        )
      );

      const highestReliability = Math.max(
        0,
        ...members.map(
          member => member.reliability10
        )
      );

      const adjustedConfidence = Math.min(
        10,
        highestConfidence +
          (highestReliability > 8 ? 2 : 0)
      );

      /*
       * Confidence 0 still receives level 1 so that
       * GeoRSS accidents are not discarded.
       */
      return Math.max(
        1,
        Math.min(
          5,
          Math.round(adjustedConfidence / 2)
        )
      );
    }

    function choosePrimaryRoad(members) {
      const roadFrequency = new Map();

      for (const member of members) {
        const road = member.road.trim();

        if (!road) {
          continue;
        }

        roadFrequency.set(
          road,
          (roadFrequency.get(road) || 0) + 1
        );
      }

      let selectedRoad = "";
      let selectedCount = 0;

      for (
        const [road, count] of roadFrequency.entries()
      ) {
        if (count > selectedCount) {
          selectedRoad = road;
          selectedCount = count;
        }
      }

      return selectedRoad;
    }

    function choosePrimaryCity(members) {
      for (const member of members) {
        const city = member.city.trim();

        if (city) {
          return city;
        }
      }

      return "";
    }

    function clusterAccidents(points) {
      const groups = clusterPointsSpatially(
        points,
        (firstPoint, secondPoint) =>
          firstPoint.isMotorway ||
          secondPoint.isMotorway
            ? MWAY_MERGE_METERS
            : NON_MWAY_MERGE_METERS
      );

      return groups.map(
        (members, index) => {
          const coordinates =
            averageCoordinate(members);

          const effectiveConfidence =
            calculateEffectiveConfidence(members);

          const road =
            choosePrimaryRoad(members);

          const city =
            choosePrimaryCity(members);

          const published =
            members.find(
              member => member.published
            )?.published || "";

          return {
            type: "Feature",

            id:
              `accident-${index}-` +
              `${coordinates[0].toFixed(5)}-` +
              `${coordinates[1].toFixed(5)}`,

            geometry: {
              type: "Point",
              coordinates
            },

            properties: {
              effectiveConfidence,
              reportCount: members.length,
              road,
              city,
              published
            }
          };
        }
      );
    }

    function createPulsingAccidentMarker(
      mapInstance
    ) {
      const size = 128;

      return {
        width: size,
        height: size,
        data: new Uint8Array(
          size * size * 4
        ),

        onAdd() {
          const canvas =
            document.createElement("canvas");

          canvas.width = size;
          canvas.height = size;

          this.context = canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );
        },

        render() {
          const context = this.context;

          const animationProgress =
            (performance.now() % 1200) / 1200;

          context.clearRect(
            0,
            0,
            size,
            size
          );

          context.beginPath();

          context.arc(
            size / 2,
            size / 2,
            (size / 2) *
              (0.30 + 0.20 * animationProgress),
            0,
            Math.PI * 2
          );

          context.fillStyle =
            `rgba(255,80,80,` +
            `${0.55 - 0.4 * animationProgress})`;

          context.fill();

          context.beginPath();

          context.arc(
            size / 2,
            size / 2,
            size * 0.09,
            0,
            Math.PI * 2
          );

          context.fillStyle = "#ff0000";
          context.strokeStyle = "#ffffff";
          context.lineWidth = 3;

          context.fill();
          context.stroke();

          this.data.set(
            context.getImageData(
              0,
              0,
              size,
              size
            ).data
          );

          mapInstance.triggerRepaint();

          return true;
        }
      };
    }

    function formatFeedUpdatedTime(updatedAt) {
      if (!updatedAt) {
        return "";
      }

      const date = new Date(updatedAt);

      if (
        Number.isNaN(date.getTime())
      ) {
        return "";
      }

      return date.toLocaleTimeString(
        "en-GB",
        {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }
      );
    }

    function setFeedStatus(
      state,
      message
    ) {
      const chip = document.getElementById(
        "feedStatusChip"
      );

      const text = document.getElementById(
        "feedStatusText"
      );

      if (chip) {
        chip.dataset.state = state;
      }

      if (text) {
        text.textContent = message;
      }
    }

    function updateAccidentSource(features) {
      const source = map.getSource(
        ACCIDENT_SOURCE_ID
      );

      if (!source) {
        return;
      }

      source.setData({
        type: "FeatureCollection",
        features
      });
    }

    async function runAccidentFeedCycle() {
      if (fetchController) {
        fetchController.abort();
      }

      fetchController =
        new AbortController();

      setFeedStatus(
        "loading",
        "Updating accident feed..."
      );

      try {
        const feed =
          await fetchAccidentFeed(
            fetchController.signal
          );

        const accidentPoints =
          incidentsToAccidentPoints(feed);

        const accidentFeatures =
          clusterAccidents(accidentPoints);

        updateAccidentSource(
          accidentFeatures
        );

        const feedUpdatedTime =
          formatFeedUpdatedTime(
            feed.updatedAt
          );

        const incidentCount =
          accidentPoints.length;

        const incidentWord =
          incidentCount === 1
            ? "accident"
            : "accidents";

        const timeText =
          feedUpdatedTime
            ? ` • Feed ${feedUpdatedTime}`
            : "";

        setFeedStatus(
          "ok",
          `${incidentCount} ${incidentWord}${timeText}`
        );
      } catch (error) {
        if (error.name !== "AbortError") {
          console.error(
            "Accident feed fetch failed:",
            error
          );

          setFeedStatus(
            "error",
            "Accident feed unavailable"
          );
        }
      } finally {
        clearTimeout(refreshTimer);

        if (!document.hidden) {
          refreshTimer = setTimeout(
            runAccidentFeedCycle,
            REFRESH_MS
          );
        }
      }
    }

    function syncAttributionIntoChip() {
      const chip = document.getElementById(
        "attribChip"
      );

      const attribution =
        document.querySelector(
          ".maplibregl-ctrl-attrib"
        );

      if (
        chip &&
        attribution
      ) {
        chip.innerHTML =
          attribution.innerHTML;
      }
    }

    map.on("load", () => {
      map.fitBounds(
        GM_BOUNDS,
        {
          padding: 4,
          duration: 0
        }
      );

      if (!map.hasImage("pulsing-red")) {
        map.addImage(
          "pulsing-red",
          createPulsingAccidentMarker(map),
          {
            pixelRatio: 2
          }
        );
      }

      map.addSource(
        ACCIDENT_SOURCE_ID,
        {
          type: "geojson",
          data: EMPTY_FEATURE_COLLECTION
        }
      );

      map.addLayer({
        id: "accidents-one",
        type: "circle",
        source: ACCIDENT_SOURCE_ID,

        filter: [
          "==",
          ["get", "effectiveConfidence"],
          1
        ],

        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            8,
            3,
            12,
            4,
            16,
            5.5
          ],

          "circle-color": "#ffe04a",
          "circle-stroke-color": "#fff1a6",
          "circle-stroke-width": 1
        }
      });

      map.addLayer({
        id: "accidents-two",
        type: "circle",
        source: ACCIDENT_SOURCE_ID,

        filter: [
          "==",
          ["get", "effectiveConfidence"],
          2
        ],

        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            8,
            4.4,
            12,
            6,
            16,
            7.4
          ],

          "circle-color": "#ffe04a",
          "circle-stroke-color": "#fff1a6",
          "circle-stroke-width": 1.2
        }
      });

      map.addLayer({
        id: "accidents-three",
        type: "circle",
        source: ACCIDENT_SOURCE_ID,

        filter: [
          "==",
          ["get", "effectiveConfidence"],
          3
        ],

        paint: {
          "circle-radius": [
            "interpolate",
            ["linear"],
            ["zoom"],
            8,
            6.2,
            12,
            8.2,
            16,
            10.2
          ],

          "circle-color": "#ff0000",
          "circle-stroke-color": "#ffd0d0",
          "circle-stroke-width": 1.6
        }
      });

      map.addLayer({
        id: "accidents-high",
        type: "symbol",
        source: ACCIDENT_SOURCE_ID,

        filter: [
          ">=",
          ["get", "effectiveConfidence"],
          HIGH_CONF_MIN
        ],

        layout: {
          "icon-image": "pulsing-red",

          "icon-size": [
            "interpolate",
            ["linear"],
            ["zoom"],
            8,
            0.8,
            12,
            1.36,
            16,
            2.1
          ],

          "icon-allow-overlap": true,
          "icon-ignore-placement": true
        }
      });

      syncAttributionIntoChip();

      const attribution =
        document.querySelector(
          ".maplibregl-ctrl-attrib"
        );

      if (attribution) {
        attributionObserver =
          new MutationObserver(
            syncAttributionIntoChip
          );

        attributionObserver.observe(
          attribution,
          {
            childList: true,
            subtree: true,
            characterData: true
          }
        );
      }

      void runAccidentFeedCycle();
    });

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          clearTimeout(refreshTimer);

          if (fetchController) {
            fetchController.abort();
          }

          return;
        }

        map.resize();
        syncAttributionIntoChip();

        if (map.isStyleLoaded()) {
          void runAccidentFeedCycle();
        }
      }
    );

    window.addEventListener(
      "resize",
      () => {
        map.resize();
      }
    );

    window.addEventListener(
      "beforeunload",
      () => {
        clearTimeout(refreshTimer);

        if (fetchController) {
          fetchController.abort();
        }

        if (attributionObserver) {
          attributionObserver.disconnect();
        }
      }
    );
  </script>
</body>
</html>
