<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LST — Control Centre Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --text:#f2f2f2;
      --muted:#c9cacc;

      --liveGreen:#42BE4B;
      --errorRed:#EA5540;
      --accent:#FFE04A;

      --line: rgba(255,255,255,0.10);

      --shadow: 0 10px 28px rgba(0,0,0,.55);
      --radius: 14px;

      --mapH: 70vh;
      --trayH: 30vh;

      --glass: rgba(10,10,10,0.62);
      --glassBorder: rgba(255,255,255,0.14);

      --highConfMin: 4;
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Buttons */
    .toolbar-btn,
    .hide-btn{
      appearance: none;
      background: rgba(255,255,255,0.05);
      color: #e7e7ea;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 5px 10px;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: .45px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .05s ease;
      user-select: none;
      white-space: nowrap;
    }
    .toolbar-btn:hover,
    .hide-btn:hover{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,224,74,0.7);
      color: #fff;
      box-shadow: 0 0 12px rgba(255,224,74,0.16);
    }
    .toolbar-btn:active,
    .hide-btn:active{ transform: translateY(1px); }

    .status-pill{
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 1000;
      background: var(--liveGreen);
      color:#000;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.10), 0 6px 18px rgba(0,0,0,0.35);
      white-space: nowrap;
      transition: background .2s ease, color .2s ease;
    }
    .status-error{ background: var(--errorRed); color:#fff; }

    #beeLogo{
      width: 40px;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      user-select: none;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{ animation: wibble 650ms ease-out; }

    .connected-count{
      font-weight: 1000;
      font-size: 14px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      color: rgba(255,255,255,0.92);
    }

    /* App layout */
    .app{
      height: 100dvh;
      display: grid;
      grid-template-rows: var(--mapH) var(--trayH);
      overflow: hidden;
    }

    /* Map area */
    .map-area{
      position: relative;
      overflow: hidden;
    }
    #map{
      width: 100%;
      height: 100%;
      background: #000;
      transform: translateZ(0);
    }

    /* Leaflet sizing */
    .leaflet-container{ font-size: 14px; }
    .leaflet-control-attribution,
    .leaflet-control-scale,
    .leaflet-control{ font-size: 12px !important; }

    /* Darker Leaflet buttons */
    .leaflet-bar a{
      background: rgba(10,10,10,0.78) !important;
      color: rgba(255,255,255,0.92) !important;
      border-bottom: 1px solid rgba(255,255,255,0.14) !important;
    }
    .leaflet-bar a:hover{ background: rgba(255,255,255,0.12) !important; }

    /* Floating top bar */
    .topbar{
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 900;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--glassBorder);
      box-shadow: var(--shadow);
      backdrop-filter: blur(7px);
    }
    .topbar-left{
      display: flex;
      gap: 10px;
      align-items: flex-start;
      min-width: 0;
    }
    .topbar-right{
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    /* Search + health sliver */
    .place-search-wrap{
      flex: 1;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    .place-search{ position: relative; }
    #gmSearch{
      width: 100%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight: 900;
      font-size: 15px;
      padding: 12px 40px 12px 12px;
      border-radius: 14px;
      outline:none;
      box-sizing:border-box;
    }
    #gmSearch:focus{
      border-color: rgba(255,224,74,0.75);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 0 2px rgba(255,224,74,0.12);
    }
    .health-sliver{
      height: 3px;
      width: 100%;
      border-radius: 0 0 10px 10px;
      background: linear-gradient(90deg,#42BE4B,#ffe04a,#ff4d4f);
      opacity: 0.95;
    }

    /* Search spinner */
    .search-spinner{
      position:absolute;
      right:12px;
      top:50%;
      width:18px;
      height:18px;
      margin-top:-9px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.25);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      display:none;
      pointer-events:none;
    }
    .search-spinner.active{ display:block; }
    @keyframes spin{ to{ transform: rotate(360deg);} }

    /* Suggestions */
    .suggestions{
      position:absolute;
      top: calc(100% + 6px);
      left:0; right:0;
      z-index:9999;
      display:none;
      background: rgba(10,10,10,0.98);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:12px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.55);
      overflow:hidden;
    }
    .suggestions.open{ display:block; }
    .suggest-list{
      margin:0;
      padding:6px;
      list-style:none;
      max-height: min(34vh, 360px);
      overflow:auto;
    }
    .suggest-item{
      padding:10px;
      border-radius:10px;
      cursor:pointer;
      border:1px solid transparent;
      color: rgba(255,255,255,0.92);
      font-weight:900;
      line-height:1.2;
    }
    .suggest-item small{
      display:block;
      margin-top:4px;
      font-weight:800;
      color: rgba(255,255,255,0.70);
    }
    .suggest-item:hover{
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,224,74,0.45);
    }
    .suggest-item.active{
      background: rgba(255,224,74,0.18);
      border-color: rgba(255,224,74,0.75);
    }

    /* Styled pin */
    .lst-pin{
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,224,74,0.22);
      border: 3px solid #FFE04A;
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.55),
        0 0 14px rgba(255,224,74,0.20);
    }

    /* Tool popup */
    dialog.tool-dialog{
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 16px;
      padding: 14px;
      background: rgba(10,10,10,0.92);
      color: #fff;
      box-shadow: 0 18px 60px rgba(0,0,0,0.65);
      width: min(520px, 92vw);
    }
    dialog.tool-dialog::backdrop{ background: rgba(0,0,0,0.55); }

    .tool-dialog__head{
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .tool-dialog__title{
      font-weight: 1000;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .tool-dialog__meta{
      margin: 10px 0 12px;
      color: rgba(255,255,255,0.78);
      font-weight: 800;
    }
    .tool-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tool-grid button{
      appearance:none;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight:1000;
      font-size: 13px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor:pointer;
      min-height:40px;
    }
    .tool-grid button:hover{
      border-color: rgba(255,224,74,0.75);
      background: rgba(255,255,255,0.12);
    }

    /* Scrollbars overall */
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.35) transparent; }
    ::-webkit-scrollbar{ width:8px; height:8px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, rgba(255,224,74,0.55), rgba(255,255,255,0.35));
      border-radius: 999px;
      border:2px solid transparent;
      background-clip: padding-box;
    }

    /* =======================================================
       LIVE ALERTS (Refactor) — dense queue + details panel
       ======================================================= */
    .alerts{
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,224,74,0.06), rgba(0,0,0,0.45));
      height: var(--trayH);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .alerts-head{
      display:grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .alerts-title .kicker{
      font-weight: 1000;
      letter-spacing: .6px;
      text-transform: uppercase;
      font-size: 11px;
      color: rgba(255,255,255,0.85);
    }
    .alerts-title .subkicker{
      margin-top: 2px;
      font-weight: 800;
      font-size: 12px;
      color: rgba(255,255,255,0.70);
    }

    .alerts-kpis{
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }
    .kpi{
      display:flex;
      align-items: baseline;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      font-weight: 1000;
    }
    .kpi b{ font-size: 14px; }
    .kpi small{ font-size: 10px; opacity: .8; text-transform: uppercase; letter-spacing: .35px; }
    .kpi span{ font-size: 14px; }
    .kpi-muted{ opacity: .8; }

    .alerts-controls{
      grid-column: 1 / -1;
      display:flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tray-controls{
      display:flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tray-controls button{
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 1000;
      padding: 4px 8px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: .35px;
    }
    .tray-controls button.active{
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .alerts-filterbar{
      display:flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    #queueSearch{
      width: min(380px, 48vw);
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight: 900;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 12px;
      outline:none;
    }
    #queueSearch:focus{
      border-color: rgba(255,224,74,0.75);
      box-shadow: 0 0 0 2px rgba(255,224,74,0.12);
    }
    #sortMode{
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(10,10,10,0.65);
      color:#fff;
      font-weight: 900;
      padding: 7px 8px;
    }

    .alerts-body{
      min-height: 0;
      display:grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 10px;
      padding: 10px 12px 12px;
      overflow: hidden;
    }

    .queue{
      min-height:0;
      display:grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      overflow:hidden;
    }
    .queue-head{
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .queue-hint{
      font-weight: 800;
      font-size: 11px;
      color: rgba(255,255,255,0.65);
    }
    .queue-list{
      min-height:0;
      overflow:auto;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      background: rgba(0,0,0,0.25);
    }

    .qrow{
      display:grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor:pointer;
      position:relative;
    }
    .qrow:last-child{ border-bottom:none; }
    .qrow::before{
      content:'';
      position:absolute;
      left:0; top:0; bottom:0;
      width: 5px;
      background: var(--qcol, rgba(255,255,255,0.25));
    }
    .qrow:hover{ background: rgba(255,255,255,0.06); }
    .qrow[aria-selected="true"]{
      background: rgba(255,224,74,0.12);
      outline: 1px solid rgba(255,224,74,0.55);
    }

    .qicon{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 18px;
    }
    .qmain{ min-width:0; }
    .qtitle{
      font-weight: 1000;
      font-size: 16px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .qsub{
      margin-top: 2px;
      font-weight: 800;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .qmeta{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap: 6px;
    }
    .qpill{
      font-weight: 1000;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      white-space: nowrap;
    }
    .qage{
      font-weight: 900;
      font-size: 11px;
      color: rgba(255,255,255,0.70);
    }

    .details-card{
      height:100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.22);
      overflow:auto;
      padding: 12px;
    }
    .details-empty{
      height:100%;
      display:grid;
      place-items:center;
      text-align:center;
      color: rgba(255,255,255,0.72);
    }
    .details-empty__title{
      font-weight: 1000;
      font-size: 16px;
    }
    .details-empty__sub{
      margin-top: 6px;
      font-weight: 800;
      font-size: 12px;
      opacity:.85;
    }

    .dh{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .dh h3{
      margin:0;
      font-size: 16px;
      font-weight: 1000;
    }
    .dtags{
      display:flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }
    .dtag{
      font-weight: 1000;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
    }
    .dgrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .ditem{
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
    }
    .ditem b{ display:block; font-size: 11px; opacity:.75; text-transform: uppercase; letter-spacing:.35px; }
    .ditem span{ display:block; margin-top: 4px; font-weight: 1000; }

    .dactions{
      margin-top: 10px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .dactions button{
      appearance:none;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight:1000;
      font-size: 13px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor:pointer;
      min-height:40px;
    }
    .dactions button:hover{
      border-color: rgba(255,224,74,0.75);
      background: rgba(255,255,255,0.12);
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- MAP -->
    <section class="map-area" aria-label="Map area">
      <div id="map" aria-label="Map"></div>

      <header class="topbar" aria-label="Search and status">
        <div class="topbar-left">
          <div class="place-search-wrap">
            <div class="place-search" id="placeSearch" aria-label="Place search">
              <input id="gmSearch" type="text" inputmode="search" autocomplete="off"
                     placeholder="Search (bus stops 🚏, pubs 🍺, streets 🛣️)… or Oxford/Whitworth"
                     aria-label="Search places in Greater Manchester"
                     aria-autocomplete="list"
                     aria-expanded="false"
                     aria-controls="gmSuggest" />
              <div class="search-spinner" id="searchSpinner" aria-hidden="true"></div>
              <div id="gmSuggest" class="suggestions" role="listbox" aria-label="Search suggestions"></div>
            </div>
            <div class="health-sliver" id="networkBar" aria-hidden="true"></div>
          </div>
        </div>

        <div class="topbar-right">
          <div id="connectedCitizens" class="connected-count">— Connected Citizens</div>
          <button id="unhideAllBtn" class="toolbar-btn" type="button">Unhide all</button>
          <div id="statusPill" class="status-pill">Initialising…</div>
          <img id="beeLogo" src="https://tfgm.com/static/android-chrome-192x192.png"
               alt="Bee Network logo" width="40" height="40" decoding="async" />
        </div>
      </header>
    </section>

    <!-- LIVE ALERTS (Refactor) -->
    <section class="alerts" aria-label="Live alerts">
      <header class="alerts-head">
        <div class="alerts-title">
          <div class="kicker">Live alerts</div>
          <div class="subkicker" id="alertsMeta">Initialising…</div>
        </div>

        <div class="alerts-kpis" aria-label="Alert counts">
          <div class="kpi"><span>⏱️</span><b id="kpiTvt">0</b><small>Traffic</small></div>
          <div class="kpi"><span>💥</span><b id="kpiAcc">0</b><small>Accidents</small></div>
          <div class="kpi"><span>🚦</span><b id="kpiSig">0</b><small>Signals</small></div>
          <div class="kpi"><span>❄️</span><b id="kpiIce">0</b><small>Ice</small></div>
          <div class="kpi kpi-muted"><span>🫥</span><b id="kpiSnoozed">0</b><small>Snoozed</small></div>
        </div>

        <div class="alerts-controls">
          <div class="tray-controls" id="tvt-filters" aria-label="Abnormal traffic filters">
            <button type="button" data-min="1">+1m</button>
            <button type="button" data-min="5">+5m</button>
            <button type="button" data-min="10">+10m</button>
            <button type="button" data-min="15" class="active">+15m</button>
          </div>

          <div class="alerts-filterbar" aria-label="Queue controls">
            <button class="toolbar-btn" type="button" data-filter="all" id="filterAll">All</button>
            <button class="toolbar-btn" type="button" data-filter="priority" id="filterPriority">Priority</button>
            <button class="toolbar-btn" type="button" data-filter="tvt" id="filterTraffic">Traffic</button>
            <button class="toolbar-btn" type="button" data-filter="waze" id="filterWaze">Waze</button>

            <select id="sortMode" aria-label="Sort mode">
              <option value="priority">Sort: Priority</option>
              <option value="age">Sort: Newest</option>
              <option value="severity">Sort: Severity</option>
            </select>

            <input id="queueSearch" type="search" placeholder="Filter by road / corridor / area…" aria-label="Filter alerts" />
          </div>
        </div>
      </header>

      <div class="alerts-body">
        <div class="queue" aria-label="Alert queue">
          <div class="queue-head">
            <span class="queue-hint">↑↓ select • Enter pan • Space tools • A acknowledge • H hide 60m</span>
            <button class="toolbar-btn" type="button" id="unhideAllBtn2">Unhide all</button>
          </div>
          <div class="queue-list" id="alertQueue" role="listbox" aria-label="Alerts list"></div>
        </div>

        <aside class="details" aria-label="Alert details">
          <div class="details-card" id="detailsCard">
            <div class="details-empty">
              <div>
                <div class="details-empty__title">Select an alert</div>
                <div class="details-empty__sub">Details and quick actions appear here.</div>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </section>

  </div>

  <!-- Marker-click popup -->
  <dialog id="toolDialog" class="tool-dialog" aria-label="Open in other tools">
    <div class="tool-dialog__head">
      <div class="tool-dialog__title">Open in other tools</div>
      <button class="toolbar-btn" id="toolDialogClose" type="button">Close</button>
    </div>
    <div class="tool-dialog__meta" id="toolDialogMeta">—</div>

    <div class="tool-grid" id="toolGrid" aria-label="Tool links">
      <button type="button" data-tool="google">Google Maps</button>
      <button type="button" data-tool="bustimes">Bus Times</button>
      <button type="button" data-tool="waze_alerts">Waze Alerts</button>
      <button type="button" data-tool="waze_closures">Waze Closures</button>
      <button type="button" data-tool="tomtom">TomTom</button>
      <button type="button" data-tool="vms">VMS</button>
      <button type="button" data-tool="utc">UTC Sites</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* =======================================================
       Utilities & helpers
       ======================================================= */
    const API_BASE = "https://renderexpress-ebb0.onrender.com";

    function withCacheBust(url){
      const sep = url.includes('?') ? '&' : '?';
      return url + sep + 'ts=' + Date.now();
    }
    async function fetchJsonFromAPI(pathOrUrl, signal){
      const url = pathOrUrl.startsWith("http") ? pathOrUrl : (API_BASE + pathOrUrl);
      const res = await fetch(withCacheBust(url), { cache: 'no-store', signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    }

    function sumWazers(usersOnJams){
      try {
        const total = (Array.isArray(usersOnJams) ? usersOnJams : [])
          .reduce((acc,u) => acc + (Number(u.wazersCount)||0), 0);
        return Math.ceil(total);
      } catch { return 0; }
    }
    function updateConnectedCitizensDisplay(total){
      const el = document.getElementById('connectedCitizens');
      if (!el) return;
      const label = Number.isFinite(total) && total > 0 ? total.toLocaleString('en-GB') : '—';
      el.textContent = label + ' Connected Citizens';
    }

    function fmtHHMMSS(){
      try{
        return new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
          .format(new Date());
      }catch(e){
        const d = new Date();
        const pad = n => String(n).padStart(2,'0');
        return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }
    }

    function setStatusPill(ok, opts){
      opts = opts || {};
      const animate = !!opts.animate;

      const pill = document.getElementById('statusPill');
      const bee  = document.getElementById('beeLogo');
      const t = fmtHHMMSS();

      if (ok){
        pill.classList.remove('status-error');
        pill.textContent = 'LIVE • ' + t;
        if (animate && bee){
          bee.classList.remove('bee-wibble');
          void bee.offsetWidth;
          bee.classList.add('bee-wibble');
        }
      } else {
        pill.classList.add('status-error');
        pill.textContent = 'Stand By • ' + t;
      }
    }

    function escapeHTML(str){
      return String(str).replace(/[&<>"']/g, function(ch){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
      });
    }

    /* Spinner helpers */
    function spinnerOn(){ document.getElementById('searchSpinner')?.classList.add('active'); }
    function spinnerOff(){ document.getElementById('searchSpinner')?.classList.remove('active'); }

    /* ========= HIDE / SUPPRESSION (60 minutes) ========= */
    const HIDE_MS = 60 * 60 * 1000;

    function hideStorageKey(prefix, id){ return 'hide_' + prefix + '_' + id; }
    function getHideEntry(prefix, id){
      const raw = localStorage.getItem(hideStorageKey(prefix, id));
      if (!raw) return null;
      if (/^\d+$/.test(raw)) return { until: Number(raw) };
      try{
        const obj = JSON.parse(raw);
        if (obj && typeof obj.until === 'number') return obj;
      }catch(e){}
      const n = Number(raw);
      return Number.isFinite(n) ? { until:n } : null;
    }
    function setHideEntry(prefix, id, entry){
      localStorage.setItem(hideStorageKey(prefix, id), JSON.stringify(entry));
    }
    function clearHide(prefix, id){
      localStorage.removeItem(hideStorageKey(prefix, id));
    }
    function hideForHour(prefix, id, baseline){
      baseline = baseline || {};
      setHideEntry(prefix, id, { until: Date.now() + HIDE_MS, baseline: baseline, createdAt: Date.now() });
    }

    // Auto-unhide rules (kept from your original)
    function isHiddenWithAutoCheck(prefix, id, currentMetrics){
      currentMetrics = currentMetrics || {};
      const entry = getHideEntry(prefix, id);
      if (!entry) return false;

      if (Date.now() > (Number(entry.until)||0)){
        clearHide(prefix, id);
        return false;
      }

      const base = entry.baseline || {};
      let autoUnhide = false;

      if (prefix === 'corr'){
        const curr = Number(currentMetrics.delayMin);
        const b = Number(base.delayMin);
        if (Number.isFinite(curr) && Number.isFinite(b)){
          const threshold = b > 0 ? Math.max(b + 5, Math.round(b * 1.5)) : 10;
          if (curr >= threshold) autoUnhide = true;
        }
      } else if (prefix === 'acc'){
        const curr = Number(currentMetrics.conf);
        const b = Number(base.conf);
        if (Number.isFinite(curr) && Number.isFinite(b) && curr >= b + 2){
          autoUnhide = true;
        }
      } else if (prefix === 'sig'){
        const curr = Number(currentMetrics.conf);
        const b = Number(base.conf);
        if (Number.isFinite(curr) && Number.isFinite(b) && curr >= b + 2){
          autoUnhide = true;
        }
      }

      if (autoUnhide){
        clearHide(prefix, id);
        return false;
      }
      return true;
    }

    /* Timers */
    let tvtTimer = null;
    let wazeTimer = null;

    function unhideAll(){
      const keys = [];
      for (let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith('hide_')) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));

      // No need to clear ACK; unhide just unsuppresses.
      try{ clearTimeout(tvtTimer); }catch(e){}
      try{ clearTimeout(wazeTimer); }catch(e){}
      tvtTimer = null; wazeTimer = null;

      tvtCycle(); wazeCycle();
      renderQueue();
    }

    /* =======================================================
       MAP — Leaflet tiles (fixed crispness)
       ======================================================= */
    const MAP_STATE = { map: null, marker: null, last: null };

    // Thunderforest Transport (standard tiles are 256px) — avoid 512+zoomOffset blur
    const TILE_URL =
      "https://api.thunderforest.com/transport/{z}/{x}/{y}.png?apikey=ec4c98ec4e394899a63ccecdf9712e54";

    function initMap(){
      const el = document.getElementById('map');
      if (!el || !window.L) return;

      const m = L.map(el, {
        zoomControl: false,
        attributionControl: true
      }).setView([53.4808, -2.2426], 12);

      L.tileLayer(TILE_URL, {
        maxZoom: 19,
        tileSize: 256,
        zoomOffset: 0,
        detectRetina: true,
        crossOrigin: true,
        attribution: '© Thunderforest © OpenStreetMap contributors • © Ordnance Survey OpenData'
      }).addTo(m);

      L.control.zoom({ position: 'bottomright' }).addTo(m);

      const pinIcon = L.divIcon({
        className: '',
        html: '<div class="lst-pin"></div>',
        iconSize: [22,22],
        iconAnchor: [11,11]
      });

      const mk = L.marker([53.4808, -2.2426], { icon: pinIcon, draggable: true }).addTo(m);
      mk.setOpacity(0);

      mk.on('dragend', function(){
        const ll = mk.getLatLng();
        MAP_STATE.last = { lat: ll.lat, lon: ll.lng };
        m.panTo(ll);
      });

      mk.on('click', function(){
        const ll = mk.getLatLng();
        MAP_STATE.last = { lat: ll.lat, lon: ll.lng };
        openToolDialog();
      });

      MAP_STATE.map = m;
      MAP_STATE.marker = mk;

      setTimeout(function(){ m.invalidateSize(true); }, 300);
      window.addEventListener('resize', function(){
        setTimeout(function(){ m.invalidateSize(true); }, 150);
      });
    }

    function setMapTarget(lat, lon, zoom){
      const m = MAP_STATE.map;
      const mk = MAP_STATE.marker;
      if (!m || !mk) return;

      const la = Number(lat), lo = Number(lon);
      if (!Number.isFinite(la) || !Number.isFinite(lo)) return;

      MAP_STATE.last = { lat: la, lon: lo };

      mk.setLatLng([la, lo]);
      mk.setOpacity(1);

      const z = Number.isFinite(Number(zoom)) ? Number(zoom) : 12;
      m.setView([la, lo], z, { animate: true });
    }

    /* =======================================================
       Tool popup (marker click)
       ======================================================= */
    function buildToolUrls(lat, lon){
      return {
        google:        'https://www.google.com/maps/@' + lat + ',' + lon + ',696m',
        bustimes:      'https://bustimes.org/map#16.53/' + lat + '/' + lon,
        waze_alerts:   'https://www.waze.com/partnerhub/map-tool?lon=' + lon + '&lat=' + lat + '&initialZoom=20',
        waze_closures: 'https://www.waze.com/en-GB/editor/?env=row&lat=' + lat + '&lon=' + lon + '&zoomLevel=17',
        tomtom:        'https://plan.tomtom.com/en/?p=' + lat + ',' + lon + ',14.48z',
        vms:           'https://www.stratostraffic.com/Modules/DriverInformationUi/informationSigns?lat=' + lat + '&lng=' + lon + '&zoom=14',
        utc:           'https://www.stratostraffic.com/Modules/TrafficSignalsUi/information?lat=' + lat + '&lng=' + lon + '&zoom=11'
      };
    }

    function openToolByName(tool){
      const last = MAP_STATE.last;
      if (!last) return;
      const urls = buildToolUrls(last.lat, last.lon);
      const u = urls[String(tool)];
      if (u) window.open(u, '_blank', 'noopener');
    }

    function openToolDialog(){
      const last = MAP_STATE.last;
      if (!last) return;

      const meta = document.getElementById('toolDialogMeta');
      if (meta){
        meta.textContent = `Lat ${last.lat.toFixed(5)} • Lon ${last.lon.toFixed(5)}`;
      }

      const dlg = document.getElementById('toolDialog');
      if (!dlg) return;

      if (typeof dlg.showModal === 'function') dlg.showModal();
      else dlg.setAttribute('open','');
    }

    function closeToolDialog(){
      const dlg = document.getElementById('toolDialog');
      if (!dlg) return;
      if (typeof dlg.close === 'function') dlg.close();
      else dlg.removeAttribute('open');
    }

    function bindToolDialog(){
      document.getElementById('toolDialogClose')?.addEventListener('click', closeToolDialog, { passive:true });

      const dlg = document.getElementById('toolDialog');
      if (dlg){
        dlg.addEventListener('click', function(e){
          const r = dlg.getBoundingClientRect();
          const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
          if (!inside) closeToolDialog();
        });
      }

      const host = document.getElementById('toolGrid');
      if (host){
        host.addEventListener('click', function(e){
          const btn = e.target.closest('button[data-tool]');
          if (!btn) return;
          openToolByName(btn.dataset.tool);
        }, { passive:true });
      }
    }

    /* =======================================================
       SEARCH — Photon (single call)
       ======================================================= */
    const GM_CENTER = { lat: 53.4808, lon: -2.2426 };
    const GM_BBOX = [-2.75, 53.30, -1.95, 53.72];

    const SEARCH_DEBOUNCE_MS = 260;
    const SEARCH_MIN_CHARS   = 2;
    const MAX_SUGGESTIONS    = 10;

    const PHOTON_ZOOM = 15;
    const PHOTON_BIAS_SCALE = 0.12;

    let gmAbort = null;
    let searchSeq = 0;

    function debounce(fn, ms){
      ms = ms || 250;
      let t = null;
      return function(){
        const args = arguments;
        clearTimeout(t);
        t = setTimeout(function(){ fn.apply(null, args); }, ms);
      };
    }

    function inGmBbox(lon, lat){
      return lon >= GM_BBOX[0] && lon <= GM_BBOX[2] && lat >= GM_BBOX[1] && lat <= GM_BBOX[3];
    }

    function getLonLatFromFeature(f){
      const c = f && f.geometry && f.geometry.coordinates;
      if (!Array.isArray(c) || c.length < 2) return null;
      const lon = Number(c[0]), lat = Number(c[1]);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) return null;
      if (!inGmBbox(lon, lat)) return null;
      return { lon: lon, lat: lat };
    }

    function stripPostcode(s){
      return String(s||'')
        .replace(/\b([A-Z]{1,2}\d[A-Z\d]?)\s?(\d[A-Z]{2})\b/ig,'')
        .replace(/\s+/g,' ')
        .trim();
    }

    function normalizeText(s){
      return String(s||'')
        .toLowerCase()
        .replace(/\s+/g,' ')
        .replace(/[^\w\s\-\(\)\/&]/g,'')
        .trim();
    }

    function featureLabel(f){
      const p = (f && f.properties) ? f.properties : {};
      const name = p.name || p.street || 'Unknown';
      const locality = [p.city, p.county, p.state].filter(Boolean).join(', ');
      const main = (name + (p.postcode ? (' ' + p.postcode) : '')).trim();
      const sub  = locality || p.country || '';
      return { main: main, sub: sub, p: p };
    }

    function getFeatureCategoryAndEmoji(f){
      const p = (f && f.properties) ? f.properties : {};
      const osmKey = String(p.osm_key || '').toLowerCase();
      const osmVal = String(p.osm_value || '').toLowerCase();
      const type   = String(p.type || '').toLowerCase();

      if (type === 'street') return { cat:'street', emoji:'🛣️' };
      if (type === 'house')  return { cat:'address', emoji:'🏠' };

      if (osmKey === 'highway' && osmVal === 'bus_stop') return { cat:'bus_stop', emoji:'🚏' };
      if (osmKey === 'public_transport' && (osmVal === 'platform' || osmVal === 'stop_position' || osmVal === 'stop_area')) return { cat:'bus_stop', emoji:'🚏' };

      if (osmKey === 'amenity'){
        if (osmVal === 'pub' || osmVal === 'bar') return { cat:'pub', emoji:'🍺' };
        if (osmVal === 'cafe') return { cat:'cafe', emoji:'☕' };
        if (osmVal === 'restaurant' || osmVal === 'fast_food') return { cat:'food', emoji:'🍽️' };
        if (osmVal === 'fuel') return { cat:'fuel', emoji:'⛽' };
        if (osmVal === 'parking') return { cat:'parking', emoji:'🅿️' };
      }

      return { cat:'other', emoji:'📍' };
    }

    function canonicalKey(item){
      const p = (item.raw && item.raw.properties) ? item.raw.properties : {};
      const type = String(p.type||'').toLowerCase();
      const osmKey = String(p.osm_key||'').toLowerCase();
      const osmVal = String(p.osm_value||'').toLowerCase();

      if ((osmKey==='highway' && osmVal==='bus_stop') || (osmKey==='public_transport' && osmVal==='platform')){
        const nm = normalizeText(stripPostcode(p.name || item.main || ''));
        const city = normalizeText(p.city || p.county || '');
        return 'busstop:' + nm + '|' + city;
      }

      if (type==='street' || type==='house' || p.street){
        const streetName = stripPostcode(p.street || p.name || item.main || '');
        const nm = normalizeText(streetName);
        const city = normalizeText(p.city || p.county || '');
        return 'street:' + nm + '|' + city;
      }

      const nm = normalizeText(stripPostcode(p.name || item.main || ''));
      const city = normalizeText(p.city || p.county || '');
      return 'poi:' + nm + '|' + city;
    }

    function dedupKeepFirst(items){
      const seen = new Set();
      const out = [];
      for (const it of items){
        const key = canonicalKey(it);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(it);
      }
      return out;
    }

    function buildPhotonUrl(query, opts){
      opts = opts || {};
      const limit = opts.limit || 10;
      const layer = opts.layer || null;
      const addGmSuffix = (opts.addGmSuffix !== false);
      const zoom = opts.zoom || PHOTON_ZOOM;
      const location_bias_scale = opts.location_bias_scale || PHOTON_BIAS_SCALE;

      const u = new URL('https://photon.komoot.io/api');
      const q = addGmSuffix ? (query + ' Greater Manchester') : query;

      u.searchParams.set('q', q);
      u.searchParams.set('lang', 'en');
      u.searchParams.set('limit', String(limit));

      u.searchParams.set('lat', String(GM_CENTER.lat));
      u.searchParams.set('lon', String(GM_CENTER.lon));
      u.searchParams.set('zoom', String(zoom));
      u.searchParams.set('location_bias_scale', String(location_bias_scale));

      u.searchParams.set('bbox', GM_BBOX.join(','));
      if (layer) u.searchParams.set('layer', layer);

      return u.toString();
    }

    function looksLikeStreetQuery(q){
      const s = String(q||'').trim();
      if (!s) return false;
      return (
        /\b(rd|road|st|street|ave|avenue|dr|drive|ln|lane|cl|close|ct|court|crescent|way|boulevard|blvd|place|pl|terrace|ter)\b/i.test(s) ||
        /\b(m|a|b)\d{1,4}\b/i.test(s)
      );
    }

    async function photonSearchOnce(qRaw, signal){
      const q = qRaw.trim();
      const wantsBusStuff = /\bbus\b|\bstop\b|🚏/i.test(q);
      const layer = (looksLikeStreetQuery(q) && !wantsBusStuff) ? 'street' : null;

      const url = buildPhotonUrl(q, { limit: 12, layer: layer });

      const res = await fetch(url, { cache:'no-store', signal: signal });
      if (!res.ok) throw new Error('Photon HTTP ' + res.status);
      const data = await res.json();
      return Array.isArray(data && data.features) ? data.features : [];
    }

    function featuresToItems(features){
      return (features||[]).map(function(f){
        const ll = getLonLatFromFeature(f);
        if (!ll) return null;
        const lab = featureLabel(f);
        const tag = getFeatureCategoryAndEmoji(f);
        return {
          kind:'feature',
          lat: ll.lat,
          lon: ll.lon,
          main: lab.main,
          sub: lab.sub,
          raw: f,
          cat: tag.cat,
          emoji: tag.emoji
        };
      }).filter(Boolean);
    }

    function openSuggestions(open){
      const box = document.getElementById('gmSuggest');
      if (!box) return;
      box.classList.toggle('open', !!open);
    }

    function renderSuggestions(items){
      const box = document.getElementById('gmSuggest');
      const input = document.getElementById('gmSearch');
      if (!box || !input) return;

      if (!items || items.length === 0){
        box.innerHTML = '';
        openSuggestions(false);
        input.setAttribute('aria-expanded', 'false');
        return;
      }

      const lis = items.map(function(it, idx){
        const emoji = it.emoji || '📍';
        const main = emoji + ' ' + escapeHTML(it.main || 'Unknown');
        const badge = '<small>' + escapeHTML(it.sub || '') + '</small>';
        return `
          <li class="suggest-item" role="option"
              data-idx="${idx}" data-lat="${it.lat}" data-lon="${it.lon}"
              data-main="${escapeHTML(it.main||'')}">
            ${main}
            ${badge}
          </li>`;
      }).join('');

      box.innerHTML = '<ul class="suggest-list">' + lis + '</ul>';
      openSuggestions(true);
      input.setAttribute('aria-expanded', 'true');
    }

    function clearSuggestions(){
      const box = document.getElementById('gmSuggest');
      const input = document.getElementById('gmSearch');
      if (box){ box.innerHTML=''; box.classList.remove('open'); }
      if (input) input.setAttribute('aria-expanded','false');
    }

    function bindGmSearch(){
      const input = document.getElementById('gmSearch');
      const box   = document.getElementById('gmSuggest');
      if (!input || !box) return;

      let activeIndex = -1;
      let currentItems = [];

      function setActive(idx){
        activeIndex = idx;
        box.querySelectorAll('.suggest-item').forEach(function(el,i){
          el.classList.toggle('active', i===idx);
        });
      }

      function choose(lat, lon, label){
        if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lon))) return;
        if (label) input.value = label;
        clearSuggestions();
        setMapTarget(Number(lat), Number(lon), 16);
      }

      const doSearch = debounce(async function(){
        const qRaw = input.value.trim();
        if (qRaw.length < SEARCH_MIN_CHARS){
          currentItems = [];
          clearSuggestions();
          spinnerOff();
          return;
        }

        const mySeq = ++searchSeq;

        try { if (gmAbort) gmAbort.abort(); } catch(e) {}
        gmAbort = new AbortController();
        const signal = gmAbort.signal;

        try{
          const features = await photonSearchOnce(qRaw, signal);
          let items = featuresToItems(features);
          items = dedupKeepFirst(items);
          const nextItems = items.slice(0, MAX_SUGGESTIONS);

          if (mySeq === searchSeq){
            currentItems = nextItems;
            renderSuggestions(currentItems);
            setActive(currentItems.length ? 0 : -1);
          }
        } catch (e){
          if (!(e && e.name === 'AbortError')) console.warn('[Search] failed:', e);
        } finally {
          if (mySeq === searchSeq) spinnerOff();
        }
      }, SEARCH_DEBOUNCE_MS);

      input.addEventListener('input', function(){
        const q = input.value.trim();
        if (q.length >= SEARCH_MIN_CHARS) spinnerOn(); else spinnerOff();
        doSearch();
      }, { passive:true });

      input.addEventListener('keydown', function(e){
        if (!box.classList.contains('open') || currentItems.length === 0) return;

        if (e.key === 'ArrowDown'){
          e.preventDefault();
          setActive(Math.min(currentItems.length - 1, activeIndex + 1));
        } else if (e.key === 'ArrowUp'){
          e.preventDefault();
          setActive(Math.max(0, activeIndex - 1));
        } else if (e.key === 'Enter'){
          e.preventDefault();
          const it = currentItems[activeIndex >= 0 ? activeIndex : 0];
          if (!it) return;
          choose(it.lat, it.lon, it.main);
        } else if (e.key === 'Escape'){
          e.preventDefault();
          clearSuggestions();
          spinnerOff();
        }
      });

      box.addEventListener('click', function(e){
        const item = e.target.closest('.suggest-item');
        if (!item) return;
        choose(Number(item.dataset.lat), Number(item.dataset.lon), item.dataset.main || item.textContent.trim());
      }, { passive:true });

      document.addEventListener('click', function(e){
        if (e.target.closest('#placeSearch')) return;
        clearSuggestions();
        spinnerOff();
      }, { passive:true });
    }

    /* =======================================================
       Shared haversine (Waze clustering)
       ======================================================= */
    function toRad(deg){ return deg * Math.PI / 180; }
    function haversineMeters(a, b){
      const lon1 = a[0], lat1 = a[1], lon2 = b[0], lat2 = b[1];
      const R = 6371000, dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
      const aa = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
    }

    /* =======================================================
       ALERTS (Unified queue) — state + rendering
       ======================================================= */
    const ALERTS = {
      byId: new Map(),
      order: [],
      selectedId: null,
      filter: 'priority', // all | priority | tvt | waze
      sort: 'priority',   // priority | age | severity
      query: ''
    };

    function ackKey(id){ return 'ack_' + id; }
    function getAck(id){
      const raw = localStorage.getItem(ackKey(id));
      const n = Number(raw);
      return Number.isFinite(n) ? n : 0;
    }
    function setAck(id){ localStorage.setItem(ackKey(id), String(Date.now())); }

    function minsAgo(ms){
      const d = Math.max(0, Date.now() - (Number(ms)||0));
      return Math.max(0, Math.round(d/60000));
    }
    function hhmm(ms){
      try{
        return new Date(Number(ms)||0).toLocaleString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit'});
      }catch(e){ return ''; }
    }

    function severityRank(a){
      // lower is more severe
      if (a.kind === 'tvt'){
        const d = Number(a.delayMin||0);
        return (d >= 15 ? 0 : d >= 10 ? 1 : d >= 5 ? 2 : 3);
      }
      if (a.kind === 'acc'){
        const c = Number(a.conf||0);
        return (c >= 4 ? 0 : c >= 3 ? 1 : 2);
      }
      if (a.kind === 'sig'){
        const r = Number(a.rel10||0);
        return (r >= 9 ? 1 : r >= 7 ? 2 : 3);
      }
      if (a.kind === 'ice') return 3;
      return 4;
    }

    function priorityRank(a){
      // new severe floats; acknowledged sinks
      const ack = getAck(a.id) ? 1 : 0;
      const sev = severityRank(a);
      return sev * 10 + ack;
    }

    function passesFilter(a){
      if (ALERTS.filter === 'all') return true;
      if (ALERTS.filter === 'priority') return priorityRank(a) <= 12;
      if (ALERTS.filter === 'tvt') return a.kind === 'tvt';
      if (ALERTS.filter === 'waze') return a.kind !== 'tvt';
      return true;
    }

    function passesQuery(a){
      const q = (ALERTS.query||'').trim().toLowerCase();
      if (!q) return true;
      const hay = (a.title + ' ' + (a.area||'') + ' ' + (a.sub||'')).toLowerCase();
      return hay.includes(q);
    }

    function upsertAlert(a){
      const existing = ALERTS.byId.get(a.id);

      // Apply hide logic using your existing system
      const hidden = isHiddenWithAutoCheck(a.hidePrefix, a.id, a.currentMetrics || a.baseline || {});
      a.hidden = !!hidden;

      // Preserve firstSeen if already exists
      if (existing){
        a.firstSeen = existing.firstSeen || a.time || Date.now();
        // Preserve selection-friendly timestamps if input time is missing
        a.time = Number(a.time) || Number(existing.time) || Date.now();
      } else {
        a.firstSeen = Number(a.time) || Date.now();
        a.time = Number(a.time) || Date.now();
      }

      ALERTS.byId.set(a.id, a);
    }

    function setKpis(){
      let tvt=0, acc=0, sig=0, ice=0, snoozed=0;
      for (const a of ALERTS.byId.values()){
        if (a.hidden) { snoozed++; continue; }
        if (a.kind==='tvt') tvt++;
        else if (a.kind==='acc') acc++;
        else if (a.kind==='sig') sig++;
        else if (a.kind==='ice') ice++;
      }
      document.getElementById('kpiTvt').textContent = String(tvt);
      document.getElementById('kpiAcc').textContent = String(acc);
      document.getElementById('kpiSig').textContent = String(sig);
      document.getElementById('kpiIce').textContent = String(ice);
      document.getElementById('kpiSnoozed').textContent = String(snoozed);
    }

    function renderQueue(){
      const host = document.getElementById('alertQueue');
      if (!host) return;

      const items = Array.from(ALERTS.byId.values())
        .filter(a => !a.hidden)
        .filter(passesFilter)
        .filter(passesQuery);

      items.sort((a,b) => {
        if (ALERTS.sort === 'age') return (b.time - a.time);
        if (ALERTS.sort === 'severity') return (severityRank(a) - severityRank(b)) || (b.time - a.time);
        return (priorityRank(a) - priorityRank(b)) || (b.time - a.time);
      });

      ALERTS.order = items.map(a => a.id);

      const frag = document.createDocumentFragment();
      for (const a of items){
        const row = document.createElement('div');
        row.className = 'qrow';
        row.setAttribute('role','option');
        row.dataset.id = a.id;
        row.style.setProperty('--qcol', a.color || 'rgba(255,255,255,0.25)');
        row.setAttribute('aria-selected', String(ALERTS.selectedId === a.id));

        const ack = getAck(a.id);
        const state = ack ? 'Ack' : 'New';

        row.innerHTML = `
          <div class="qicon">${escapeHTML(a.icon || '📍')}</div>
          <div class="qmain">
            <div class="qtitle">${escapeHTML(a.title || 'Unknown')}</div>
            <div class="qsub">${escapeHTML(a.sub || '')}${a.sub ? ' • ' : ''}${state}${a.area ? ' • ' + escapeHTML(a.area) : ''}</div>
          </div>
          <div class="qmeta">
            <div class="qpill">${escapeHTML(a.badge || '')}</div>
            <div class="qage">${minsAgo(a.time)}m ago</div>
          </div>
        `;
        frag.appendChild(row);
      }

      host.innerHTML = '';
      host.appendChild(frag);

      setKpis();

      // Keep selection stable
      if (!ALERTS.selectedId || !ALERTS.byId.has(ALERTS.selectedId) || (ALERTS.byId.get(ALERTS.selectedId)?.hidden)){
        ALERTS.selectedId = items[0]?.id || null;
      }
      updateSelectionUI();
      renderDetails();
    }

    function updateSelectionUI(){
      const host = document.getElementById('alertQueue');
      if (!host) return;
      host.querySelectorAll('.qrow').forEach(el => {
        el.setAttribute('aria-selected', String(el.dataset.id === ALERTS.selectedId));
      });
    }

      card.querySelector('#actHide')?.addEventListener('click', () => {
        hideForHour(a.hidePrefix || 'gen', a.id, a.baseline || {});
        a.hidden = true;
        ALERTS.byId.set(a.id, a);
        renderQueue();

      // Keep marker context ready

    function bindQueueInteractions(){
      const host = document.getElementById('alertQueue');
      if (!host) return;

      host.addEventListener('click', (e) => {
        const row = e.target.closest('.qrow');
        if (!row) return;
        ALERTS.selectedId = row.dataset.id;
        updateSelectionUI();
        renderDetails();
      }, { passive:true });

      document.addEventListener('keydown', (e) => {
        if (!ALERTS.order.length) return;

        const idx = Math.max(0, ALERTS.order.indexOf(ALERTS.selectedId));
        if (e.key === 'ArrowDown'){
          e.preventDefault();
          ALERTS.selectedId = ALERTS.order[Math.min(ALERTS.order.length-1, idx+1)];
          updateSelectionUI(); renderDetails();
        } else if (e.key === 'ArrowUp'){
          e.preventDefault();
          ALERTS.selectedId = ALERTS.order[Math.max(0, idx-1)];
          updateSelectionUI(); renderDetails();
        } else if (e.key === 'Enter'){
          const a = ALERTS.byId.get(ALERTS.selectedId);
          if (a){ e.preventDefault(); setMapTarget(a.lat, a.lon, a.zoom || 14); }
        } else if (e.key === ' '){
          const a = ALERTS.byId.get(ALERTS.selectedId);
          if (a){ e.preventDefault(); MAP_STATE.last = { lat:a.lat, lon:a.lon }; openToolDialog(); }
        } else if (e.key.toLowerCase() === 'h'){
          const a = ALERTS.byId.get(ALERTS.selectedId);
          if (a){ e.preventDefault(); hideForHour(a.hidePrefix || 'gen', a.id, a.baseline || {}); a.hidden = true; ALERTS.byId.set(a.id, a); renderQueue(); }
        } else if (e.key.toLowerCase() === 'a'){
          const a = ALERTS.byId.get(ALERTS.selectedId);
          if (a){ e.preventDefault(); setAck(a.id); renderQueue(); }
        }
      });
    }

    function bindAlertControls(){

    function setAlertsMeta(text){
      const el = document.getElementById('alertsMeta');
      if (el) el.textContent = text;
    }

    /* =======================================================
       TVT — ingestion + alerts
       ======================================================= */
    const TVT_REFRESH_MS = 5 * 60 * 1000;
    let TVT_MIN_DELAY = 15;
    let lastTvtData = null;

    function corridorDisplayName(r){
      if (r && r.name && r.name.trim()) return r.name.trim();
      const from = String(r && r.fromName || '').trim();
      const to   = String(r && r.toName   || '').trim();
      if (from || to) return [from, to].filter(Boolean).join(' → ');
      if (r && r.leadAlert && r.leadAlert.street) return String(r.leadAlert.street).trim();
      return 'Unnamed corridor';
    }

    function networkGradientFromUsersOnJams(usersOnJams){
      if (!Array.isArray(usersOnJams) || usersOnJams.length === 0) {
        return 'linear-gradient(90deg,#42BE4B,#ffe04a,#ff4d4f)';
      }
      const levelColors = { 0:'#42BE4B', 1:'#9ddc43', 2:'#ffe04a', 3:'#ff9a1f', 4:'#ff4d4f' };
      const total = usersOnJams.reduce(function(a,u){ return a + (Number(u.wazersCount)||0); }, 0) || 1;
      let acc = 0, stops=[];
      usersOnJams.slice().sort(function(a,b){ return a.jamLevel-b.jamLevel; }).forEach(function(u){
        const pct = (Number(u.wazersCount)||0)/total*100;
        const start = acc, end = acc + pct;
        stops.push((levelColors[u.jamLevel] || '#666') + ' ' + start.toFixed(2) + '% ' + end.toFixed(2) + '%');
        acc = end;
      });
      return 'linear-gradient(90deg, ' + stops.join(', ') + ')';
    }

    function delayColor(delayMin){
      if (delayMin >= 15) return '#FF4D4F';
      if (delayMin >= 10) return '#FF9A1F';
      if (delayMin >= 5)  return '#FFE04A';
      return '#42BE4B';
    }

    function computeDelayMin(r){
      const time = Number(r && r.time);
      const hist = Number(r && r.historicTime);
      if (!Number.isFinite(time) || !Number.isFinite(hist)) return 0;
      return Math.max(0, Math.round((time - hist) / 60));
    }

    function computeTopNDelays(routesRaw, n, minDelay){
      n = n || 24; minDelay = minDelay || 15;
      const routes = Array.isArray(routesRaw) ? routesRaw.slice() : [];
      const candidates = routes
        .map(function(r){
          return { r:r, time:Number(r && r.time)||0, hist:Number(r && r.historicTime)||0, delayMin: computeDelayMin(r) };
        })
        .filter(function(x){ return Number.isFinite(x.delayMin) && x.delayMin >= minDelay; });

      candidates.sort(function(a,b){ return (b.delayMin - a.delayMin) || (b.time - a.time); });
      return candidates.slice(0, n);
    }

    const routeKey = (r) => {
      const base = String((r && (r.id ?? r.name)) ?? corridorDisplayName(r) ?? '').trim();
      const t = String(r && r.type || '').toUpperCase();
      const bb = r && r.bbox;
      const bbTok = (bb && [bb.minX, bb.minY, bb.maxX, bb.maxY].every(Number.isFinite))
        ? (Number(bb.minX).toFixed(4)+','+Number(bb.minY).toFixed(4)+','+Number(bb.maxX).toFixed(4)+','+Number(bb.maxY).toFixed(4))
        : '';
      return t === 'DYNAMIC' ? (base + '|DYN|' + bbTok) : base;
    };

    function getCorridorCenterLngLat(route){
      try{
        const bb = route && route.bbox;
        if (bb){
          const minX = Number(bb.minX), maxX = Number(bb.maxX);
          const minY = Number(bb.minY), maxY = Number(bb.maxY);
          if ([minX, maxX, minY, maxY].every(Number.isFinite)){
            return [(minX + maxX) / 2, (minY + maxY) / 2];
          }
        }
        const pts = Array.isArray(route && route.line) ? route.line : [];
        let sumX = 0, sumY = 0, n = 0;
        for (const p of pts){
          const x = Number(p && p.x);
          const y = Number(p && p.y);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          sumX += x; sumY += y; n++;
        }
        if (n > 0) return [sumX / n, sumY / n];
      }catch(e){}
      return null;
    }

    function tvtToAlerts(data){
      lastTvtData = data;

      const net = document.getElementById('networkBar');
      if (net){
        net.style.background = networkGradientFromUsersOnJams((data && data.usersOnJams) || []);
      }
      updateConnectedCitizensDisplay(sumWazers((data && data.usersOnJams) || []));

      const allRoutes = []
        .concat(Array.isArray(data && data.routes) ? data.routes : [])
        .concat(Array.isArray(data && data.irregularities) ? data.irregularities : []);

      const rows = computeTopNDelays(allRoutes, 30, TVT_MIN_DELAY);

      for (const it of rows){
        const r = it.r;
        const label = corridorDisplayName(r);
        const delayMin = Math.max(0, Number(it.delayMin)||0);
        const normMin = Math.max(0, Math.round((Number(it.hist)||0) / 60));
        const nowMin  = Math.max(0, Math.round((Number(it.time)||0) / 60));

        const center = getCorridorCenterLngLat(r);
        if (!center) continue;
        const lon = Number(center[0]), lat = Number(center[1]);
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;

        const id = routeKey(r);
        upsertAlert({
          id,
          kind: 'tvt',
          kindLabel: 'Abnormal traffic',
          icon: '⏱️',
          title: label,
          sub: `${normMin}m → ${nowMin}m`,
          badge: `+${delayMin}m`,
          delayMin,
          time: Date.now(), // “seen now” each cycle; ack is persistent
          lat, lon,
          zoom: 11,
          color: delayColor(delayMin),
          hidePrefix: 'corr',
          baseline: { delayMin },
          currentMetrics: { delayMin }
        });
      }
    }

    function bindTvtFilters(){
      const wrap = document.getElementById('tvt-filters');
      if (!wrap) return;

      wrap.addEventListener('click', function(e){
        const btn = e.target.closest('button[data-min]');
        if (!btn) return;
        TVT_MIN_DELAY = Number(btn.dataset.min) || 15;
        wrap.querySelectorAll('button[data-min]').forEach(function(b){
          b.classList.toggle('active', b === btn);
        });
        if (lastTvtData) { tvtToAlerts(lastTvtData); renderQueue(); }
      }, { passive:true });
    }

    async function fetchTVT(signal){
      return await fetchJsonFromAPI(API_BASE + '/api/waze/tvt', signal);
    }

    async function tvtCycle(){
      const ctrl = new AbortController();
      try{
        const data = await fetchTVT(ctrl.signal);
        tvtToAlerts(data);
        setAlertsMeta(`TVT refreshed • threshold +${TVT_MIN_DELAY}m • ${fmtHHMMSS()}`);
        renderQueue();
        setStatusPill(true, { animate:true });
      }catch(e){
        console.error('[TVT] fetch failed:', e);
        setAlertsMeta(`TVT failed • ${fmtHHMMSS()}`);
        setStatusPill(false);
      }finally{
        clearTimeout(tvtTimer);
        tvtTimer = setTimeout(tvtCycle, TVT_REFRESH_MS);
      }
    }

    /* =======================================================
       WAZE — ingestion + alerts (accidents / signals / ice)
       ======================================================= */
    const WAZE_REFRESH_MS = 30000;

    async function fetchViaProxies(_ignoredUrl, signal){
      return await fetchJsonFromAPI(API_BASE + '/api/waze/partner-feed', signal);
    }

    function stableClusterId(coord){
      const lon = Number(coord[0]).toFixed(4);
      const lat = Number(coord[1]).toFixed(4);
      return 'cluster-' + lon + ',' + lat;
    }
    function readConfidence(a){ return Number(a && (a.confidence ?? a.confidenceLevel ?? a.level ?? 0)) || 0; }
    function readReliability(a){ return Number(a && (a.reliability ?? a.reliabilityScore ?? 0)) || 0; }
    function readType(a){ return String((a && (a.type || a.alertType)) || '').toUpperCase(); }
    function readSubType(a){ return String((a && (a.subtype || a.subType || a.sub_type)) || '').toUpperCase(); }
    function readDesc(a){ return String((a && (a.description || a.reportDescription || a.title)) || '').toUpperCase(); }

    function getLngLatFromAlert(a){
      try{
        if(a){
          if(a.location){
            const loc = a.location;
            if(typeof loc.x==='number' && typeof loc.y==='number') return [loc.x, loc.y];
            if(typeof loc.lon==='number' && typeof loc.lat==='number') return [loc.lon, loc.lat];
            if(Array.isArray(loc.coordinates) && loc.coordinates.length>=2) return [loc.coordinates[0], loc.coordinates[1]];
            if(loc.point && typeof loc.point.x==='number' && typeof loc.point.y==='number') return [loc.point.x, loc.point.y];
          }
          if(a.geometry && a.geometry.coordinates && a.geometry.coordinates.length>=2){
            const c = a.geometry.coordinates;
            if(typeof c[0]==='number' && typeof c[1]==='number') return [c[0], c[1]];
          }
          if(typeof a.longitude==='number' && typeof a.latitude==='number') return [a.longitude, a.latitude];
        }
      }catch(e){}
      return null;
    }

    function isAccident(a){
      const t = readType(a);
      const st = readSubType(a);
      return t.includes('ACCIDENT') || st.includes('ACCIDENT');
    }

    function isIceAlert(a){
      const st = String((a && (a.subtype || a.subType || a.sub_type)) || '').toUpperCase();
      if (st === 'HAZARD_ON_ROAD_ICE') return true;

      const t  = String((a && (a.type || a.alertType)) || '').toUpperCase();
      const d  = String((a && (a.description || a.reportDescription || a.title)) || '').toUpperCase();
      return t.includes('ICE') || /\bICE\b|BLACK\s*ICE|RECENT(LY)?\s+FORMED\s+ICE/.test(d);
    }

    function isTrafficLightFault(a){
      const t = readType(a), st = readSubType(a), d = readDesc(a);
      return st === 'HAZARD_ON_ROAD_TRAFFIC_LIGHT_FAULT' ||
             (t.includes('TRAFFIC') && t.includes('LIGHT')) ||
             st.includes('TRAFFIC_LIGHT') || st.includes('LIGHT_FAULT') ||
             /TRAFFIC\s+LIGHT\s+FAULT|SIGNAL\s+FAULT/i.test(d);
    }

    function dedupAccidentClusters(clusters, opts){
      opts = opts || {};
      const corridorMeters = opts.corridorMeters || 8000;
      if (!Array.isArray(clusters) || clusters.length === 0) return [];
      const groups = new Map();
      for (const c of clusters){
        const token = (c.street||'').toUpperCase().match(/\b([MBA]\d{1,4})\b/);
        const key = token ? token[1] : (c.street||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim() || '___unknown___';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(c);
      }
      const kept = [];
      for (const arr of groups.values()){
        arr.sort(function(a,b){
          return (Number(b.effectiveConfidence||0) - Number(a.effectiveConfidence||0)) || (Number(b.time||0) - Number(a.time||0));
        });
        const chosen = [];
        for (const c of arr){
          let dup = false;
          for (const k of chosen){
            const dist = haversineMeters(c.coord, k.coord);
            if (dist <= corridorMeters){ dup = true; break; }
          }
          if (!dup) chosen.push(c);
        }
        kept.push.apply(kept, chosen);
      }
      kept.sort(function(a,b){
        return (Number(b.effectiveConfidence||0) - Number(a.effectiveConfidence||0)) || (Number(b.time||0) - Number(a.time||0));
      });
      return kept;
    }

    function normalizeMillis(raw){
      const n = Number(raw) || 0;
      return n > Date.now() ? Date.now() : n;
    }

    function wazeChipColor(kind, score){
      if (kind === 'acc'){
        if (score >= 4) return '#FF4D4F';
        if (score >= 3) return '#FF9A1F';
        return '#FFE04A';
      }
      if (kind === 'sig'){
        if (score >= 9) return '#FF4D4F';
        if (score >= 7) return '#FF9A1F';
        return '#FFE04A';
      }
      if (kind === 'ice') return '#7AA7FF';
      return 'rgba(255,255,255,0.35)';
    }

    async function wazeCycle(){
      const ctrl = new AbortController();
      try{
        const data = await fetchViaProxies('', ctrl.signal);
        const alertsRaw = (data && Array.isArray(data.alerts)) ? data.alerts : [];

        // ACCIDENT points
        const accidentPoints = [];
        for (const x of alertsRaw){
          if(!isAccident(x)) continue;
          const c = readConfidence(x);
          if(!(c > 0)) continue;
          const coord = getLngLatFromAlert(x); if(!coord) continue;
          const rawTime = x.pubMillis || x.updateTime || x.reportMillis || 0;
          accidentPoints.push({
            coord: coord,
            conf10: c,
            rel10: readReliability(x),
            street: x.street||x.roadName||x.address||'Unknown road',
            city: x.city||x.town||'',
            time: normalizeMillis(rawTime),
            id: x.uuid||x.id||(coord[0]+','+coord[1]+','+(rawTime||''))
          });
        }

        // Cluster accidents
        const accidentClustersRaw = accidentPoints.length ? (function cluster(points, merge){
          merge = merge || 200;
          if(points.length===0) return [];
          const parent = Array(points.length).fill(0).map((_,i)=>i);
          const find = x => { while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
          const union = (a,b) => { a=find(a); b=find(b); if(a!==b) parent[a]=b; };

          for(let i=0;i<points.length;i++){
            for(let j=i+1;j<points.length;j++){
              const d = haversineMeters(points[i].coord, points[j].coord);
              if(d<=merge) union(i,j);
            }
          }

          const groups = new Map();
          for(let i=0;i<points.length;i++){
            const r=find(i);
            if(!groups.has(r)) groups.set(r, []);
            groups.get(r).push(points[i]);
          }

          const clusters=[];
          for(const members of groups.values()){
            const count=members.length;
            const baseConf10=members.reduce((m,p)=>Math.max(m, Number(p.conf10)||0), 0);
            const bestRel10=members.reduce((m,p)=>Math.max(m, Number(p.rel10)||0), 0);
            let eff10=baseConf10 + (bestRel10>8?2:0);
            eff10=Math.max(0, Math.min(12, eff10));
            const eff5=Math.max(1, Math.min(5, Math.round(eff10/2)));

            const avg=members.reduce((acc,m)=>[acc[0]+m.coord[0], acc[1]+m.coord[1]],[0,0]).map(v=>v/count);
            const maxTime=members.reduce((t,m)=>Math.max(t, Number(m.time)||0), 0);

            const best=members.slice().sort((a,b)=>((Number(b.conf10)||0)-(Number(a.conf10)||0))||((Number(b.time)||0)-(Number(a.time)||0)))[0];
            clusters.push({ id: stableClusterId(avg), coord: avg, street: best.street, city: best.city, effectiveConfidence: eff5, time: maxTime, reportCount: count });
          }

          clusters.sort((a,b)=>(Number(b.effectiveConfidence||0)-Number(a.effectiveConfidence||0))||((Number(b.time||0)-Number(a.time||0))));
          return clusters;
        })(accidentPoints) : [];

        const accidentClusters = dedupAccidentClusters(accidentClustersRaw, { corridorMeters: 8000 });

        // Signals
        const signals = [];
        for (const x of alertsRaw){
          if (!isTrafficLightFault(x)) continue;
          const coord = getLngLatFromAlert(x);
          if (!coord) continue;

          const rel10 = readReliability(x);
          const rawTime = x.pubMillis || x.updateTime || x.reportMillis || 0;
          const time  = normalizeMillis(rawTime);
          const id    = x.uuid || x.id || (coord[0]+','+coord[1]+','+(rawTime || ''));
          const street = x.street || x.roadName || x.address || 'Unknown road';
          const city = x.city || x.town || '';
          const desc = x.reportDescription || x.description || x.title || 'Traffic light fault';

          if (isHiddenWithAutoCheck('sig', id, { conf: rel10 })) continue;
          signals.push({ id, coord, street, city, time, rel10, desc });
        }
        signals.sort((a,b)=>(b.rel10 - a.rel10) || (b.time - a.time));

        // Weather (ice)
        const ice = [];
        for (const x of alertsRaw){
          if (!isIceAlert(x)) continue;
          const coord = getLngLatFromAlert(x);
          if (!coord) continue;

          const rawTime = x.pubMillis || x.updateTime || x.reportMillis || 0;
          const time  = normalizeMillis(rawTime);
          const id    = x.uuid || x.id || (coord[0]+','+coord[1]+','+(rawTime || ''));
          const street = x.street || x.roadName || x.address || 'Unknown road';
          const city = x.city || x.town || '';
          const desc = x.reportDescription || x.description || x.title || 'Ice alert';

          if (isHiddenWithAutoCheck('wx', id, {})) continue;
          ice.push({ id, coord, street, city, time, desc });
        }
        ice.sort((a,b)=>b.time-a.time);

        // Build unified alerts
        const HIGH_MIN = Number(getComputedStyle(document.documentElement).getPropertyValue('--highConfMin')) || 4;

        for (const a of accidentClusters){
          const conf = Number(a.effectiveConfidence)||0;
          if (isHiddenWithAutoCheck('acc', a.id, { conf })) continue;

          upsertAlert({
            id: a.id,
            kind: 'acc',
            kindLabel: (conf >= HIGH_MIN ? 'Accident (priority)' : 'Accident'),
            icon: '💥',
            title: a.street || 'Unknown road',
            badge: `Conf ${conf}/5`,
            sub: `${hhmm(a.time)} • ${a.reportCount || 1} rpt${(a.reportCount||1)>1?'s':''}${a.city ? (' • ' + a.city) : ''}`,
            conf,
            time: Number(a.time) || Date.now(),
            lat: a.coord[1], lon: a.coord[0],
            zoom: 14,
            color: wazeChipColor('acc', conf),
            hidePrefix: 'acc',
            baseline: { conf },
            currentMetrics: { conf }
          });
        }

        for (const s of signals){
          const rel = Number(s.rel10)||0;
          upsertAlert({
            id: s.id,
            kind: 'sig',
            kindLabel: 'Traffic signals',
            icon: '🚦',
            title: s.street || 'Unknown road',
            badge: `Rel ${rel}/10`,
            sub: `${hhmm(s.time)}${s.city ? (' • ' + s.city) : ''}`,
            rel10: rel,
            area: s.city || '',
            time: Number(s.time) || Date.now(),
            lat: s.coord[1], lon: s.coord[0],
            zoom: 15,
            color: wazeChipColor('sig', rel),
            hidePrefix: 'sig',
            baseline: { conf: rel },
            currentMetrics: { conf: rel }
          });
        }

        for (const w of ice){
          upsertAlert({
            id: w.id,
            kind: 'ice',
            kindLabel: 'Ice hazard',
            icon: '❄️',
            title: w.street || 'Unknown road',
            badge: `Ice`,
            sub: `${hhmm(w.time)}${w.city ? (' • ' + w.city) : ''}`,
            area: w.city || '',
            time: Number(w.time) || Date.now(),
            lat: w.coord[1], lon: w.coord[0],
            zoom: 15,
            color: wazeChipColor('ice', 0),
            hidePrefix: 'wx',
            baseline: {},
            currentMetrics: {}
          });
        }

        setAlertsMeta(`Waze refreshed • ${fmtHHMMSS()}`);
        renderQueue();
        setStatusPill(true, { animate:true });

      }catch(e){
        console.error('[Waze] fetch failed:', e);
        setAlertsMeta(`Waze failed • ${fmtHHMMSS()}`);
        setStatusPill(false);
      }finally{
        clearTimeout(wazeTimer);
        wazeTimer = setTimeout(wazeCycle, WAZE_REFRESH_MS);
      }
    }

    /* =======================================================
       BOOT / VISIBILITY
       ======================================================= */
    document.addEventListener('visibilitychange', function(){
      if (document.hidden){
        clearTimeout(tvtTimer); tvtTimer = null;
        clearTimeout(wazeTimer); wazeTimer = null;
        spinnerOff();
      } else {
        tvtCycle();
        wazeCycle();
      }
    });

    window.addEventListener('load', function(){
      setStatusPill(false);

      initMap();
      bindToolDialog();

      bindGmSearch();

      document.getElementById('unhideAllBtn')?.addEventListener('click', unhideAll, { passive:true });

      bindTvtFilters();
      bindQueueInteractions();
      bindAlertControls();

      tvtCycle();
      wazeCycle();
    });
  </script>
</body>
</html>
