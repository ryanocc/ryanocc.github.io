<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Bus Diversions</title>
<meta http-equiv="Cache-Control" content="no-store" />
<style>
  :root{
    --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;

    /* Operator colours */
    --op-BNML:#ff4d4f;   /* red */
    --op-BNGN:#3a7afe;   /* blue */
    --op-BNSM:#ff9a1f;   /* orange */
    --op-BNDB:#ffffff;   /* white */
    --op-BNVB:#7a3ffe;   /* purple */
    --op-BNFM:#ff66b3;   /* pink */

    --neutral:#16161b;
    --neutralElev:#1b1b22;

    --accent:#ffd100;       /* yellow route badge */

    /* Status pill colours */
    --liveGreen:#19c37d;
    --errorRed:#ff4d4f;

    /* Grid/card */
    --gridGap:20px;
    --cardRadius:24px;
    --cardHeight: 420px; /* JS will override to fit exactly 2 rows */

    /* Summary metrics */
    --summary-line-height: 1.35; /* keep in sync with .summary line-height */
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; padding:0; background:var(--bg);
    color:var(--text);
    font-family:system-ui, Segoe UI, Roboto, Arial, sans-serif;
    overflow:hidden; /* no page scroll */
  }

  /* ----------- HEADER ----------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    background:#0b0b0e;
    border-bottom:1px solid #1d1d25;
  }
  .title{
    margin:0;
    font-size:56px;
    font-weight:900;
    letter-spacing:-0.3px;
  }
  .status-pill{
    padding:8px 14px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    background:var(--liveGreen);
    color:#000;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08),
               0 4px 14px rgba(0,0,0,0.25);
    transition:background .2s ease,color .2s ease;
  }
  .status-error{
    background:var(--errorRed);
    color:#fff;
  }

  main{
    padding:0 24px 24px; /* bottom padding only */
    display:flex;
    flex-direction:column;
    height:calc(100vh - 68px);
  }

  /* ----------- FIXED 3×2 GRID ----------- */
  #grid{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);  /* 3 wide */
    gap:var(--gridGap);
    flex:1;
    height:100%;           /* ensure clientHeight is reliable */
    overflow:hidden;       /* keep grid non-scroll */
  }

  /* ----------- CARD ----------- */
  .chip{
    position:relative;
    border:3px solid #2a2a33;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00) 60%),
      var(--neutralElev);
    border-radius:var(--cardRadius);
    display:flex;
    flex-direction:column;
    padding:24px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.04) inset,
      0 10px 25px rgba(0,0,0,0.35),
      0 6px 18px rgba(0,0,0,0.45);
    height:var(--cardHeight); /* all cards same height */
    min-height:var(--cardHeight);
    max-height:var(--cardHeight);
    overflow:hidden; /* ensure uniform sizing */
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .chip:hover{
    transform:translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.05) inset,
      0 16px 36px rgba(0,0,0,0.45),
      0 3px 8px rgba(0,0,0,0.45);
    border-color:#343545;
  }

  /* Header: route + operator short code */
  .chipHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:16px;
  }
  .route{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    background:var(--accent);
    color:#000;
    padding:8px 20px;
    border-radius:16px;
    letter-spacing:-0.5px;
    line-height:1;
    min-width:3ch;
    font-size:clamp(64px, 8vw, 110px);
  }
  .operatorTag{
    display:inline-flex;
    align-items:center;
    gap:14px;
    padding:10px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,255,255,0.18);
    font-size:32px;
    font-weight:800;
    color:#e6e6ee;
  }
  .operatorDot{
    width:22px; height:22px; border-radius:50%;
    background:#888;
    box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset;
  }

  /* Body: EXACTLY TWO LINES (spacer if short, truncate if long) */
  .summary{
    font-size:clamp(28px, 3vw, 34px);
    line-height: var(--summary-line-height);
    color:var(--text);
    opacity:0.95;

    /* Two-line block */
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;    /* truncate after 2 lines */
    overflow:hidden;

    /* Reserve exactly two line-heights of space */
    min-height: calc(2 * var(--summary-line-height) * 1em);
    max-height: calc(2 * var(--summary-line-height) * 1em);

    margin:2px 2px 16px 2px;
  }

  /* Footer: stacked times */
  .validityTime{
    margin-top:auto;
    padding-top:16px;
    border-top:2px solid rgba(255,255,255,0.15);
    white-space:pre-line;
    font-size:clamp(26px, 2.4vw, 32px);
    font-weight:900;
    color:#d9d9e2;
    line-height:1.25;
  }

  /* Optional subtle operator tints */
  .op-BNML{ background:linear-gradient(180deg, rgba(255,77,79,0.08), transparent), var(--neutralElev); }
  .op-BNGN{ background:linear-gradient(180deg, rgba(58,122,254,0.10), transparent), var(--neutralElev); }
  .op-BNSM{ background:linear-gradient(180deg, rgba(255,154,31,0.10), transparent), var(--neutralElev); }
  .op-BNDB{ background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.16)); border-color:#dcdcdc; color:#000; }
  .op-BNVB{ background:linear-gradient(180deg, rgba(122,63,254,0.12), transparent), var(--neutralElev); }
  .op-BNFM{ background:linear-gradient(180deg, rgba(255,102,179,0.12), transparent), var(--neutralElev); }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="title">Live Bus Diversions</h1>
  <div id="statusPill" class="status-pill">Live • --:--:--</div>
</header>

<main>
  <div id="grid"></div>
</main>

<script>
/* ===========================
   CONFIG
=========================== */
const API_KEY = "17889546a31fddeef67fca78252fb66951aedf1a";
const BODS_URL =
  `https://occproxy-6dem.vercel.app/api/proxy?url=https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;

/* TfGM Bee Network operator refs (strict) */
const BEE_OPERATORS = ["BNML","BNGN","BNSM","BNDB","BNVB","BNFM"];

/* Behaviour flags */
const UNPLANNED_ONLY = true;
const PAGE_INTERVAL_MS = 10000;

/* Diversion keyword matching */
const DIVERSION_MATCHERS = ["divert","diversion","diversions"];

/* Helpers */
const $ = s => document.querySelector(s);
const parseISO = s => s ? new Date(s) : null;

function fmtFull(d){
  return new Intl.DateTimeFormat(undefined,
    {hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d);
}
function fmtHM(d){
  return new Intl.DateTimeFormat(undefined,
    {hour:"2-digit",minute:"2-digit"}).format(d);
}
function setStatusPill(ok){
  const pill = $("#statusPill");
  const t = fmtFull(new Date());
  if(ok){
    pill.classList.remove("status-error");
    pill.textContent = `Live • ${t}`;
  } else {
    pill.classList.add("status-error");
    pill.textContent = `Error • ${t}`;
  }
}

/* Operator short-label mapping for the pill */
function operatorShortLabel(refRaw){
  const ref = (refRaw || "").toUpperCase();
  const map = {
    BNSM:"SCM",
    BNML:"ML",
    BNGN:"GNW",
    BNDB:"DB",
    BNVB:"VB",
    BNFM:"FB",
  };
  return map[ref] || ref || "—";
}

/* Duration formatter for UFN (minutes or hours) */
function durationSince(startDate){
  if(!startDate) return null;
  const now = new Date();
  const diffMs = now - startDate;
  if(diffMs < 60*1000) return "less than a minute";
  const mins = Math.floor(diffMs / 60000);
  if(mins < 60) return `${mins} minute${mins === 1 ? "" : "s"}`;
  const hours = Math.floor(mins / 60);
  return `${hours} hour${hours === 1 ? "" : "s"}`;
}

/* --- Relative time formatter (EOS rules + UFN duration) --- */
function validityTimeLabel(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

  function formatPart(d, isStart){
    // If no time:
    if(!d) return isStart ? null : "🛑 UFN";

    const sameDay = d.toDateString() === now.toDateString();

    // Local week bounds (Mon–Sun)
    const startWeek = new Date(now);
    startWeek.setDate(now.getDate() - ((now.getDay() + 6) % 7)); // Monday
    startWeek.setHours(0,0,0,0);
    const endWeek = new Date(startWeek);
    endWeek.setDate(startWeek.getDate() + 6);
    endWeek.setHours(23,59,59,999);

    const inWeek = d >= startWeek && d <= endWeek;

    // 23:59 => EOS logic
    const is2359 = d.getHours() === 23 && d.getMinutes() === 59;
    if(is2359){
      if(sameDay){
        return (isStart ? "🕛 " : "🛑 ") + "End of Service";
      } else {
        if(inWeek){
          const wd = new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(d);
          return (isStart ? "🕛 " : "🛑 ") + `EOS ${wd}`;
        } else {
          const dm = new Intl.DateTimeFormat(undefined,{day:'2-digit',month:'short'}).format(d);
          return (isStart ? "🕛 " : "🛑 ") + `EOS ${dm}`;
        }
      }
    }

    // Non-EOS normal formatting
    const time = fmtHM(d);
    let label;
    if(sameDay){
      label = `${time} Today`;
    } else if(inWeek){
      const wd = new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(d);
      label = `${wd} ${time}`;
    } else {
      const dm = new Intl.DateTimeFormat(undefined,{day:'2-digit',month:'short'}).format(d);
      label = `${dm} ${time}`;
    }
    return (isStart ? "🕛 " : "🛑 ") + label;
  }

  const startTxt = formatPart(s, true);
  const hasEnd = !!e;
  const endTxt   = hasEnd ? formatPart(e, false) : null;

  if(startTxt && endTxt){
    return `${startTxt}\n${endTxt}`;
  }
  if(startTxt && !hasEnd){
    // No end time → explicit UFN + duration since start
    const dur = durationSince(s);
    const tail = dur ? ` - diverted for ${dur}` : "";
    return `${startTxt}\n🛑 UFN${tail}`;
  }
  if(!startTxt && endTxt){
    return `${endTxt}`;
  }
  // If completely missing, still show generic UFN
  return "🛑 UFN";
}

/* Window: only include incidents whose start OR end is within ±7 days of today */
function isWithin7DayWindow(sit){
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
  const endOfToday   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59,999);

  const windowStart = new Date(startOfToday.getTime() - 7*24*60*60*1000);
  const windowEnd   = new Date(endOfToday.getTime()   + 7*24*60*60*1000);

  const inWindow = d => d && d >= windowStart && d <= windowEnd;
  return inWindow(s) || inWindow(e);
}

/* OperatorRef extraction & class */
function getOperatorRef(sit){
  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
  if(Array.isArray(avj) && avj.length && avj[0]?.OperatorRef) return String(avj[0].OperatorRef);
  if(avj && avj.OperatorRef) return String(avj.OperatorRef);
  if(sit?.OperatorRef) return String(sit.OperatorRef);
  if(sit?.__operatorRefs && sit.__operatorRefs.length) return String(sit.__operatorRefs[0]);
  return null;
}

function operatorClass(ref){
  switch((ref||"").toUpperCase()){
    case "BNML": return {cls:"op-BNML", dark:false};
    case "BNGN": return {cls:"op-BNGN", dark:true};
    case "BNSM": return {cls:"op-BNSM", dark:false};
    case "BNDB": return {cls:"op-BNDB", dark:false};
    case "BNVB": return {cls:"op-BNVB", dark:true};
    case "BNFM": return {cls:"op-BNFM", dark:false};
    default: return {cls:"", dark:true};
  }
}

/* Keys */
function situationKey(sit){
  if(sit.SituationNumber) return "id:" + sit.SituationNumber;
  if(sit.SituationRef)   return "ref:" + sit.SituationRef;
  if(sit.ParticipantRef) return "p:" + sit.ParticipantRef;
  const op = getOperatorRef(sit) || "";
  const ln = (sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef || "").toString();
  const st = sit?.ValidityPeriod?.StartTime || sit?.StartTime || "";
  const sum = (sit?.Summary || sit?.Description || "").toString().slice(0,120);
  return `k:${op}|${ln}|${st}|${sum}`;
}

/* Filters */
function isDiversion(sit){
  const txt = (sit.Description || sit.Summary || "").toLowerCase();
  return DIVERSION_MATCHERS.some(k => txt.includes(k));
}
function isCurrentlyValid(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
  if(!s) return false;
  if(s > now) return false;
  if(e && e < now) return false;
  return true;
}
function isUnplanned(sit){
  const p = sit?.Planned;
  if(p === false) return true;
  if(typeof p === "string" && p.trim().toLowerCase() === "false") return true;
  return false;
}

/* Extractors */
function extractSituationsFromJSON(json){
  const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
  if(!sd) return [];
  const sed = Array.isArray(sd.SituationExchangeDelivery)
    ? sd.SituationExchangeDelivery
    : [sd.SituationExchangeDelivery].filter(Boolean);
  const out=[];
  for(const d of sed){
    const pe = d?.Situations?.PtSituationElement;
    if(Array.isArray(pe)) out.push(...pe);
    else if(pe) out.push(pe);
  }
  return out;
}
function extractSituationsFromXML(doc){
  const els = [...doc.querySelectorAll("PtSituationElement")];
  return els.map(el=>{
    const T = s => el.querySelector(s)?.textContent?.trim() || null;
    const opsRef = [...el.querySelectorAll("AffectedVehicleJourney > OperatorRef, OperatorRef")]
                    .map(n=>n.textContent.trim()).filter(Boolean);
    const lines  = [...el.querySelectorAll("AffectedVehicleJourney > LineRef, PublishedLineName, LineName")]
                    .map(n=>n.textContent.trim()).filter(Boolean);
    return {
      Summary: T("Summary") || T("Description"),
      Description: T("Description"),
      Severity: T("Severity") || "unknown",
      Planned: T("Planned"),
      SituationNumber: T("SituationNumber") || T("SituationRef"),
      ParticipantRef: T("ParticipantRef"),
      ValidityPeriod: {
        StartTime: T("ValidityPeriod > StartTime") || T("StartTime"),
        EndTime:   T("ValidityPeriod > EndTime")   || T("EndTime"),
      },
      CreationTime: T("CreationTime") || T("RecordedAtTime") || T("VersionedAtTime"),
      Affects: {
        VehicleJourneys: {
          AffectedVehicleJourney: (opsRef.length || lines.length)
            ? [{ OperatorRef: opsRef[0], LineRef: lines[0] }]
            : []
        }
      },
      __operatorRefs: opsRef
    };
  });
}

/* -------- Paging -------- */
const pager={pages:[],pageIndex:0,pageSize:6,total:0,timer:null}; // always 6 (3×2)

/* Fit exactly 2 rows vertically by setting --cardHeight */
function setFixedGridSizing(){
  const main = document.querySelector("main");
  const grid = document.getElementById("grid");
  const gridStyles = getComputedStyle(grid);
  const gap = parseInt(gridStyles.gap) || 20;

  // Prefer the actual grid content height (accounts for margins/padding/flex)
  let gridAvail = grid.clientHeight;

  // If layout not settled yet (clientHeight=0), fallback to a robust calc
  if(!gridAvail){
    const mainRect = main.getBoundingClientRect();
    const gridRect = grid.getBoundingClientRect();
    const mainStyles = getComputedStyle(main);
    const pb = parseInt(mainStyles.paddingBottom) || 0;
    gridAvail = Math.max(0, Math.floor(mainRect.bottom - gridRect.top - pb));
  }

  // Two rows => subtract one gap between them
  const cardH = Math.max(200, Math.floor((gridAvail - gap) / 2));
  document.documentElement.style.setProperty("--cardHeight", cardH + "px");
}

function renderPage(){
  const grid = document.getElementById("grid");
  const pg = pager.pages[pager.pageIndex] || [];
  grid.innerHTML = "";

  for(const it of pg){
    const oc = operatorClass(it.operatorRef);

    const chip = document.createElement("div");
    chip.className = "chip " + oc.cls;

    const inner = document.createElement("div");
    inner.className = "chipContent " + (oc.dark ? "on-dark" : "");

    // Header
    const header = document.createElement("div");
    header.className = "chipHeader";

    const r = document.createElement("div");
    r.className = "route";
    r.textContent = it.route;

    const opTag = document.createElement("div");
    opTag.className = "operatorTag";
    opTag.title = (it.operatorRef || "").toUpperCase(); // show full ref on hover
    const dot = document.createElement("span");
    dot.className = "operatorDot";
    // tint operator dot
    const opColour = {
      BNML: "var(--op-BNML)", BNGN: "var(--op-BNGN)", BNSM: "var(--op-BNSM)",
      BNDB: "var(--op-BNDB)", BNVB: "var(--op-BNVB)", BNFM: "var(--op-BNFM)"
    }[(it.operatorRef || "").toUpperCase()];
    if(opColour) dot.style.background = opColour;
    // short label mapping
    const shortLabel = operatorShortLabel(it.operatorRef);
    opTag.append(dot, document.createTextNode(shortLabel));

    header.append(r, opTag);

    // Summary (exactly 2 lines reserved)
    const s = document.createElement("div");
    s.className = "summary";
    s.textContent = it.summary || "";

    // Validity
    const v = document.createElement("div");
    v.className = "validityTime";
    v.textContent = it.validity;

    inner.append(header, s, v);
    chip.append(inner);
    grid.append(chip);
  }
}

function startPager(){
  if(pager.timer) clearInterval(pager.timer);
  if(pager.pages.length <= 1) return;
  pager.timer = setInterval(()=>{
    pager.pageIndex = (pager.pageIndex + 1) % pager.pages.length;
    renderPage();
    setStatusPill(true);
  }, PAGE_INTERVAL_MS);
}

/* -------- Fetch & Render -------- */
async function fetchAll(){
  try{
    const res = await fetch(BODS_URL, { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    let parsed;
    try{
      parsed = { type:"json", data: await res.clone().json() };
    }catch{
      parsed = { type:"xml", data: (new DOMParser()).parseFromString(await res.text(),"application/xml") };
    }

    let situations = parsed.type==="json"
      ? extractSituationsFromJSON(parsed.data)
      : extractSituationsFromXML(parsed.data);

    /* Strict operator filter */
    situations = situations.filter(sit=>{
      const ref = getOperatorRef(sit);
      return ref && BEE_OPERATORS.includes(ref.toUpperCase());
    });

    /* Diversions only */
    situations = situations.filter(isDiversion);

    /* Only currently valid */
    situations = situations.filter(isCurrentlyValid);

    /* Only if start or end is within ±7 days of today */
    situations = situations.filter(isWithin7DayWindow);

    /* Only unplanned (default on) */
    if(UNPLANNED_ONLY) {
      situations = situations.filter(isUnplanned);
    }

    /* Map to items */
    const items = situations.map(s=>{
      const route = s?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef || "?";
      const opRef = getOperatorRef(s) || "";
      const st = parseISO(s?.ValidityPeriod?.StartTime || s?.StartTime);
      const en = parseISO(s?.ValidityPeriod?.EndTime   || s?.EndTime);

      return {
        key: situationKey(s),
        route: String(route),
        operatorRef: opRef,
        validity: validityTimeLabel(s),
        summary: (s.Summary || s.Description || "").trim(),
        startMs: st ? st.getTime() : 0,
        endMs: en ? en.getTime() : null
      };
    })
    /* Sort: most recently started first */
    .sort((a,b)=> b.startMs - a.startMs);

    /* Page building: fixed 6 per page for 3×2 grid */
    pager.pageSize = 6;
    pager.pages = chunk(items, pager.pageSize);
    pager.pageIndex = 0;
    pager.total = items.length;

    // Size cards so two rows fit perfectly, then render
    requestAnimationFrame(()=>{
      setFixedGridSizing();
      renderPage();
      startPager();
      setStatusPill(true);
    });
  }catch(e){
    console.error(e);
    setStatusPill(false);
  }
}

/* Utility: chunk array */
function chunk(arr,size){
  const out=[];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out.length?out:[[]];
}

/* Start */
fetchAll();
setInterval(fetchAll, 60000);

window.addEventListener("resize", ()=>{
  // Maintain fixed 3×2 layout sizing on any resize
  requestAnimationFrame(()=>{
    setFixedGridSizing();
    const flat = (pager.pages || []).flat();
    pager.pageSize = 6;
    pager.pages = chunk(flat, pager.pageSize);
    pager.pageIndex = 0;
    renderPage();
    startPager();
  });
});

// Initial sizing once DOM is ready
window.addEventListener("load", ()=> requestAnimationFrame(setFixedGridSizing) );
</script>
</body>
</html>
