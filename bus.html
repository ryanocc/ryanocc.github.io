<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Bus Diversions</title>
<meta http-equiv="Cache-Control" content="no-store" />
<style>
  :root{
    --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;
    --chipBorder:#22232b;

    /* Operator colours */
    --op-BNML:#ff4d4f;   /* red */
    --op-BNGN:#3a7afe;   /* blue */
    --op-BNSM:#ff9a1f;   /* orange */
    --op-BNDB:#ffffff;   /* white */
    --op-BNVB:#7a3ffe;   /* purple */
    --op-BNFM:#ff66b3;   /* pink */

    --neutral:#23232b;
    --accent:#ffd100;       /* yellow route badge */
    --accentGlow: rgba(255,209,0,0.45);
    --accentGlowStrong: rgba(255,209,0,0.85);

    /* Status pill colours */
    --liveGreen:#19c37d;
    --errorRed:#ff4d4f;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; padding:0; background:var(--bg);
    color:var(--text);
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    overflow:hidden;
  }

  /* ----------- MODERN HEADER ----------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px;
    background:#0b0b0e;
    border-bottom:1px solid #1d1d25;
  }
  .title{
    margin:0;
    font-size:34px;
    font-weight:900;
    letter-spacing:-0.5px;
  }
  .status-pill{
    padding:9px 18px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    background:var(--liveGreen);
    color:#000;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08),
               0 4px 14px rgba(0,0,0,0.25);
    transition:background .2s ease,color .2s ease;
  }
  .status-error{
    background:var(--errorRed);
    color:#fff;
  }

  main{
    padding:0 28px 28px;
    display:flex;
    flex-direction:column;
    height:calc(100vh - 84px);
  }

  /* Hide old status bar completely */
  #statusBar{ display:none; }

  /* ----------- GRID ----------- */
  #grid{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
    flex:1;
    overflow:hidden;
  }

  .chip{
    position:relative;
    border:2px solid var(--chipBorder);
    background:var(--neutral);
    border-radius:18px;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    transition:border .2s ease, box-shadow .2s ease;
  }

  .chipContent{
    text-align:center;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .route{
    display:inline-block;
    font-size:46px;
    font-weight:900;
    background:var(--accent);
    color:#000;
    padding:6px 14px;
    border-radius:10px;
    margin-bottom:14px;
  }

  /* Stacked times */
  .validityTime{
    font-size:17px;
    font-weight:800;
    line-height:1.25;
    white-space:nowrap;
    margin-bottom:10px;
  }

  .summary{
    font-size:14px;
    line-height:1.2;
    opacity:0.85;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    max-width:92%;
    margin:0 auto;
  }

  /* Dark inversion */
  .on-dark .validityTime,
  .on-dark .summary{
    color:white;
  }

  /* ----------- GLOW FOR UFN ----------- */
  .glow-ufn{
    border-color:var(--accent);
    box-shadow:0 0 12px 4px var(--accentGlowStrong),
               0 0 28px 10px var(--accentGlow);
  }

  /* ----------- PULSE FOR NEW ----------- */
  @keyframes pulseRing {
    0%   { box-shadow:0 0 0 2px var(--accent),0 0 8px 2px var(--accentGlow); }
    50%  { box-shadow:0 0 0 2px rgba(255,209,0,0.7),0 0 18px 7px var(--accentGlowStrong); }
    100% { box-shadow:0 0 0 2px var(--accent),0 0 8px 2px var(--accentGlow); }
  }
  .pulse-new{
    border-color:var(--accent);
    animation:pulseRing 2s ease-in-out infinite;
  }

  /* Operator colours */
  .op-BNML{ background:var(--op-BNML); }
  .op-BNGN{ background:var(--op-BNGN); }
  .op-BNSM{ background:var(--op-BNSM); }
  .op-BNDB{ background:var(--op-BNDB); border-color:#dcdcdc; }
  .op-BNVB{ background:var(--op-BNVB); }
  .op-BNFM{ background:var(--op-BNFM); }
  .neutral-dark{ background:var(--neutral); }
  .op-BNGN .chipContent,
  .op-BNVB .chipContent,
  .neutral-dark .chipContent{
    color:white;
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="title">Live Bus Diversions</h1>
  <div id="statusPill" class="status-pill">Live • --:--:--</div>
</header>

<main>
  <div id="grid"></div>
</main>

<script>
/* ===========================
   CONFIG
=========================== */
const API_KEY = "17889546a31fddeef67fca78252fb66951aedf1a";
const BODS_URL =
`https://occproxy-6dem.vercel.app/api/proxy?url=https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;

const UNPLANNED_ONLY = true;
const PAGE_INTERVAL_MS = 10000;
const HIGHLIGHT_WINDOW_MS = 5 * 60 * 1000;

const DIVERSION_MATCHERS = ["divert","diversion","diversions"];
const BEE_MATCHERS = ["bee network","bee network -","bee network–","bee network —"];

/* Track new chips */
const firstSeenMap = new Map();

/* Query helpers */
const $ = s => document.querySelector(s);

/* Time formatting */
function fmtFull(d){
  return new Intl.DateTimeFormat(undefined,
    {hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d);
}
function fmtHM(d){
  return new Intl.DateTimeFormat(undefined,
    {hour:"2-digit",minute:"2-digit"}).format(d);
}
const parseISO = s => s ? new Date(s) : null;

/* Status pill setter */
function setStatusPill(ok){
  const pill = $("#statusPill");
  const t = fmtFull(new Date());
  if(ok){
    pill.classList.remove("status-error");
    pill.textContent = `Live • ${t}`;
  } else {
    pill.classList.add("status-error");
    pill.textContent = `Error • ${t}`;
  }
}

/* --- Format start/end times with stacked layout --- */
function formatRelativeHM(d, now=new Date()){
  if(!d) return null;

  const sameDay = d.toDateString() === now.toDateString();
  const timeHM = dt => fmtHM(dt);
  const weekday = dt =>
    new Intl.DateTimeFormat(undefined,{weekday:"short"}).format(dt);
  const dateDM = dt =>
    new Intl.DateTimeFormat(undefined,{day:"2-digit",month:"short"}).format(dt);

  // Week start = Monday
  const startWeek = new Date(now);
  startWeek.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  startWeek.setHours(0,0,0,0);

  const endWeek = new Date(startWeek);
  endWeek.setDate(startWeek.getDate() + 6);
  endWeek.setHours(23,59,59,999);

  const inWeek = d >= startWeek && d <= endWeek;

  if(sameDay) return timeHM(d);
  if(inWeek) return `${weekday(d)} ${timeHM(d)}`;
  return `${dateDM(d)} ${timeHM(d)}`;
}

function validityTimeLabel(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime || sit?.EndTime);

  const S = formatRelativeHM(s, now);
  const E = formatRelativeHM(e, now);

  if(S && E) return `${S}\n${E}`;
  if(S && !E) return `${S}\nUFN`;
  if(!S && E) return `Until\n${E}`;
  return "—";
}

/* Operator colour */
function operatorClass(ref){
  switch((ref||"").toUpperCase()){
    case "BNML": return {cls:"op-BNML", dark:false};
    case "BNGN": return {cls:"op-BNGN", dark:true};
    case "BNSM": return {cls:"op-BNSM", dark:false};
    case "BNDB": return {cls:"op-BNDB", dark:false};
    case "BNVB": return {cls:"op-BNVB", dark:true};
    case "BNFM": return {cls:"op-BNFM", dark:false};
    default: return {cls:"neutral-dark", dark:true};
  }
}

/* Situation key (stable ID) */
function situationKey(sit){
  if(sit.SituationNumber) return "id:" + sit.SituationNumber;
  if(sit.ParticipantRef) return "p:" + sit.ParticipantRef;
  const op = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.OperatorRef || "";
  const ln = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef || "";
  const st = sit?.StartTime || "";
  return `k:${op}|${ln}|${st}`;
}

/* Filters */
function isDiversion(sit){
  const txt = (sit.Description||sit.Summary||"").toLowerCase();
  return DIVERSION_MATCHERS.some(k => txt.includes(k));
}
function isCurrentlyValid(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime || sit?.EndTime);
  if(!s) return false;
  if(s > now) return false;
  if(e && e < now) return false;
  return true;
}
function isUnplanned(sit){
  const p = sit.Planned;
  if(p === false) return true;
  if(typeof p==="string" && p.trim().toLowerCase()==="false") return true;
  return false;
}

/* Extractors work unchanged — omitted here for brevity in explanation */
/* BUT they are included in the final code below */

function extractSituationsFromJSON(json){
  const sd=json.ServiceDelivery||json.Siri?.ServiceDelivery||json.SIRI?.ServiceDelivery||json;
  if(!sd) return [];
  const sed=Array.isArray(sd.SituationExchangeDelivery)?
    sd.SituationExchangeDelivery:[sd.SituationExchangeDelivery].filter(Boolean);
  const out=[];
  for(const d of sed){
    const pe=d?.Situations?.PtSituationElement;
    if(Array.isArray(pe)) out.push(...pe);
    else if(pe) out.push(pe);
  }
  return out;
}
function extractSituationsFromXML(doc){
  const items=[...doc.querySelectorAll("PtSituationElement")].map(el=>{
    const T=n=>el.querySelector(n)?.textContent.trim()||null;
    const ops=[...el.querySelectorAll("AffectedVehicleJourney > OperatorName,OperatorName")].map(n=>n.textContent.trim()).filter(Boolean);
    const opsRef=[...el.querySelectorAll("AffectedVehicleJourney > OperatorRef,OperatorRef")].map(n=>n.textContent.trim()).filter(Boolean);
    const lines=[...el.querySelectorAll("AffectedVehicleJourney > LineRef,PublishedLineName,LineName")].map(n=>n.textContent.trim()).filter(Boolean);
    const places=[...el.querySelectorAll("AffectedStopPoint > StopPointName,AffectedStopPoint > PlaceName")].map(n=>n.textContent.trim()).filter(Boolean);

    return {
      Summary:T("Summary")||T("Description"),
      Description:T("Description"),
      Severity:T("Severity")||"unknown",
      Planned:T("Planned"),
      SituationNumber:T("SituationNumber"),
      ParticipantRef:T("ParticipantRef"),
      ValidityPeriod:{
        StartTime:T("ValidityPeriod > StartTime")||T("StartTime"),
        EndTime:T("ValidityPeriod > EndTime")||T("EndTime")
      },
      CreationTime:T("CreationTime")||T("RecordedAtTime"),
      Affects:{
        VehicleJourneys:{
          AffectedVehicleJourney:[
            {OperatorRef:opsRef[0], OperatorName:ops[0], LineRef:lines[0]}
          ]
        }
      }
    };
  });
  return items;
}

/* Pager */
const pager={pages:[],pageIndex:0,pageSize:0,total:0,timer:null};

function computePageSize(){
  const topH=$(".topbar").getBoundingClientRect().height;
  const pad=40;
  const avail=window.innerHeight-(topH+pad);
  const grid=$("#grid");
  const w=grid.clientWidth||window.innerWidth;

  const minW=220, gap=20;
  const cols=Math.max(1, Math.floor((w+gap)/(minW+gap)));
  const cardSize=Math.max(minW, Math.floor((w-(cols-1)*gap)/cols));
  const rows=Math.max(1, Math.floor((avail+gap)/(cardSize+gap)));
  return cols*rows;
}

function chunk(arr,size){
  const out=[];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out.length?out:[[]];
}

function renderPage(){
  const grid=$("#grid");
  const now=Date.now();
  const pg=pager.pages[pager.pageIndex]||[];
  grid.innerHTML="";

  for(const it of pg){
    const oc=operatorClass(it.operatorRef);
    const chip=document.createElement("div");
    chip.className="chip "+oc.cls;

    if(!it.endMs) chip.classList.add("glow-ufn");
    if(it.firstSeen && now-it.firstSeen < HIGHLIGHT_WINDOW_MS)
      chip.classList.add("pulse-new");

    const inner=document.createElement("div");
    inner.className="chipContent "+(oc.dark?"on-dark":"");

    const r=document.createElement("div");
    r.className="route";
    r.textContent=it.route;

    const v=document.createElement("div");
    v.className="validityTime";
    v.innerHTML=it.validity.replace(/\n/g,"<br>");

    const s=document.createElement("div");
    s.className="summary";
    s.textContent=it.summary;

    inner.append(r,v,s);
    chip.append(inner);
    grid.append(chip);
  }
}

/* Auto pager */
function startPager(){
  if(pager.timer) clearInterval(pager.timer);
  if(pager.pages.length<=1) return;
  pager.timer=setInterval(()=>{
    pager.pageIndex=(pager.pageIndex+1)%pager.pages.length;
    renderPage();
    setStatusPill(true);
  }, PAGE_INTERVAL_MS);
}

/* Main fetch */
async function fetchAll(){
  try{
    const res=await fetch(BODS_URL,{cache:"no-store"});
    let parsed;
    try{ parsed={type:"json",data:await res.clone().json()}; }
    catch{ parsed={type:"xml",data:(new DOMParser()).parseFromString(await res.text(),"application/xml")}; }

    let sits = parsed.type==="json"
      ? extractSituationsFromJSON(parsed.data)
      : extractSituationsFromXML(parsed.data);

    /* Filter */
    sits=sits.filter(isDiversion)
             .filter(isCurrentlyValid);
    if(UNPLANNED_ONLY) sits=sits.filter(isUnplanned);

    /* Map */
    const now=Date.now();
    const items=sits.map(s=>{
      const key=situationKey(s);
      if(!firstSeenMap.has(key))
        firstSeenMap.set(key, now);

      const route=s?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef || "?";
      const ref=s?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.OperatorRef || "";
      const st=parseISO(s?.ValidityPeriod?.StartTime);
      const en=parseISO(s?.ValidityPeriod?.EndTime);

      return {
        key,
        route,
        operatorRef:ref,
        validity:validityTimeLabel(s),
        summary:(s.Summary||s.Description||"").trim(),
        startMs:st?st.getTime():0,
        endMs:en?en.getTime():null,
        firstSeen:firstSeenMap.get(key)
      };
    })
    .sort((a,b)=>b.startMs - a.startMs);

    pager.pageSize=computePageSize();
    pager.pages=chunk(items,pager.pageSize);
    pager.pageIndex=0;
    pager.total=items.length;

    renderPage();
    startPager();
    setStatusPill(true);
  }
  catch(e){
    console.error(e);
    setStatusPill(false);
  }
}

/* Start */
fetchAll();
setInterval(fetchAll,60000);

window.addEventListener("resize",()=>{
  const flat=pager.pages.flat();
  pager.pageSize=computePageSize();
  pager.pages=chunk(flat,pager.pageSize);
  pager.pageIndex=0;
  renderPage();
  startPager();
});

</script>
</body>
</html>
