<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Bus Diversions</title>
  <meta http-equiv="Cache-Control" content="no-store" />

  <!-- Font: Barlow Semi Condensed -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;

      /* Operator colours (dots in pill stay neutral per Option A) */
      --op-BNML:#ff4d4f;   /* red */
      --op-BNGN:#3a7afe;   /* blue */
      --op-BNSM:#ff9a1f;   /* orange */
      --op-BNDB:#ffffff;   /* white */
      --op-BNVB:#7a3ffe;   /* purple */
      --op-BNFM:#ff66b3;   /* pink */

      --neutral:#16161b;
      --neutralElev:#1b1b22;
      --accent:#ffd100;       /* route badge */

      /* Status pill colours */
      --liveGreen:#19c37d;
      --errorRed:#ff4d4f;

      /* Grid/card */
      --gridGap:20px;
      --cardRadius:24px;
      --cardHeight: 420px; /* JS sets exact value */

      /* Summary metrics */
      --summary-line-height: 1.3;

      /* Route ticker sizing */
      --route-font: clamp(44px, 5.6vw, 80px);
      --route-pad-v: 8px;
      --route-pad-h: 16px;
      --route-radius: 12px;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0; padding:0; background:var(--bg);
      color:var(--text);
      font-family:"Barlow Semi Condensed", system-ui, sans-serif;
      overflow:hidden; /* no page scroll */
    }

    /* ----------- HEADER ----------- */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 24px;
      background:#0b0b0e;
      border-bottom:1px solid #1d1d25;
    }
    .title{
      margin:0;
      font-size:56px;        /* control-room size */
      font-weight:900;
      letter-spacing:-0.3px;
    }
    .status-pill{
      padding:10px 16px;
      border-radius:999px;
      font-size:18px;
      font-weight:800;
      background:var(--liveGreen);
      color:#000;
      box-shadow:0 0 0 2px rgba(255,255,255,0.08),
                 0 4px 14px rgba(0,0,0,0.25);
      transition:background .2s ease,color .2s ease;
    }
    .status-error{
      background:var(--errorRed);
      color:#fff;
    }

    main{
      padding:0 24px 24px; /* bottom padding only */
      display:flex;
      flex-direction:column;
      height:100vh; /* F11/kiosk */
    }

    /* ----------- FIXED 3×2 GRID ----------- */
    #grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(3, 1fr);  /* 3 wide */
      gap:var(--gridGap);
      flex:1;
      height:100%;
      overflow:hidden; /* keep grid non-scroll */
    }

    /* ----------- CARD ----------- */
    .chip{
      position:relative;
      border:3px solid #2a2a33;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.00) 60%),
        var(--neutralElev);
      border-radius:var(--cardRadius);
      display:flex;
      flex-direction:column;
      padding:24px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 10px 25px rgba(0,0,0,0.35),
        0 6px 18px rgba(0,0,0,0.45);
      height:var(--cardHeight);
      min-height:var(--cardHeight);
      max-height:var(--cardHeight);
      overflow:hidden; /* ensure uniform sizing; no overflow lines */
    }
    .chip:hover{
      transform:translateY(-1px);
      transition:transform .15s ease;
    }

    /* Header: ROUTE TICKER + operator pill */
    .chipHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:16px;
      width:100%;
    }

    /* ROUTE TICKER: single-line viewport, slides full-width pages */
    .routesTicker{
      position:relative;
      overflow:hidden;
      width:100%;
      max-width:100%;
      flex:1 1 auto;
    }
    .routesTrack{
      display:flex;
      flex-wrap:nowrap;
      will-change:transform;
      transform:translateX(0%);
    }
    .routeSlide{
      flex: 0 0 100%;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start; /* left align */
    }
    .route{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      background:var(--accent);
      color:#000;
      padding:var(--route-pad-v) var(--route-pad-h);
      border-radius:var(--route-radius);
      letter-spacing:-0.5px;
      line-height:1;
      min-width:3ch;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-size:var(--route-font);
    }

    /* Operator pill (Option A: one neutral dot + comma-separated codes) */
    .operatorTag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      border:2px solid rgba(255,255,255,0.18);
      font-size:28px;
      font-weight:800;
      color:#e6e6ee;
      white-space:nowrap;   /* keep on one line */
      flex-shrink:0;
    }
    .operatorDot{
      width:18px; height:18px; border-radius:50%;
      background:#cfcfd6; /* neutral grey dot */
      box-shadow:0 0 0 2px rgba(0,0,0,0.25) inset;
      display:inline-block;
      flex-shrink:0;
    }

    /* Body: EXACTLY TWO LINES (truncate or leave spacer) */
    .summary{
      font-size:clamp(26px, 2.6vw, 32px);
      line-height: var(--summary-line-height);
      color:var(--text);
      opacity:0.95;

      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      overflow:hidden;

      min-height: calc(2 * var(--summary-line-height) * 1em);
      max-height: calc(2 * var(--summary-line-height) * 1em);

      margin:6px 2px 12px 2px;
    }

    /* Footer: time lines (each one line) */
    .times{
      margin-top:auto;
      padding-top:12px;
      border-top:2px solid rgba(255,255,255,0.15);
    }
    .timeLine{
      font-size:clamp(24px, 2.2vw, 30px);
      font-weight:900;
      color:#d9d9e2;
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;  /* ensure one-line, no overflow */
    }

    /* Optional subtle operator tints (backgrounds) */
    .op-BNML{ background:linear-gradient(180deg, rgba(255,77,79,0.08), transparent), var(--neutralElev); }
    .op-BNGN{ background:linear-gradient(180deg, rgba(58,122,254,0.10), transparent), var(--neutralElev); }
    .op-BNSM{ background:linear-gradient(180deg, rgba(255,154,31,0.10), transparent), var(--neutralElev); }
    .op-BNDB{ background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.16)); border-color:#dcdcdc; color:#000; }
    .op-BNVB{ background:linear-gradient(180deg, rgba(122,63,254,0.12), transparent), var(--neutralElev); }
    .op-BNFM{ background:linear-gradient(180deg, rgba(255,102,179,0.12), transparent), var(--neutralElev); }
  </style>
</head>
<body>

  <header class="topbar">
    <h1 class="title">Live Bus Diversions</h1>
    <div id="statusPill" class="status-pill">Live • --:--:--</div>
  </header>

  <main>
    <div id="grid"></div>
  </main>

  <script>
    /* ===========================
       CONFIG
    =========================== */
    const API_KEY = "17889546a31fddeef67fca78252fb66951aedf1a";
    const BODS_URL =
      `https://occproxy-6dem.vercel.app/api/proxy?url=https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;

    /* TfGM Bee Network operator refs (strict) */
    const BEE_OPERATORS = ["BNML","BNGN","BNSM","BNDB","BNVB","BNFM"];

    /* Behaviour flags */
    const UNPLANNED_ONLY = true;
    const PAGE_INTERVAL_MS = 10000; // page dwell (10s)
    const FEED_REFRESH_MS = 60000;  // feed refresh (60s)
    const ROUTE_SLIDE_EASE_MS = 400; // slide animation

    /* Diversion keyword matching */
    const DIVERSION_MATCHERS = ["divert","diversion","diversions"];

    /* Track ticker timers */
    let routeTickerTimers = [];
    let pagerTimer = null;

    /* Helpers */
    const $ = s => document.querySelector(s);
    const parseISO = s => s ? new Date(s) : null;

    function fmtFull(d){
      return new Intl.DateTimeFormat(undefined,
        {hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d);
    }
    function fmtHM(d){
      return new Intl.DateTimeFormat(undefined,
        {hour:"2-digit",minute:"2-digit"}).format(d);
    }
    function setStatusPill(ok){
      const pill = $("#statusPill");
      const t = fmtFull(new Date());
      if(ok){
        pill.classList.remove("status-error");
        pill.textContent = `Live • ${t}`;
      } else {
        pill.classList.add("status-error");
        pill.textContent = `Error • ${t}`;
      }
    }

    /* Operator short-code mapping */
    const OP_MAP = {
      BNML:"ML",
      BNGN:"GNW",
      BNSM:"SCM",
      BNDB:"DB",
      BNVB:"VB",
      BNFM:"FB",
      // Add other non-BN mappings here if needed
    };
    function mapOperators(list){
      return list.map(ref => OP_MAP[ref] || ref);
    }

    /* Collect *all* operator refs (deduped) */
    function getOperatorRefs(sit){
      const refs = new Set();
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      const add = v => { if (v) refs.add(String(v).trim().toUpperCase()); };

      if(Array.isArray(avj)){
        for(const j of avj) add(j?.OperatorRef);
      } else if(avj){
        add(avj?.OperatorRef);
      }
      if(Array.isArray(sit.__operatorRefs)){
        sit.__operatorRefs.forEach(add);
      }
      return [...refs];
    }

    /* Collect line refs (deduped) */
    function getLineRefs(sit){
      const lines = new Set();
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;

      const pushVal = (val)=>{
        if(val == null) return;
        const s = String(val).trim();
        if(s) lines.add(s);
      };

      if(Array.isArray(avj)){
        for(const j of avj){
          pushVal(j?.LineRef || j?.PublishedLineName || j?.LineName);
        }
      }else if(avj){
        pushVal(avj?.LineRef || avj?.PublishedLineName || avj?.LineName);
      }
      if(Array.isArray(sit.__lineRefs)){
        for(const v of sit.__lineRefs) pushVal(v);
      }
      if(lines.size === 0){
        const fallback = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef;
        if(fallback) pushVal(fallback);
      }
      return Array.from(lines);
    }

    /* UFN duration phrasing (m / hr / hrs) */
    function ufnDurationPhrase(startDate){
      if(!startDate) return "less than a minute";
      const now = new Date();
      const diffMs = now - startDate;
      if(diffMs < 60000) return "less than a minute";
      const mins = Math.floor(diffMs / 60000);
      if(mins < 60) return `${mins} m`;
      const hours = Math.floor(mins / 60);
      return `${hours} ${hours === 1 ? "hr" : "hrs"}`;
    }

    /* Day/Date label rules */
    function dayDateLabel(d){
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startOfGiven = new Date(d.getFullYear(), d.getMonth(), d.getDate());

      const msPerDay = 86400000;
      const dayDiff = Math.round((startOfGiven - startOfToday) / msPerDay);

      if(dayDiff === 0) return "Today";
      if(dayDiff === -1) return "Yesterday";
      if(dayDiff === 1) return "Tomorrow";

      // Week bounds (Mon–Sun)
      const mon = new Date(startOfToday);
      mon.setDate(startOfToday.getDate() - ((startOfToday.getDay() + 6) % 7)); // Monday
      const sun = new Date(mon);
      sun.setDate(mon.getDate() + 6);
      sun.setHours(23,59,59,999);

      if(d >= mon && d <= sun){
        return new Intl.DateTimeFormat(undefined, { weekday: 'short' }).format(d);
      }
      // Otherwise: '2 Feb'
      return new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(d);
    }

    /* Validity lines (🕛 start, 🛑 end/UFN) with requested format */
    function validityLines(sit){
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

      function formatStart(d){
        if(!d) return null;
        const isSoS = d.getHours() === 0 && d.getMinutes() === 0;
        const label = dayDateLabel(d);
        if(isSoS) return `🕛 SoS ${label}`;
        return `🕛 ${fmtHM(d)} ${label}`;
      }
      function formatEnd(d){
        if(!d) return "🛑 UFN"; // placeholder; UFN phrasing replaces this
        const isEoS = d.getHours() === 23 && d.getMinutes() === 59;
        const label = dayDateLabel(d);
        if(isEoS) return `🛑 EoS ${label}`;
        return `🛑 ${fmtHM(d)} ${label}`;
      }

      const hasEnd = !!e;
      if(hasEnd){
        const startLine = formatStart(s);
        const endLine   = formatEnd(e);
        return { startLine, endLine };
      }
      // UFN: ONLY the UFN line, with duration
      const dur = ufnDurationPhrase(s);
      const ufnLine = `🛑 UFN - diverted for ${dur}`;
      return { startLine: null, endLine: ufnLine };
    }

    /* Window filter ±7 days */
    function isWithin7DayWindow(sit){
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
      const endOfToday   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59,999);

      const windowStart = new Date(startOfToday.getTime() - 7*24*60*60*1000);
      const windowEnd   = new Date(endOfToday.getTime()   + 7*24*60*60*1000);

      const inWindow = d => d && d >= windowStart && d <= windowEnd;
      return inWindow(s) || inWindow(e);
    }

    function getOperatorRef(sit){
      // Single-ref fallback (used only for background tint class)
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      if(Array.isArray(avj) && avj.length && avj[0]?.OperatorRef) return String(avj[0].OperatorRef);
      if(avj && avj.OperatorRef) return String(avj.OperatorRef);
      if(sit?.OperatorRef) return String(sit.OperatorRef);
      if(sit?.__operatorRefs && sit.__operatorRefs.length) return String(sit.__operatorRefs[0]);
      return null;
    }

    function operatorClass(ref){
      switch((ref||"").toUpperCase()){
        case "BNML": return {cls:"op-BNML", dark:false};
        case "BNGN": return {cls:"op-BNGN", dark:true};
        case "BNSM": return {cls:"op-BNSM", dark:false};
        case "BNDB": return {cls:"op-BNDB", dark:false};
        case "BNVB": return {cls:"op-BNVB", dark:true};
        case "BNFM": return {cls:"op-BNFM", dark:false};
        default: return {cls:"", dark:true};
      }
    }

    function situationKey(sit){
      if(sit.SituationNumber) return "id:" + sit.SituationNumber;
      if(sit.SituationRef)   return "ref:" + sit.SituationRef;
      if(sit.ParticipantRef) return "p:" + sit.ParticipantRef;
      const op = getOperatorRef(sit) || "";
      const st = sit?.ValidityPeriod?.StartTime || sit?.StartTime || "";
      const sum = (sit?.Summary || sit?.Description || "").toString().slice(0,120);
      return `k:${op}|${st}|${sum}`;
    }

    function isDiversion(sit){
      const txt = (sit.Description || sit.Summary || "").toLowerCase();
      return DIVERSION_MATCHERS.some(k => txt.includes(k));
    }

    function isCurrentlyValid(sit){
      const now = new Date();
      const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
      const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
      if(!s) return false;
      if(s > now) return false;
      if(e && e < now) return false;
      return true;
    }

    function extractSituationsFromJSON(json){
      const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
      if(!sd) return [];
      const sed = Array.isArray(sd.SituationExchangeDelivery)
        ? sd.SituationExchangeDelivery
        : [sd.SituationExchangeDelivery].filter(Boolean);
      const out=[];
      for(const d of sed){
        const pe = d?.Situations?.PtSituationElement;
        if(Array.isArray(pe)) out.push(...pe);
        else if(pe) out.push(pe);
      }
      return out;
    }

    function extractSituationsFromXML(doc){
      const els = [...doc.querySelectorAll("PtSituationElement")];
      return els.map(el=>{
        const T = s => el.querySelector(s)?.textContent?.trim() || null;
        const opsRef = [...el.querySelectorAll("AffectedVehicleJourney > OperatorRef, OperatorRef")]
                        .map(n=>n.textContent.trim()).filter(Boolean);
        const lines  = [...el.querySelectorAll("AffectedVehicleJourney > LineRef, PublishedLineName, LineName")]
                        .map(n=>n.textContent.trim()).filter(Boolean);
        return {
          Summary: T("Summary") || T("Description"),
          Description: T("Description"),
          Severity: T("Severity") || "unknown",
          Planned: T("Planned"),
          SituationNumber: T("SituationNumber") || T("SituationRef"),
          ParticipantRef: T("ParticipantRef"),
          ValidityPeriod: {
            StartTime: T("ValidityPeriod > StartTime") || T("StartTime"),
            EndTime:   T("ValidityPeriod > EndTime")   || T("EndTime"),
          },
          CreationTime: T("CreationTime") || T("RecordedAtTime") || T("VersionedAtTime"),
          Affects: {
            VehicleJourneys: {
              AffectedVehicleJourney: lines.length
                ? lines.map((ln)=>({ OperatorRef: opsRef[0] || null, LineRef: ln }))
                : []
            }
          },
          __operatorRefs: opsRef,
          __lineRefs: lines
        };
      });
    }

    /* -------- Paging -------- */
    const pager={pages:[],pageIndex:0,pageSize:6,total:0};

    function chunk(arr,size){
      const out=[];
      for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
      return out.length?out:[[]];
    }

    /* Fit exactly 2 rows vertically by setting --cardHeight (F11 fullscreen safe) */
    function setFixedGridSizing(){
      const grid = document.getElementById("grid");
      const main = document.querySelector("main");
      const mainStyles = getComputedStyle(main);
      const pb = parseInt(mainStyles.paddingBottom) || 0;

      const gridTop = grid.getBoundingClientRect().top;
      const vh = window.innerHeight; // reliable in F11 fullscreen
      const gridAvail = Math.max(0, Math.floor(vh - pb - gridTop));

      const gap = parseInt(getComputedStyle(grid).gap) || 20;

      // Two rows => subtract one gap between them; add small safety buffer
      const rawH = (gridAvail - gap) / 2;
      const safety = 4; // px to avoid post-font overflow
      const cardH = Math.max(200, Math.floor(rawH) - safety);
      const cur = getComputedStyle(document.documentElement).getPropertyValue("--cardHeight").trim();
      const next = cardH + "px";
      if(cur !== next){
        document.documentElement.style.setProperty("--cardHeight", next);
      }
    }

    function clearRouteTickers(){
      routeTickerTimers.forEach(t=>clearInterval(t));
      routeTickerTimers = [];
    }

    function renderPage(){
      clearRouteTickers();

      const grid = document.getElementById("grid");
      const pg = pager.pages[pager.pageIndex] || [];
      grid.innerHTML = "";

      for(const it of pg){
        const oc = operatorClass(it.singleOpRefForTint);

        const chip = document.createElement("div");
        chip.className = "chip " + oc.cls;

        const inner = document.createElement("div");
        inner.className = "chipContent " + (oc.dark ? "on-dark" : "");

        // Header: route ticker + operator pill (Option A)
        const header = document.createElement("div");
        header.className = "chipHeader";

        // ROUTES TICKER
        const ticker = document.createElement("div");
        ticker.className = "routesTicker";
        ticker.title = (it.routes || []).join(", ");

        const track = document.createElement("div");
        track.className = "routesTrack";

        const routes = Array.isArray(it.routes) && it.routes.length ? it.routes : ["?"];
        routes.forEach(rt=>{
          const slide = document.createElement("div");
          slide.className = "routeSlide";
          const badge = document.createElement("div");
          badge.className = "route";
          badge.textContent = String(rt);
          slide.appendChild(badge);
          track.appendChild(slide);
        });
        ticker.appendChild(track);

        // Operator pill: ● + comma-separated codes
        const opTag = document.createElement("div");
        opTag.className = "operatorTag";
        opTag.title = (it.operatorRefs || []).join(", ");

        const dot = document.createElement("span");
        dot.className = "operatorDot";
        opTag.appendChild(dot);

        const opCodes = mapOperators(it.operatorRefs || []);
        opTag.appendChild(document.createTextNode(" " + (opCodes.length ? opCodes.join(", ") : "—")));

        header.append(ticker, opTag);

        // Summary (exactly 2 lines)
        const s = document.createElement("div");
        s.className = "summary";
        s.textContent = it.summary || "";

        // Times
        const times = document.createElement("div");
        times.className = "times";
        if(it.timeLines.startLine){
          const tStart = document.createElement("div");
          tStart.className = "timeLine";
          tStart.textContent = it.timeLines.startLine;
          times.appendChild(tStart);
        }
        if(it.timeLines.endLine){
          const tEnd = document.createElement("div");
          tEnd.className = "timeLine";
          tEnd.textContent = it.timeLines.endLine;
          times.appendChild(tEnd);
        }

        inner.append(header, s, times);
        chip.append(inner);
        grid.append(chip);

        // Start per-card route ticker
        startRouteTicker(track, routes.length);
      }
    }

    /* Route ticker: slide through all routes within current page dwell once */
    function startRouteTicker(trackEl, count){
      if(!trackEl || count <= 1) return;

      const steps = count;                 // number of slides
      const totalMs = PAGE_INTERVAL_MS;    // total page dwell
      const minPerSlide = 800;             // readability minimum
      const stepMs = Math.max(minPerSlide, Math.floor(totalMs / steps));
      let idx = 0;

      trackEl.style.transition = "none";
      trackEl.style.transform = "translateX(0%)";

      // Defer to allow layout to settle, then animate
      setTimeout(()=>{
        trackEl.style.transition = `transform ${ROUTE_SLIDE_EASE_MS}ms ease-in-out`;

        const timer = setInterval(()=>{
          idx += 1;
          if(idx >= steps){
            clearInterval(timer);
            return;
          }
          const shift = -(idx * 100);
          trackEl.style.transform = `translateX(${shift}%)`;
        }, stepMs);

        routeTickerTimers.push(timer);
      }, 50);
    }

    function startPager(){
      if(pagerTimer) clearInterval(pagerTimer);
      if(pager.pages.length <= 1) return;
      pagerTimer = setInterval(()=>{
        pager.pageIndex = (pager.pageIndex + 1) % pager.pages.length;
        renderPage();
        setStatusPill(true);
        requestAnimationFrame(setFixedGridSizing); // keep exact
      }, PAGE_INTERVAL_MS);
    }

    /* -------- Fetch & Render -------- */
    async function fetchAll(){
      try{
        const res = await fetch(BODS_URL, { cache:"no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);

        let parsed;
        try{
          parsed = { type:"json", data: await res.clone().json() };
        }catch{
          parsed = { type:"xml", data: (new DOMParser()).parseFromString(await res.text(),"application/xml") };
        }

        let situations = parsed.type==="json"
          ? extractSituationsFromJSON(parsed.data)
          : extractSituationsFromXML(parsed.data);

        /* Strict operator filter */
        situations = situations.filter(sit=>{
          const multiRefs = getOperatorRefs(sit);
          const anyBee = multiRefs.some(ref => BEE_OPERATORS.includes(ref));
          const singleFallback = getOperatorRef(sit);
          return anyBee || (singleFallback && BEE_OPERATORS.includes(singleFallback.toUpperCase()));
        });

        /* Diversions only */
        situations = situations.filter(isDiversion);

        /* Only currently valid */
        situations = situations.filter(isCurrentlyValid);

        /* Only if start or end is within ±7 days of today */
        situations = situations.filter(isWithin7DayWindow);

        /* Only unplanned (default on) */
        if(UNPLANNED_ONLY) {
          situations = situations.filter(sit=>{
            const p = sit?.Planned;
            if(p === false) return true;
            if(typeof p === "string" && p.trim().toLowerCase() === "false") return true;
            return false;
          });
        }

        /* Map to items (supports multi-operator and multi-route) */
        const items = situations.map(s=>{
          const singleOpRefForTint = getOperatorRef(s) || "";
          const operatorRefs = getOperatorRefs(s);
          const routes = getLineRefs(s);
          const st = parseISO(s?.ValidityPeriod?.StartTime || s?.StartTime);
          const en = parseISO(s?.ValidityPeriod?.EndTime   || s?.EndTime);

          return {
            key: situationKey(s),
            singleOpRefForTint: singleOpRefForTint,
            operatorRefs,
            routes: routes.length ? routes.map(String) : ["?"],
            timeLines: validityLines(s),     // {startLine, endLine}
            summary: (s.Summary || s.Description || "").trim(),
            startMs: st ? st.getTime() : 0,
            endMs: en ? en.getTime() : null
          };
        })
        /* Sort: most recently started first */
        .sort((a,b)=> b.startMs - a.startMs);

        /* Page building: fixed 6 per page for 3×2 grid */
        pager.pageSize = 6;
        pager.pages = chunk(items, pager.pageSize);
        pager.pageIndex = 0;
        pager.total = items.length;

        requestAnimationFrame(()=>{
          setFixedGridSizing();
          renderPage();
          startPager();
          setStatusPill(true);
        });
      }catch(e){
        console.error(e);
        setStatusPill(false);
      }
    }

    /* Start */
    fetchAll();
    setInterval(fetchAll, FEED_REFRESH_MS); // refresh feed every 60s

    /* Reflow on resize and after fonts ready */
    window.addEventListener("resize", ()=>{
      requestAnimationFrame(()=>{
        setFixedGridSizing();
        // no need to rebuild pages on resize; just keep sizing and current render
      });
    });

    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(()=> requestAnimationFrame(setFixedGridSizing));
    }
    window.addEventListener("load", ()=> requestAnimationFrame(setFixedGridSizing) );
  </script>
</body>
</html>
