<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bee Network — Live Bus Diversions (BODS SIRI‑SX)</title>
<meta http-equiv="Cache-Control" content="no-store" />
<style>
  :root{
    --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;
    --chipBorder:#22232b; --chipBg:#16161b;

    /* Operator colours */
    --op-BNML:#ff4d4f;   /* red */
    --op-BNGN:#3a7afe;   /* blue */
    --op-BNSM:#ff9a1f;   /* orange */
    --op-BNDB:#ffffff;   /* white */
    --op-BNVB:#7a3ffe;   /* purple */
    --op-BNFM:#ff66b3;   /* pink */

    --neutral:#23232b;   /* default chip bg */
    --accent:#ffd100;    /* yellow route badge */
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui, Segoe UI, Roboto, Arial, sans-serif;
    overflow:hidden; /* hard stop: no page scroll */
  }
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:18px 24px; border-bottom:1px solid #22232b;
    background:linear-gradient(180deg,var(--bg),rgba(11,11,14,.85) 80%, transparent)
  }
  h1{margin:0; font-size:28px; font-weight:700}
  .accent{color:#ffd100}
  .meta{display:flex; gap:18px; color:var(--muted); font-size:14px}

  main{padding:16px 24px 24px; height:calc(100vh - 74px); display:flex; flex-direction:column}
  #statusBar{display:flex; gap:16px; flex-wrap:wrap; margin:8px 0 18px}
  .tag{
    display:inline-flex; align-items:center; gap:6px; background:#1d1d26;
    border:1px solid #262733; color:var(--muted);
    padding:4px 10px; border-radius:999px; font-size:12px; text-transform:uppercase
  }

  /* Grid of square chips (auto-fill, squares) */
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:16px;
    overflow:hidden;
    flex:1;
  }

  /* Square chip container */
  .chip{
    position:relative;
    border:1px solid var(--chipBorder);
    border-radius:16px;
    background:var(--neutral); /* overriden by operator colour */
    display:flex; align-items:center; justify-content:center;
    aspect-ratio:1/1; /* square */
    padding:12px;
  }

  /* Inner layout */
  .chipContent{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; height:100%; text-align:center;
  }

  /* Big route number inside yellow box (always black text) */
  .route{
    display:inline-block;
    font-size:42px; font-weight:900; line-height:1; letter-spacing:0.5px;
    margin-bottom:12px;
    color:#000;
    background:var(--accent);
    padding:6px 12px;
    border-radius:8px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }

  /* Validity time line (below route number) */
  .validityTime{
    font-size:15px; font-weight:700; margin-bottom:8px;
    color:#0b0b0e; /* dark text by default for light backgrounds */
    opacity:0.95;
  }

  /* Summary line */
  .summary{
    font-size:13px; line-height:1.2; color:#0b0b0e;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
    max-width:95%;
  }

  /* For dark backgrounds (blue/purple/neutral), invert text to white */
  .on-dark .validityTime, .on-dark .summary { color:#ffffff; }
  .on-dark .validityTime { opacity:0.92; }

  /* Operator colour classes (chip background) */
  .op-BNML{ background:var(--op-BNML); }  /* red  -> default (dark text ok for route badge only; content uses .on-dark/normal) */
  .op-BNGN{ background:var(--op-BNGN); }  /* blue -> add .on-dark */
  .op-BNSM{ background:var(--op-BNSM); }  /* orange -> normal (dark text) */
  .op-BNDB{ background:var(--op-BNDB); border-color:#dcdcdc; }  /* white -> normal (dark text) */
  .op-BNVB{ background:var(--op-BNVB); }  /* purple -> add .on-dark */
  .op-BNFM{ background:var(--op-BNFM); }  /* pink  -> normal (dark text) */
  .neutral-dark{ background:var(--neutral); } /* unknown -> treat as dark */

  /* Apply .on-dark text inversion for dark chips */
  .op-BNGN .chipContent, .op-BNVB .chipContent, .neutral-dark .chipContent { color:#fff; }

  /* Status text */
  #statusMsg{ min-width:140px }
</style>
</head>
<body>
<header>
  <h1><span class="accent">Bee Network</span> — Live Bus Diversions</h1>
  <div class="meta">
    <span id="clock">--:--</span>
    <span id="lastOk" class="faint">Last update: —</span>
  </div>
</header>

<main>
  <div id="statusBar">
    <span class="tag" id="totalTag">Total: 0</span>
    <span class="tag">Bee Network only</span>
    <span class="tag" id="refreshTag">Refresh: 60s</span>
    <span class="tag" id="statusMsg">Starting…</span>
  </div>
  <div id="grid"></div>
</main>

<script>
/** ===== Configuration ===== **/
const API_KEY = '17889546a31fddeef67fca78252fb66951aedf1a'; // Consider moving server-side
const BODS_URL = `https://occproxy-6dem.vercel.app/api/proxy?url=https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;
const REFRESH_SECONDS = 60;

/* Diversion keyword matching */
const DIVERSION_MATCHERS = ['divert', 'diversion', 'diversions'];

/* Bee operator matching */
const BEE_MATCHERS = ['bee network','bee network -','bee network–','bee network —'];
const SEV_PRIORITY = { 'noimpact':0,'verylow':1,'low':2,'normal':3,'medium':4,'high':5,'veryhigh':6,'unknown':3 };

/* Optional: filter only UNPLANNED incidents (SIRI-SX Planned=false). Set to true to enable. */
const UNPLANNED_ONLY = false;

const el = sel => document.querySelector(sel);
function fmtTime(d){ return new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d); }
function fmtHM(d){ return new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(d); }
function parseISO(s){ try { return s ? new Date(s) : null; } catch { return null; } }
function escapeHtml(s){ return String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }
function textContains(h, needles){ if(!h) return false; const x = String(h).toLowerCase(); return needles.some(n => x.includes(n)); }

/** ===== Upstream parse (JSON or XML) ===== **/
function parseUpstreamBody(text){
  const t = (text||'').trim();
  if(t.startsWith('{') || t.startsWith('[')){
    try { return { type:'json', data: JSON.parse(t) }; } catch { /* fall through */ }
  }
  const dom = new DOMParser().parseFromString(t,'application/xml');
  const err = dom.querySelector('parsererror');
  if(err) throw new Error('XML parse error');
  return { type:'xml', data: dom };
}

/** ===== Extractors ===== **/
function extractSituationsFromJSON(json){
  const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
  if(!sd) return [];
  const sed = Array.isArray(sd.SituationExchangeDelivery) ? sd.SituationExchangeDelivery
            : [sd.SituationExchangeDelivery].filter(Boolean);
  const all=[]; for(const d of sed){
    const pe = d?.Situations?.PtSituationElement;
    if(Array.isArray(pe)) all.push(...pe);
    else if(pe) all.push(pe);
  }
  return all;
}

function extractSituationsFromXML(doc){
  const elems = doc.querySelectorAll('PtSituationElement');
  return Array.from(elems).map(el=>{
    const T = s => el.querySelector(s)?.textContent?.trim() || null;
    const ops = Array.from(el.querySelectorAll('AffectedVehicleJourney > OperatorName, OperatorName'))
                      .map(n=>n.textContent.trim()).filter(Boolean);
    const opsRef = Array.from(el.querySelectorAll('AffectedVehicleJourney > OperatorRef, OperatorRef'))
                      .map(n=>n.textContent.trim()).filter(Boolean);
    const lines = Array.from(el.querySelectorAll('AffectedVehicleJourney > LineRef, PublishedLineName, LineName'))
                      .map(n=>n.textContent.trim()).filter(Boolean);
    const places = Array.from(el.querySelectorAll('AffectedStopPoint > StopPointName, AffectedStopPoint > PlaceName'))
                      .map(n=>n.textContent.trim()).filter(Boolean);
    return {
      Summary: T('Summary') || T('Description') || 'Disruption',
      Description: T('Description'),
      Severity: T('Severity') || T('Priority') || 'unknown',
      Planned: T('Planned'),
      ValidityPeriod: {
        StartTime: T('ValidityPeriod > StartTime') || T('StartTime'),
        EndTime:   T('ValidityPeriod > EndTime')   || T('EndTime'),
      },
      CreationTime: T('CreationTime') || T('VersionedAtTime') || T('RecordedAtTime'),
      Affects: {
        VehicleJourneys: { AffectedVehicleJourney: (ops.length||lines.length||opsRef.length) ? [{ OperatorName: ops[0], OperatorRef: opsRef[0], LineRef: lines[0] }] : [] },
        StopPoints: { AffectedStopPoint: places.map(p=>({ StopPointName: p })) }
      },
      __operators: ops, __operatorRefs: opsRef, __lines: lines, __places: places
    };
  });
}

const _getOperatorRef = sit => {
  const candidates = new Set();
  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney || [];
  const journeys = Array.isArray(avj) ? avj : [avj].filter(Boolean);
  for(const j of journeys){
    if(j?.OperatorRef) candidates.add(String(j.OperatorRef).trim());
  }
  if(candidates.size) return [...candidates][0];
  if(Array.isArray(sit.__operatorRefs) && sit.__operatorRefs.length) return sit.__operatorRefs[0];
  return null;
};

const _getOps = sit => {
  const ops = new Set();
  const names=[].concat(sit?.OperatorName||[]).concat(sit?.Operators||[]).concat(sit?.Affects?.Operators||[]);
  for(const n of names){
    if(!n) continue;
    if(Array.isArray(n)) n.forEach(v=>v && ops.add(String(v).trim()));
    else if(typeof n==='object'){
      const v = n.OperatorName || n.Name || n.value || n.text; if(v) ops.add(String(v).trim());
    } else ops.add(String(n).trim());
  }
  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney || [];
  const journeys = Array.isArray(avj) ? avj : [avj].filter(Boolean);
  for(const j of journeys){ const on = j?.OperatorName || j?.OperatorRef; if(on) ops.add(String(on).trim()); }
  return [...ops];
};

const _getLines = sit => {
  const lines = new Set();
  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney || [];
  const journeys = Array.isArray(avj) ? avj : [avj].filter(Boolean);
  for(const j of journeys){
    const l = j?.LineRef || j?.PublishedLineName || j?.RouteName || j?.LineName;
    if(Array.isArray(l)) l.forEach(x=>x&&lines.add(String(x)));
    else if(l) lines.add(String(l));
  }
  return [...lines];
};

/* Helpers */
function pickTitle(sit){ return (sit?.Summary || sit?.Description || sit?.ParticipantRef || sit?.SituationNumber || '').toString(); }

/* Diversion filter */
function isDiversion(sit){
  const txt = [sit?.Description, sit?.Summary].filter(Boolean).join(' ').toLowerCase();
  return DIVERSION_MATCHERS.some(k => txt.includes(k));
}

/* Is currently valid: Start <= now <= End (or End missing) */
function isCurrentlyValid(sit, now = new Date()){
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
  if(!s) return false;                // require a start to consider it valid
  if(s > now) return false;           // not started yet
  if(e && e < now) return false;      // already ended
  return true;                        // active window
}

/* Validity time label (HH:MM–HH:MM | From HH:MM | Until HH:MM) */
function validityTimeLabel(sit){
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
  if(s && e) return `${fmtHM(s)}–${fmtHM(e)}`;
  if(s)      return `From ${fmtHM(s)}`;
  if(e)      return `Until ${fmtHM(e)}`;
  return '—';
}

/* Optional: Planned=false only */
function isUnplanned(sit){
  // SIRI-SX PtSituationElement may include <Planned>true|false>.
  // Treat explicit "false" (string) or boolean false as unplanned.
  const p = sit?.Planned;
  if(p === false) return true;
  if(typeof p === 'string') return p.trim().toLowerCase() === 'false';
  return false;
}

/* Map OperatorRef => CSS class + on-dark flag */
function operatorClass(ref){
  switch(String(ref||'').toUpperCase()){
    case 'BNML': return { cls:'op-BNML', onDark:false };
    case 'BNGN': return { cls:'op-BNGN', onDark:true  };
    case 'BNSM': return { cls:'op-BNSM', onDark:false };
    case 'BNDB': return { cls:'op-BNDB', onDark:false };
    case 'BNVB': return { cls:'op-BNVB', onDark:true  };
    case 'BNFM': return { cls:'op-BNFM', onDark:false };
    default:     return { cls:'neutral-dark', onDark:true };
  }
}

/* Fit-to-screen: compute how many squares fit in the grid area, then slice */
function sliceToViewport(items){
  const headerH = document.querySelector('header')?.getBoundingClientRect().height ?? 74;
  const statusH = document.querySelector('#statusBar')?.getBoundingClientRect().height ?? 36;
  const mainPadding = 24 + 16;
  const availH = window.innerHeight - headerH - statusH - mainPadding;
  const grid = el('#grid');

  const gridW = grid.clientWidth || (window.innerWidth - 48);
  const minW = 200, gap = 16;
  const cols = Math.max(1, Math.floor((gridW + gap) / (minW + gap)));
  const cardSize = Math.max(minW, Math.floor((gridW - (cols-1)*gap)/cols));
  const rows = Math.max(1, Math.floor((availH + gap) / (cardSize + gap)));
  const max = Math.max(1, cols * rows);

  return items.slice(0, max);
}

/** ===== Rendering ===== **/
function renderSituations(items){
  const grid = el('#grid');
  const visible = sliceToViewport(items);

  const frag = document.createDocumentFragment();
  visible.forEach(it=>{
    const { cls, onDark } = operatorClass(it.operatorRef);
    const chip = document.createElement('div');
    chip.className = `chip ${cls}`;

    const inner = document.createElement('div');
    inner.className = `chipContent ${onDark ? 'on-dark' : ''}`;

    const route = document.createElement('div');
    route.className = 'route';
    route.textContent = it.route || '—';

    const validityEl = document.createElement('div');
    validityEl.className = 'validityTime';
    validityEl.textContent = it.validityTime || '—';

    const summary = document.createElement('div');
    summary.className = 'summary';
    summary.textContent = it.summary || '';

    inner.appendChild(route);
    inner.appendChild(validityEl);
    inner.appendChild(summary);
    chip.appendChild(inner);

    frag.appendChild(chip);
  });

  grid.replaceChildren(frag);
  el('#totalTag').textContent = `Total: ${visible.length}`;
}

/** ===== Fetch loop ===== **/
async function fetchAndRender(){
  const status = el('#statusMsg');
  try{
    status.textContent = 'Fetching…';

    const res = await fetch(BODS_URL, {
      method: 'GET',
      headers: {
        'Accept': 'application/json, application/xml;q=0.8, text/xml;q=0.7',
        'Cache-Control': 'no-store'
      },
      cache: 'no-store',
    });

    if(!res.ok){
      throw new Error(`Upstream HTTP ${res.status}`);
    }

    let parsed;
    const clone = res.clone();
    try{
      const j = await res.json();
      parsed = { type:'json', data:j };
    }catch{
      const txt = await clone.text();
      parsed = parseUpstreamBody(txt);
    }

    const situations = (parsed.type === 'json')
      ? extractSituationsFromJSON(parsed.data)
      : extractSituationsFromXML(parsed.data);

    // Filter: Bee Network only
    const beeOnly = situations.filter(sit=>{
      const ops = _getOps(sit);
      return ops.length
        ? ops.some(o => textContains(o, BEE_MATCHERS))
        : textContains(sit?.Summary || sit?.Description || '', BEE_MATCHERS);
    });

    // Filter: Diversions only
    let filtered = beeOnly.filter(isDiversion);

    // Filter: ONLY currently valid
    const now = new Date();
    filtered = filtered.filter(sit => isCurrentlyValid(sit, now));

    // Optional: Only UNPLANNED
    if(UNPLANNED_ONLY){
      filtered = filtered.filter(isUnplanned);
    }

    // Map to chip items
    const items = filtered.map(sit=>{
      const operatorRef = _getOperatorRef(sit);
      const lines = _getLines(sit);
      const route = lines[0] || '—';

      const validityTime = validityTimeLabel(sit);
      const summary = pickTitle(sit);

      const updated = parseISO(sit?.CreationTime || sit?.VersionedAtTime || sit?.RecordedAtTime);

      return {
        operatorRef, route,
        validityTime,
        summary,
        updated, sit
      };
    }).sort((a,b)=>{
      // Sort: most recently updated first
      const au = a.updated?.getTime?.() || 0;
      const bu = b.updated?.getTime?.() || 0;
      return bu - au;
    });

    renderSituations(items);
    el('#statusMsg').textContent = items.length ? 'Live' : 'No active diversions';
    el('#lastOk').textContent = `Last update: ${fmtTime(new Date())}`;
  }catch(err){
    console.error(err);
    el('#statusMsg').textContent = `Error: ${err.message}`;
  }
}

function tickClock(){ el('#clock').textContent = fmtTime(new Date()); }
function start(){
  el('#refreshTag').textContent = `Refresh: ${REFRESH_SECONDS}s`;
  setInterval(tickClock, 1000);
  fetchAndRender();
  setInterval(fetchAndRender, REFRESH_SECONDS*1000);
}
window.addEventListener('load', start);

/* Re-slice on resize to keep non-scrolling fit */
window.addEventListener('resize', () => {
  fetchAndRender();
});
</script>
</body>
</html>
