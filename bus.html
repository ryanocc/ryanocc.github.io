<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Bus Diversions</title>
<meta http-equiv="Cache-Control" content="no-store" />
<style>
  :root{
    --bg:#0b0b0e; --text:#e9e9ef; --muted:#a7a7b3;
    --chipBorder:#22232b;

    /* Operator colours */
    --op-BNML:#ff4d4f;   /* red */
    --op-BNGN:#3a7afe;   /* blue */
    --op-BNSM:#ff9a1f;   /* orange */
    --op-BNDB:#ffffff;   /* white */
    --op-BNVB:#7a3ffe;   /* purple */
    --op-BNFM:#ff66b3;   /* pink */

    --neutral:#23232b;
    --accent:#ffd100;       /* yellow route badge */
    --accentGlow: rgba(255,209,0,0.45);
    --accentGlowStrong: rgba(255,209,0,0.85);

    /* Status pill colours */
    --liveGreen:#19c37d;
    --errorRed:#ff4d4f;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; padding:0; background:var(--bg);
    color:var(--text);
    font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    overflow:hidden; /* no page scroll */
  }

  /* ----------- MODERN HEADER ----------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 28px;
    background:#0b0b0e;
    border-bottom:1px solid #1d1d25;
  }
  .title{
    margin:0;
    font-size:34px;
    font-weight:900;
    letter-spacing:-0.5px;
  }
  .status-pill{
    padding:9px 18px;
    border-radius:999px;
    font-size:15px;
    font-weight:700;
    background:var(--liveGreen);
    color:#000;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08),
               0 4px 14px rgba(0,0,0,0.25);
    transition:background .2s ease,color .2s ease;
  }
  .status-error{
    background:var(--errorRed);
    color:#fff;
  }

  main{
    padding:0 28px 28px;
    display:flex;
    flex-direction:column;
    height:calc(100vh - 84px);
  }

  /* ----------- GRID ----------- */
  #grid{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:20px;
    flex:1;
    overflow:hidden; /* keep grid non-scroll */
  }

  .chip{
    position:relative;
    border:2px solid var(--chipBorder);
    background:var(--neutral);
    border-radius:18px;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    transition:border .2s ease, box-shadow .2s ease;
  }

  .chipContent{
    text-align:center;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .route{
    display:inline-block;
    font-size:46px;
    font-weight:900;
    background:var(--accent);
    color:#000;
    padding:6px 14px;
    border-radius:10px;
    margin-bottom:14px;
  }

  /* Stacked times */
  .validityTime{
    font-size:17px;
    font-weight:800;
    line-height:1.25;
    white-space:nowrap;
    margin-bottom:10px;
  }

  .summary{
    font-size:14px;
    line-height:1.2;
    opacity:0.85;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    max-width:92%;
    margin:0 auto;
  }

  /* Dark inversion */
  .on-dark .validityTime,
  .on-dark .summary{
    color:white;
  }

  /* ----------- GLOW FOR UFN ----------- */
  .glow-ufn{
    border-color:var(--accent);
    box-shadow:0 0 12px 4px var(--accentGlowStrong),
               0 0 28px 10px var(--accentGlow);
  }

  /* ----------- PULSE FOR NEW ----------- */
  @keyframes pulseRing {
    0%   { box-shadow:0 0 0 2px var(--accent),0 0 8px 2px var(--accentGlow); }
    50%  { box-shadow:0 0 0 2px rgba(255,209,0,0.7),0 0 18px 7px var(--accentGlowStrong); }
    100% { box-shadow:0 0 0 2px var(--accent),0 0 8px 2px var(--accentGlow); }
  }
  .pulse-new{
    border-color:var(--accent);
    animation:pulseRing 2s ease-in-out infinite;
  }

  /* Operator colours */
  .op-BNML{ background:var(--op-BNML); }
  .op-BNGN{ background:var(--op-BNGN); }
  .op-BNSM{ background:var(--op-BNSM); }
  .op-BNDB{ background:var(--op-BNDB); border-color:#dcdcdc; }
  .op-BNVB{ background:var(--op-BNVB); }
  .op-BNFM{ background:var(--op-BNFM); }
  .neutral-dark{ background:var(--neutral); }
  .op-BNGN .chipContent,
  .op-BNVB .chipContent,
  .neutral-dark .chipContent{
    color:white;
  }

  /* White chip: force black text for readability */
  .op-BNDB .chipContent{
    color:#000 !important;
  }
  .op-BNDB .validityTime,
  .op-BNDB .summary{
    color:#000 !important;
  }
</style>
</head>
<body>

<header class="topbar">
  <h1 class="title">Live Bus Diversions</h1>
  <div id="statusPill" class="status-pill">Live • --:--:--</div>
</header>

<main>
  <div id="grid"></div>
</main>

<script>
/* ===========================
   CONFIG
=========================== */
const API_KEY = "17889546a31fddeef67fca78252fb66951aedf1a";
const BODS_URL =
`https://occproxy-6dem.vercel.app/api/proxy?url=https://data.bus-data.dft.gov.uk/api/v1/siri-sx/?api_key=${API_KEY}`;

/* TfGM Bee Network operator refs (strict) */
const BEE_OPERATORS = ["BNML","BNGN","BNSM","BNDB","BNVB","BNFM"];

/* Behaviour flags */
const UNPLANNED_ONLY = true;      // default as requested
const PAGE_INTERVAL_MS = 10000;   // auto-advance
const HIGHLIGHT_WINDOW_MS = 5 * 60 * 1000; // pulse new for 5 min

/* Diversion keyword matching */
const DIVERSION_MATCHERS = ["divert","diversion","diversions"];

/* Track first-seen situations */
const firstSeenMap = new Map();

/* Helpers */
const $ = s => document.querySelector(s);
const parseISO = s => s ? new Date(s) : null;

function fmtFull(d){
  return new Intl.DateTimeFormat(undefined,
    {hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d);
}
function fmtHM(d){
  return new Intl.DateTimeFormat(undefined,
    {hour:"2-digit",minute:"2-digit"}).format(d);
}
function setStatusPill(ok){
  const pill = $("#statusPill");
  const t = fmtFull(new Date());
  if(ok){
    pill.classList.remove("status-error");
    pill.textContent = `Live • ${t}`;
  } else {
    pill.classList.add("status-error");
    pill.textContent = `Error • ${t}`;
  }
}

/* --- Relative time formatter for stacked lines with emojis and Today marker,
       and turning any 23:59 into "End of Service" --- */
function validityTimeLabel(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

  function formatPart(d, isStart){
    // If no time:
    if(!d) return isStart ? null : "UFN";

    // Treat 23:59 as "End of Service"
    const is2359 = d.getHours() === 23 && d.getMinutes() === 59;
    if(is2359){
      return (isStart ? "🟢 " : "🛑 ") + "End of Service";
    }

    const sameDay = d.toDateString() === now.toDateString();
    const time = fmtHM(d);

    // Local week bounds (Mon–Sun)
    const startWeek = new Date(now);
    startWeek.setDate(now.getDate() - ((now.getDay() + 6) % 7)); // Monday
    startWeek.setHours(0,0,0,0);

    const endWeek = new Date(startWeek);
    endWeek.setDate(startWeek.getDate() + 6);
    endWeek.setHours(23,59,59,999);

    const inWeek = d >= startWeek && d <= endWeek;

    let label;
    if(sameDay){
      // Today: HH:MM Today
      label = `${time} Today`;
    } else if(inWeek){
      // This week (not today): Tue HH:MM
      const wd = new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(d);
      label = `${wd} ${time}`;
    } else {
      // Outside this week: 21 Feb HH:MM
      const dm = new Intl.DateTimeFormat(undefined,{day:'2-digit',month:'short'}).format(d);
      label = `${dm} ${time}`;
    }

    return (isStart ? "🟢 " : "🛑 ") + label;
  }

  const startTxt = formatPart(s, true);
  const endTxt   = formatPart(e, false);

  if(startTxt && endTxt){
    return `${startTxt}\n${endTxt}`;
  }
  if(startTxt && !endTxt){
    // No end time → UFN (keep the end emoji)
    return `${startTxt}\n🛑 UFN`;
  }
  if(!startTxt && endTxt){
    // Unusual but supported: end only
    return `${endTxt}`;
  }
  return "—";
}

/* Only include incidents whose start OR end is within ±7 days of today */
function isWithin7DayWindow(sit){
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);

  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
  const endOfToday   = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59,999);

  const windowStart = new Date(startOfToday.getTime() - 7*24*60*60*1000);
  const windowEnd   = new Date(endOfToday.getTime()   + 7*24*60*60*1000);

  const inWindow = d => d && d >= windowStart && d <= windowEnd;
  return inWindow(s) || inWindow(e);
}

/* OperatorRef extraction & class */
function getOperatorRef(sit){
  const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
  if(Array.isArray(avj) && avj.length && avj[0]?.OperatorRef) return String(avj[0].OperatorRef);
  if(avj && avj.OperatorRef) return String(avj.OperatorRef);
  if(sit?.OperatorRef) return String(sit.OperatorRef);
  if(sit?.__operatorRefs && sit.__operatorRefs.length) return String(sit.__operatorRefs[0]);
  return null;
}

function operatorClass(ref){
  switch((ref||"").toUpperCase()){
    case "BNML": return {cls:"op-BNML", dark:false};
    case "BNGN": return {cls:"op-BNGN", dark:true};
    case "BNSM": return {cls:"op-BNSM", dark:false};
    case "BNDB": return {cls:"op-BNDB", dark:false};
    case "BNVB": return {cls:"op-BNVB", dark:true};
    case "BNFM": return {cls:"op-BNFM", dark:false};
    default: return {cls:"neutral-dark", dark:true};
  }
}

/* Keys & titles */
function situationKey(sit){
  if(sit.SituationNumber) return "id:" + sit.SituationNumber;
  if(sit.SituationRef)   return "ref:" + sit.SituationRef;
  if(sit.ParticipantRef) return "p:" + sit.ParticipantRef;
  const op = getOperatorRef(sit) || "";
  const ln = (sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef || "").toString();
  const st = sit?.ValidityPeriod?.StartTime || sit?.StartTime || "";
  const sum = (sit?.Summary || sit?.Description || "").toString().slice(0,120);
  return `k:${op}|${ln}|${st}|${sum}`;
}

/* Filters */
function isDiversion(sit){
  const txt = (sit.Description || sit.Summary || "").toLowerCase();
  return DIVERSION_MATCHERS.some(k => txt.includes(k));
}
function isCurrentlyValid(sit){
  const now = new Date();
  const s = parseISO(sit?.ValidityPeriod?.StartTime || sit?.StartTime);
  const e = parseISO(sit?.ValidityPeriod?.EndTime   || sit?.EndTime);
  if(!s) return false;
  if(s > now) return false;
  if(e && e < now) return false;
  return true;
}
function isUnplanned(sit){
  const p = sit?.Planned;
  if(p === false) return true;
  if(typeof p === "string" && p.trim().toLowerCase() === "false") return true;
  return false;
}

/* Extractors */
function extractSituationsFromJSON(json){
  const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
  if(!sd) return [];
  const sed = Array.isArray(sd.SituationExchangeDelivery)
    ? sd.SituationExchangeDelivery
    : [sd.SituationExchangeDelivery].filter(Boolean);
  const out=[];
  for(const d of sed){
    const pe = d?.Situations?.PtSituationElement;
    if(Array.isArray(pe)) out.push(...pe);
    else if(pe) out.push(pe);
  }
  return out;
}
function extractSituationsFromXML(doc){
  const els = [...doc.querySelectorAll("PtSituationElement")];
  return els.map(el=>{
    const T = s => el.querySelector(s)?.textContent?.trim() || null;
    const opsRef = [...el.querySelectorAll("AffectedVehicleJourney > OperatorRef, OperatorRef")]
                    .map(n=>n.textContent.trim()).filter(Boolean);
    const lines  = [...el.querySelectorAll("AffectedVehicleJourney > LineRef, PublishedLineName, LineName")]
                    .map(n=>n.textContent.trim()).filter(Boolean);
    return {
      Summary: T("Summary") || T("Description"),
      Description: T("Description"),
      Severity: T("Severity") || "unknown",
      Planned: T("Planned"),
      SituationNumber: T("SituationNumber") || T("SituationRef"),
      ParticipantRef: T("ParticipantRef"),
      ValidityPeriod: {
        StartTime: T("ValidityPeriod > StartTime") || T("StartTime"),
        EndTime:   T("ValidityPeriod > EndTime")   || T("EndTime"),
      },
      CreationTime: T("CreationTime") || T("RecordedAtTime") || T("VersionedAtTime"),
      Affects: {
        VehicleJourneys: {
          AffectedVehicleJourney: (opsRef.length || lines.length)
            ? [{ OperatorRef: opsRef[0], LineRef: lines[0] }]
            : []
        }
      },
      __operatorRefs: opsRef
    };
  });
}

/* -------- Pager (no scrolling) -------- */
const pager={pages:[],pageIndex:0,pageSize:0,total:0,timer:null};

function computePageSize(){
  const topH = $(".topbar").getBoundingClientRect().height;
  const pad = 40;
  const avail = window.innerHeight - (topH + pad);
  const grid = $("#grid");
  const w = grid.clientWidth || window.innerWidth;

  const minW=220, gap=20;
  const cols=Math.max(1, Math.floor((w+gap)/(minW+gap)));
  const cardSize=Math.max(minW, Math.floor((w-(cols-1)*gap)/cols));
  const rows=Math.max(1, Math.floor((avail+gap)/(cardSize+gap)));
  return cols*rows;
}
function chunk(arr,size){
  const out=[];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out.length?out:[[]];
}
function renderPage(){
  const grid=$("#grid");
  const now=Date.now();
  const pg=pager.pages[pager.pageIndex]||[];
  grid.innerHTML="";

  for(const it of pg){
    const oc=operatorClass(it.operatorRef);
    const chip=document.createElement("div");
    chip.className="chip "+oc.cls;

    if(!it.endMs) chip.classList.add("glow-ufn");
    if(it.firstSeen && now-it.firstSeen < HIGHLIGHT_WINDOW_MS)
      chip.classList.add("pulse-new");

    const inner=document.createElement("div");
    inner.className="chipContent "+(oc.dark?"on-dark":"");

    const r=document.createElement("div");
    r.className="route";
    r.textContent=it.route;

    const v=document.createElement("div");
    v.className="validityTime";
    v.innerHTML=it.validity.replace(/\n/g,"<br>");

    const s=document.createElement("div");
    s.className="summary";
    s.textContent=it.summary;

    inner.append(r,v,s);
    chip.append(inner);
    grid.append(chip);
  }
}
function startPager(){
  if(pager.timer) clearInterval(pager.timer);
  if(pager.pages.length<=1) return;
  pager.timer=setInterval(()=>{
    pager.pageIndex=(pager.pageIndex+1)%pager.pages.length;
    renderPage();
    setStatusPill(true);
  }, PAGE_INTERVAL_MS);
}

/* -------- Fetch & Render -------- */
async function fetchAll(){
  try{
    const res = await fetch(BODS_URL, { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    let parsed;
    try{
      parsed = { type:"json", data: await res.clone().json() };
    }catch{
      parsed = { type:"xml", data: (new DOMParser()).parseFromString(await res.text(),"application/xml") };
    }

    let situations = parsed.type==="json"
      ? extractSituationsFromJSON(parsed.data)
      : extractSituationsFromXML(parsed.data);

    /* ---------- PROPER TfGM FILTER: OperatorRef must be in BEE_OPERATORS ---------- */
    situations = situations.filter(sit=>{
      const ref = getOperatorRef(sit);
      return ref && BEE_OPERATORS.includes(ref.toUpperCase());
    });

    /* Diversions only */
    situations = situations.filter(isDiversion);

    /* Only currently valid */
    situations = situations.filter(isCurrentlyValid);

    /* Only if start or end is within ±7 days of today */
    situations = situations.filter(isWithin7DayWindow);

    /* Only unplanned (default on) */
    if(UNPLANNED_ONLY) {
      situations = situations.filter(isUnplanned);
    }

    /* Map to chips */
    const now = Date.now();
    const items = situations.map(s=>{
      const key = situationKey(s);
      if(!firstSeenMap.has(key)) firstSeenMap.set(key, now);

      const route = s?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef || "?";
      const opRef = getOperatorRef(s) || "";
      const st = parseISO(s?.ValidityPeriod?.StartTime || s?.StartTime);
      const en = parseISO(s?.ValidityPeriod?.EndTime   || s?.EndTime);

      return {
        key,
        route,
        operatorRef: opRef,
        validity: validityTimeLabel(s),
        summary: (s.Summary || s.Description || "").trim(),
        startMs: st ? st.getTime() : 0,
        endMs: en ? en.getTime() : null,
        firstSeen: firstSeenMap.get(key)
      };
    })
    /* Sort: most recently started first */
    .sort((a,b)=> b.startMs - a.startMs);

    /* Page building */
    pager.pageSize = computePageSize();
    pager.pages = chunk(items, pager.pageSize);
    pager.pageIndex = 0;
    pager.total = items.length;

    renderPage();
    startPager();
    setStatusPill(true);
  }catch(e){
    console.error(e);
    setStatusPill(false);
  }
}

/* Start */
fetchAll();
setInterval(fetchAll, 60000);

window.addEventListener("resize", ()=>{
  const flat = (pager.pages || []).flat();
  pager.pageSize = computePageSize();
  pager.pages = chunk(flat, pager.pageSize);
  pager.pageIndex = 0;
  renderPage();
  startPager();
});
</script>
</body>
</html>
