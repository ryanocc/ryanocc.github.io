<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OCC Map — GM View (Dark + Clustering + Reinforced Confidence)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- MapLibre CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.14.0/dist/maplibre-gl.js"></script>

  <!-- Barlow Semi Condensed (modern sans-serif everywhere) -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --bg:#000;
      --text:#f2f2f2;
      --danger:#ff2e34;      /* bottom bar red & edge scan red */
      --red:#ff0000;         /* red circles */
      --yellow:#ffd000;      /* yellow circles */
      --green:#28c76f;       /* OCC accent green (still used for highlights) */
      --ui-font:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
    }

    html, body { height:100%; margin:0; }
    body {
      background:var(--bg);
      color:var(--text);
      font-family:var(--ui-font);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
      position:relative;
    }

    /* Map occupies full height normally; shrinks to 75vh when bar is visible */
    #map {
      position:absolute;
      top:0; left:0; right:0;
      height:100%;
      width:100%;
    }
    body.bar-open #map { height:75vh; }

    .maplibregl-ctrl-group button { filter: invert(1) hue-rotate(180deg); }
    .maplibregl-ctrl-attrib { background: rgba(0,0,0,0.5); color:#ddd; }

    /* ===== Bottom Alert Bar (25% viewport height) ===== */
    #alert-bar {
      position:absolute;
      left:0; right:0; bottom:0;
      height:25vh;
      background:var(--danger);
      color:#fff;
      z-index:10;
      transform: translateY(100%);
      transition: transform 300ms ease;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:16px;
      box-sizing:border-box;
      font-family:var(--ui-font);
    }
    #alert-bar.show { transform: translateY(0); }

    #alert-content {
      max-width:1200px;
      width:100%;
      display:grid;
      grid-template-rows:auto auto auto;
      row-gap:10px;
      padding:0 16px;
      font-family:var(--ui-font);
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
    }

    #alert-title {
      font-size:clamp(20px, 3.2vh, 32px);
      font-weight:700;
      letter-spacing:0.5px;
      text-transform:uppercase;
    }

    /* ===== Subtitle styling: very large + distinctive ===== */
    #alert-location {
      font-size: clamp(28px, 5.6vh, 72px);
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.15;
      text-transform: none;
      color: #fff;
      text-shadow:
        0 2px 6px rgba(0,0,0,0.45),
        0 0 2px rgba(0,0,0,0.85);
      font-family:var(--ui-font);
    }

    /* Road badge element for M/A/B roads */
    .road-badge {
      display: inline-block;
      margin-right: 12px;
      padding: 2px 14px;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.85);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.35) inset,
        0 4px 12px rgba(0,0,0,0.40),
        0 0 12px rgba(255,255,255,0.35);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: linear-gradient(180deg, #1f1f1f 0%, #000 100%);
      font-family:var(--ui-font);
    }
    .road-badge.motorway { background: linear-gradient(180deg, #004b8d 0%, #00345f 100%); } /* Motorway: blue */
    .road-badge.aprimary { background: linear-gradient(180deg, #2f8f09 0%, #1e5e06 100%); } /* A-road: green */
    .road-badge.broad    { background: linear-gradient(180deg, #7a5c00 0%, #4e3a00 100%); } /* B-road: brown */

    .road-sep { margin: 0 8px; opacity: 0.9; }

    /* First reported time */
    #alert-time {
      font-size:clamp(14px, 2.4vh, 24px);
      font-weight:600;
      opacity:0.9;
      font-family:var(--ui-font);
    }

    /* ===== Progress bar in alert ===== */
    #alert-progress-wrap{
      position:absolute;
      left:0; right:0; bottom:0;
      height:6px;
      background:rgba(0,0,0,0.25);
    }
    #alert-progress{
      height:100%;
      width:100%;
      transform-origin:left center;
      background:rgba(255,255,255,0.85);
    }

    /* ===== SVG Border Sweep (RED) ===== */
    #svg-scan {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 9;                /* under the bar */
      opacity: 0;
      transition: opacity 120ms ease;
    }
    body.scan-on #svg-scan { opacity: 1; }

    #svg-scan .scan-rect {
      fill: none;
      stroke: var(--danger);
      stroke-width: 15;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 8px rgba(255, 46, 52, 0.75));
    }

    @keyframes dashSweep {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: var(--dashLen); }
    }
    body.scan-on #svg-scan .scan-rect {
      animation: dashSweep 900ms ease-out 1;
    }

    /* ===== Feed Health badges ===== */
    .feed-health {
      position: absolute;
      z-index: 11;
      background: rgba(20,20,20,0.75);
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      font-family: var(--ui-font);
      font-size: 14px;
      letter-spacing: 0.2px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      pointer-events: none;
      white-space: nowrap;
    }
    #feed-health-waze { top: 10px; left: 10px; }
    #feed-health-he   { top: 10px; right: 10px; }

    .feed-health.ok    { border-color: rgba(40,199,111,0.6); }
    .feed-health.stale { border-color: rgba(255,46,52,0.6); }

    /* ===== Audio test panel ===== */
    #audio-test {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 12;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(20,20,20,0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      backdrop-filter: blur(2px);
    }
    #sound-test {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.25);
      background: linear-gradient(180deg, #2a2a2a 0%, #141414 100%);
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px;
      font-family: var(--ui-font);
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
    }
    #sound-test:active { transform: translateY(1px); }
    #audio-status {
      color: #fff;
      font-size: 13px;
      opacity: 0.95;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Feed health badges -->
  <div id="feed-health-waze" class="feed-health stale" aria-live="polite" aria-label="Waze feed status">Waze: initialising…</div>
  <div id="feed-health-he"   class="feed-health stale" aria-live="polite" aria-label="Highways feed status">Highways: initialising…</div>

  <!-- Audio test panel -->
  <div id="audio-test" role="group" aria-label="Audio controls">
    <button id="sound-test" type="button" aria-label="Test alert chime">Test Chime</button>
    <div id="audio-status" aria-live="polite">Audio: Locked</div>
  </div>

  <!-- SVG edge sweep overlay -->
  <svg id="svg-scan" aria-hidden="true" width="100%" height="100%">
    <rect class="scan-rect" x="1" y="1" width="100%" height="100%"></rect>
  </svg>

  <!-- Bottom red alert bar -->
  <div id="alert-bar" aria-live="assertive" aria-hidden="true">
    <div id="alert-content">
      <div id="alert-title">New High Confidence Alert</div>
      <div id="alert-location">—</div>
      <div id="alert-time" aria-label="First reported time">—</div>
    </div>

    <!-- Progress bar (counts down ALERT_BAR_MS) -->
    <div id="alert-progress-wrap">
      <div id="alert-progress"></div>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const WAZE_URL = 'https://www.waze.com/row-partnerhub-api/partners/11867436614/waze-feeds/4e8ef399-d6b9-4338-9840-7c2beacd235b?format=1';
    const HE_URL   = 'https://m.highwaysengland.co.uk/feeds/rss/UnplannedEvents/North%20West.xml'; // National Highways RSS (North West)
    const REFRESH_MS = 30000;

    const ALERT_BAR_MS       = 10000; // 10s visible
    const MERGE_METERS       = 200;   // merge alerts within 200 m

    // Optional behaviours
    const STALE_CLEAR_MS = 5 * 60 * 1000;        // clear accidents if feed stale > 5min
    const SHOW_BANNER_ON_INCREASE = true;        // banner when high-tier increases

    // 🎯 High confidence definition
    const HIGH_CONF_MIN = 4;

    // 🧮 Clustering reinforcement
    const CLUSTER_BONUS_PER_REPORT = 0.5;
    const CLUSTER_BONUS_MAX = 2.0;

    // ===== AUDIO CONFIG (15-minute global cooldown) =====
    const AUDIO_COOLDOWN_MS = 15 * 60 * 1000; // 15 minutes
    let audioCtx = null;
    let audioEnabled = false;
    let lastSoundAt = Number(localStorage.getItem('lastSoundAt') || 0);
    if (!Number.isFinite(lastSoundAt) || lastSoundAt < 0) {
      lastSoundAt = 0;
      localStorage.setItem('lastSoundAt', '0');
    }

    // ===== Quiet hours config (Europe/London) =====
    const QUIET_START = { h: 22, m: 0 };   // 22:00
    const QUIET_END   = { h: 6,  m: 15 };  // 06:15
    const NIGHT_ATTENUATION = 0.45;        // ~ -7 dB (gentle reduction)

    function isQuietHours(d = new Date()) {
      // Compute time in Europe/London (DST aware)
      const fmt = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        hour12: false,
        hour: '2-digit',
        minute: '2-digit'
      });
      const [hhStr, mmStr] = fmt.format(d).split(':');
      const hh = Number(hhStr), mm = Number(mmStr);

      if (hh >= QUIET_START.h) return true;                           // 22:00–23:59
      if (hh < QUIET_END.h)   return true;                            // 00:00–05:59
      if (hh === QUIET_END.h && mm < QUIET_END.m) return true;        // 06:00–06:14
      return false;
    }

    // Persistent unlock until running
    function unlockAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        audioCtx.resume().then(() => {
          if (audioCtx.state === 'running') {
            audioEnabled = true;
            document.removeEventListener('pointerdown', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
            updateAudioStatus();
            console.log('🔊 Audio unlocked');
          }
        }).catch(() => {});
      } catch (e) {}
    }
    document.addEventListener('pointerdown', unlockAudio);
    document.addEventListener('keydown',    unlockAudio);

    function getCooldownRemainingMs() {
      const now = Date.now();
      return Math.max(0, AUDIO_COOLDOWN_MS - (now - lastSoundAt));
    }

    function canPlayAlertSound() {
      if (!audioCtx || !audioEnabled) return false;
      if (audioCtx.state !== 'running') return false;
      return getCooldownRemainingMs() === 0;
    }

    // ===== Option B: Soft "Marimba" style chime with quiet-hours volume =====
    function playAlertSound() {
      if (!audioCtx || audioCtx.state !== 'running') return;

      const ctx = audioCtx;
      const now = ctx.currentTime;

      // Master gain with quiet-hours attenuation
      const master = ctx.createGain();
      const baseGain = 0.85; // daytime level
      const gainFactor = isQuietHours() ? (baseGain * NIGHT_ATTENUATION) : baseGain;
      master.gain.value = gainFactor;
      master.connect(ctx.destination);

      // Smooth lowpass to remove harshness
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 2000; // start lower than the "sweep bell"
      lp.Q.value = 0.8;
      lp.connect(master);

      // ADSR utility
      function applyADSR(g, t0, { a = 0.015, d = 0.22, s = 0.35, r = 0.35, peak = 0.85 }) {
        g.gain.cancelScheduledValues(t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(peak,      t0 + a);
        g.gain.linearRampToValueAtTime(peak * s,  t0 + a + d);
        g.gain.linearRampToValueAtTime(0.0001,    t0 + a + d + r);
      }

      // Marimba-like voice: sine + very low square partial
      function makeTone(freq, start, dur) {
        const oscSine   = ctx.createOscillator();
        const oscSquare = ctx.createOscillator();
        const gSine     = ctx.createGain();
        const gSquare   = ctx.createGain();

        oscSine.type = 'sine';
        oscSquare.type = 'square';

        oscSine.frequency.setValueAtTime(freq, now + start);
        oscSquare.frequency.setValueAtTime(freq, now + start);

        // Balance: sine main voice, square very low for woodiness
        gSine.gain.value   = 1.0;
        gSquare.gain.value = 0.18;

        oscSine.connect(gSine).connect(lp);
        oscSquare.connect(gSquare).connect(lp);

        // Gentle evolution: slight filter move to emulate bar resonance
        lp.frequency.cancelScheduledValues(now + start);
        lp.frequency.setValueAtTime(2000, now + start);
        lp.frequency.linearRampToValueAtTime(2600, now + start + 0.20);
        lp.frequency.linearRampToValueAtTime(1800, now + start + dur);

        // ADSR per partial
        applyADSR(gSine,   now + start, { a: 0.015, d: 0.22, s: 0.35, r: Math.max(0.28, dur - 0.05), peak: 0.85 });
        applyADSR(gSquare, now + start, { a: 0.010, d: 0.25, s: 0.25, r: Math.max(0.28, dur - 0.05), peak: 0.18 });

        const stopAt = now + start + dur + 0.03; // small tail to avoid clicks
        oscSine.start(now + start);
        oscSquare.start(now + start);
        oscSine.stop(stopAt);
        oscSquare.stop(stopAt);
      }

      // Two-note chime (gentle, control-room friendly)
      // A5 (880 Hz) then E6 (1319 Hz), with slight overlap
      makeTone(880.00,  0.00, 0.42);
      makeTone(1319.0,  0.24, 0.46);

      lastSoundAt = Date.now();
      localStorage.setItem('lastSoundAt', String(lastSoundAt));
      updateAudioStatus();
    }

    // Manual test that bypasses cooldown safely (still applies quiet-hours attenuation)
    function playTestChime() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(() => {
        audioEnabled = (audioCtx.state === 'running');
        if (!audioEnabled) { updateAudioStatus(); return; }
        const saved = lastSoundAt;
        try {
          lastSoundAt = 0; // bypass cooldown once for the test
          playAlertSound(); // uses the marimba-style chime above
        } finally {
          lastSoundAt = saved; // restore original cooldown timestamp
        }
      }).catch(() => {});
    }

    // ===== Tight Greater Manchester bounds (SW, NE) =====
    const GM_BOUNDS = [
      [-2.75, 53.33],  // Southwest (lon, lat)
      [-1.95, 53.62]   // Northeast (lon, lat)
    ];

    const FOCUS_ZOOM    = 12.00;
    const FOCUS_PITCH   = 30;
    const FOCUS_BEARING = 0;
    const FOCUS_MS      = 1200;

    // Your preferred default view (for returns)
    const DEFAULT_VIEW = {
      center: [-2.3214, 53.4306],
      zoom: 11.15,
      bearing: 0,
      pitch: 58
    };

    // ===== MAP (TomTom style URL) =====
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://api.tomtom.com/style/2/custom/style/dG9tdG9tQEBAaGFqWkVicnlCWER2bUhJaTsYyZt3W8VKY4lO983E0Ln7.json?key=0xMuCVT7V4oiP7NscvquS3oVpvQ7sPtP',
      center: DEFAULT_VIEW.center,
      zoom: DEFAULT_VIEW.zoom,
      bearing: DEFAULT_VIEW.bearing,
      pitch: DEFAULT_VIEW.pitch,
      maxBounds: GM_BOUNDS
    });

    // ===== Helpers: cache-bust query =====
    function withCacheBust(url){
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}ts=${Date.now()}`;
    }

    // ===== Shared proxy chain =====
    const PROXIES = [
      (url) => `https://occproxy-6dem.vercel.app/api/proxy?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    ];

    // ===== Waze fetch via proxy chain with JSON guard =====
    async function fetchViaProxies(url, signal){
      const busted = withCacheBust(url);
      const errors = [];
      for(const build of PROXIES){
        const proxied = build(busted);
        try{
          const res = await fetch(proxied, { cache:'no-store', signal });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const trimmed = text.replace(/^\uFEFF/, '').trim();
          if(!trimmed || trimmed[0] !== '{') throw new Error('Non-JSON response');
          return JSON.parse(trimmed);
        }catch(e){
          errors.push(`${proxied}: ${e.message}`);
        }
      }
      throw new Error(`All proxies failed\n${errors.join('\n')}`);
    }

    // ===== XML fetch via proxies (for National Highways RSS) =====
    async function fetchTextViaProxies(url, signal){
      const busted = withCacheBust(url);
      const errors = [];
      for(const build of PROXIES){
        const proxied = build(busted);
        try{
          const res = await fetch(proxied, { cache:'no-store', signal });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          if(!text || !text.trim()) throw new Error('Empty response');
          return text;
        }catch(e){
          errors.push(`${proxied}: ${e.message}`);
        }
      }
      throw new Error(`All proxies failed\n${errors.join('\n')}`);
    }

    // ===== Geo helpers =====
    function toRad(deg){ return deg * Math.PI / 180; }
    function haversineMeters([lon1, lat1], [lon2, lat2]){
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2
              + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ===== Feed shaping (Waze) =====
    function getLngLatFromAlert(a){
      try{
        if(a){
          if(a.location){
            const loc = a.location;
            if(typeof loc.x==='number' && typeof loc.y==='number') return [loc.x, loc.y];
            if(typeof loc.lon==='number' && typeof loc.lat==='number') return [loc.lon, loc.lat];
            if(Array.isArray(loc.coordinates) && loc.coordinates.length>=2) return [loc.coordinates[0], loc.coordinates[1]];
            if(loc.point && typeof loc.point.x==='number' && typeof loc.point.y==='number') return [loc.point.x, loc.point.y];
          }
          if(a.geometry?.coordinates && a.geometry.coordinates.length>=2){
            const c = a.geometry.coordinates; if(typeof c[0]==='number' && typeof c[1]==='number') return [c[0], c[1]];
          }
          if(typeof a.longitude==='number' && typeof a.latitude==='number') return [a.longitude, a.latitude];
        }
      }catch(e){}
      return null;
    }

    function alertsToPoints(feed){
      const out=[];
      const alerts = (feed && Array.isArray(feed.alerts)) ? feed.alerts : [];
      for(const a of alerts){
        const type = (a.type || a.alertType || '').toString().toUpperCase();
        if(type !== 'ACCIDENT') continue;

        const base = Number(a.confidence ?? a.confidenceLevel ?? a.level ?? 0) || 0;
        if(!(base > 0)) continue;

        const coord = getLngLatFromAlert(a);
        if(!coord) continue;

        const id = a.uuid || a.id || `${coord[0]},${coord[1]},${a.pubMillis || ''}`;
        out.push({
          id,
          coord,
          street: a.street || a.roadName || a.address || 'Unknown road',
          city: a.city || a.town || '',
          conf: base,
          time: a.pubMillis || a.updateTime || a.reportMillis || 0
        });
      }
      return out;
    }

    // ===== Clustering: confidence = MAX(member) + reinforcement =====
    function clusterAccidents(points, mergeMeters = MERGE_METERS){
      if(points.length === 0) return [];

      const parent = Array(points.length).fill(0).map((_,i)=>i);
      function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
      function union(a,b){ a=find(a); b=find(b); if(a!==b) parent[a]=b; }

      for(let i=0;i<points.length;i++){
        for(let j=i+1;j<points.length;j++){
          const d = haversineMeters(points[i].coord, points[j].coord);
          if(d <= mergeMeters) union(i,j);
        }
      }

      const groups = new Map();
      for(let i=0;i<points.length;i++){
        const r = find(i);
        if(!groups.has(r)) groups.set(r, []);
        groups.get(r).push(points[i]);
      }

      const clusters = [];
      for(const members of groups.values()){
        const count     = members.length;
        const maxConf   = members.reduce((m,p)=>Math.max(m, Number(p.conf)||0), 0);

        const bonusRaw  = (count - 1) * CLUSTER_BONUS_PER_REPORT;
        const bonus     = Math.min(CLUSTER_BONUS_MAX, Math.max(0, bonusRaw));
        const eff       = Math.min(5, Math.max(1, Math.round(maxConf + bonus)));

        const avg       = members.reduce((acc,m)=>[acc[0]+m.coord[0], acc[1]+m.coord[1]], [0,0]).map(v=>v/count);
        const maxTime   = members.reduce((t,m)=>Math.max(t, Number(m.time)||0), 0);
        const minTime   = members.reduce((t,m)=>Math.min(t, Number(m.time)||Infinity), Infinity);
        const firstTime = (minTime === Infinity) ? 0 : minTime;
        const ids       = members.map(m=>m.id).sort().join('+');

        const best = members.slice().sort((a,b)=>{
          const ce = (Number(b.conf)||0) - (Number(a.conf)||0);
          if(ce!==0) return ce;
          return (Number(b.time)||0) - (Number(a.time)||0);
        })[0];

        clusters.push({
          id: `cluster-${ids}`,
          coord: avg,
          street: best.street,
          city: best.city,
          eff,
          latestTime: maxTime,
          firstTime,
          count
        });
      }

      clusters.sort((a,b)=>{
        const ce = (Number(b.eff)||0) - (Number(a.eff)||0);
        if(ce!==0) return ce;
        return (Number(b.latestTime)||0) - (Number(a.latestTime)||0);
      });

      return clusters.map(c => ({
        type:'Feature',
        id: c.id,
        geometry:{ type:'Point', coordinates: c.coord },
        properties:{
          id: c.id,
          effectiveConfidence: c.eff,
          street: c.street,
          city: c.city,
          time: c.latestTime,
          firstReportedMillis: c.firstTime,
          reportCount: c.count
        }
      }));
    }

    // ===== Time formatting =====
    function formatFirstReported(ms){
      if(!ms || !isFinite(ms)) return 'Time unknown';
      try{
        return new Date(Number(ms)).toLocaleString('en-GB', {
          timeZone: 'Europe/London',
          hour12: false,
          year: 'numeric',
          month: 'short',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
      }catch(e){
        return 'Time unavailable';
      }
    }

    // ===== Canvas pulsing icon for high (>=4) =====
    function createPulsingDot(map, color='red'){
      const size = 340;
      const targetFps = 12;
      const frameMs = 1000 / targetFps;
      let last = 0;

      const fillColor = (on)=> color==='white' ? `rgba(255,255,255,${on?1:0.85})` : `rgba(255,0,0,${on?1:0.9})`;
      const ringColor = (on)=> color==='white' ? `rgba(255,255,255,${on?0.95:0.3})` : `rgba(255, 80, 80, ${on?0.95:0.15})`;

      return {
        width:size, height:size, data:new Uint8Array(size*size*4),
        onAdd:function(){
          const c=document.createElement('canvas'); c.width=this.width; c.height=this.height;
          this.context=c.getContext('2d');
        },
        render:function(){
          const now = performance.now();
          if(now - last < frameMs) return false;
          last = now;

          const duration = 1200; const t = (now % duration) / duration;
          const on = t < 0.5;

          const ctx=this.context, w=this.width, h=this.height;
          ctx.clearRect(0,0,w,h);

          const ringR = (w/2)*(0.30 + 0.20*t);
          ctx.beginPath(); ctx.arc(w/2,h/2, ringR, 0, Math.PI*2, false);
          ctx.fillStyle = ringColor(on); ctx.fill();

          ctx.beginPath(); ctx.arc(w/2,h/2, (w/2)*0.18, 0, Math.PI*2, false);
          ctx.fillStyle = fillColor(true);
          ctx.strokeStyle = 'rgba(255,255,255,1)';
          ctx.lineWidth = Math.max(2, w*0.025);
          ctx.fill(); ctx.stroke();

          const img=ctx.getImageData(0,0,w,h); this.data.set(img.data);

          map.triggerRepaint();
          return true;
        }
      };
    }

    // ===== OCC highlight dots (optional points) =====
    const HIGHLIGHT_POINTS = [
      // { name: 'TfGM HQ', coordinates: [-2.2455, 53.4793] },
    ];

    function buildHighlightsFC(points){
      const features = (points || []).filter(p =>
        Array.isArray(p?.coordinates) && p.coordinates.length >= 2 &&
        typeof p.coordinates[0] === 'number' && typeof p.coordinates[1] === 'number'
      ).map((p, i) => ({
        type: 'Feature',
        id: p.name ? `hl-${p.name}-${i}` : `hl-${i}`,
        geometry: { type: 'Point', coordinates: p.coordinates },
        properties: { name: p.name || '' }
      }));
      return { type: 'FeatureCollection', features };
    }

    function setHighlightPoints(points){
      const src = map.getSource('occ-highlights');
      const fc = buildHighlightsFC(points);
      if(src) src.setData(fc);
    }

    // ===== UI elements =====
    const barEl = document.getElementById('alert-bar');
    const locEl = document.getElementById('alert-location');
    const timeEl = document.getElementById('alert-time');
    const progressEl = document.getElementById('alert-progress');
    const healthWazeEl = document.getElementById('feed-health-waze');
    const healthHeEl   = document.getElementById('feed-health-he');
    const audioStatusEl = document.getElementById('audio-status');
    const soundTestBtn  = document.getElementById('sound-test');

    let queue = [], bannerActive = false, highlightedId = null;
    let highlightedCenter = null;
    let hideTimer = null;

    /* ===== SVG Scan helpers ===== */
    function initSvgScan() {
      const rect = document.querySelector('#svg-scan .scan-rect');
      const svg  = document.getElementById('svg-scan');
      if (!rect || !svg) return;

      const w = Math.max(0, window.innerWidth  - 2);
      const h = Math.max(0, window.innerHeight - 2);

      rect.setAttribute('x', '1');
      rect.setAttribute('y', '1');
      rect.setAttribute('width',  `${w}`);
      rect.setAttribute('height', `${h}`);

      const perimeter = 2 * (w + h);
      rect.style.strokeDasharray  = `${perimeter}`;
      rect.style.strokeDashoffset = `0`;
      document.documentElement.style.setProperty('--dashLen', `${perimeter}`);
    }
    window.addEventListener('resize', initSvgScan);
    initSvgScan();

    function runSvgScan() {
      document.body.classList.remove('scan-on');
      requestAnimationFrame(() => {
        document.body.classList.add('scan-on');
        setTimeout(() => document.body.classList.remove('scan-on'), 950);
      });
    }

    /* ===== Audio status ===== */
    let audioStatusTimer = null;
    function formatMs(ms){
      const s = Math.ceil(ms/1000);
      const m = Math.floor(s/60);
      const r = s % 60;
      return m > 0 ? `${m}:${String(r).padStart(2,'0')}` : `${r}s`;
    }
    function updateAudioStatus(){
      if (!audioStatusEl) return;
      if (!audioCtx || !audioEnabled || audioCtx.state !== 'running') {
        audioStatusEl.textContent = 'Audio: Locked — click anywhere or Test Chime';
        return;
      }
      const rem = getCooldownRemainingMs();
      const night = isQuietHours();
      if (rem > 0) {
        audioStatusEl.textContent = `Audio: Cooldown ${formatMs(rem)}${night ? ' (quiet hours)' : ''}`;
      } else {
        audioStatusEl.textContent = `Audio: Ready${night ? ' (quiet hours)' : ''}`;
      }
    }

    // ===== Alert bar show/hide & map camera control =====
    function setBarVisible(show){
      barEl.classList.toggle('show', show);
      barEl.setAttribute('aria-hidden', show ? 'false' : 'true');
      document.body.classList.toggle('bar-open', show);
      map.resize();

      if (show && highlightedCenter) {
        map.easeTo({
          center: highlightedCenter,

          essential: true
        });

      } else {
        // Smooth transition delay back to your default view
        setTimeout(() => {
          map.easeTo({
            center: DEFAULT_VIEW.center,
            zoom: DEFAULT_VIEW.zoom,
            bearing: DEFAULT_VIEW.bearing,
            pitch: DEFAULT_VIEW.pitch,
            duration: 1400,
            essential: true
          });

    }

    function updateHighlightFilters(){
      if(map.getLayer('accidents-high')){
        const filter = highlightedId
          ? [ "all", [">=", ["get","effectiveConfidence"], HIGH_CONF_MIN], ["!=", ["get","id"], highlightedId] ]
          : [ ">=", ["get","effectiveConfidence"], HIGH_CONF_MIN ];
        map.setFilter('accidents-high', filter);
      }
      if(map.getLayer('accident-highlighted')){
        const filter = highlightedId
          ? ["==", ["get","id"], highlightedId]
          : ["==", ["get","id"], "___none___"];
        map.setFilter('accident-highlighted', filter);
      }
    }

    function escapeHTML(str){
      return String(str).replace(/[&<>:"']/g, (ch) => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[ch]));
    }

    function stylizeRoad(street, city) {
      const s = escapeHTML((street || '').trim());
      const c = escapeHTML((city || '').trim());

      if (!s && !c) return 'Unknown road';

      const roadTokenRegex = /\b([MBA]\d{1,4})\b/i;

      let displayStreet = s;
      const match = s.match(roadTokenRegex);

      if (match) {
        const token = match[1].toUpperCase();
        const cls = token.startsWith('M') ? 'motorway'
                  : token.startsWith('A') ? 'aprimary'
                  : 'broad';
        displayStreet = s.replace(
          roadTokenRegex,
          `<span class="road-badge ${cls}">${token}</span>`
        );
      }

      const sep = c ? `<span class="road-sep">—</span>` : '';
      return `${displayStreet}${c ? `${sep}${c}` : ''}`;
    }

    function resetProgressBar() {
      if (!progressEl) return;
      progressEl.style.transition = 'none';
      progressEl.style.transform  = 'scaleX(1)';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          progressEl.style.transition = `transform ${ALERT_BAR_MS}ms linear`;
          progressEl.style.transform  = 'scaleX(0)';
        });
      });
    }

    function enqueueBanner(feature){
      const street = (feature.properties.street||'').trim() || 'Unknown road';
      const city   = (feature.properties.city||'').trim();
      const center = Array.isArray(feature.geometry?.coordinates) ? feature.geometry.coordinates : null;
      const firstMillis = Number(feature.properties.firstReportedMillis)||0;

      queue.push({ id: feature.id, street, city, center, firstMillis });
      if(!bannerActive) showNextBanner();
    }

    function showNextBanner(){
      if(bannerActive) return;
      const item = queue.shift(); if(!item) return;

      bannerActive = true;
      highlightedId = item.id;
      highlightedCenter = item.center;
      updateHighlightFilters();

      locEl.innerHTML = stylizeRoad(item.street, item.city);
      timeEl.textContent = `First reported: ${formatFirstReported(item.firstMillis)}`;

      setBarVisible(true);
      resetProgressBar();

      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      hideTimer = setTimeout(()=>{
        setBarVisible(false);
        highlightedId = null;
        highlightedCenter = null;
        updateHighlightFilters();
        bannerActive = false;
        showNextBanner();
      }, ALERT_BAR_MS);
    }

    const prevEffByClusterId = new Map();
    // Track brand-new clusters (after initial load) for sound trigger
    const seenClusterIds = new Set();
    let hasInitializedClusters = false;

    // ===== Global repaint ticker =====
    let repaintRAF = null;

    function layerExists(id){ try { return !!map.getLayer(id); } catch(e){ return false; } }

    function hasPulsingVisible(){
      if(!layerExists('accidents-high') && !layerExists('accident-highlighted')) return false;
      const red = layerExists('accidents-high') ? map.queryRenderedFeatures({layers:['accidents-high']}) : [];
      const white = layerExists('accident-highlighted') ? map.queryRenderedFeatures({layers:['accident-highlighted']}) : [];
      return (red && red.length > 0) || (white && white.length > 0);
    }

    function startGlobalRepaint(){
      if (repaintRAF) return;
      const tick = () => {
        if (hasPulsingVisible()) {
          map.triggerRepaint();
          repaintRAF = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(repaintRAF); repaintRAF = null;
        }
      };
      repaintRAF = requestAnimationFrame(tick);
    }

    // ===== Waze feed health tracking =====
    let lastOkWaze = 0;
    function markHealthOK_Waze(){
      lastOkWaze = Date.now();
      if(healthWazeEl){
        healthWazeEl.classList.remove('stale');
        healthWazeEl.classList.add('ok');
        healthWazeEl.textContent = `Waze: ${new Date(lastOkWaze).toLocaleTimeString('en-GB',{hour12:false})}`;
      }
    }
    function markHealthStale_Waze(errMsg){
      const staleSecs = Math.round((Date.now() - (lastOkWaze||Date.now()))/1000);
      if(healthWazeEl){
        healthWazeEl.classList.remove('ok');
        healthWazeEl.classList.add('stale');
        healthWazeEl.textContent = `Waze stale (${staleSecs}s)${errMsg? ' — ' + errMsg : ''}`;
      }
    }
    function clearAccidentsIfTooStale(){
      const staleMs = Date.now() - (lastOkWaze || 0);
      if (lastOkWaze && staleMs > STALE_CLEAR_MS) {
        map.getSource('accidents')?.setData({ type:'FeatureCollection', features:[] });
      }
    }

    // ===== Waze update loop =====
    let fetchTimer = null;
    let inFlight = null;
    let proxyStartIndex = 0;

    async function runCycle(){
      if (inFlight) { try{ inFlight.abort(); }catch(e){} inFlight = null; }

      const controller = new AbortController();
      inFlight = controller;

      const origOrder = PROXIES.slice();
      const rotated = PROXIES.slice(proxyStartIndex).concat(PROXIES.slice(0, proxyStartIndex));
      PROXIES.length = 0; PROXIES.push(...rotated);

      try{
        const data = await fetchViaProxies(WAZE_URL, controller.signal);
        const points = alertsToPoints(data);
        const clusterFeatures = clusterAccidents(points, MERGE_METERS);

        const geo = { type:'FeatureCollection', features: clusterFeatures };
        const src = map.getSource('accidents');
        if(src) src.setData(geo);

        // --- Detect brand-new clusters since initialisation ---
        let brandNewCount = 0;
        for (const f of clusterFeatures) {
          if (!seenClusterIds.has(f.id)) {
            if (hasInitializedClusters) {
              brandNewCount++;
            }
            seenClusterIds.add(f.id);
          }
        }

        // --- Existing high-confidence transition logic ---
        const newly = [];
        for(const f of clusterFeatures){
          const id = f.id;
          const newEff = Number(f.properties.effectiveConfidence||0);
          const oldEff = prevEffByClusterId.get(id);

          const becameHigh = (newEff >= HIGH_CONF_MIN) && (oldEff === undefined || oldEff < HIGH_CONF_MIN);
          const becameHigherHigh = SHOW_BANNER_ON_INCREASE && (newEff >= HIGH_CONF_MIN) && (oldEff !== undefined) && (newEff > oldEff);

          prevEffByClusterId.set(id, newEff);
          if (becameHigh || becameHigherHigh) newly.push(f);
        }

        // --- Play max one sound per cycle, respecting 15-min global cooldown ---
        if ((brandNewCount > 0 || newly.length > 0) && canPlayAlertSound()) {
          playAlertSound();
        }

        // Continue banner flow for high-confidence items
        if(newly.length){
          newly.sort((a,b)=>{
            const dc = (Number(b.properties.effectiveConfidence||0)) - (Number(a.properties.effectiveConfidence||0));
            if(dc!==0) return dc;
            return (Number(b.properties.time||0)) - (Number(a.properties.time||0));
          });
          newly.forEach(enqueueBanner);
        }

        // After first successful cycle, start treating unseen clusters as "new"
        hasInitializedClusters = true;

        proxyStartIndex = (proxyStartIndex + 1) % PROXIES.length;
        markHealthOK_Waze();
        scheduleNext(REFRESH_MS);
      }catch(e){
        console.error('Waze fetch failed:', e);
        markHealthStale_Waze(e?.message || 'request error');
        clearAccidentsIfTooStale();
        proxyStartIndex = (proxyStartIndex + 1) % PROXIES.length;
        scheduleNext(Math.min(REFRESH_MS * 2, 180000));
      }finally{
        PROXIES.length = 0; PROXIES.push(...origOrder);
        inFlight = null;
        startGlobalRepaint();
      }
    }

    function scheduleNext(ms){
      clearTimeout(fetchTimer);
      fetchTimer = setTimeout(runCycle, ms);
    }

    // ===== National Highways RSS parser → GeoJSON =====
    function tryNumber(v){
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function parseHeRss(xmlString){
      let doc;
      try{
        doc = new DOMParser().parseFromString(xmlString, 'text/xml');
      }catch(e){
        return { type:'FeatureCollection', features:[] };
      }
      const items = Array.from(doc.querySelectorAll('item'));
      const feats = [];

      for(const item of items){
        let lat = null, lon = null;

        // georss:point -> "lat lon"
        const geoPoint = item.querySelector('ge\\:point, georss\\:point, point');
        if(geoPoint && geoPoint.textContent){
          const parts = geoPoint.textContent.trim().split(/[ ,]+/);
          if(parts.length >= 2){
            lat = tryNumber(parts[0]); lon = tryNumber(parts[1]);
          }
        }

        // geo:lat + geo:long
        if(lat === null || lon === null){
          const latEl = item.querySelector('geo\\:lat, lat');
          const lonEl = item.querySelector('geo\\:long, lon, long');
          if(latEl && lonEl){
            lat = tryNumber(latEl.textContent);
            lon = tryNumber(lonEl.textContent);
          }
        }

        // Fallback: parse from link query (?lat=&lon=) or lonlat=lon,lat
        if((lat === null || lon === null) && item.querySelector('link')){
          try{
            const href = item.querySelector('link')?.textContent?.trim() || '';
            const u = new URL(href, location.href);
            const qLat = tryNumber(u.searchParams.get('lat'));
            const qLon = tryNumber(u.searchParams.get('lon') || u.searchParams.get('lng') || u.searchParams.get('long'));
            if(qLat != null && qLon != null){
              lat = qLat; lon = qLon;
            }else{
              const lonlat = u.searchParams.get('lonlat') || u.searchParams.get('ll');
              if(lonlat){
                const parts = lonlat.split(/[ ,]+/);
                if(parts.length >= 2){
                  const qLon2 = tryNumber(parts[0]); const qLat2 = tryNumber(parts[1]);
                  if(qLat2 != null && qLon2 != null){ lat = qLat2; lon = qLon2; }
                }
              }
            }
          }catch(e){}
        }

        if(lat == null || lon == null) continue;

        const title   = item.querySelector('title')?.textContent?.trim() || 'Unplanned event';
        const guid    = item.querySelector('guid')?.textContent?.trim() || `${lon},${lat},${title}`;
        const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';

        feats.push({
          type: 'Feature',
          id: `he-${guid}`,
          geometry: { type:'Point', coordinates:[lon, lat] },
          properties: { id:`he-${guid}`, title, pubDate }
        });
      }

      return { type:'FeatureCollection', features:feats };
    }

    // ===== Highways feed health tracking =====
    let lastOkHe = 0;
    function markHealthOK_He(){
      lastOkHe = Date.now();
      if(healthHeEl){
        healthHeEl.classList.remove('stale');
        healthHeEl.classList.add('ok');
        healthHeEl.textContent = `Highways: ${new Date(lastOkHe).toLocaleTimeString('en-GB',{hour12:false})}`;
      }
    }
    function markHealthStale_He(errMsg){
      const staleSecs = Math.round((Date.now() - (lastOkHe||Date.now()))/1000);
      if(healthHeEl){
        healthHeEl.classList.remove('ok');
        healthHeEl.classList.add('stale');
        healthHeEl.textContent = `Highways stale (${staleSecs}s)`;
      }
    }

    // ===== National Highways update loop (no banner/zoom/animation) =====
    let heTimer = null;
    let heInFlight = null;

    async function runHeCycle(){
      if(heInFlight){ try{ heInFlight.abort(); }catch(e){} heInFlight = null; }

      const controller = new AbortController();
      heInFlight = controller;

      try{
        const xml = await fetchTextViaProxies(HE_URL, controller.signal);
        const fc  = parseHeRss(xml);

        const src = map.getSource('he-unplanned');
        if(src) src.setData(fc);

        markHealthOK_He();
        scheduleHeNext(REFRESH_MS);
      }catch(e){
        console.error('Highways fetch failed:', e);
        markHealthStale_He(e?.message || 'request error');
        scheduleHeNext(Math.min(REFRESH_MS * 2, 180000));
      }finally{
        heInFlight = null;
      }
    }

    function scheduleHeNext(ms){
      clearTimeout(heTimer);
      heTimer = setTimeout(runHeCycle, ms);
    }

    // ===== Map setup =====
    map.on('load', async () => {
      // Start at your DEFAULT_VIEW camera
      // (If you prefer to fit bounds on first load, uncomment the next line)
      // map.fitBounds(GM_BOUNDS, { padding: 4, duration: 0 });

      // Images for pulsing (high = >=4)
      map.addImage('pulsing-red',   createPulsingDot(map,'red'),   { pixelRatio: 2 });
      map.addImage('pulsing-white', createPulsingDot(map,'white'), { pixelRatio: 2 });

      // Accident source
      map.addSource('accidents', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });

      // = 1 : small YELLOW circle
      map.addLayer({
        id:'accidents-one',
        type:'circle',
        source:'accidents',
        filter: ['==', ['get','effectiveConfidence'], 1],
        paint:{
          'circle-radius':['interpolate',['linear'],['zoom'], 8,3.0, 12,4.0, 16,5.5],
          'circle-color': varColor('--yellow', '#ffd000'),
          'circle-stroke-color': '#fff1a6',
          'circle-stroke-width': 1.0
        }
      });

      // = 2 : medium YELLOW circle
      map.addLayer({
        id:'accidents-two',
        type:'circle',
        source:'accidents',
        filter: ['==', ['get','effectiveConfidence'], 2],
        paint:{
          'circle-radius':['interpolate',['linear'],['zoom'], 8,4.4, 12,6.0, 16,7.4],
          'circle-color': varColor('--yellow', '#ffd000'),
          'circle-stroke-color': '#fff1a6',
          'circle-stroke-width': 1.2
        }
      });

      // = 3 : larger RED circle (non-pulsing)
      map.addLayer({
        id:'accidents-three',
        type:'circle',
        source:'accidents',
        filter: ['==', ['get','effectiveConfidence'], 3],
        paint:{
          'circle-radius':['interpolate',['linear'],['zoom'], 8,6.2, 12,8.2, 16,10.2],
          'circle-color': varColor('--red', '#ff0000'),
          'circle-stroke-color': '#ffd0d0',
          'circle-stroke-width': 1.6
        }
      });

      // ≥ 4 : pulsing RED symbols (high confidence)
      map.addLayer({
        id:'accidents-high',
        type:'symbol',
        source:'accidents',
        filter: [">=", ['get','effectiveConfidence'], HIGH_CONF_MIN],
        layout:{
          'icon-image':'pulsing-red',
          'icon-size':['interpolate',['linear'],['zoom'], 8,0.36, 12,0.62, 16,0.95],
          'icon-allow-overlap':true
        }
      });

      // Highlighted (bar’s referenced cluster) as pulsing WHITE
      map.addLayer({
        id:'accident-highlighted',
        type:'symbol',
        source:'accidents',
        filter: ["==", ["get","id"], "___none___"],
        layout:{
          'icon-image':'pulsing-white',
          'icon-size':['interpolate',['linear'],['zoom'], 8,0.36, 12,0.62, 16,0.95],
          'icon-allow-overlap':true
        }
      });

      // ===== Your OCC highlight dots =====
      map.addSource('occ-highlights', {
        type: 'geojson',
        data: buildHighlightsFC(HIGHLIGHT_POINTS)
      });

      map.addLayer({
        id: 'occ-highlights-dots',
        type: 'circle',
        source: 'occ-highlights',
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 3.2, 12, 4.2, 16, 5.8],
          'circle-color': '#28c76f',
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 1.2,
          'circle-blur': 0.03
        }
      });

      // --- National Highways (North West) blue dots (static) ---
      map.addSource('he-unplanned', {
        type: 'geojson',
        data: { type:'FeatureCollection', features:[] }
      });

      map.addLayer({
        id: 'he-unplanned-dots',
        type: 'circle',
        source: 'he-unplanned',
        paint: {
          'circle-radius': ['interpolate',['linear'],['zoom'], 8, 3.4, 12, 5.2, 16, 7.0],
          'circle-color': '#3a90ff',
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 1.2,
          'circle-blur': 0.03
        }
      });

      // Controlled update cycle (Waze)
      await runCycle();
      scheduleNext(REFRESH_MS);

      // Initial RSS fetch + schedule (Highways)
      await runHeCycle();
      scheduleHeNext(REFRESH_MS);

      // Start global repaint ticker once the style and layers exist
      startGlobalRepaint();

      // Init audio status
      updateAudioStatus();
      if (audioStatusTimer) clearInterval(audioStatusTimer);
      audioStatusTimer = setInterval(updateAudioStatus, 1000);
    });

    // Keep ticker alive after map activity
    map.on('idle', startGlobalRepaint);
    map.on('moveend', startGlobalRepaint);
    map.on('zoomend', startGlobalRepaint);

    // Maintain layout when window resizes
    window.addEventListener('resize', () => { map.resize(); startGlobalRepaint(); });

    // ===== Utility: read CSS variable (fallback to provided colour) =====
    function varColor(varName, fallback){
      try{
        const val = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
        return val || fallback;
      }catch(e){
        return fallback;
      }
    }

    // ===== Wire up Test Chime button =====
    if (soundTestBtn) {
      soundTestBtn.addEventListener('click', () => {
        playTestChime();
      });
    }
  </script>
