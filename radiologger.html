<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Logger</title>
<style>
:root{--yellow:#ffdd00;--yellow-hover:#ffe84d;--black:#111;--panel:#1b1b1b;--panel-light:#262626;--border:#454545;--white:#fff;--muted:#b8b8b8;--green:#36d17c;--red:#ff5a5a}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--black);color:var(--white);font-family:"Segoe UI",Arial,sans-serif}button,input,textarea{font:inherit}button{touch-action:manipulation}
.app{width:100%;height:100vh;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;gap:7px;padding:8px;overflow:hidden}
.header{min-height:44px;display:flex;align-items:center;padding:7px 12px;background:var(--yellow);color:var(--black);border-radius:7px}.header-title{margin:0;font-size:clamp(20px,1.7vw,30px);font-weight:850;line-height:1;letter-spacing:-.5px}
.quick-entry-bar{display:grid;grid-template-columns:auto minmax(260px,560px) auto minmax(0,1fr);align-items:center;gap:10px;min-height:58px;padding:8px 10px;background:#171717;border:2px solid var(--yellow);border-radius:8px;box-shadow:0 0 0 1px rgba(255,221,0,.12),0 5px 16px rgba(0,0,0,.28)}
.quick-entry-label{color:var(--yellow);font-size:13px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}.quick-entry-input{width:100%;min-width:0;height:40px;padding:7px 12px;border:2px solid #666;border-radius:6px;outline:none;background:#050505;color:var(--white);font-family:Consolas,"Courier New",monospace;font-size:17px;font-weight:800;text-transform:uppercase}.quick-entry-input:focus{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(255,221,0,.12)}.quick-entry-input::placeholder{color:#747474;text-transform:none}.quick-entry-button{height:40px;padding:4px 22px;border:2px solid var(--yellow);border-radius:6px;background:var(--yellow);color:var(--black);cursor:pointer;font-size:14px;font-weight:900;letter-spacing:.35px}.quick-entry-button:hover{background:var(--yellow-hover)}.quick-entry-help{min-width:0;overflow:hidden;color:#d0d0d0;font-size:11px;font-weight:700;line-height:1.25}
.panel{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:7px}.section-header{display:flex;align-items:center;gap:8px;margin-bottom:5px}.section-number{flex:0 0 auto;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;background:var(--yellow);color:var(--black);font-size:12px;font-weight:900}.section-title{margin:0;color:var(--yellow);font-size:14px;font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.45px}
.call-sign-layout{display:grid;grid-template-columns:1fr 2.7fr;gap:7px}.button-grid{display:grid;gap:4px}.letter-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.number-grid{grid-template-columns:repeat(17,minmax(0,1fr))}.location-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.choice-button{min-width:0;min-height:30px;overflow:hidden;padding:5px 6px;border:1px solid #575757;border-radius:5px;background:var(--panel-light);color:var(--white);cursor:pointer;font-weight:700;line-height:1.08}.choice-button:hover{border-color:var(--yellow);background:#303030}.choice-button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}.choice-button.selected{border-color:var(--yellow);background:var(--yellow);color:var(--black);box-shadow:inset 0 0 0 1px var(--black)}.letter-button{font-size:clamp(11px,.8vw,14px)}.number-button{min-height:29px;padding:2px;font-size:12px}
.location-panel{min-height:0;overflow:hidden}.location-button{min-height:38px;padding:4px 5px;font-size:clamp(9px,.68vw,12px)}.location-code{display:inline-block;margin-right:5px;padding:2px 4px;border-radius:3px;background:var(--yellow);color:var(--black);font-size:10px;font-weight:900;letter-spacing:.35px}.location-name{vertical-align:middle}.location-button.selected .location-code{background:var(--black);color:var(--yellow)}.other-button{background:#303030;border-color:var(--yellow);color:var(--yellow)}.other-location-row{display:none;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:7px;margin-top:5px}.other-location-row.visible{display:grid}.other-label{color:var(--yellow);font-size:12px;font-weight:800}
.details-grid{min-height:0;display:grid;grid-template-columns:minmax(95px,.3fr) minmax(125px,.43fr) minmax(125px,.48fr) minmax(275px,1.1fr) minmax(245px,1.05fr) minmax(275px,1.3fr);gap:7px}.details-grid .panel{min-height:0;display:flex;flex-direction:column}.text-input,.message-input{width:100%;min-width:0;border:2px solid #555;border-radius:5px;outline:none;background:#080808;color:var(--white)}.text-input{height:38px;padding:7px 10px;font-size:15px;font-weight:700}.message-input{flex:1;min-height:55px;padding:8px 10px;resize:none;font-size:14px;line-height:1.3}.text-input:focus,.message-input:focus{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(255,221,0,.14)}.text-input::placeholder,.message-input::placeholder{color:#858585}.route-info{margin-top:5px;color:var(--yellow);font-size:10px;font-weight:700;line-height:1.2;min-height:12px}
.response-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.response-service{grid-column:1/-1;color:var(--white);font-size:11px;font-weight:850;text-align:center;margin-top:2px}.response-button{min-height:29px;padding:4px;font-size:11px}.site-button{grid-column:1/-1;min-height:30px;margin-top:1px}.response-log-row{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px;align-items:center;margin-bottom:2px}.response-log-prefix{color:var(--yellow);font-weight:900}.response-log-input{height:31px}
.output-box{flex:1;min-height:55px;overflow:auto;padding:8px 10px;border:2px solid var(--yellow);border-radius:5px;background:#050505;color:var(--yellow);font-size:clamp(13px,.95vw,17px);font-weight:750;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}.footer-actions{display:flex;justify-content:flex-end;align-items:center;gap:7px}.action-button{min-height:36px;padding:7px 18px;border:1px solid var(--yellow);border-radius:5px;cursor:pointer;font-size:13px;font-weight:850}.copy-button{background:var(--yellow);color:var(--black)}.copy-clear-button{background:var(--black);color:var(--yellow)}.reset-button{border-color:#666;background:#242424;color:var(--white)}
@media(max-height:760px){.app{gap:5px;padding:5px}.header{min-height:38px;padding:5px 9px}.quick-entry-bar{min-height:48px;padding:5px 7px}.quick-entry-input,.quick-entry-button{height:34px}.panel{padding:5px}.section-header{margin-bottom:4px}.section-number{width:20px;height:20px;font-size:10px}.section-title{font-size:12px}.choice-button{min-height:25px}.number-button{min-height:24px}.location-button{min-height:31px;padding:2px 4px}.text-input{height:32px}.message-input,.output-box{min-height:42px}.response-button{min-height:24px}.site-button{min-height:25px}.action-button{min-height:32px}}
@media(max-width:1400px){.details-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1150px){html,body{overflow:auto}.app{height:auto;min-height:100vh;overflow:visible}.quick-entry-bar{grid-template-columns:auto minmax(0,1fr) auto}.quick-entry-help{grid-column:1/-1}.location-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.number-grid{grid-template-columns:repeat(12,minmax(0,1fr))}.details-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.quick-entry-bar{grid-template-columns:1fr auto}.quick-entry-label,.quick-entry-help{display:none}.call-sign-layout{grid-template-columns:1fr}.letter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.number-grid{grid-template-columns:repeat(7,minmax(0,1fr))}.location-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.details-grid{grid-template-columns:1fr 1fr}.details-grid .panel:nth-child(n+3){grid-column:1/-1}.footer-actions{display:grid;grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="header"><h1 class="header-title">Radio Logger</h1></header>
<section class="quick-entry-bar" aria-label="Universal quick entry">
<label class="quick-entry-label" for="quickEntryInput">Quick entry</label>
<input id="quickEntryInput" class="quick-entry-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
<button id="applyQuickEntryButton" class="quick-entry-button" type="button">APPLY</button>
</section>
<section class="call-sign-layout">
<div class="panel"><div class="section-header"><span class="section-number">1</span><h2 class="section-title">Radio callsign</h2></div><div id="letterButtons" class="button-grid letter-grid"></div></div>
<div class="panel"><div class="section-header"><span class="section-number">2</span><h2 class="section-title">Callsign number</h2></div><div id="numberButtons" class="button-grid number-grid"></div></div>
</section>
<section class="panel location-panel"><div class="section-header"><span class="section-number">3</span><h2 class="section-title">Location</h2></div><div id="locationButtons" class="button-grid location-grid"></div><div id="otherLocationRow" class="other-location-row"><label class="other-label" for="otherLocationInput">OTHER LOCATION</label><input id="otherLocationInput" class="text-input" type="text" autocomplete="off" placeholder="Type the location"></div></section>
<section class="details-grid">
<div class="panel"><div class="section-header"><span class="section-number">4</span><h2 class="section-title">Stand</h2></div><input id="standInput" class="text-input" type="text" maxlength="10" autocomplete="off" placeholder="A, 12, CZ..."></div>
<div class="panel"><div class="section-header"><span class="section-number">5</span><h2 class="section-title">Service number</h2></div><input id="serviceInput" class="text-input" type="text" autocomplete="off" placeholder="e.g. 192 or X50"><div id="routeInfo" class="route-info">Loading route data...</div></div>
<div class="panel"><div class="section-header"><span class="section-number">6</span><h2 class="section-title">Fleet number</h2></div><input id="fleetInput" class="text-input" type="text" maxlength="10" autocomplete="off" placeholder="e.g. 37123 or VEH123"></div>
<div class="panel"><div class="section-header"><span class="section-number">7</span><h2 class="section-title">Response</h2></div><div class="response-grid">
<div class="response-service">LOG</div><div class="response-log-row"><span class="response-log-prefix">L</span><input id="gmpLogInput" class="text-input response-log-input" type="text" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="3 or 4 digits"></div>
<div class="response-service">NWAS</div><button class="choice-button response-button" type="button" data-service="NWAS" data-status="CALLED">CALLED</button><button class="choice-button response-button" type="button" data-service="NWAS" data-status="ON SITE">ON SITE</button><button class="choice-button response-button" type="button" data-service="NWAS" data-status="LEFT">LEFT</button>
<div class="response-service">GMP</div><button class="choice-button response-button" type="button" data-service="GMP" data-status="CALLED">CALLED</button><button class="choice-button response-button" type="button" data-service="GMP" data-status="ON SITE">ON SITE</button><button class="choice-button response-button" type="button" data-service="GMP" data-status="LEFT">LEFT</button>
<div class="response-service">SITE CO-ORDINATOR</div><button id="siteCoordinatorButton" class="choice-button response-button site-button" type="button">AWARE</button>
<div class="response-service">EYES ON</div><button id="eyesOnButton" class="choice-button response-button" type="button">REQUESTED</button><button id="eyesOffButton" class="choice-button response-button" type="button">EYES OFF</button>
</div></div>
<div class="panel"><div class="section-header"><span class="section-number">8</span><h2 class="section-title">Message received</h2></div><textarea id="messageInput" class="message-input" spellcheck="true" placeholder="Type the radio message received..."></textarea></div>
<div class="panel"><div class="section-header"><span class="section-number">9</span><h2 class="section-title">IMS output</h2></div><div id="outputBox" class="output-box" aria-live="polite"></div></div>
</section>
<footer class="footer-actions"><button id="copyButton" class="action-button copy-button" type="button">COPY LOG</button><button id="copyClearButton" class="action-button copy-clear-button" type="button">COPY &amp; CLEAR</button><button id="resetButton" class="action-button reset-button" type="button">CLEAR</button></footer>
</main>
<script>
(function(){
"use strict";
const ROUTES_URL="https://ryanocc.github.io/Routes.csv";
const radioGroups=[{label:"Bravo",code:"B"},{label:"Sierra",code:"S"},{label:"Mike",code:"M"},{label:"Tango-Sierra",code:"TS"},{label:"Tango-Alpha",code:"TA"},{label:"November",code:"N"}];
const locations=[
{code:"ALI",aliases:["ALI","ALT","ALTY"],name:"Altrincham Interchange"},{code:"ASI",aliases:["ASI","ASH","AUL"],name:"Ashton-under-Lyne Interchange"},{code:"BLI",aliases:["BLI","BON","BOL"],name:"Bolton Interchange"},{code:"BRI",aliases:["BRI","BRY","BUR","BURY"],name:"Bury Interchange"},{code:"ECI",aliases:["ECI","ECC","ECL"],name:"Eccles Interchange"},{code:"HYD",aliases:["HYD","HYDE"],name:"Hyde Bus Station"},{code:"LEI",aliases:["LEI","LBS"],name:"Leigh Bus Station"},{code:"MAP",aliases:["MAP","MIA","MAR"],name:"Manchester Airport Bus Station"},{code:"MAN",aliases:["MAN","PIC","PAR","PKS"],name:"Manchester Piccadilly Gardens"},{code:"MID",aliases:["MID"],name:"Middleton Bus Station"},{code:"OLD",aliases:["OLD","OBS"],name:"Oldham Bus Station"},{code:"ROI",aliases:["ROI","ROC","RCH"],name:"Rochdale Interchange"},{code:"SHI",aliases:["SHI","SHU"],name:"Shudehill Interchange"},{code:"STO",aliases:["STO","SPT"],name:"Stockport Interchange"},{code:"TRA",aliases:["TRA","TRC","TRF"],name:"The Trafford Centre Bus Station"},{code:"WGB",aliases:["WGB","WIG","WGN"],name:"Wigan Bus Station"},{code:"WYI",aliases:["WYI","WYT","WTH"],name:"Wythenshawe Interchange"},{code:"OTH",aliases:["OTH"],name:"Other"}];
let selectedLetterCode="",selectedCallsignNumber="",selectedLocation="",gmpLogNumber="",siteCoordinatorAware=false,eyesStatus="",routes=[],quickHistory=[];
const responseSelections={NWAS:"",GMP:""};
const $=id=>document.getElementById(id);
const letterButtonsContainer=$("letterButtons"),numberButtonsContainer=$("numberButtons"),locationButtonsContainer=$("locationButtons"),otherLocationRow=$("otherLocationRow"),otherLocationInput=$("otherLocationInput"),standInput=$("standInput"),serviceInput=$("serviceInput"),routeInfo=$("routeInfo"),fleetInput=$("fleetInput"),gmpLogInput=$("gmpLogInput"),messageInput=$("messageInput"),outputBox=$("outputBox"),copyButton=$("copyButton"),copyClearButton=$("copyClearButton"),resetButton=$("resetButton"),quickEntryInput=$("quickEntryInput"),applyQuickEntryButton=$("applyQuickEntryButton"),siteCoordinatorButton=$("siteCoordinatorButton"),eyesOnButton=$("eyesOnButton"),eyesOffButton=$("eyesOffButton");
const responseButtons=document.querySelectorAll("[data-service][data-status]");
function clearSelectedButtons(container){container.querySelectorAll(".choice-button").forEach(button=>button.classList.remove("selected"));}
function createButtons(){radioGroups.forEach(group=>{const button=document.createElement("button");button.type="button";button.className="choice-button letter-button";button.textContent=group.label;button.dataset.code=group.code;button.onclick=()=>selectCallsignLetter(group.code);letterButtonsContainer.appendChild(button);});for(let number=1;number<=34;number++){const button=document.createElement("button");button.type="button";button.className="choice-button number-button";button.textContent=String(number);button.dataset.number=String(number);button.onclick=()=>selectCallsignNumber(String(number));numberButtonsContainer.appendChild(button);}locations.forEach(item=>{const button=document.createElement("button"),code=document.createElement("span"),name=document.createElement("span");button.type="button";button.className="choice-button location-button";button.dataset.location=item.name;button.dataset.locationCode=item.code;button.title="Quick-entry codes: @"+item.aliases.join(", @")+" | "+item.name;code.className="location-code";code.textContent=item.code;name.className="location-name";name.textContent=item.name;button.append(code,name);if(item.name==="Other")button.classList.add("other-button");button.onclick=()=>selectLocation(item);locationButtonsContainer.appendChild(button);});}
function selectCallsignLetter(code){selectedLetterCode=code;clearSelectedButtons(letterButtonsContainer);letterButtonsContainer.querySelector('[data-code="'+code+'"]')?.classList.add("selected");updateOutput();}
function selectCallsignNumber(number){selectedCallsignNumber=number;clearSelectedButtons(numberButtonsContainer);numberButtonsContainer.querySelector('[data-number="'+number+'"]')?.classList.add("selected");updateOutput();}
function selectLocation(item){selectedLocation=item.name;clearSelectedButtons(locationButtonsContainer);locationButtonsContainer.querySelector('[data-location-code="'+item.code+'"]')?.classList.add("selected");if(item.name==="Other"){otherLocationRow.classList.add("visible");setTimeout(()=>otherLocationInput.focus(),0);}else{otherLocationRow.classList.remove("visible");otherLocationInput.value="";}updateOutput();}
function setResponse(service,status,toggle){const same=responseSelections[service]===status;document.querySelectorAll('[data-service="'+service+'"]').forEach(button=>button.classList.remove("selected"));responseSelections[service]=toggle&&same?"":status;if(responseSelections[service])document.querySelector('[data-service="'+service+'"][data-status="'+status+'"]')?.classList.add("selected");updateOutput();}
function setEyesStatus(status,toggle=true){eyesStatus=toggle&&eyesStatus===status?"":status;eyesOnButton.classList.toggle("selected",eyesStatus==="ON");eyesOffButton.classList.toggle("selected",eyesStatus==="OFF");updateOutput();}
function setupResponseButtons(){responseButtons.forEach(button=>button.onclick=()=>setResponse(button.dataset.service,button.dataset.status,true));siteCoordinatorButton.onclick=()=>{siteCoordinatorAware=!siteCoordinatorAware;siteCoordinatorButton.classList.toggle("selected",siteCoordinatorAware);updateOutput();};eyesOnButton.onclick=()=>setEyesStatus("ON");eyesOffButton.onclick=()=>setEyesStatus("OFF");}
function cleanAlphanumeric(value){return value.replace(/[^a-z0-9]/gi,"").toUpperCase();}
function normaliseStand(){const value=cleanAlphanumeric(standInput.value).slice(0,10);standInput.value=value;return value;}
function normaliseService(){const value=cleanAlphanumeric(serviceInput.value);serviceInput.value=value;return value;}
function normaliseFleet(){const value=cleanAlphanumeric(fleetInput.value).slice(0,10);fleetInput.value=value;return value;}
function normaliseLog(){const value=gmpLogInput.value.replace(/\D/g,"").slice(0,4);gmpLogInput.value=value;gmpLogNumber=value;return value;}
function getLocationText(){return selectedLocation==="Other"?otherLocationInput.value.trim():selectedLocation;}
function getRouteMatch(){const service=normaliseService();return service?routes.find(route=>route.route.toUpperCase()===service.toUpperCase())||null:null;}
function refreshRouteInfo(){const service=normaliseService(),match=getRouteMatch();if(!service){routeInfo.textContent=routes.length?"Enter a service to look it up.":"Route data unavailable.";return;}if(match){const details=[match.description,match.operator].filter(Boolean);routeInfo.textContent=details.length?details.join(" · "):"Route found, but no description or operator is listed.";return;}routeInfo.textContent=routes.length?"No matching route found.":"Route data unavailable.";}
function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===","&&!quoted){row.push(field);field="";}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&n==="\n")i++;row.push(field);if(row.some(value=>value.trim()!==""))rows.push(row);row=[];field="";}else field+=c;}row.push(field);if(row.some(value=>value.trim()!==""))rows.push(row);if(!rows.length)return[];const headers=rows.shift().map(header=>header.trim().toLowerCase());return rows.map(values=>Object.fromEntries(headers.map((header,index)=>[header,(values[index]||"").trim()])));}
async function loadRoutes(){try{const response=await fetch(ROUTES_URL,{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);routes=parseCSV(await response.text()).filter(route=>route.route);refreshRouteInfo();updateOutput();}catch(error){routes=[];routeInfo.textContent="Route data unavailable.";console.warn("Could not load Routes.csv:",error);}}
function getTodayDDMMYY(){const date=new Date();return String(date.getDate()).padStart(2,"0")+String(date.getMonth()+1).padStart(2,"0")+String(date.getFullYear()).slice(-2);}
function buildOutputText(){const callsign=selectedLetterCode+selectedCallsignNumber,location=getLocationText(),stand=normaliseStand(),service=normaliseService(),fleet=normaliseFleet(),message=messageInput.value.trim(),routeMatch=getRouteMatch(),positionParts=[],updates=[];let heading="🔈";if(callsign)heading+=" "+callsign;if(fleet){heading+=" on "+fleet;if(service)heading+=routeMatch&&routeMatch.operator?" operating a "+routeMatch.operator+" "+service+" service":" operating service "+service;}else if(service){heading+=routeMatch&&routeMatch.operator?" on a "+routeMatch.operator+" "+service+" service":" on service "+service;}if(stand)positionParts.push("Stand "+stand);if(location)positionParts.push(location);if(positionParts.length)heading+=" at "+positionParts.join(", ");heading+=" :";let result=heading;if(message)result+="\n"+message;if(gmpLogNumber)updates.push("GMP Log "+gmpLogNumber+"-"+getTodayDDMMYY());if(responseSelections.NWAS)updates.push("NWAS "+responseSelections.NWAS);if(responseSelections.GMP)updates.push("GMP "+responseSelections.GMP);if(siteCoordinatorAware)updates.push("SITE COORDINATOR AWARE");if(eyesStatus==="ON")updates.push("EYES ON");if(eyesStatus==="OFF")updates.push("EYES OFF");if(updates.length)result+="\n\n// "+updates.join(" | ");return result;}
function updateOutput(){refreshRouteInfo();outputBox.textContent=buildOutputText();}
function captureState(){return{selectedLetterCode,selectedCallsignNumber,selectedLocation,gmpLogNumber,siteCoordinatorAware,eyesStatus,NWAS:responseSelections.NWAS,GMP:responseSelections.GMP,otherLocation:otherLocationInput.value,stand:standInput.value,service:serviceInput.value,fleet:fleetInput.value,message:messageInput.value};}
function restoreState(state){selectedLetterCode=state.selectedLetterCode;selectedCallsignNumber=state.selectedCallsignNumber;selectedLocation=state.selectedLocation;gmpLogNumber=state.gmpLogNumber;siteCoordinatorAware=state.siteCoordinatorAware;eyesStatus=state.eyesStatus;responseSelections.NWAS=state.NWAS;responseSelections.GMP=state.GMP;otherLocationInput.value=state.otherLocation;standInput.value=state.stand;serviceInput.value=state.service;fleetInput.value=state.fleet;gmpLogInput.value=state.gmpLogNumber;messageInput.value=state.message;syncUI();updateOutput();}
function syncUI(){clearSelectedButtons(letterButtonsContainer);clearSelectedButtons(numberButtonsContainer);clearSelectedButtons(locationButtonsContainer);if(selectedLetterCode)letterButtonsContainer.querySelector('[data-code="'+selectedLetterCode+'"]')?.classList.add("selected");if(selectedCallsignNumber)numberButtonsContainer.querySelector('[data-number="'+selectedCallsignNumber+'"]')?.classList.add("selected");const item=locations.find(location=>location.name===selectedLocation);if(item)locationButtonsContainer.querySelector('[data-location-code="'+item.code+'"]')?.classList.add("selected");otherLocationRow.classList.toggle("visible",selectedLocation==="Other");responseButtons.forEach(button=>button.classList.toggle("selected",responseSelections[button.dataset.service]===button.dataset.status));siteCoordinatorButton.classList.toggle("selected",siteCoordinatorAware);eyesOnButton.classList.toggle("selected",eyesStatus==="ON");eyesOffButton.classList.toggle("selected",eyesStatus==="OFF");}
function scratchLast(){if(!quickHistory.length)return;restoreState(quickHistory.pop());quickEntryInput.value="";quickEntryInput.focus();}
async function applyQuickEntry(){const raw=quickEntryInput.value.trim();if(!raw){quickEntryInput.focus();return;}const upper=raw.toUpperCase();if(upper==="COP"){quickEntryInput.value="";await copyToClipboard();quickEntryInput.focus();return;}if(upper==="CLR"){clearForm();return;}if(upper==="XX"){scratchLast();return;}const before=captureState();let recognised=true;const standMatch=upper.match(/^\/([A-Z0-9]+)$/),serviceMatch=upper.match(/^#([A-Z0-9]+)$/),fleetMatch=upper.match(/^F([0-9]{4,5}|[A-Z]{2,3}[0-9]{3})$/),logMatch=upper.match(/^L([0-9]{3,4})$/),locationMatch=upper.match(/^@([A-Z0-9]+)$/),callsignMatch=upper.match(/^(TS|TA|B|S|M|N)([0-9]{1,2})$/);if(standMatch)standInput.value=standMatch[1];else if(serviceMatch)serviceInput.value=serviceMatch[1];else if(fleetMatch)fleetInput.value=fleetMatch[1];else if(logMatch){gmpLogNumber=logMatch[1];gmpLogInput.value=gmpLogNumber;}else if(["GMPC","GMPO","GMP/","NWASC","NWASO","NWAS/","SA","EO","EOF"].includes(upper)){if(upper==="GMPC")setResponse("GMP","CALLED",false);if(upper==="GMPO")setResponse("GMP","ON SITE",false);if(upper==="GMP/")setResponse("GMP","LEFT",false);if(upper==="NWASC")setResponse("NWAS","CALLED",false);if(upper==="NWASO")setResponse("NWAS","ON SITE",false);if(upper==="NWAS/")setResponse("NWAS","LEFT",false);if(upper==="SA"){siteCoordinatorAware=true;siteCoordinatorButton.classList.add("selected");}if(upper==="EO")setEyesStatus("ON",false);if(upper==="EOF")setEyesStatus("OFF",false);}else if(callsignMatch&&Number(callsignMatch[2])>=1&&Number(callsignMatch[2])<=34){selectCallsignLetter(callsignMatch[1]);selectCallsignNumber(String(Number(callsignMatch[2])));}else if(locationMatch){const item=locations.find(location=>location.aliases.includes(locationMatch[1]));if(item)selectLocation(item);else recognised=false;}else if(raw.length>2)messageInput.value=raw;else recognised=false;if(!recognised){quickEntryInput.select();return;}quickHistory.push(before);quickEntryInput.value="";updateOutput();if(upper==="@OTH")setTimeout(()=>otherLocationInput.focus(),0);else quickEntryInput.focus();}
async function copyToClipboard(){const text=buildOutputText();try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else fallbackCopy(text);return true;}catch(error){try{fallbackCopy(text);return true;}catch(fallbackError){return false;}}}
function fallbackCopy(text){const area=document.createElement("textarea");area.value=text;area.setAttribute("readonly","");area.style.position="fixed";area.style.left="-9999px";document.body.appendChild(area);area.select();const copied=document.execCommand("copy");area.remove();if(!copied)throw new Error("Copy failed");}
function clearForm(){selectedLetterCode="";selectedCallsignNumber="";selectedLocation="";gmpLogNumber="";siteCoordinatorAware=false;eyesStatus="";responseSelections.NWAS="";responseSelections.GMP="";otherLocationInput.value="";standInput.value="";serviceInput.value="";fleetInput.value="";gmpLogInput.value="";messageInput.value="";quickEntryInput.value="";quickHistory=[];syncUI();updateOutput();quickEntryInput.focus();}
applyQuickEntryButton.onclick=applyQuickEntry;quickEntryInput.onkeydown=event=>{if(event.key==="Enter"){event.preventDefault();applyQuickEntry();}};otherLocationInput.oninput=updateOutput;otherLocationInput.onkeydown=event=>{if(event.key==="Enter"){event.preventDefault();updateOutput();quickEntryInput.focus();}};standInput.oninput=()=>{normaliseStand();updateOutput();};serviceInput.oninput=()=>{normaliseService();updateOutput();};fleetInput.oninput=()=>{normaliseFleet();updateOutput();};gmpLogInput.oninput=()=>{normaliseLog();updateOutput();};messageInput.oninput=updateOutput;copyButton.onclick=copyToClipboard;copyClearButton.onclick=async()=>{if(await copyToClipboard())clearForm();};resetButton.onclick=clearForm;createButtons();setupResponseButtons();updateOutput();loadRoutes();quickEntryInput.focus();
})();
