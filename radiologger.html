<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Logger</title>
<style>
    :root {
        --yellow: #ffdd00;
        --yellow-hover: #ffe84d;
        --black: #111111;
        --panel: #1b1b1b;
        --panel-light: #262626;
        --border: #454545;
        --white: #ffffff;
        --muted: #b8b8b8;
        --green: #36d17c;
        --red: #ff5a5a;
    }

    * { box-sizing: border-box; }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    body {
        background: var(--black);
        color: var(--white);
        font-family: "Segoe UI", Arial, sans-serif;
    }

    button,
    input,
    textarea { font: inherit; }

    button { touch-action: manipulation; }

    .app {
        width: 100%;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
        gap: 7px;
        padding: 8px;
        overflow: hidden;
    }

    .header {
        min-height: 44px;
        display: flex;
        align-items: center;
        padding: 7px 12px;
        background: var(--yellow);
        color: var(--black);
        border-radius: 7px;
    }

    .header-title {
        margin: 0;
        font-size: clamp(20px, 1.7vw, 30px);
        font-weight: 850;
        line-height: 1;
        letter-spacing: -0.5px;
    }

    .quick-code-bar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        padding: 4px 7px;
        background: #171717;
        border: 1px solid var(--border);
        border-radius: 7px;
    }

    .quick-code-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .quick-code-input {
        width: 100%;
        min-width: 0;
        height: 26px;
        padding: 3px 8px;
        border: 1px solid #555555;
        border-radius: 4px;
        outline: none;
        background: #080808;
        color: var(--white);
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        font-weight: 700;
    }

    .quick-code-input:focus {
        border-color: var(--yellow);
        box-shadow: 0 0 0 2px rgba(255, 221, 0, 0.12);
    }

    .quick-code-input::placeholder { color: #747474; }

    .quick-code-button {
        height: 26px;
        padding: 2px 12px;
        border: 1px solid var(--yellow);
        border-radius: 4px;
        background: var(--yellow);
        color: var(--black);
        cursor: pointer;
        font-size: 11px;
        font-weight: 900;
    }

    .quick-code-button:hover { background: var(--yellow-hover); }

    .panel {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px;
    }

    .section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 5px;
    }

    .section-number {
        flex: 0 0 auto;
        width: 23px;
        height: 23px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--yellow);
        color: var(--black);
        font-size: 12px;
        font-weight: 900;
    }

    .section-title {
        margin: 0;
        color: var(--yellow);
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
        text-transform: uppercase;
        letter-spacing: 0.45px;
    }

    .optional-label {
        margin-left: auto;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
    }

    .call-sign-layout {
        display: grid;
        grid-template-columns: 1fr 2.7fr;
        gap: 7px;
    }

    .button-grid {
        display: grid;
        gap: 4px;
    }

    .letter-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .number-grid { grid-template-columns: repeat(17, minmax(0, 1fr)); }
    .location-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }

    .choice-button {
        min-width: 0;
        min-height: 30px;
        overflow: hidden;
        padding: 5px 6px;
        border: 1px solid #575757;
        border-radius: 5px;
        background: var(--panel-light);
        color: var(--white);
        cursor: pointer;
        font-weight: 700;
        line-height: 1.08;
    }

    .choice-button:hover {
        border-color: var(--yellow);
        background: #303030;
    }

    .choice-button:focus-visible {
        outline: 2px solid var(--yellow);
        outline-offset: 2px;
    }

    .choice-button.selected {
        border-color: var(--yellow);
        background: var(--yellow);
        color: var(--black);
        box-shadow: inset 0 0 0 1px var(--black);
    }

    .letter-button { font-size: clamp(11px, 0.8vw, 14px); }

    .number-button {
        min-height: 29px;
        padding: 2px;
        font-size: 12px;
    }

    .location-panel {
        min-height: 0;
        overflow: hidden;
    }

    .location-button {
        min-height: 38px;
        padding: 4px 5px;
        font-size: clamp(9px, 0.68vw, 12px);
    }

    .location-code {
        display: inline-block;
        margin-right: 5px;
        padding: 2px 4px;
        border-radius: 3px;
        background: var(--yellow);
        color: var(--black);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.35px;
    }

    .location-name {
        vertical-align: middle;
    }

    .location-button.selected .location-code {
        background: var(--black);
        color: var(--yellow);
    }

    .other-button {
        background: #303030;
        border-color: var(--yellow);
        color: var(--yellow);
    }

    .other-location-row {
        display: none;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        margin-top: 5px;
    }

    .other-location-row.visible { display: grid; }

    .other-label {
        color: var(--yellow);
        font-size: 12px;
        font-weight: 800;
    }

    .details-grid {
        min-height: 0;
        display: grid;
        grid-template-columns:
            minmax(95px, 0.33fr)
            minmax(125px, 0.43fr)
            minmax(245px, 0.95fr)
            minmax(245px, 1.15fr)
            minmax(275px, 1.3fr);
        gap: 7px;
    }

    .details-grid .panel {
        min-height: 0;
        display: flex;
        flex-direction: column;
    }

    .text-input,
    .message-input {
        width: 100%;
        min-width: 0;
        border: 2px solid #555555;
        border-radius: 5px;
        outline: none;
        background: #080808;
        color: var(--white);
    }

    .text-input {
        height: 38px;
        padding: 7px 10px;
        font-size: 15px;
        font-weight: 700;
    }

    .message-input {
        flex: 1;
        min-height: 55px;
        padding: 8px 10px;
        resize: none;
        font-size: 14px;
        line-height: 1.3;
    }

    .text-input:focus,
    .message-input:focus {
        border-color: var(--yellow);
        box-shadow: 0 0 0 2px rgba(255, 221, 0, 0.14);
    }

    .text-input::placeholder,
    .message-input::placeholder { color: #858585; }

    .input-help {
        margin-top: 5px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.2;
    }

    .response-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
    }

    .response-service {
        grid-column: 1 / -1;
        color: var(--white);
        font-size: 11px;
        font-weight: 850;
        text-align: center;
        margin-top: 2px;
    }

    .response-button {
        min-height: 29px;
        padding: 4px;
        font-size: 11px;
    }

    .site-button {
        grid-column: 1 / -1;
        min-height: 34px;
        margin-top: 3px;
    }

    .output-box {
        flex: 1;
        min-height: 55px;
        overflow: auto;
        padding: 8px 10px;
        border: 2px solid var(--yellow);
        border-radius: 5px;
        background: #050505;
        color: var(--yellow);
        font-size: clamp(13px, 0.95vw, 17px);
        font-weight: 750;
        line-height: 1.35;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
    }

    .footer-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto;
        align-items: center;
        gap: 7px;
    }

    .status {
        min-width: 0;
        min-height: 34px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--panel);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
    }

    .status.success {
        border-color: var(--green);
        color: var(--green);
    }

    .status.error {
        border-color: var(--red);
        color: var(--red);
    }

    .action-button {
        min-height: 36px;
        padding: 7px 18px;
        border: 1px solid var(--yellow);
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 850;
    }

    .action-button:focus-visible {
        outline: 2px solid var(--white);
        outline-offset: 2px;
    }

    .copy-button {
        background: var(--yellow);
        color: var(--black);
    }

    .copy-button:hover { background: var(--yellow-hover); }

    .copy-clear-button {
        background: var(--black);
        color: var(--yellow);
    }

    .copy-clear-button:hover { background: #282828; }

    .reset-button {
        border-color: #666666;
        background: #242424;
        color: var(--white);
    }

    .reset-button:hover { border-color: var(--white); }

    @media (max-height: 760px) {
        .app { gap: 5px; padding: 5px; }
        .header { min-height: 38px; padding: 5px 9px; }
        .quick-code-bar { min-height: 29px; padding: 2px 5px; }
        .quick-code-input, .quick-code-button { height: 24px; }
        .panel { padding: 5px; }
        .section-header { margin-bottom: 4px; }
        .section-number { width: 20px; height: 20px; font-size: 10px; }
        .section-title { font-size: 12px; }
        .choice-button { min-height: 25px; }
        .number-button { min-height: 24px; }
        .location-button { min-height: 31px; padding: 2px 4px; }
        .text-input { height: 32px; }
        .message-input,
        .output-box { min-height: 42px; }
        .response-button { min-height: 24px; }
        .site-button { min-height: 28px; }
        .action-button { min-height: 32px; }
    }

    @media (max-width: 1150px) {
        html,
        body { overflow: auto; }

        .app {
            height: auto;
            min-height: 100vh;
            overflow: visible;
        }

        .location-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .location-button { min-height: 34px; }
        .number-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }

        .details-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .details-grid .panel:nth-child(4),
        .details-grid .panel:nth-child(5) { grid-column: span 2; }
    }

    @media (max-width: 700px) {
        .quick-code-bar { grid-template-columns: 1fr auto; }
        .quick-code-label { display: none; }
        .call-sign-layout { grid-template-columns: 1fr; }
        .letter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .number-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .location-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .details-grid { grid-template-columns: 1fr 1fr; }
        .details-grid .panel:nth-child(n+3) { grid-column: 1 / -1; }
        .footer-actions { grid-template-columns: 1fr; }
        .status { min-height: 38px; }
    }
</style>
</head>
<body>
<main class="app">
    <header class="header">
        <h1 class="header-title">Radio Logger</h1>
    </header>

    <section class="quick-code-bar" aria-label="Quick code entry">
        <label class="quick-code-label" for="quickCodeInput">Quick code</label>
        <input id="quickCodeInput" class="quick-code-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. B1ALSBF4343NCGOCA Passenger feeling unwell">
        <button id="applyQuickCodeButton" class="quick-code-button" type="button">APPLY</button>
    </section>

    <section class="call-sign-layout">
        <div class="panel">
            <div class="section-header">
                <span class="section-number">1</span>
                <h2 class="section-title">Radio callsign</h2>
            </div>
            <div id="letterButtons" class="button-grid letter-grid"></div>
        </div>

        <div class="panel">
            <div class="section-header">
                <span class="section-number">2</span>
                <h2 class="section-title">Callsign number</h2>
            </div>
            <div id="numberButtons" class="button-grid number-grid"></div>
        </div>
    </section>

    <section class="panel location-panel">
        <div class="section-header">
            <span class="section-number">3</span>
            <h2 class="section-title">Location</h2>
            <span class="optional-label">Optional</span>
        </div>

        <div id="locationButtons" class="button-grid location-grid"></div>

        <div id="otherLocationRow" class="other-location-row">
            <label class="other-label" for="otherLocationInput">OTHER LOCATION</label>
            <input id="otherLocationInput" class="text-input" type="text" autocomplete="off" placeholder="Type the location">
        </div>
    </section>

    <section class="details-grid">
        <div class="panel">
            <div class="section-header">
                <span class="section-number">4</span>
                <h2 class="section-title">Stand</h2>
            </div>
            <input id="standInput" class="text-input" type="text" maxlength="2" autocomplete="off" placeholder="A, B, CZ...">
            <div class="input-help">Optional. Maximum two letters.</div>
        </div>

        <div class="panel">
            <div class="section-header">
                <span class="section-number">5</span>
                <h2 class="section-title">Fleet number</h2>
            </div>
            <input id="fleetInput" class="text-input" type="text" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="e.g. 37123">
            <div class="input-help">Optional bus fleet number.</div>
        </div>

        <div class="panel">
            <div class="section-header">
                <span class="section-number">6</span>
                <h2 class="section-title">Response</h2>
                <span class="optional-label">Optional</span>
            </div>

            <div class="response-grid">
                <div class="response-service">NWAS</div>
                <button class="choice-button response-button" type="button" data-service="NWAS" data-status="CALLED">CALLED</button>
                <button class="choice-button response-button" type="button" data-service="NWAS" data-status="ON SITE">ON SITE</button>

                <div class="response-service">GMP</div>
                <button class="choice-button response-button" type="button" data-service="GMP" data-status="CALLED">CALLED</button>
                <button class="choice-button response-button" type="button" data-service="GMP" data-status="ON SITE">ON SITE</button>

                <div class="response-service">SITE CO-ORDINATOR</div>
                <button id="siteCoordinatorButton" class="choice-button response-button site-button" type="button">AWARE</button>
            </div>
        </div>

        <div class="panel">
            <div class="section-header">
                <span class="section-number">7</span>
                <h2 class="section-title">Message received</h2>
            </div>
            <textarea id="messageInput" class="message-input" spellcheck="true" placeholder="Type the radio message received..."></textarea>
        </div>

        <div class="panel">
            <div class="section-header">
                <span class="section-number">8</span>
                <h2 class="section-title">IMS output</h2>
            </div>
            <div id="outputBox" class="output-box" aria-live="polite"></div>
        </div>
    </section>

    <footer class="footer-actions">
        <div id="statusBox" class="status" aria-live="polite">Select a callsign and enter a message.</div>
        <button id="copyButton" class="action-button copy-button" type="button">COPY LOG</button>
        <button id="copyClearButton" class="action-button copy-clear-button" type="button">COPY &amp; CLEAR</button>
        <button id="resetButton" class="action-button reset-button" type="button">CLEAR</button>
    </footer>
</main>

<script>
(function () {
    "use strict";

    const radioGroups = [
        { label: "Bravo", code: "B" },
        { label: "Sierra", code: "S" },
        { label: "Mike", code: "M" },
        { label: "Tango-Sierra", code: "TS" },
        { label: "Tango-Alpha", code: "TA" },
        { label: "November", code: "N" }
    ];

    const locations = [
        { code: "ALS", name: "Altrincham Interchange" },
        { code: "ASH", name: "Ashton-under-Lyne Interchange" },
        { code: "BOL", name: "Bolton Interchange" },
        { code: "BUR", name: "Bury Interchange" },
        { code: "ECC", name: "Eccles Interchange" },
        { code: "HYD", name: "Hyde Bus Station" },
        { code: "LEI", name: "Leigh Bus Station" },
        { code: "MATA", name: "Manchester Airport The Station" },
        { code: "MANPIC", name: "Manchester Piccadilly Gardens" },
        { code: "MID", name: "Middleton Bus Station" },
        { code: "OLD", name: "Oldham Bus Station" },
        { code: "ROC", name: "Rochdale Interchange" },
        { code: "SHU", name: "Shudehill Interchange" },
        { code: "STO", name: "Stockport Interchange" },
        { code: "TRA", name: "The Trafford Centre Bus Station" },
        { code: "WIG", name: "Wigan Bus Station" },
        { code: "WYT", name: "Wythenshawe Interchange" },
        { code: "OTH", name: "Other" }
    ];

    let selectedLetterCode = "";
    let selectedCallsignNumber = "";
    let selectedLocation = "";
    const responseSelections = { NWAS: "", GMP: "" };
    let siteCoordinatorAware = false;

    const letterButtonsContainer = document.getElementById("letterButtons");
    const numberButtonsContainer = document.getElementById("numberButtons");
    const locationButtonsContainer = document.getElementById("locationButtons");
    const otherLocationRow = document.getElementById("otherLocationRow");
    const otherLocationInput = document.getElementById("otherLocationInput");
    const standInput = document.getElementById("standInput");
    const fleetInput = document.getElementById("fleetInput");
    const messageInput = document.getElementById("messageInput");
    const outputBox = document.getElementById("outputBox");
    const statusBox = document.getElementById("statusBox");
    const copyButton = document.getElementById("copyButton");
    const copyClearButton = document.getElementById("copyClearButton");
    const resetButton = document.getElementById("resetButton");
    const quickCodeInput = document.getElementById("quickCodeInput");
    const applyQuickCodeButton = document.getElementById("applyQuickCodeButton");
    const responseButtons = document.querySelectorAll("[data-service][data-status]");
    const siteCoordinatorButton = document.getElementById("siteCoordinatorButton");

    function createRadioLetterButtons() {
        radioGroups.forEach(function (radioGroup) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "choice-button letter-button";
            button.textContent = radioGroup.label;
            button.dataset.code = radioGroup.code;

            button.addEventListener("click", function () {
                selectedLetterCode = radioGroup.code;
                clearSelectedButtons(letterButtonsContainer);
                button.classList.add("selected");
                updateOutput();
            });

            letterButtonsContainer.appendChild(button);
        });
    }

    function createNumberButtons() {
        for (let number = 1; number <= 34; number += 1) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "choice-button number-button";
            button.textContent = String(number);
            button.dataset.number = String(number);

            button.addEventListener("click", function () {
                selectedCallsignNumber = String(number);
                clearSelectedButtons(numberButtonsContainer);
                button.classList.add("selected");
                updateOutput();
            });

            numberButtonsContainer.appendChild(button);
        }
    }

    function createLocationButtons() {
        locations.forEach(function (locationItem) {
            const locationName = locationItem.name;
            const button = document.createElement("button");
            const codeSpan = document.createElement("span");
            const nameSpan = document.createElement("span");

            button.type = "button";
            button.className = "choice-button location-button";
            button.dataset.location = locationName;
            button.dataset.locationCode = locationItem.code;
            button.title = locationItem.code + " = " + locationName;

            codeSpan.className = "location-code";
            codeSpan.textContent = locationItem.code;
            nameSpan.className = "location-name";
            nameSpan.textContent = locationName;
            button.appendChild(codeSpan);
            button.appendChild(nameSpan);

            if (locationName === "Other") {
                button.classList.add("other-button");
            }

            button.addEventListener("click", function () {
                if (selectedLocation === locationName && locationName !== "Other") {
                    selectedLocation = "";
                    button.classList.remove("selected");
                    updateOutput();
                    return;
                }

                selectedLocation = locationName;
                clearSelectedButtons(locationButtonsContainer);
                button.classList.add("selected");

                if (locationName === "Other") {
                    otherLocationRow.classList.add("visible");
                    otherLocationInput.focus();
                } else {
                    otherLocationRow.classList.remove("visible");
                    otherLocationInput.value = "";
                }

                updateOutput();
            });

            locationButtonsContainer.appendChild(button);
        });
    }

    function setupResponseButtons() {
        responseButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                const service = button.dataset.service;
                const status = button.dataset.status;
                const alreadySelected = responseSelections[service] === status;

                document.querySelectorAll('[data-service="' + service + '"]').forEach(function (serviceButton) {
                    serviceButton.classList.remove("selected");
                });

                if (alreadySelected) {
                    responseSelections[service] = "";
                } else {
                    responseSelections[service] = status;
                    button.classList.add("selected");
                }

                updateOutput();
            });
        });

        siteCoordinatorButton.addEventListener("click", function () {
            siteCoordinatorAware = !siteCoordinatorAware;
            siteCoordinatorButton.classList.toggle("selected", siteCoordinatorAware);
            updateOutput();
        });
    }

    function clearSelectedButtons(container) {
        container.querySelectorAll(".choice-button").forEach(function (button) {
            button.classList.remove("selected");
        });
    }

    function normaliseStand() {
        const cleanedStand = standInput.value
            .replace(/[^a-zA-Z]/g, "")
            .slice(0, 2)
            .toUpperCase();

        if (standInput.value !== cleanedStand) {
            standInput.value = cleanedStand;
        }

        return cleanedStand;
    }

    function normaliseFleetNumber() {
        const cleanedFleetNumber = fleetInput.value
            .replace(/[^0-9]/g, "")
            .slice(0, 10);

        if (fleetInput.value !== cleanedFleetNumber) {
            fleetInput.value = cleanedFleetNumber;
        }

        return cleanedFleetNumber;
    }

    function getLocationText() {
        if (selectedLocation === "Other") {
            return otherLocationInput.value.trim();
        }
        return selectedLocation;
    }

    function buildOutputText() {
        const callsign = selectedLetterCode + selectedCallsignNumber;
        const locationText = getLocationText();
        const standText = normaliseStand();
        const fleetNumber = normaliseFleetNumber();
        const messageText = messageInput.value.trim();
        const optionalUpdates = [];

        let result = "🔈";

        if (callsign) {
            result += " " + callsign;
        }

        if (locationText) {
            result += " at " + locationText;
        }

        if (standText) {
            result += " Stand " + standText;
        }

        if (fleetNumber) {
            result += " (Fleet " + fleetNumber + ")";
        }

        result += ":";

        if (messageText) {
            result += " " + messageText;
        }

        if (responseSelections.NWAS) {
            optionalUpdates.push("NWAS " + responseSelections.NWAS);
        }

        if (responseSelections.GMP) {
            optionalUpdates.push("GMP " + responseSelections.GMP);
        }

        if (siteCoordinatorAware) {
            optionalUpdates.push("SITE CO-ORDINATOR AWARE");
        }

        if (optionalUpdates.length > 0) {
            result += " | " + optionalUpdates.join(" | ");
        }

        return result;
    }

    function updateOutput() {
        outputBox.textContent = buildOutputText();
        const missingItems = [];

        if (!selectedLetterCode) missingItems.push("callsign letter");
        if (!selectedCallsignNumber) missingItems.push("callsign number");
        if (!messageInput.value.trim()) missingItems.push("message");

        statusBox.classList.remove("success", "error");

        if (missingItems.length === 0) {
            statusBox.textContent = "Log ready to copy. Location and response details are optional.";
            statusBox.classList.add("success");
        } else {
            statusBox.textContent = "Still required: " + missingItems.join(", ") + ". Location is optional.";
        }
    }

    function isLogComplete() {
        return Boolean(
            selectedLetterCode &&
            selectedCallsignNumber &&
            messageInput.value.trim()
        );
    }

    async function copyToClipboard() {
        if (!isLogComplete()) {
            statusBox.textContent = "Complete the callsign and message before copying. Location is optional.";
            statusBox.classList.remove("success");
            statusBox.classList.add("error");
            return false;
        }

        const textToCopy = buildOutputText();

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(textToCopy);
            } else {
                fallbackCopy(textToCopy);
            }

            statusBox.textContent = "IMS log copied to clipboard.";
            statusBox.classList.remove("error");
            statusBox.classList.add("success");
            return true;
        } catch (error) {
            try {
                fallbackCopy(textToCopy);
                statusBox.textContent = "IMS log copied to clipboard.";
                statusBox.classList.remove("error");
                statusBox.classList.add("success");
                return true;
            } catch (fallbackError) {
                statusBox.textContent = "Copy failed. Select the output text and copy it manually.";
                statusBox.classList.remove("success");
                statusBox.classList.add("error");
                return false;
            }
        }
    }

    function fallbackCopy(textToCopy) {
        const temporaryTextArea = document.createElement("textarea");
        temporaryTextArea.value = textToCopy;
        temporaryTextArea.setAttribute("readonly", "");
        temporaryTextArea.style.position = "fixed";
        temporaryTextArea.style.left = "-9999px";
        temporaryTextArea.style.top = "0";
        document.body.appendChild(temporaryTextArea);
        temporaryTextArea.focus();
        temporaryTextArea.select();

        const successful = document.execCommand("copy");
        document.body.removeChild(temporaryTextArea);

        if (!successful) {
            throw new Error("Browser copy command failed.");
        }
    }

    function parseResponseCodes(value) {
        const codes = [];
        let remaining = value;

        while (remaining.length > 0) {
            const code = remaining.slice(0, 2);
            if (!["NC", "NO", "GC", "GO", "CA"].includes(code)) {
                return null;
            }
            codes.push(code);
            remaining = remaining.slice(2);
        }

        const nwasCodes = codes.filter(function (code) { return code === "NC" || code === "NO"; });
        const gmpCodes = codes.filter(function (code) { return code === "GC" || code === "GO"; });
        const coordinatorCodes = codes.filter(function (code) { return code === "CA"; });

        if (nwasCodes.length > 1 || gmpCodes.length > 1 || coordinatorCodes.length > 1) {
            return null;
        }
        return codes;
    }

    function parseQuickCode() {
        const enteredText = quickCodeInput.value.trim();
        if (!enteredText) {
            showQuickCodeError("Enter a quick code first.");
            return;
        }

        const firstSpace = enteredText.search(/\s/);
        const compactCode = (firstSpace === -1 ? enteredText : enteredText.slice(0, firstSpace)).toUpperCase();
        const messageText = firstSpace === -1 ? "" : enteredText.slice(firstSpace).trim();
        let position = 0;

        const callsignGroup = radioGroups
            .slice()
            .sort(function (a, b) { return b.code.length - a.code.length; })
            .find(function (group) { return compactCode.startsWith(group.code); });

        if (!callsignGroup) {
            showQuickCodeError("Quick code has an unrecognised callsign letter.");
            return;
        }
        position += callsignGroup.code.length;

        const numberMatch = compactCode.slice(position).match(/^([0-9]{1,2})/);
        if (!numberMatch || Number(numberMatch[1]) < 1 || Number(numberMatch[1]) > 34) {
            showQuickCodeError("Quick code needs a callsign number from 1 to 34.");
            return;
        }
        const callsignNumber = numberMatch[1];
        position += callsignNumber.length;

        const locationItem = locations
            .filter(function (item) { return item.name !== "Other"; })
            .slice()
            .sort(function (a, b) { return b.code.length - a.code.length; })
            .find(function (item) { return compactCode.slice(position).startsWith(item.code); });

        if (!locationItem) {
            showQuickCodeError("Quick code has an unrecognised or missing location code.");
            return;
        }
        position += locationItem.code.length;

        let remaining = compactCode.slice(position);
        let stand = "";
        let fleet = "";
        let responseText = "";
        const fleetMarker = remaining.indexOf("F");

        if (fleetMarker !== -1) {
            stand = remaining.slice(0, fleetMarker);
            const afterFleetMarker = remaining.slice(fleetMarker + 1);
            const fleetMatch = afterFleetMarker.match(/^([0-9]{1,10})/);
            if (!fleetMatch) {
                showQuickCodeError("F must be followed by a fleet number.");
                return;
            }
            fleet = fleetMatch[1];
            responseText = afterFleetMarker.slice(fleet.length);
        } else {
            let matchedWithoutFleet = false;
            for (let standLength = 0; standLength <= Math.min(2, remaining.length); standLength += 1) {
                const possibleStand = remaining.slice(0, standLength);
                const possibleResponses = remaining.slice(standLength);
                if (/^[A-Z]{0,2}$/.test(possibleStand) && parseResponseCodes(possibleResponses) !== null) {
                    stand = possibleStand;
                    responseText = possibleResponses;
                    matchedWithoutFleet = true;
                    break;
                }
            }
            if (!matchedWithoutFleet) {
                showQuickCodeError("The stand or response section of the quick code is not recognised.");
                return;
            }
        }

        if (!/^[A-Z]{0,2}$/.test(stand)) {
            showQuickCodeError("Stand must contain no more than two letters.");
            return;
        }

        const responseCodes = parseResponseCodes(responseText);
        if (responseCodes === null) {
            showQuickCodeError("Response codes are invalid or contain conflicting selections.");
            return;
        }

        selectedLetterCode = callsignGroup.code;
        selectedCallsignNumber = callsignNumber;
        selectedLocation = locationItem.name;
        responseSelections.NWAS = "";
        responseSelections.GMP = "";
        siteCoordinatorAware = false;

        clearSelectedButtons(letterButtonsContainer);
        clearSelectedButtons(numberButtonsContainer);
        clearSelectedButtons(locationButtonsContainer);
        responseButtons.forEach(function (button) { button.classList.remove("selected"); });
        siteCoordinatorButton.classList.remove("selected");

        const letterButton = letterButtonsContainer.querySelector('[data-code="' + callsignGroup.code + '"]');
        const numberButton = numberButtonsContainer.querySelector('[data-number="' + callsignNumber + '"]');
        const locationButton = locationButtonsContainer.querySelector('[data-location-code="' + locationItem.code + '"]');
        if (letterButton) letterButton.classList.add("selected");
        if (numberButton) numberButton.classList.add("selected");
        if (locationButton) locationButton.classList.add("selected");

        otherLocationInput.value = "";
        otherLocationRow.classList.remove("visible");
        standInput.value = stand;
        fleetInput.value = fleet;
        messageInput.value = messageText;

        responseCodes.forEach(function (code) {
            let service = "";
            let status = "";
            if (code === "NC") { service = "NWAS"; status = "CALLED"; }
            if (code === "NO") { service = "NWAS"; status = "ON SITE"; }
            if (code === "GC") { service = "GMP"; status = "CALLED"; }
            if (code === "GO") { service = "GMP"; status = "ON SITE"; }
            if (code === "CA") { siteCoordinatorAware = true; }

            if (service) {
                responseSelections[service] = status;
                const responseButton = document.querySelector('[data-service="' + service + '"][data-status="' + status + '"]');
                if (responseButton) responseButton.classList.add("selected");
            }
        });

        siteCoordinatorButton.classList.toggle("selected", siteCoordinatorAware);
        updateOutput();
        statusBox.textContent = messageText
            ? "Quick code applied. Log ready to check and copy."
            : "Quick code applied. Enter the message before copying.";
        statusBox.classList.remove("error");
        if (messageText) statusBox.classList.add("success");
    }

    function showQuickCodeError(message) {
        statusBox.textContent = message;
        statusBox.classList.remove("success");
        statusBox.classList.add("error");
        quickCodeInput.focus();
    }

    function clearForm() {
        selectedLetterCode = "";
        selectedCallsignNumber = "";
        selectedLocation = "";
        responseSelections.NWAS = "";
        responseSelections.GMP = "";
        siteCoordinatorAware = false;

        clearSelectedButtons(letterButtonsContainer);
        clearSelectedButtons(numberButtonsContainer);
        clearSelectedButtons(locationButtonsContainer);
        responseButtons.forEach(function (button) {
            button.classList.remove("selected");
        });
        siteCoordinatorButton.classList.remove("selected");

        otherLocationInput.value = "";
        otherLocationRow.classList.remove("visible");
        standInput.value = "";
        fleetInput.value = "";
        messageInput.value = "";
        quickCodeInput.value = "";
        updateOutput();
    }

    applyQuickCodeButton.addEventListener("click", parseQuickCode);
    quickCodeInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            event.preventDefault();
            parseQuickCode();
        }
    });

    otherLocationInput.addEventListener("input", updateOutput);

    standInput.addEventListener("input", function () {
        normaliseStand();
        updateOutput();
    });

    fleetInput.addEventListener("input", function () {
        normaliseFleetNumber();
        updateOutput();
    });

    messageInput.addEventListener("input", updateOutput);
    copyButton.addEventListener("click", copyToClipboard);

    copyClearButton.addEventListener("click", async function () {
        const copied = await copyToClipboard();
        if (copied) {
            clearForm();
            statusBox.textContent = "IMS log copied. Form cleared for the next call.";
            statusBox.classList.remove("error");
            statusBox.classList.add("success");
        }
    });

    resetButton.addEventListener("click", clearForm);

    createRadioLetterButtons();
    createNumberButtons();
    createLocationButtons();
    setupResponseButtons();
    updateOutput();
})();
</script>
</body>
</html>
