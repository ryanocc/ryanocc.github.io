<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LST — Control Centre Wall Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts (match your tool) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ================================
       THEME
       ================================ */
    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --text:#f2f2f2;
      --muted:#c9cacc;

      --liveGreen:#42BE4B;
      --errorRed:#EA5540;

      --accent:#FFE04A;
      --line: rgba(255,255,255,0.08);

      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --radius: 12px;
      --gap: 12px;
      --frame-padding: 12px;

      --titlebar-h: 10vh;
      --highConfMin: 4;
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .hide-btn,
    .toolbar-btn{
      appearance: none;
      background: rgba(255,255,255,0.04);
      color: #d8d8dd;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .5px;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.05s ease;
    }
    .hide-btn:hover,
    .toolbar-btn:hover{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,224,74,0.7);
      color: #fff;
      box-shadow: 0 0 10px rgba(255,224,74,0.15);
    }
    .hide-btn:active,
    .toolbar-btn:active{
      transform: translateY(1px);
      background: rgba(255,255,255,0.15);
    }

    /* ================================
       LAYOUT: Top content + bottom title bar
       ================================ */

.app{
  height: 100dvh;
  display: grid;
  grid-template-rows: 1fr var(--titlebar-h);
  overflow: hidden;     /* ✅ critical */
  min-height: 0;        /* ✅ critical */
}



.content{
  padding: var(--gap);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: var(--gap);
  min-height: 0;        /* ✅ REQUIRED */
  overflow: hidden;     /* ✅ REQUIRED */
}


    .col1{
      display: grid;
      grid-template-rows: 1fr;
      gap: var(--gap);
      min-height: 0;
    }
    .col2{
      display: grid;
      grid-template-rows: 3fr 1fr;
      gap: var(--gap);
      min-height: 0;
    }

.col1,
.col2,
.col3{
  min-height: 0;        /* ✅ THIS fixes the overflow */
  overflow: hidden;     /* ✅ contain children */
}

.frame{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: var(--frame-padding);
  min-height: 0;      /* ✅ REQUIRED */
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 8px;
}

    .frame-header{
      font-size: clamp(12px, 1.8vh, 14px);
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

.frame-body{
  min-height: 0;      /* ✅ REQUIRED */
  overflow: hidden;   /* ✅ scrolling lives below */
}

/* =========================
   FORCE WAZE COLUMN TO SCROLL
   ========================= */
#frame-d {
  display: flex !important;
  flex-direction: column !important;
  height: 100% !important;
  min-height: 0 !important;
}

#frame-d .frame-body {
  flex: 1 1 auto !important;
  min-height: 0 !important;
  overflow: hidden !important;
  display: block !important;
}

.waze-panel {
  height: 100% !important;
  min-height: 0 !important;
  overflow-y: auto !important;
  display: block !important;
}


#frame-d .frame-body {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: visible;
  flex: 1 1 auto;
}

.waze-panel {
  display: grid;
  grid-auto-rows: auto;
  gap: 10px;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1 1 auto;
  min-height: 0;
}

/* --- Waze column: make the scroll container the waze-panel and give it breathing room --- */
#frame-d{
  display:flex;
  flex-direction:column;
  min-height:0;
}

#frame-d .frame-body{
  flex:1 1 auto;
  min-height:0;
  overflow:hidden; /* keep scrolling inside the panel, not the frame */
  display:flex;
}

#waze-panel{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;

  /* ✅ fixes last card being cut off */
  padding-bottom: 16px;

  /* optional: keeps last card clear of scrollbar on Windows */
  padding-right: 6px;
  box-sizing: border-box;
}



/* ✅ Key Travel Alerts: allow inner grid to scroll */
#frame-c .frame-body{
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
    /* ================================
       Bottom Title Bar
       ================================ */
    .titlebar{
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(255,224,74,0.06), transparent);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .title-left{
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .title-right{
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .status-pill{
      padding: 10px 16px;
      border-radius: 999px;
      font-size: clamp(14px, 2.2vh, 18px);
      font-weight: 800;
      background: var(--liveGreen);
      color:#000;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.25);
      transition: background .2s ease, color .2s ease;
      white-space: nowrap;
      user-select: none;
    }
    .status-error{ background: var(--errorRed); color:#fff; }

    #beeLogo{
      width: clamp(40px, 6vh, 64px);
      height: clamp(40px, 6vh, 64px);
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      transition: transform 0.2s ease-out;
      user-select: none;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{ animation: wibble 650ms ease-out; }

    .car-icon{
      width: clamp(22px, 3.2vh, 28px);
      height: clamp(22px, 3.2vh, 28px);
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
    }
    .connected-count{
      font-weight: 900;
      font-size: clamp(14px, 2.2vh, 18px);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* =======================================================
       ABNORMAL TRAFFIC — 2-WIDE GRID, 3-LINE CARDS
       ======================================================= */
    .tvt-panel{
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .network-health { margin: 0 2px; }
    .network-row { display:flex; align-items:center; gap:10px; }
    .network-bar{
      flex:1 1 auto;
      height: clamp(10px, 1.8vh, 16px);
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 4px 10px rgba(0,0,0,0.30);
    }

    /* The 2-wide grid that scrolls */
  
  .travel-alerts-body{
  display: flex;
  flex-direction: column;
  min-height: 0;        /* ✅ critical */
  overflow: hidden;     /* ✅ contain scroll */
}
  
.corridor-list{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  min-height: 0;
  overflow-y: auto;

  /* NEW: force uniform card sizes */
  grid-auto-rows: var(--corridor-card-h);
  align-content: start; /* keeps rows packed neatly at the top */
}

/* Pick a height that suits your wall display */
:root{
  --corridor-card-h: clamp(140px, 16vh, 190px);
}

    .corridor-list{ scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent; }
    .corridor-list::-webkit-scrollbar{ width: 10px; }
    .corridor-list::-webkit-scrollbar-track{ background: transparent; }
    .corridor-list::-webkit-scrollbar-thumb{
      background-color: rgba(255,255,255,0.28);
      border-radius: 8px;
      border: 2px solid transparent;
    }
    .corridor-list::-webkit-scrollbar-thumb:hover{ background-color: rgba(255,255,255,0.40); }

.corridor{
  display: grid;
  grid-template-rows: auto auto auto; /* ✅ no 1fr */
  align-content: start;              /* ✅ pack upward */
  gap: 6px;

  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(255,255,255,0.045);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25) inset, 0 1px 0 rgba(255,255,255,0.04);

  height: 100%;
  box-sizing: border-box;

  position: relative;
  padding-bottom: 36px; /* keep space for Hide */
  overflow: hidden;     /* can stay */
}

.corridor .hide-btn{
  position: absolute;
  right: 10px;
  bottom: 8px;
  font-size: 10px;
  padding: 3px 8px;
}

    .corridor-top{
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .corridor-title{
      font-size: clamp(15px, 2.4vh, 20px);
      font-weight: 900;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .corridor-delay{
      font-size: clamp(22px, 4.2vh, 34px);
      font-weight: 900;
      letter-spacing: .3px;
      line-height: 0.95;
      color: var(--delay-col);
      margin-bottom: 2px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .corridor-times{
      font-size: clamp(12px, 1.8vh, 15px);
      font-weight: 800;
      color: rgba(255,255,255,0.86);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tvt-filters{
      display: flex;
      gap: 8px;
      padding-top: 2px;
    }
    .tvt-filters button{
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 900;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: .2px;
      transition: background .2s ease, border-color .2s ease, transform .05s ease;
    }
    .tvt-filters button:hover{
      border-color: rgba(255,224,74,0.7);
      background: rgba(255,255,255,0.10);
    }
    .tvt-filters button:active{ transform: translateY(1px); }
    .tvt-filters button.active{
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

/* Travel alert filter toggles in the frame header */
.frame-header-row{
  justify-content: space-between;
  width: 100%;
}

.corridor{ cursor: pointer; }
.corridor .hide-btn{ cursor: pointer; }

.div-filters{
  display: inline-flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.div-filters button{
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.18);
  color: #fff;
  font-weight: 900;
  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  letter-spacing: .2px;
  transition: background .2s ease, border-color .2s ease, transform .05s ease;
  font-size: 11px;
  text-transform: uppercase;
}

.div-filters button:hover{
  border-color: rgba(255,224,74,0.7);
  background: rgba(255,255,255,0.10);
}

.div-filters button:active{ transform: translateY(1px); }

.div-filters button.active{
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}

    /* =======================================================
       WAZE PANEL (right) — keep your existing look
       ======================================================= */
.waze-panel{
  display: grid;
  grid-auto-rows: auto;
  gap: 10px;
  min-height: 0;      /* ✅ REQUIRED */
  overflow-y: auto;   /* ✅ scrolls within frame */
}

    .section{
      display: grid;
      grid-auto-rows: auto;
      gap: 8px;
      min-height: 0;
    }
    .section-title{
      font-size: clamp(11px, 1.6vh, 13px);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--muted);
      opacity: 0.95;
      border-left: 3px solid rgba(255,255,255,0.15);
      padding-left: 8px;
    }
    .cards{
      display: grid;
      grid-auto-rows: minmax(0, auto);
      gap: 8px;
      min-height: 0;
    }
    .card{
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 6px 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.045);
      box-shadow: 0 1px 0 rgba(255,255,255,0.045) inset, 0 2px 6px rgba(0,0,0,0.25) inset;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.06);
      min-width: 0;
      
  position: relative;   /* ✅ REQUIRED */
  padding-bottom: 36px; /* ✅ space for Hide button */

    }
    
  .card .hide-btn{
  position: absolute;
  right: 10px;
  bottom: 8px;
  font-size: 10px;
  padding: 3px 8px;
}
    
    .card:hover{ background: rgba(255,255,255,0.065); }
    .card .title{
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: clamp(14px, 2.2vh, 18px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .meta{
      grid-column: 1 / -1;
      font-weight: 800;
      font-size: clamp(12px, 1.8vh, 14px);
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .desc{
      grid-column: 1 / -1;
      font-weight: 700;
      font-size: clamp(12px, 1.8vh, 14px);
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spacer{ flex: 1 1 auto; }

    /* =======================================================
       CENTRAL PANE (Key Travel Alerts) — your existing 2×4 grid
       ======================================================= */

#diverts-grid{
  flex: 1 1 auto;       /* ✅ THIS creates height */
  min-height: 0;        /* ✅ allows shrinking */
  overflow-y: auto;     /* ✅ scrolling finally works */

  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: min-content;
  gap: 10px;
}

    .divert-card{
      position: relative;
      
  display: grid;
  grid-template-rows: auto auto auto auto;
  align-content: start;     /* ✅ pack content from the top */

      gap: 4px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 6px rgba(0,0,0,0.22) inset;
      min-height: 0;
      overflow: hidden;
    }
    .divert-card.ufn-highlight{
      border-color: rgba(255,60,60,0.9);
      box-shadow:
        0 0 0 1px rgba(255,224,74,0.25),
        0 6px 18px rgba(0,0,0,0.35),
        0 1px 0 rgba(255,255,255,0.05) inset;
    }
.divert-card{ cursor: pointer; }
.divert-card:hover{ background: rgba(255,255,255,0.06); }

    .divert-header{
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .routes{
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
      overflow: hidden;
    }
    .route-chip{
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: clamp(11px, 1.6vh, 13px);
      padding: 1px 6px;
      border-radius: 6px;
      white-space: nowrap;
      user-select: none;
      box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    }
    .route-chip.more{
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--muted);
    }

    .op-tag{
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      min-width: 54px;
      max-width: 54px;
      justify-content: center;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      font-weight: 800;
      font-size: clamp(10px, 1.5vh, 12px);
      color: #e8e9ec;
      white-space: nowrap;
    }
    .op-dot{
      width: 10px; height: 10px; border-radius: 50%;
      background-color:#cfcfd6;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset;
      flex-shrink: 0;
      transition: background-color 600ms ease;
    }
    .op-code-rotator{
      position: relative;
      height: 1.1em;
      line-height: 1.1em;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
    }
    .op-code{
      position: absolute;
      opacity: 0;
      transition: opacity 0.35s ease-in-out;
    }
    .op-code.active{ opacity: 1; }

    .street-line{
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(13px, 2.0vh, 16px);
      white-space: normal; overflow: hidden; text-overflow: ellipsis;
      color: #fff;
    }
    .street-line .street {
      font-weight: 900;
      font-size: 1.2em;
    }
    .location{
      font-size: clamp(14px, 2.1vh, 18px);
      color: #d7d9de;
      white-space: normal; overflow: hidden; text-overflow: ellipsis;
    }
    .times{
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.12);
      display: grid;
      grid-auto-rows: auto;
      gap: 2px;
      min-height: 0;
    }
    .time-row{
      font-size: clamp(11px, 1.5vh, 13px);
      color: #d6d7db;
      white-space: normal; overflow: hidden; text-overflow: ellipsis;
    }
    .time-row .lab{ color: rgba(255,255,255,0.65); font-weight: 700; }
    .time-row .val{ color: #fff; font-weight: 900; }
    .ufn { color: var(--accent) !important; }

    @keyframes flashBorder {
      0%   { box-shadow: 0 0 0 0 rgba(255,224,74,0.6); border-color: rgba(255,224,74,0.9); transform: scale(1.00); }
      50%  { box-shadow: 0 0 0 10px rgba(255,224,74,0.10); border-color: rgba(255,224,74,1.0); transform: scale(1.02); }
      100% { box-shadow: 0 0 0 0 rgba(255,224,74,0.0); border-color: rgba(255,255,255,0.12); transform: scale(1.00); }
    }
    .new-ufn-flash{ animation: flashBorder 1400ms ease-out 1; }

    /* =======================================================
       ROUTE OPERATOR CHECKER
       ======================================================= */
    .visually-hidden {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden; clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }
    .roc-panel{
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      height: 100%;
      min-height: 0;
    }
    .roc-input-row{ width: 100%; display:block; overflow:hidden; }
    .roc-input-full{
      display:block;
      width:100%;
      box-sizing:border-box;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-weight: 800;
      font-size: clamp(12px, 1.8vh, 14px);
      letter-spacing: .2px;
      outline:none;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .roc-input-full:focus {
      border-color: rgba(255,224,74,0.7);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 0 3px rgba(255,224,74,0.15);
    }
    .roc-result{
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 0px;
      scrollbar-gutter: auto;
    }
    .roc-result::-webkit-scrollbar{ width: 10px; }
    .roc-result::-webkit-scrollbar-thumb{
      background-color: rgba(255,255,255,0.28);
      border-radius: 8px;
      border: 2px solid transparent;
    }
    
    /* ===== Modern minimal scrollbar ===== */
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.35) transparent;
}

/* WebKit (Chrome, Edge, Safari) */
::-webkit-scrollbar{
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track{

  <script>
    /* =======================================================
       Utilities & helpers
       ======================================================= */
    function sumWazers(usersOnJams){
      try {
        const total = (Array.isArray(usersOnJams) ? usersOnJams : [])
          .reduce((acc,u) => acc + (Number(u.wazersCount)||0), 0);
        return Math.ceil(total);
      } catch {
        return 0;
      }
    }

    function updateConnectedCitizensDisplay(total){
      const el = document.getElementById('connectedCitizens');
      if (!el) return;
      const label = Number.isFinite(total) && total > 0
        ? total.toLocaleString('en-GB')
        : '—';
      el.textContent = `${label} Connected Citizens`;
    }

    function withCacheBust(url){
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}ts=${Date.now()}`;
    }

    function fmtHHMMSS(){
      try{
        return new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
          .format(new Date());
      }catch(e){
        const d = new Date();
        const pad = n => String(n).padStart(2,'0');
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }
    }

    function setStatusPill(ok, {animate=false}={}){
      const pill = document.getElementById('statusPill');
      const bee  = document.getElementById('beeLogo');
      const t = fmtHHMMSS();
      if (ok){
        pill.classList.remove('status-error');
        pill.textContent = `LIVE • ${t}`;
        if (animate && bee){
          bee.classList.remove('bee-wibble');
          void bee.offsetWidth;
          bee.classList.add('bee-wibble');
        }
      } else {
        pill.classList.add('status-error');
        pill.textContent = `Stand By • ${t}`;
      }
    }

    /* ========= HIDE / SUPPRESSION (60 minutes) ========= */
    const HIDE_MS = 60 * 60 * 1000;

    function hideStorageKey(prefix, id){ return `hide_${prefix}_${id}`; }

    function getHideEntry(prefix, id){
      const raw = localStorage.getItem(hideStorageKey(prefix, id));
      if (!raw) return null;
      if (/^\d+$/.test(raw)) return { until: Number(raw) };
      try{
        const obj = JSON.parse(raw);
        if (obj && typeof obj.until === 'number') return obj;
      }catch(e){}
      const n = Number(raw);
      return Number.isFinite(n) ? { until:n } : null;
    }

    function setHideEntry(prefix, id, entry){
      localStorage.setItem(hideStorageKey(prefix, id), JSON.stringify(entry));
    }

    function clearHide(prefix, id){
      localStorage.removeItem(hideStorageKey(prefix, id));
    }

    function hideForHour(prefix, id, baseline={}){
      setHideEntry(prefix, id, { until: Date.now() + HIDE_MS, baseline, createdAt: Date.now() });
    }

    function isHiddenWithAutoCheck(prefix, id, currentMetrics={}){
      const entry = getHideEntry(prefix, id);
      if (!entry) return false;

      if (Date.now() > (Number(entry.until)||0)){
        clearHide(prefix, id);
        return false;
      }

      const base = entry.baseline || {};
      let autoUnhide = false;

      // Abnormal traffic: auto-unhide if delay worsens materially
      if (prefix === 'corr'){
        const curr = Number(currentMetrics.delayMin);
        const b = Number(base.delayMin);
        if (Number.isFinite(curr) && Number.isFinite(b)){
          const threshold = b > 0 ? Math.max(b + 5, Math.round(b * 1.5)) : 10;
          if (curr >= threshold) autoUnhide = true;
        }
      } else if (prefix === 'acc'){
        const curr = Number(currentMetrics.conf);
        const b = Number(base.conf);
        if (Number.isFinite(curr) && Number.isFinite(b) && curr >= b + 2){
          autoUnhide = true;
        }
      }

      if (autoUnhide){
        clearHide(prefix, id);
        return false;
      }

      return true;
    }

    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.hide-btn');
      if (!btn) return;
      ev.preventDefault(); ev.stopPropagation();

      const prefix = btn.getAttribute('data-prefix') || '';
      const id     = btn.getAttribute('data-id') || '';
      if (!prefix || !id) return;

      const baseline = {};
      const delay = btn.getAttribute('data-baseline-delay');
      const conf  = btn.getAttribute('data-baseline-conf');

      if (delay != null && delay !== '' && isFinite(Number(delay))) baseline.delayMin = Number(delay);
      if (conf  != null && conf  !== '' && isFinite(Number(conf ))) baseline.conf    = Number(conf);

      hideForHour(prefix, id, baseline);

      const container = btn.closest('.card, .corridor');
      if (container) {
        container.remove();
        const wazeHost = document.getElementById('waze-panel');
        if (wazeHost && wazeHost.contains(container)) {
          requestAnimationFrame(ensureWazeFits);
        }
      }
    }, { passive: false });

    function unhideAll(){
      const keys = [];
      for (let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith('hide_')) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));

      try{ clearTimeout(tvtTimer); }catch{}
      try{ clearTimeout(wazeTimer); }catch{}
      try{ clearTimeout(divTimer); }catch{}
      tvtTimer = null; wazeTimer = null; divTimer = null;

      tvtCycle(); wazeCycle(); divertsCycle();
    }

    /* =======================================================
       TVT PANEL (left) — GRID CARDS, 3 LINES
       ======================================================= */
    const TVT_URL = 'https://occproxy-6dem.vercel.app/api/proxy?url=https://www.waze.com/row-partnerhub-api/feeds-tvt/?id=1709296452339';
    const TVT_REFRESH_MS = 5 * 60 * 1000;
    let tvtTimer = null;

    let TVT_MIN_DELAY = 15;
    let lastTvtData = null;

    function escapeHTML(str){
      return String(str).replace(/[&<>"']/g, ch =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])
      );
    }

    function corridorDisplayName(r){
      const base = String(r?.name || r?.toName || 'Unnamed corridor');
      const parts = base.split(' - ');
      return (parts[0] || base).trim();
    }

    function networkGradientFromUsersOnJams(usersOnJams){
      if (!Array.isArray(usersOnJams) || usersOnJams.length === 0) {
        return 'linear-gradient(90deg,#42BE4B,#ffe04a,#ff4d4f)';
      }
      const levelColors = { 0:'#42BE4B', 1:'#9ddc43', 2:'#ffe04a', 3:'#ff9a1f', 4:'#ff4d4f' };
      const total = usersOnJams.reduce((a,u)=>a + (Number(u.wazersCount)||0), 0) || 1;
      let acc = 0, stops=[];
      usersOnJams.slice().sort((a,b)=>a.jamLevel-b.jamLevel).forEach(u=>{
        const pct = (Number(u.wazersCount)||0)/total*100;
        const start = acc, end = acc + pct;
        stops.push(`${levelColors[u.jamLevel] || '#666'} ${start.toFixed(2)}% ${end.toFixed(2)}%`);
        acc = end;
      });
      return `linear-gradient(90deg, ${stops.join(', ')})`;
    }

    function delayColor(delayMin){
      // 15m delay threshold = RED
      if (delayMin >= 15) return '#FF4D4F';
      if (delayMin >= 10) return '#FF9A1F';
      if (delayMin >= 5)  return '#FFE04A';
      return '#9DDC43';
    }

    function computeTopNDelays(routesRaw, n = 16, minDelay = 15){
      const routes = Array.isArray(routesRaw) ? routesRaw.slice() : [];
      const candidates = routes
        .map(r => {
          const time = Number(r.time)||0;
          const hist = Number(r.historicTime)||0;
          const delaySec = Math.max(0, time - hist);
          const delayMin = Math.round(delaySec / 60);
          return { r, time, hist, delayMin };
        })
        .filter(x => Number.isFinite(x.delayMin) && x.delayMin >= minDelay);

      candidates.sort((a,b) =>
        (b.delayMin - a.delayMin) ||
        (b.time - a.time)
      );

      return candidates.slice(0, n);
    }

    const routeKey = (r) => String(r?.id ?? r?.name ?? corridorDisplayName(r) ?? '').trim();

/* =======================================================
   ABNORMAL TRAFFIC → click corridor to open Waze Map Tool
   Uses bbox centre if present, else averages the polyline.
   ======================================================= */
function getCorridorCenterLngLat(route){
  // Returns [lon, lat] or null
  try{
    // 1) Best: bbox center (your feed has bbox.minX/minY/maxX/maxY)
    const bb = route?.bbox;
    if (bb){
      const minX = Number(bb.minX), maxX = Number(bb.maxX);
      const minY = Number(bb.minY), maxY = Number(bb.maxY);
      if ([minX, maxX, minY, maxY].every(Number.isFinite)){
        return [(minX + maxX) / 2, (minY + maxY) / 2];
      }
    }

    // 2) Fallback: average of line points (your feed has line[].x/.y)
    const pts = Array.isArray(route?.line) ? route.line : [];
    let sumX = 0, sumY = 0, n = 0;
    for (const p of pts){
      const x = Number(p?.x);
      const y = Number(p?.y);
      if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
      sumX += x; sumY += y; n++;
    }
    if (n > 0){
      return [sumX / n, sumY / n];
    }
  }catch(e){}
  return null;
}

function bindCorridorClicks(){
  const list = document.getElementById('tvt-corridors');
  if (!list) return;

  // Event delegation: survives re-renders (innerHTML updates)
  list.addEventListener('click', (ev) => {
    // ✅ Do nothing if user clicked Hide button (keep hide behaviour)
    if (ev.target && ev.target.closest('.hide-btn')) return;

    const card = ev.target.closest('.corridor');
    if (!card) return;

    const lon = Number(card.getAttribute('data-lon'));
    const lat = Number(card.getAttribute('data-lat'));
    if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;

    const u = new URL('https://www.waze.com/partnerhub/map-tool');
    u.searchParams.set('lon', String(lon));
    u.searchParams.set('lat', String(lat));

    window.open(u.toString(), '_blank', 'noopener');
  }, { passive: true });
}

    function renderTvtPanel(data){
      lastTvtData = data;

      const host = document.getElementById('abnormal-traffic');
      if (!host) return;

      const list = document.getElementById('tvt-corridors');
      const net  = host.querySelector('.network-bar');

      // Update network health gradient
      if (net){
        net.style.background = networkGradientFromUsersOnJams(data?.usersOnJams || []);
      }

      // Update footer "Connected Citizens"
      updateConnectedCitizensDisplay(sumWazers(data?.usersOnJams || []));

      const rows = computeTopNDelays(data?.routes || [], 16, TVT_MIN_DELAY);

      const filtered = rows
        .map(x => ({ ...x, id: routeKey(x.r) }))
        .filter(it => !isHiddenWithAutoCheck('corr', it.id, { delayMin: it.delayMin }));

      const itemHTML = (it) => {
        const street = escapeHTML(corridorDisplayName(it.r));
        const id = escapeHTML(it.id);

        const delayMin = Math.max(0, Number(it.delayMin)||0);
        const col = delayColor(delayMin);

        const normMin = Math.max(0, Math.round((Number(it.hist)||0) / 60));
        const nowMin  = Math.max(0, Math.round((Number(it.time)||0) / 60));
        const center = getCorridorCenterLngLat(it.r);
        const cLon = center ? Number(center[0]) : NaN;
        const cLat = center ? Number(center[1]) : NaN;
        const hasCenter = Number.isFinite(cLon) && Number.isFinite(cLat);
        

        return `

  <div class="corridor"
       title="${escapeHTML(it.r?.name||'')}"
       data-delay="${delayMin}"
       ${hasCenter ? `data-lon="${cLon}" data-lat="${cLat}"` : ''}>
            <div class="corridor-top">
              <div class="corridor-title">${street}</div>
              <button class="hide-btn"
                      data-prefix="corr"
                      data-id="${id}"
                      data-baseline-delay="${delayMin}"
                      type="button">Hide</button>
            </div>

            <div class="corridor-delay" style="--delay-col:${col}">
              +${delayMin}m
            </div>

            <div class="corridor-times">
              ${normMin}m → ${nowMin}m
            </div>
          </div>
        `;
      };

      list.innerHTML = filtered.length
        ? filtered.map(itemHTML).join('')
        : `
          <div class="corridor" style="grid-column: 1 / -1;">
          
            <div class="corridor-top">
              <div class="corridor-title">No corridors above +${TVT_MIN_DELAY}m</div>
            </div>
            <div class="corridor-delay" style="--delay-col:rgba(255,255,255,0.7)">Normal</div>
            <div class="corridor-times">Use the filter buttons below to view smaller delays</div>
          </div>
        `;
    }

    function bindTvtFilters(){
      const wrap = document.getElementById('tvt-filters');
      if (!wrap) return;

      wrap.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-min]');
        if (!btn) return;

        TVT_MIN_DELAY = Number(btn.dataset.min) || 15;

        wrap.querySelectorAll('button[data-min]').forEach(b => {
          b.classList.toggle('active', b === btn);
        });

        if (lastTvtData) renderTvtPanel(lastTvtData);
      }, { passive: true });
    }

    async function fetchTVT(signal){
      const res = await fetch(withCacheBust(TVT_URL), { cache:'no-store', signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const trimmed = text.replace(/^\uFEFF/, '').trim();
      return JSON.parse(trimmed);
    }

    async function tvtCycle(){
      let ctrl = new AbortController();
      try{
        const data = await fetchTVT(ctrl.signal);
        renderTvtPanel(data);
        setStatusPill(true, { animate:true });
      }catch(e){
        console.error('[TVT] fetch failed:', e);
        setStatusPill(false, { animate:false });
      }finally{
        clearTimeout(tvtTimer);
        tvtTimer = setTimeout(tvtCycle, TVT_REFRESH_MS);
      }
    }

    /* =======================================================
       WAZE ALERTS (right) — accidents, signals, weather (ice)
       ======================================================= */
    const WAZE_URL = 'https://www.waze.com/row-partnerhub-api/partners/11867436614/waze-feeds/4e8ef399-d6b9-4338-9840-7c2beacd235b?format=1';
    const WAZE_REFRESH_MS = 30000;
    const PROXIES = [
      (url) => `https://occproxy-6dem.vercel.app/api/proxy?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    ];

    async function fetchViaProxies(url, signal){
      const busted = withCacheBust(url);
      const errors = [];
      for(const build of PROXIES){
        const proxied = build(busted);
        try{
          const res = await fetch(proxied, { cache:'no-store', signal });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const trimmed = text.replace(/^\uFEFF/, '').trim();
          if(!trimmed || trimmed[0] !== '{') throw new Error('Non-JSON response');
          return JSON.parse(trimmed);
        }catch(e){ errors.push(`${proxied}: ${e.message}`); }
      }
      throw new Error(`All proxies failed\n${errors.join('\n')}`);
    }

    function toRad(deg){ return deg * Math.PI / 180; }
    function haversineMeters([lon1, lat1], [lon2, lat2]){
      const R = 6371000, dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function stableClusterId(coord){
      const lon = Number(coord[0]).toFixed(4);
      const lat = Number(coord[1]).toFixed(4);
      return `cluster-${lon},${lat}`;
    }
    function readConfidence(a){ return Number(a.confidence ?? a.confidenceLevel ?? a.level ?? 0) || 0; }
    function readReliability(a){ return Number(a.reliability ?? a.reliabilityScore ?? 0) || 0; }
    function readType(a){ return String(a.type || a.alertType || '').toUpperCase(); }
    function readSubType(a){ return String(a.subtype || a.subType || a.sub_type || '').toUpperCase(); }
    function readDesc(a){ return String(a.description || a.reportDescription || a.title || '').toUpperCase(); }

    function getLngLatFromAlert(a){
      try{
        if(a){
          if(a.location){
            const loc = a.location;
            if(typeof loc.x==='number' && typeof loc.y==='number') return [loc.x, loc.y];
            if(typeof loc.lon==='number' && typeof loc.lat==='number') return [loc.lon, loc.lat];
            if(Array.isArray(loc.coordinates) && loc.coordinates.length>=2) return [loc.coordinates[0], loc.coordinates[1]];
            if(loc.point && typeof loc.point.x==='number' && typeof loc.point.y==='number') return [loc.point.x, loc.point.y];
          }
          if(a.geometry?.coordinates && a.geometry.coordinates.length>=2){
            const c = a.geometry.coordinates; if(typeof c[0]==='number' && typeof c[1]==='number') return [c[0], c[1]];
          }
          if(typeof a.longitude==='number' && typeof a.latitude==='number') return [a.longitude, a.latitude];
        }
      }catch(e){}
      return null;
    }

    function isAccident(a){
      const t = readType(a);
      const st = readSubType(a);
      return t.includes('ACCIDENT') || st.includes('ACCIDENT');
    }

    function isIceAlert(a){
      const st = String(a?.subtype ?? a?.subType ?? a?.sub_type ?? '').toUpperCase();
      if (st === 'HAZARD_ON_ROAD_ICE') return true;

      const t  = String(a?.type || a?.alertType || '').toUpperCase();
      const d  = String(a?.description || a?.reportDescription || a?.title || '').toUpperCase();
      return (
        t.includes('ICE') ||
        /\bICE\b|\BICY\b|BLACK\s*ICE|RECENT(LY)?\s+FORMED\s+ICE/.test(d)
      );
    }

    function isTrafficLightFault(a){
      const t = readType(a), st = readSubType(a), d = readDesc(a);
      return (
        st === 'HAZARD_ON_ROAD_TRAFFIC_LIGHT_FAULT' ||
        (t.includes('TRAFFIC') && t.includes('LIGHT')) ||
        st.includes('TRAFFIC_LIGHT') || st.includes('LIGHT_FAULT') ||
        /BROKEN\s+TRAFFIC\s+LIGHT|TRAFFIC\s+LIGHT\s+FAULT|SIGNAL\s+FAULT/i.test(d)
      );
    }

    function dedupAccidentClusters(clusters, opts={}){
      const { corridorMeters = 8000 } = opts;
      if (!Array.isArray(clusters) || clusters.length === 0) return [];
      const groups = new Map();
      for (const c of clusters){
        const token = (c.street||'').toUpperCase().match(/\b([MBA]\d{1,4})\b/);
        const key = token ? token[1] : (c.street||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim() || '___unknown___';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(c);
      }
      const kept = [];
      for (const arr of groups.values()){
        arr.sort((a,b)=>
          (Number(b.effectiveConfidence||0) - Number(a.effectiveConfidence||0)) ||
          (Number(b.time||0) - Number(a.time||0))
        );
        const chosen = [];
        const H = ([lon1,lat1],[lon2,lat2])=>{
          const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
          const A=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
          return 2*R*Math.atan2(Math.sqrt(A), Math.sqrt(1-A));
        };
        for (const c of arr){
          let dup = false;
          for (const k of chosen){
            const dist = H(c.coord, k.coord);
            if (dist <= corridorMeters){ dup = true; break; }
          }
          if (!dup) chosen.push(c);
        }
        kept.push(...chosen);
      }
      kept.sort((a,b)=>
        (Number(b.effectiveConfidence||0) - (Number(a.effectiveConfidence||0))) ||
        (Number(b.time||0) - (Number(a.time||0)))
      );
      return kept;
    }

      if(!place || !town) return null;
      return { place, town };
    }

    function divMapSituation(s){
      const operatorRefs = divGetOperatorRefs(s);
      const lines = divGetLineRefs(s);
      const st = s?.ValidityPeriod?.StartTime || s?.StartTime ? new Date(s?.ValidityPeriod?.StartTime || s?.StartTime) : null;
      const en = s?.ValidityPeriod?.EndTime   || s?.EndTime   ? new Date(s?.ValidityPeriod?.EndTime   || s?.EndTime)   : null;

      const parsed = divParseSummaryParts(s.Summary || s.Description || "");
      const street = parsed?.place || "";
      const town   = parsed?.town  || "";

      const isUFN = !en;

      return {
        id: divGetSituationId(s),
        operatorRefs,
        routes: lines,
        summary: (s.Summary || s.Description || "").trim(),
        street,
        town,
        start: st,
        end: en,
        isUFN,
        startedLabel: dFormatLabel(st),
        endsLabel: isUFN ? "UFN" : dFormatLabel(en),
        durationLabel: dDuration(st, en)
      };
    }

    function divSortItems(a, b){
      if (a.isUFN && !b.isUFN) return -1;
      if (!a.isUFN && b.isUFN) return 1;
      if (a.isUFN && b.isUFN) return (a.start?.getTime()||0) - (b.start?.getTime()||0);
      const aEnd = a.end?.getTime() ?? Number.POSITIVE_INFINITY;
      const bEnd = b.end?.getTime() ?? Number.POSITIVE_INFINITY;
      if (aEnd !== bEnd) return aEnd - bEnd;
      return (a.start?.getTime()||0) - (b.start?.getTime()||0);
    }

    async function divFetch(){
      const res = await fetch(withCacheBust(DIV_BODS_URL), { cache:'no-store' });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);

      let parsed;
      try{
        parsed = { type:"json", data: await res.clone().json() };
      }catch{
        const text = await res.text();
        parsed = { type:"xml", data: (new DOMParser()).parseFromString(text,"application/xml") };
      }

      const fromJSON = (json) => {
        const sd = json?.ServiceDelivery || json?.Siri?.ServiceDelivery || json?.SIRI?.ServiceDelivery || json;
        if(!sd) return [];
        const sed = Array.isArray(sd.SituationExchangeDelivery)
          ? sd.SituationExchangeDelivery
          : [sd.SituationExchangeDelivery].filter(Boolean);
        const out=[];
        for(const d of sed){
          const pe = d?.Situations?.PtSituationElement;
          if(Array.isArray(pe)) out.push(...pe);
          else if(pe) out.push(pe);
        }
        return out;
      };

      const fromXML = (doc) => {
        const els = [...doc.querySelectorAll("PtSituationElement")];
        return els.map(el=>{
          const T = s => el.querySelector(s)?.textContent?.trim() || null;
          const opsRef = [...el.querySelectorAll("AffectedVehicleJourney > OperatorRef, OperatorRef")]
                          .map(n=>n.textContent.trim()).filter(Boolean);
          const lines  = [...el.querySelectorAll("AffectedVehicleJourney > LineRef, PublishedLineName, LineName")]
                          .map(n=>n.textContent.trim()).filter(Boolean);
          return {
            Summary: T("Summary") || T("Description"),
            Description: T("Description"),
            Planned: T("Planned"),
            SituationNumber: T("SituationNumber") || T("SituationRef"),
            ParticipantRef: T("ParticipantRef"),
            ValidityPeriod: {
              StartTime: T("ValidityPeriod > StartTime") || T("StartTime"),
              EndTime:   T("ValidityPeriod > EndTime")   || T("EndTime"),
            },
            Affects: {
              VehicleJourneys: {
                AffectedVehicleJourney: lines.length
                  ? lines.map((ln)=>({ OperatorRef: opsRef[0] || null, LineRef: ln }))
                  : []
              }
            },
            __operatorRefs: opsRef,
            __lineRefs: lines
          };
        });
      };

      let sits = parsed.type==="json" ? fromJSON(parsed.data) : fromXML(parsed.data);

      sits = sits.filter(divIsBeeOperator)
                 .filter(divIsDiversion)
                 .filter(divIsCurrentlyValid)
                 .filter(sit => {
                   const p = sit?.Planned;
                   return (p === false) || (typeof p === "string" && p.trim().toLowerCase() === "false");
                 })
                 .filter(divMatchesMode);

      return sits.map(divMapSituation).sort(divSortItems);
    }

    function divBuildRouteChips(routes){
      const host = document.createElement('div');
      host.className = 'routes';
      const list = Array.isArray(routes) ? routes : ["?"];
      if (list.length <= 3){
        list.forEach(r=>{
          const chip = document.createElement('span');
          chip.className = 'route-chip';
          chip.textContent = r;
          host.appendChild(chip);
        });
      } else {
        for (let i=0;i<3;i++){
          const chip = document.createElement('span');
          chip.className = 'route-chip';
          chip.textContent = list[i];
          host.appendChild(chip);
        }
        const more = document.createElement('span');
        more.className = 'route-chip more';
        more.textContent = `+${list.length-3}`;
        host.appendChild(more);
      }
      return host;
    }

    function divBuildOpTag(operatorRefs){
      const tag = document.createElement('div');
      tag.className = 'op-tag';

      const dot = document.createElement('span');
      dot.className = 'op-dot';

      const upperRefs = (operatorRefs || []).map(r => String(r).toUpperCase());
      const codes = upperRefs.map(r => DIV_OP_MAP[r] || r);
      const colors = upperRefs.map(r => DIV_OP_COLORS[r]).filter(Boolean);

      dot.style.backgroundColor = colors[0] || '#cfcfd6';
      tag.appendChild(dot);

      const rot = document.createElement('div');
      rot.className = 'op-code-rotator';

      if (codes.length <= 1){
        const c = document.createElement('span');
        c.textContent = codes[0] || '—';
        c.className = 'op-code active';
        rot.appendChild(c);
      } else {
        codes.forEach((c, i) => {
          const el = document.createElement('span');
          el.textContent = c;
          el.className = 'op-code' + (i === 0 ? ' active' : '');
          rot.appendChild(el);
        });

        let idx = 0;
        const rotateCodes = () => {
          const children = rot.querySelectorAll('.op-code');
          if (children.length <= 1) return;
          children[idx].classList.remove('active');
          idx = (idx + 1) % children.length;
          children[idx].classList.add('active');
        };
        const codeInterval = setInterval(rotateCodes, 3200);

        let cIdx = 0;
        const cycleDot = () => {
          if (colors.length <= 1) return;
          cIdx = (cIdx + 1) % colors.length;
          dot.style.backgroundColor = colors[cIdx] || '#cfcfd6';
        };
        const dotInterval = setInterval(cycleDot, 3200);

        const observer = new MutationObserver(() => {
          if (!document.body.contains(tag)){
            clearInterval(codeInterval);
            clearInterval(dotInterval);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      tag.appendChild(rot);
      return tag;
    }

function divRenderBoard(items){
  const grid = document.querySelector('#diverts-grid');
  if (!grid) return;

  const list = Array.isArray(items) ? items : [];

  // Track IDs so "new UFN flash" still works correctly
  const currentIds = new Set(list.map(it => it.id));

  grid.innerHTML = '';

  for (const it of list){
    const card = document.createElement('div');
    card.className = 'divert-card';
    card.setAttribute('data-sit', String(it.id || '').trim());

    if (it.isUFN){ card.classList.add('ufn-highlight'); }

    // Header
    const header = document.createElement('div');
    header.className = 'divert-header';

    const routes = divBuildRouteChips(it.routes || ["?"]);
    routes.title = (it.routes || []).join(', ');

    const opTag = divBuildOpTag((it.operatorRefs || []).map(r => String(r).toUpperCase()));
    opTag.title = (it.operatorRefs || []).join(', ') || '—';

    header.append(routes, opTag);

    // Street
    const streetLine = document.createElement('div');
    streetLine.className = 'street-line';

    const st = document.createElement('span');
    st.className = 'street';
    st.textContent = it.street || '—';

    streetLine.append(st);

    // Location / summary
    const loc = document.createElement('div');
    loc.className = 'location';
    loc.textContent = it.town || it.summary || 'Travel alert';

    // Times
    const times = document.createElement('div');
    times.className = 'times';

    const row1 = document.createElement('div');
    row1.className = 'time-row';
    row1.innerHTML = `<span class="lab">Started:</span> <span class="val">${it.startedLabel || '—'}</span>`;

    const row2 = document.createElement('div');
    row2.className = 'time-row' + (String(it.endsLabel || '').toUpperCase() === 'UFN' ? ' ufn' : '');
    row2.innerHTML = `<span class="lab">Ends:</span> <span class="val">${it.endsLabel || '—'}</span>`;

    const row3 = document.createElement('div');
    row3.className = 'time-row';
    row3.innerHTML = `<span class="lab">Duration:</span> <span class="val">${it.durationLabel || '—'}</span>`;

    times.append(row1, row2, row3);

    // Assemble card
    card.append(header, streetLine, loc, times);

    // Keep your "new UFN flash" behaviour
    if (it.isUFN && !lastBoardIds.has(it.id)){
      card.classList.add('new-ufn-flash');
      setTimeout(() => card.classList.remove('new-ufn-flash'), 1600);
    }

    grid.appendChild(card);
  }

  // Save for next refresh
  lastBoardIds = currentIds;
}

    async function divertsCycle(){
      const ctrl = new AbortController();
      try{
        const items = await divFetch();
        divRenderBoard(items);
        setStatusPill(true, { animate:false });
      }catch(e){
        console.error('[DIVERTS] fetch failed:', e);
        setStatusPill(false, { animate:false });
      }finally{
        clearTimeout(divTimer);
        divTimer = setTimeout(divertsCycle, DIV_REFRESH_MS);
      }
    }

    /* =======================================================
       ROUTE OPERATOR CHECKER — live CSV lookup (Routes.csv)
       ======================================================= */
    const ROC_CSV_URL = 'https://ryanocc.github.io/Routes.csv';

    const ROC_OPERATOR_PRIORITY = [
      { name: 'STAGECOACH MANCHESTER', code: 'SC', color: '#ff9a1f' },
      { name: 'METROLINE MANCHESTER',  code: 'ML', color: '#ff4d4f' },
      { name: 'GO NORTH WEST',         code: 'GN', color: '#003C6E' },
      { name: 'DIAMOND',               code: 'DB', color: '#9AC331' },
      { name: 'FIRST MANCHESTER',      code: 'FB', color: '#ff66b3' },
      { name: 'VISION BUS',            code: 'VB', color: '#7a3ffe' }
    ];
    const ROC_OPERATOR_INDEX = ROC_OPERATOR_PRIORITY.reduce((m,o)=>{ m[o.name]=o; return m; }, {});

    const ROC_STATE = {
      rows: [],
      fetched: false,
      fetching: false,
      lastQuery: ''
    };

    function rocNormalizeRoute(raw){
      const s = String(raw||'').toUpperCase().replace(/\s+/g,'');
      const m = s.match(/^([A-Z]*)(\d+)?([A-Z]*)$/);
      if (!m) return s;
      const prefix = m[1] || '';
      const digits = (m[2] || '').replace(/^0+/, '') || (m[2] ? '0' : '');
      const suffix = m[3] || '';
      return `${prefix}${digits}${suffix}`;
    }

    function textColorForBg(hex){
      try{
        const h = hex.replace('#','');
        const r = parseInt(h.substring(0,2),16);
        const g = parseInt(h.substring(2,4),16);
        const b = parseInt(h.substring(4,6),16);
        const yiq = (r*299 + g*587 + b*114) / 1000;
        return yiq >= 150 ? '#000' : '#fff';
      }catch{ return '#000'; }
    }

    async function rocFetchCSV(){
      if (ROC_STATE.fetching || ROC_STATE.fetched) return;
      ROC_STATE.fetching = true;

      const status = document.getElementById('roc-status');
      if (status) status.textContent = 'Loading route list…';

      try{
        const res = await fetch(ROC_CSV_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();

        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        const header = lines.shift() || '';
        const delim = header.includes(';') ? ';' : ',';

        const h = header.split(delim).map(s => s.trim().toLowerCase());
        const idxRoute = h.indexOf('route');
        const idxDesc  = h.indexOf('description');
        const idxOper  = h.indexOf('operator');

        if (idxRoute === -1 || idxDesc === -1 || idxOper === -1){
          throw new Error('Unexpected CSV header. Expected: route, description, operator');
        }

        const rows = [];
        for (const line of lines){
          const parts = line.split(delim);
          if (parts.length < 3) continue;
          const route = (parts[idxRoute] || '').trim();
          const description = (parts[idxDesc] || '').trim();
          const operator = (parts[idxOper] || '').trim();
          if (!route) continue;
          rows.push({ route, description, operator });
        }

        ROC_STATE.rows = rows;
        ROC_STATE.fetched = true;

        if (status) status.textContent = `Loaded ${rows.length} routes`;
      }catch(e){
        console.error('[ROC] CSV fetch failed:', e);
        const status = document.getElementById('roc-status');
        if (status) status.textContent = 'Unable to load routes (stand by)';
      }finally{
        ROC_STATE.fetching = false;
      }
    }

    function rocRenderPrompt(){
      const host = document.getElementById('roc-result');
      if (!host) return;
      host.innerHTML = `<div class="roc-empty">Type a route number to see its description and operator.</div>`;
    }

    function rocRenderNoMatch(){
      const host = document.getElementById('roc-result');
      if (!host) return;
      host.innerHTML = `<div class="roc-empty">No matching route found.</div>`;
    }

    function rocRenderResult(row, mappedOp){
      const host = document.getElementById('roc-result');
      if (!host) return;

      const opName = String(row.operator || '').trim().toUpperCase();
      const map = ROC_OPERATOR_INDEX[opName] || mappedOp || null;

      const code  = map?.code  || '';
      const color = map?.color || '';
      const pillStyle = color
        ? `background:${color}; border-color: rgba(255,255,255,0.22); color:${textColorForBg(color)}`
        : '';

      host.innerHTML = `
        <div class="roc-card">
          <div class="roc-route-chip">${escapeHTML(row.route)}</div>
          <div class="roc-right">
            <div class="roc-desc">${escapeHTML(row.description || '—')}</div>
            <div class="roc-operator-chip" style="${pillStyle}">
              <span class="roc-op-swatch" style="${color ? `background:${color}` : ''}"></span>
              <span>${escapeHTML(code || '—')}</span>
              <span>• ${escapeHTML(row.operator || 'Unknown')}</span>
            </div>
          </div>
        </div>
      `;
    }

    function chooseBestRowForExactRoute(candidates){
      if (!Array.isArray(candidates) || candidates.length === 0) return null;
      const byName = new Map();
      candidates.forEach((r,i) => byName.set(String(r.operator||'').trim().toUpperCase(), i));
      for (const pref of ROC_OPERATOR_PRIORITY){
        const idx = byName.get(pref.name);
        if (idx != null) return { row: candidates[idx], mapped: pref };
      }
      return { row: candidates[0], mapped: null };
    }

    function rocSearch(q){
      const status = document.getElementById('roc-status');
      const host = document.getElementById('roc-result');
      if (!host) return;

      const normInput = rocNormalizeRoute(q);
      if (!normInput){
        rocRenderPrompt();
        if (status) status.textContent = '';
        return;
      }

      const exactCandidates = ROC_STATE.rows.filter(r => rocNormalizeRoute(r.route) === normInput);

      if (exactCandidates.length === 0){
        rocRenderNoMatch();
        if (status) status.textContent = '';
        return;
      }

      const picked = chooseBestRowForExactRoute(exactCandidates);
      if (!picked){
        rocRenderNoMatch();
        if (status) status.textContent = '';
        return;
      }

      rocRenderResult(picked.row, picked.mapped);
      if (status) status.textContent = exactCandidates.length > 1
        ? `Found ${exactCandidates.length} entries • showing best operator match`
        : `Found 1 match`;
    }

    function rocBind(){
      const input = document.getElementById('roc-input');
      if (!input) return;

      let t = null;
      const onChange = () => {
        const q = input.value || '';
        ROC_STATE.lastQuery = q;
        clearTimeout(t);
        t = setTimeout(() => rocSearch(q), 120);
      };

      input.addEventListener('input', onChange, { passive: true });
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          clearTimeout(t);
          rocSearch(input.value || '');
        }
      });

      rocRenderPrompt();
    }

    /* =======================================================
       BOOT / VISIBILITY
       ======================================================= */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){
        clearTimeout(tvtTimer); tvtTimer = null;
        clearTimeout(wazeTimer); wazeTimer = null;
        clearTimeout(divTimer);  divTimer  = null;
      } else {
        tvtCycle();
        wazeCycle();
        divertsCycle();
      }
    });

    window.addEventListener('load', () => {
      setStatusPill(false, { animate:false });

      const unhideBtn = document.getElementById('unhideAllBtn');
      if (unhideBtn){ unhideBtn.addEventListener('click', unhideAll, { passive: true }); }

      bindTvtFilters();
      bindDivFilters();
      
      

bindCorridorClicks();
bindDivertCardClicks();

      tvtCycle();
      wazeCycle();
      divertsCycle();

      rocBind();
      rocFetchCSV().then(() => {
        if ((ROC_STATE.lastQuery || '').trim()){
          rocSearch(ROC_STATE.lastQuery);
        }
      });

      window.addEventListener('resize', () => requestAnimationFrame(ensureWazeFits));
    });
  </script>
