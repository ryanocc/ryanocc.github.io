<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LST - Waze Accident Wall Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --text:#f2f2f2;
      --muted:#c9cacc;
      --liveGreen:#42BE4B;
      --errorRed:#EA5540;
      --accent:#FFE04A;
      --line:rgba(255,255,255,.08);
      --shadow:0 8px 24px rgba(0,0,0,.35);
      --radius:12px;
      --gap:12px;
      --frame-padding:12px;
      --titlebar-h:10vh;
      --highConfMin:4;
    }

    *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:"IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }
    button,input{font:inherit}

    .app{height:100dvh;display:grid;grid-template-rows:1fr var(--titlebar-h);overflow:hidden;min-height:0}
    .content{
      padding:var(--gap);
      display:grid;
      grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);
      gap:var(--gap);
      min-height:0;
      overflow:hidden;
      height:100%;
    }
    .col-map,.col-alerts{display:flex;flex-direction:column;min-height:0;overflow:hidden;gap:var(--gap)}

    .frame{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:var(--frame-padding);
      min-height:0;
      overflow:hidden;
      display:grid;
      grid-template-rows:auto 1fr;
      gap:8px;
    }
    .frame-header{
      font-size:clamp(12px,1.8vh,14px);
      font-weight:800;
      letter-spacing:.4px;
      text-transform:uppercase;
      color:var(--muted);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .frame-body{min-height:0;overflow:hidden}
    #frame-map{flex:1 1 0}
    #frame-tools{flex:0 0 clamp(170px,24vh,230px)}
    #frame-alerts{flex:1 1 0}

    #map{width:100%;height:100%;border-radius:10px;overflow:hidden}

    .place-search{position:relative;margin-bottom:10px}
    #gmSearch{
      width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
      color:#fff;font-weight:800;font-size:clamp(12px,2vh,15px);padding:12px 40px 12px 12px;
      border-radius:12px;outline:none;
    }
    #gmSearch:focus{border-color:rgba(255,224,74,.75);background:rgba(255,255,255,.10);box-shadow:0 0 0 2px rgba(255,224,74,.12)}
    .search-spinner{position:absolute;right:12px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--accent);animation:spin .8s linear infinite;display:none;pointer-events:none}
    .search-spinner.active{display:block}
    @keyframes spin{to{transform:rotate(360deg)}}

    .suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:1000;display:none;background:rgba(10,10,10,.98);border:1px solid rgba(255,255,255,.14);border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.55);overflow:hidden}
    .suggestions.open{display:block}
    .suggest-list{margin:0;padding:6px;list-style:none;max-height:min(34vh,320px);overflow:auto}
    .suggest-item{padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent;color:rgba(255,255,255,.92);font-weight:800;line-height:1.2}
    .suggest-item small{display:block;margin-top:4px;font-weight:700;color:rgba(255,255,255,.70)}
    .suggest-item:hover,.suggest-item.active{background:rgba(255,224,74,.16);border-color:rgba(255,224,74,.65)}

    .tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-content:start;height:100%;overflow:auto;padding-right:2px}
    .tool-grid button,.toolbar-btn,.hide-btn{
      appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;
      font-weight:800;border-radius:9px;cursor:pointer;
    }
    .tool-grid button{font-size:clamp(11px,1.6vh,13px);padding:8px;min-height:34px}
    .tool-grid button:hover,.toolbar-btn:hover,.hide-btn:hover{border-color:rgba(255,224,74,.75);background:rgba(255,255,255,.12)}
    .tool-grid button:disabled{opacity:.35;cursor:not-allowed}
    .toolbar-btn,.hide-btn{padding:5px 10px;font-size:11px;letter-spacing:.4px;text-transform:uppercase}

    #waze-panel{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px;padding-bottom:16px}
    .section{display:grid;gap:8px}
    .section-title{font-size:clamp(11px,1.6vh,13px);text-transform:uppercase;font-weight:800;letter-spacing:.6px;color:var(--muted);border-left:3px solid rgba(255,255,255,.15);padding-left:8px}
    .cards{display:grid;gap:8px}
    .card{display:grid;gap:6px;padding:10px 12px 36px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);position:relative;cursor:pointer}
    .card:hover{border-color:rgba(255,224,74,.38);background:rgba(255,255,255,.065)}
    .card .hide-btn{position:absolute;right:10px;bottom:8px;font-size:10px;padding:3px 8px}
    .card .title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(14px,2.2vh,18px);min-width:0}
    .card .road{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card .meta{font-weight:800;font-size:clamp(12px,1.8vh,14px);color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card .desc{font-weight:700;font-size:clamp(12px,1.8vh,14px);color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty-state{padding:22px;border:1px dashed rgba(255,255,255,.16);border-radius:12px;color:rgba(255,255,255,.68);font-weight:800;text-align:center}
    .count-badge{padding:3px 8px;border-radius:999px;background:rgba(255,224,74,.12);color:var(--accent);font-size:12px;font-weight:900}

    .titlebar{border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(255,224,74,.06),transparent);display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 16px;gap:12px}
    .title-left,.title-right{display:flex;align-items:center;gap:12px;min-width:0}
    .footer-label{font-size:clamp(14px,2.2vh,18px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status-pill{padding:10px 16px;border-radius:999px;font-size:clamp(14px,2.2vh,18px);font-weight:800;background:var(--liveGreen);color:#000;white-space:nowrap;transition:background .2s,color .2s}
    .status-error{background:var(--errorRed);color:#fff}
    #beeLogo{width:clamp(40px,6vh,64px);height:clamp(40px,6vh,64px);object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
    @keyframes wibble{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(4deg) scale(1.05)}40%{transform:rotate(-4deg) scale(1.05)}60%{transform:rotate(3deg) scale(1.03)}80%{transform:rotate(-3deg) scale(1.03)}}
    .bee-wibble{animation:wibble 650ms ease-out}

    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,224,74,.55),rgba(255,255,255,.35));border-radius:999px;border:2px solid transparent;background-clip:padding-box}

    @media (max-width:900px){
      body{overflow:auto}
      .app{height:auto;min-height:100dvh;grid-template-rows:auto auto}
      .content{grid-template-columns:1fr;height:auto;overflow:visible}
      .col-map,.col-alerts{overflow:visible}
      #frame-map{height:55vh;flex:none}
      #frame-tools{min-height:210px;flex:none}
      #frame-alerts{min-height:60vh;flex:none}
      .tool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .titlebar{min-height:82px}
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="content" aria-label="Waze accident dashboard">
      <div class="col-map">
        <section class="frame" id="frame-map" aria-labelledby="map-title">
          <div class="frame-header" id="map-title">Map</div>
          <div class="frame-body"><div id="map" aria-label="Map"></div></div>
        </section>

        <section class="frame" id="frame-tools" aria-labelledby="tools-title">
          <div class="frame-header" id="tools-title">Open in other tools</div>
          <div class="frame-body">
            <div class="place-search" id="placeSearch">
              <input id="gmSearch" type="text" inputmode="search" autocomplete="off" placeholder="Search Greater Manchester" aria-label="Search places in Greater Manchester" aria-autocomplete="list" aria-expanded="false" aria-controls="gmSuggest">
              <div class="search-spinner" id="searchSpinner" aria-hidden="true"></div>
              <div id="gmSuggest" class="suggestions" role="listbox" aria-label="Search suggestions"></div>
            </div>
            <div class="tool-grid" id="toolGrid" aria-label="Tool links">
              <button type="button" data-tool="google">Google Maps</button>
              <button type="button" data-tool="bustimes">Bus Times</button>
              <button type="button" data-tool="waze_alerts">Waze Alerts</button>
              <button type="button" data-tool="waze_closures">Waze Closures</button>
              <button type="button" data-tool="tomtom">TomTom</button>
              <button type="button" data-tool="vms">VMS</button>
              <button type="button" data-tool="utc">UTC Sites</button>
            </div>
          </div>
        </section>
      </div>

      <div class="col-alerts">
        <section class="frame" id="frame-alerts" aria-labelledby="alerts-title">
          <div class="frame-header" id="alerts-title">
            <span>Waze Accidents</span>
            <span id="accidentCount" class="count-badge">0</span>
          </div>
          <div class="frame-body">
            <div id="waze-panel" aria-live="polite">
              <div class="section">
                <div class="section-title">All accident reports</div>
                <div class="cards" id="cards-acc-high"></div>
              </div>
              <div class="cards" id="cards-acc-low" hidden></div>
              <div id="emptyState" class="empty-state" hidden>No current accident reports</div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer class="titlebar" role="contentinfo">
      <div class="title-left"><div class="footer-label">LST - Waze accident monitoring</div></div>
      <div class="title-right">
        <button id="unhideAllBtn" class="toolbar-btn" type="button">Unhide all</button>
        <div id="statusPill" class="status-pill status-error">Initialising...</div>
        <img id="beeLogo" src="https://tfgm.com/static/android-chrome-192x192.png" alt="Bee Network logo" width="64" height="64" decoding="async">
      </div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const ACCIDENT_FEED_URL = 'https://ryanocc.github.io/data/waze-accidents.json';
    const WAZE_REFRESH_MS = 30000;
    const HIDE_MS = 60 * 60 * 1000;
    const HIGH_CONFIDENCE_MIN = 4;
    const MAP_STATE = { map:null, marker:null, last:null };
    let wazeTimer = null;
    let feedAbort = null;
    let searchAbort = null;
    let searchSequence = 0;

    function escapeHTML(value){
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function fmtTime(){
      return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
    }
    function setStatus(ok){
      const pill=document.getElementById('statusPill');
      const bee=document.getElementById('beeLogo');
      pill.classList.toggle('status-error',!ok);
      pill.textContent=ok?`LIVE - ${fmtTime()}`:`Stand By - ${fmtTime()}`;
      if(ok&&bee){bee.classList.remove('bee-wibble');void bee.offsetWidth;bee.classList.add('bee-wibble')}
    }
    function withCacheBust(url){return `${url}${url.includes('?')?'&':'?'}ts=${Date.now()}`}
    function normaliseMillis(value){
      let n=Number(value)||0;
      if(n>0&&n<1e12)n*=1000;
      return n>Date.now()?Date.now():n;
    }
    function hideKey(id){return `hide_acc_${id}`}
    function hideAlert(id,confidence){localStorage.setItem(hideKey(id),JSON.stringify({until:Date.now()+HIDE_MS,baseline:{confidence:Number(confidence)||0}}))}
    function clearHidden(id){localStorage.removeItem(hideKey(id))}
    function isHidden(id,currentConfidence){
      const raw=localStorage.getItem(hideKey(id));
      if(!raw)return false;
      try{
        const entry=JSON.parse(raw);
        if(Date.now()>Number(entry.until||0)){clearHidden(id);return false}
        const old=Number(entry.baseline?.confidence)||0;
        const current=Number(currentConfidence)||0;
        if(current>=old+2){clearHidden(id);return false}
        return true;
      }catch{clearHidden(id);return false}
    }

    function initMap(){
      const map=L.map('map',{zoomControl:true,attributionControl:true}).setView([53.4808,-2.2426],10);
      L.tileLayer('https://tile.thunderforest.com/transport-dark/{z}/{x}/{y}{r}.png?apikey=ec4c98ec4e394899a63ccecdf9712e54',{
        maxZoom:22,detectRetina:true,tileSize:512,zoomOffset:-1,
        attribution:'&copy; Thunderforest, &copy; OpenStreetMap contributors'
      }).addTo(map);
      const marker=L.circleMarker([53.4808,-2.2426],{radius:10,color:'#FFE04A',weight:3,fillColor:'#FFE04A',fillOpacity:0}).addTo(map);
      marker.setStyle({opacity:0,fillOpacity:0});
      MAP_STATE.map=map;MAP_STATE.marker=marker;
      setTimeout(()=>map.invalidateSize(),250);
      window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),120));
    }
    function setToolButtonsEnabled(enabled){document.querySelectorAll('#toolGrid button').forEach(button=>button.disabled=!enabled)}
    function setMapTarget(lat,lon,zoom=14){
      lat=Number(lat);lon=Number(lon);
      if(!Number.isFinite(lat)||!Number.isFinite(lon)||!MAP_STATE.map)return;
      MAP_STATE.last={lat,lon};
      MAP_STATE.marker.setLatLng([lat,lon]).setStyle({opacity:1,fillOpacity:.25});
      MAP_STATE.map.setView([lat,lon],zoom,{animate:true});
      setToolButtonsEnabled(true);
    }
    function openTool(tool){
      if(!MAP_STATE.last)return;
      const {lat,lon}=MAP_STATE.last;
      const urls={
        google:`https://www.google.com/maps/@${lat},${lon},696m`,
        bustimes:`https://bustimes.org/map#16.53/${lat}/${lon}`,
        waze_alerts:`https://www.waze.com/partnerhub/map-tool?lon=${lon}&lat=${lat}&initialZoom=20`,
        waze_closures:`https://www.waze.com/en-GB/editor/?env=row&lat=${lat}&lon=${lon}&zoomLevel=17`,
        tomtom:`https://plan.tomtom.com/en/?p=${lat},${lon},14.48z`,
        vms:`https://www.stratostraffic.com/Modules/DriverInformationUi/informationSigns?lat=${lat}&lng=${lon}&zoom=14`,
        utc:`https://www.stratostraffic.com/Modules/TrafficSignalsUi/information?lat=${lat}&lng=${lon}&zoom=11`
      };
      if(urls[tool])window.open(urls[tool],'_blank','noopener');
    }

    function readConfidence(a){return Number(a?.confidence??a?.confidenceLevel??a?.level??a?.effectiveConfidence??0)||0}
    function readReliability(a){return Number(a?.reliability??a?.reliabilityScore??0)||0}
    function getCoordinates(a){
      const loc=a?.location;
      if(Number.isFinite(Number(loc?.x))&&Number.isFinite(Number(loc?.y)))return [Number(loc.x),Number(loc.y)];
      if(Number.isFinite(Number(loc?.lon))&&Number.isFinite(Number(loc?.lat)))return [Number(loc.lon),Number(loc.lat)];
      if(Array.isArray(loc?.coordinates)&&loc.coordinates.length>=2)return [Number(loc.coordinates[0]),Number(loc.coordinates[1])];
      if(Array.isArray(a?.geometry?.coordinates)&&a.geometry.coordinates.length>=2)return [Number(a.geometry.coordinates[0]),Number(a.geometry.coordinates[1])];
      if(Number.isFinite(Number(a?.longitude))&&Number.isFinite(Number(a?.latitude)))return [Number(a.longitude),Number(a.latitude)];
      if(Number.isFinite(Number(a?.lon))&&Number.isFinite(Number(a?.lat)))return [Number(a.lon),Number(a.lat)];
      if(typeof a?.point==='string'){
        const parts=a.point.trim().split(/\s+/).map(Number);
        if(parts.length>=2&&parts.every(Number.isFinite))return [parts[1],parts[0]];
      }
      return null;
    }
    function isAccident(a){
      const type=String(a?.type??a?.alertType??'').toUpperCase();
      const subtype=String(a?.subtype??a?.subType??a?.sub_type??'').toUpperCase();
      return type.includes('ACCIDENT')||subtype.includes('ACCIDENT')||(!type&&!subtype);
    }
    function extractArray(data){
      if(Array.isArray(data))return data;
      for(const key of ['incidents','alerts','accidents','items','features','data'])if(Array.isArray(data?.[key]))return data[key];
      return [];
    }
    function normaliseAccident(a,index){
      if(!isAccident(a))return null;
      const coord=getCoordinates(a);
      if(!coord||!coord.every(Number.isFinite))return null;
      const time=normaliseMillis(a.pubMillis??a.updateTime??a.reportMillis??a.time??a.timestamp??Date.parse(a.published||''));
      const confidence=readConfidence(a);
      const reliability=readReliability(a);
      const street=a.road??a.street??a.roadName??a.address??a.name??'Unknown road';
      const city=a.city??a.town??a.area??'';
      const description=a.reportDescription??a.description??a.title??'Accident';
      const id=String(a.uuid??a.id??`${coord[0].toFixed(5)},${coord[1].toFixed(5)},${time||index}`);
      return {id,coord,time,confidence,reliability,street,city,description};
    }
    function accidentCard(a){
      const when=a.time?new Date(a.time).toLocaleString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit'}):'Time unavailable';
      const confidence=a.confidence>0?`Confidence: ${escapeHTML(a.confidence)}/5`:'Confidence unavailable';
      const reliability=a.reliability>0?` • Reliability: ${escapeHTML(a.reliability)}/10`:'';
      return `<article class="card" data-lon="${a.coord[0]}" data-lat="${a.coord[1]}">
        <div class="title"><span class="road">${escapeHTML(a.street)}</span></div>
        <div class="meta">${confidence}${reliability} • ${when}</div>
        <div class="desc">${escapeHTML(a.city?`${a.description} - ${a.city}`:a.description)}</div>
        <button class="hide-btn" type="button" data-id="${escapeHTML(a.id)}" data-confidence="${a.confidence}">Hide</button>
      </article>`;
    }
    function renderAccidents(items){
      const visible=items.filter(a=>!isHidden(a.id,a.confidence)).sort((a,b)=>(b.confidence-a.confidence)||(b.reliability-a.reliability)||(b.time-a.time));
      const high=visible;
      const low=[];
      document.getElementById('cards-acc-high').innerHTML=high.map(accidentCard).join('');
      document.getElementById('cards-acc-low').innerHTML='';
      document.getElementById('accidentCount').textContent=String(visible.length);
      document.getElementById('emptyState').hidden=visible.length!==0;
    }
    async function loadAccidents(){
      if(feedAbort)feedAbort.abort();
      feedAbort=new AbortController();
      try{
        const response=await fetch(withCacheBust(ACCIDENT_FEED_URL),{cache:'no-store',signal:feedAbort.signal});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const data=await response.json();
        const accidents=extractArray(data).map(normaliseAccident).filter(Boolean);
        renderAccidents(accidents);
        setStatus(true);
      }catch(error){
        if(error.name!=='AbortError'){console.error('[Waze accidents] fetch failed:',error);setStatus(false)}
      }finally{
        clearTimeout(wazeTimer);
        wazeTimer=setTimeout(loadAccidents,WAZE_REFRESH_MS);
      }
    }

    const GM_CENTER={lat:53.4808,lon:-2.2426};
    const GM_BBOX=[-2.75,53.30,-1.95,53.72];
    function debounce(fn,delay){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay)}}
    function spinner(on){document.getElementById('searchSpinner').classList.toggle('active',on)}
    function closeSuggestions(){const box=document.getElementById('gmSuggest');box.innerHTML='';box.classList.remove('open');document.getElementById('gmSearch').setAttribute('aria-expanded','false')}
    function featureLabel(feature){
      const p=feature.properties||{};
      const main=p.name||p.street||'Unknown';
      const sub=[p.city,p.county,p.state].filter(Boolean).join(', ');
      return {main,sub};
    }
    function categoryEmoji(feature){
      const p=feature.properties||{},key=String(p.osm_key||'').toLowerCase(),value=String(p.osm_value||'').toLowerCase(),type=String(p.type||'').toLowerCase();
      if(type==='street')return '🛣️';
      if(type==='house')return '🏠';
      if((key==='highway'&&value==='bus_stop')||(key==='public_transport'))return '🚏';
      if(key==='railway'||value==='station')return '🚉';
      if(key==='amenity'&&(value==='pub'||value==='bar'))return '🍺';
      return '📍';
    }
    function renderSuggestions(items){
      const box=document.getElementById('gmSuggest');
      if(!items.length){closeSuggestions();return}
      box.innerHTML=`<ul class="suggest-list">${items.map((item,index)=>`<li class="suggest-item${index===0?' active':''}" role="option" data-index="${index}">${categoryEmoji(item.raw)} ${escapeHTML(item.main)}<small>${escapeHTML(item.sub)}</small></li>`).join('')}</ul>`;
      box.classList.add('open');
      document.getElementById('gmSearch').setAttribute('aria-expanded','true');
    }
    function bindSearch(){
      const input=document.getElementById('gmSearch'),box=document.getElementById('gmSuggest');
      let items=[],active=0;
      const choose=item=>{if(!item)return;input.value=item.main;closeSuggestions();setMapTarget(item.lat,item.lon,16)};
      const search=debounce(async()=>{
        const query=input.value.trim();
        if(query.length<2){items=[];closeSuggestions();spinner(false);return}
        const sequence=++searchSequence;
        if(searchAbort)searchAbort.abort();
        searchAbort=new AbortController();
        try{
          const url=new URL('https://photon.komoot.io/api');
          url.searchParams.set('q',`${query} Greater Manchester`);
          url.searchParams.set('lang','en');url.searchParams.set('limit','10');
          url.searchParams.set('lat',GM_CENTER.lat);url.searchParams.set('lon',GM_CENTER.lon);
          url.searchParams.set('zoom','15');url.searchParams.set('location_bias_scale','.12');url.searchParams.set('bbox',GM_BBOX.join(','));
          const response=await fetch(url,{cache:'no-store',signal:searchAbort.signal});
          if(!response.ok)throw new Error(`Photon HTTP ${response.status}`);
          const data=await response.json();
          if(sequence!==searchSequence)return;
          items=(data.features||[]).map(raw=>{const c=raw.geometry?.coordinates;if(!Array.isArray(c)||c.length<2)return null;const lon=Number(c[0]),lat=Number(c[1]);if(!Number.isFinite(lon)||!Number.isFinite(lat))return null;const label=featureLabel(raw);return {...label,lat,lon,raw}}).filter(Boolean);
          active=0;renderSuggestions(items);
        }catch(error){if(error.name!=='AbortError')console.warn('[Search] failed:',error)}finally{if(sequence===searchSequence)spinner(false)}
      },260);
      input.addEventListener('input',()=>{spinner(input.value.trim().length>=2);search()});
      input.addEventListener('keydown',event=>{
        if(!box.classList.contains('open')||!items.length)return;
        if(event.key==='ArrowDown'){event.preventDefault();active=Math.min(items.length-1,active+1)}
        else if(event.key==='ArrowUp'){event.preventDefault();active=Math.max(0,active-1)}
        else if(event.key==='Enter'){event.preventDefault();choose(items[active]);return}
        else if(event.key==='Escape'){closeSuggestions();spinner(false);return}else return;
        box.querySelectorAll('.suggest-item').forEach((el,index)=>el.classList.toggle('active',index===active));
      });
      box.addEventListener('click',event=>{const row=event.target.closest('.suggest-item');if(row)choose(items[Number(row.dataset.index)])});
      document.addEventListener('click',event=>{if(!event.target.closest('#placeSearch'))closeSuggestions()});
    }

    document.getElementById('toolGrid').addEventListener('click',event=>{const button=event.target.closest('button[data-tool]');if(button&&!button.disabled)openTool(button.dataset.tool)});
    document.getElementById('waze-panel').addEventListener('click',event=>{
      const hide=event.target.closest('.hide-btn');
      if(hide){event.stopPropagation();hideAlert(hide.dataset.id,hide.dataset.confidence);hide.closest('.card')?.remove();const badge=document.getElementById('accidentCount');badge.textContent=String(Math.max(0,Number(badge.textContent||0)-1));return}
      const card=event.target.closest('.card');
      if(card)setMapTarget(card.dataset.lat,card.dataset.lon,14);
    });
    document.getElementById('unhideAllBtn').addEventListener('click',()=>{
      const keys=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith('hide_acc_'))keys.push(key)}
      keys.forEach(key=>localStorage.removeItem(key));loadAccidents();
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){clearTimeout(wazeTimer);wazeTimer=null;if(feedAbort)feedAbort.abort();spinner(false)}
      else loadAccidents();
    });
    window.addEventListener('load',()=>{
      setStatus(false);initMap();setToolButtonsEnabled(false);bindSearch();loadAccidents();
    });
  </script>
</body>
</html>
