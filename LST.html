<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LST — Control Centre Wall Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root{
      --bg:#000;
      --panel:#0b0b0b;
      --text:#f2f2f2;
      --muted:#c9cacc;

      --liveGreen:#42BE4B;
      --errorRed:#EA5540;

      --accent:#FFE04A;
      --line: rgba(255,255,255,0.08);

      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --radius: 12px;
      --gap: 12px;
      --frame-padding: 12px;

      --titlebar-h: 10vh;
      --highConfMin: 4;

      --corridor-card-h: clamp(140px, 16vh, 190px);
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    .hide-btn,
    .toolbar-btn{
      appearance: none;
      background: rgba(255,255,255,0.04);
      color: #d8d8dd;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: .5px;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.05s ease;
    }
    .hide-btn:hover,
    .toolbar-btn:hover{
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,224,74,0.7);
      color: #fff;
      box-shadow: 0 0 10px rgba(255,224,74,0.15);
    }
    .hide-btn:active,
    .toolbar-btn:active{
      transform: translateY(1px);
      background: rgba(255,255,255,0.15);
    }

    .app{
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr var(--titlebar-h);
      overflow: hidden;
      min-height: 0;
    }

    .content{
      padding: var(--gap);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--gap);
      min-height: 0;
      overflow: hidden;
      height: 100%;
      box-sizing: border-box;
    }

    .col1,.col2,.col3{ display:flex; flex-direction:column; min-height:0; overflow:hidden; }

    .frame{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--frame-padding);
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }

    .frame-header{
      font-size: clamp(12px, 1.8vh, 14px);
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .frame-body{ min-height: 0; overflow: hidden; }

    .col1 > .frame,
    .col3 > .frame{
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }

    #frame-c{ flex: 1 1 0; min-height: 0; overflow: hidden; }
    #frame-b{ flex: 1 1 0; min-height: 0; overflow: hidden; }

    #frame-d{
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    #frame-d .frame-body{
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
    }
    #waze-panel{
      flex: 1 1 0;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 16px;
      padding-right: 6px;
      box-sizing: border-box;
    }

    .titlebar{
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(255,224,74,0.06), transparent);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .title-left{ display:flex; align-items:center; gap:12px; min-width:0; }
    .title-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

    .status-pill{
      padding: 10px 16px;
      border-radius: 999px;
      font-size: clamp(14px, 2.2vh, 18px);
      font-weight: 800;
      background: var(--liveGreen);
      color:#000;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.25);
      white-space: nowrap;
      user-select: none;
      transition: background .2s ease, color .2s ease;
    }
    .status-error{ background: var(--errorRed); color:#fff; }

    #beeLogo{
      width: clamp(40px, 6vh, 64px);
      height: clamp(40px, 6vh, 64px);
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      user-select: none;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{ animation: wibble 650ms ease-out; }

    .car-icon{
      width: clamp(22px, 3.2vh, 28px);
      height: clamp(22px, 3.2vh, 28px);
      object-fit: contain;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.45));
    }
    .connected-count{
      font-weight: 900;
      font-size: clamp(14px, 2.2vh, 18px);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* TVT */
    .tvt-panel{
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }
    .network-health { margin: 0 2px; }
    .network-row { display:flex; align-items:center; gap:10px; }
    .network-bar{
      flex:1 1 auto;
      height: clamp(10px, 1.8vh, 16px);
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 4px 10px rgba(0,0,0,0.30);
    }

    .corridor-list{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      min-height: 0;
      overflow-y: auto;
      grid-auto-rows: var(--corridor-card-h);
      align-content: start;
    }
    .corridor{
      display: grid;
      grid-template-rows: auto auto auto;
      align-content: start;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25) inset, 0 1px 0 rgba(255,255,255,0.04);
      height: 100%;
      box-sizing: border-box;
      position: relative;
      padding-bottom: 36px;
      overflow: hidden;
      cursor: pointer;
    }
    .corridor .hide-btn{
      position: absolute;
      right: 10px;
      bottom: 8px;
      font-size: 10px;
      padding: 3px 8px;
    }
    .corridor-top{
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .corridor-title{
      font-size: clamp(15px, 2.4vh, 20px);
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
    }
    .corridor-title .corridor-name{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .corridor-delay{
      font-size: clamp(22px, 4.2vh, 34px);
      font-weight: 900;
      line-height: 0.95;
      color: var(--delay-col);
    }
    .corridor-times{
      font-size: clamp(12px, 1.8vh, 15px);
      font-weight: 800;
      color: rgba(255,255,255,0.86);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tvt-filters{
      display: flex;
      gap: 8px;
      padding-top: 2px;
    }
    .tvt-filters button{
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-weight: 900;
      padding: 8px 0;
      border-radius: 10px;
      cursor: pointer;
    }
    .tvt-filters button.active{
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Waze */
    .section{ display:grid; gap:8px; }
    .section-title{
      font-size: clamp(11px, 1.6vh, 13px);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--muted);
      border-left: 3px solid rgba(255,255,255,0.15);
      padding-left: 8px;
    }
    .cards{ display:grid; gap:8px; }
    .card{
      display:grid;
      gap:6px;
      padding:10px 12px 36px;
      border-radius:12px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      position:relative;
      cursor:pointer;
    }
    .card .hide-btn{
      position:absolute;
      right:10px;
      bottom:8px;
      font-size:10px;
      padding:3px 8px;
    }
    .card .title{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      font-size: clamp(14px, 2.2vh, 18px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .meta{
      font-weight:800;
      font-size: clamp(12px, 1.8vh, 14px);
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card .desc{
      font-weight:700;
      font-size: clamp(12px, 1.8vh, 14px);
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spacer{ flex:1; }

    /* Map + tools */
    #map{ width:100%; height:100%; border-radius:10px; overflow:hidden; }

    .tool-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      align-content:start;
      height:100%;
      overflow:auto;
      padding-right:2px;
      box-sizing:border-box;
    }
    .tool-grid button{
      appearance:none;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight:800;
      font-size: clamp(11px, 1.6vh, 13px);
      padding: 8px 8px;
      border-radius: 10px;
      cursor:pointer;
      min-height:34px;
    }
    .tool-grid button:hover{
      border-color: rgba(255,224,74,0.75);
      background: rgba(255,255,255,0.12);
    }
    .tool-grid button:disabled{ opacity:0.35; cursor:not-allowed; }

    /* Search UI */
    .place-search{ position:relative; margin-bottom:10px; }
    #gmSearch{
      width:100%;
      border:1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color:#fff;
      font-weight:800;
      font-size: clamp(12px, 2.0vh, 15px);
      padding:12px 40px 12px 12px;
      border-radius:12px;
      outline:none;
      box-sizing:border-box;
    }
    #gmSearch:focus{
      border-color: rgba(255,224,74,0.75);
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 0 2px rgba(255,224,74,0.12);
    }
    .search-spinner{
      position:absolute;
      right:12px;
      top:50%;
      width:18px;
      height:18px;
      margin-top:-9px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.25);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      display:none;
      pointer-events:none;
    }
    .search-spinner.active{ display:block; }
    @keyframes spin{ to{ transform: rotate(360deg);} }

    .suggestions{
      position:absolute;
      top: calc(100% + 6px);
      left:0; right:0;
      z-index:60;
      display:none;
      background: rgba(10,10,10,0.98);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:12px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.55);
      overflow:hidden;
    }
    .suggestions.open{ display:block; }
    .suggest-list{
      margin:0;
      padding:6px;
      list-style:none;
      max-height: min(34vh, 320px);
      overflow:auto;
    }
    .suggest-item{
      padding:10px;
      border-radius:10px;
      cursor:pointer;
      border:1px solid transparent;
      color: rgba(255,255,255,0.92);
      font-weight:800;
      line-height:1.2;
    }
    .suggest-item small{
      display:block;
      margin-top:4px;
      font-weight:700;
      color: rgba(255,255,255,0.70);
    }
    .suggest-item:hover{
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,224,74,0.45);
    }
    .suggest-item.active{
      background: rgba(255,224,74,0.18);
      border-color: rgba(255,224,74,0.75);
    }

    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.35) transparent; }
    ::-webkit-scrollbar{ width:8px; height:8px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{
      background: linear-gradient(180deg, rgba(255,224,74,0.55), rgba(255,255,255,0.35));
      border-radius: 999px;
      border:2px solid transparent;
      background-clip: padding-box;
    }
  </style>
</head>

<body>
  <div class="app">
    <section class="content" aria-label="Main dashboard area">

      <!-- Column 1 -->
      <div class="col1">
        <div class="frame" id="frame-a" aria-labelledby="frame-a-title">
          <div class="frame-header" id="frame-a-title">Highways Health &amp; Abnormal Traffic</div>
          <div class="frame-body">
            <div class="tvt-panel" id="abnormal-traffic" aria-live="polite">
              <div class="network-health">
                <div class="network-row">
                  <div class="network-bar" style="background:linear-gradient(90deg,#42BE4B,#ffe04a,#ff4d4f)"></div>
                </div>
              </div>

              <div class="corridor-list" id="tvt-corridors"></div>

              <div class="tvt-filters" id="tvt-filters" aria-label="Abnormal traffic filters">
                <button type="button" data-min="1">+1m</button>
                <button type="button" data-min="5">+5m</button>
                <button type="button" data-min="10">+10m</button>
                <button type="button" data-min="15" class="active">+15m</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Column 2 -->
      <div class="col2">
        <div class="frame" id="frame-c" aria-labelledby="frame-c-title">
          <div class="frame-header" id="frame-c-title">Map</div>
          <div class="frame-body">
            <div id="map" aria-label="Map"></div>
          </div>
        </div>

        <div class="frame" id="frame-b" aria-labelledby="frame-b-title">
          <div class="frame-header" id="frame-b-title">Open in other tools</div>
          <div class="frame-body">
            <div class="place-search" id="placeSearch" aria-label="Place search">
              <input id="gmSearch" type="text" inputmode="search" autocomplete="off"
                     placeholder="Search (bus stops 🚏, pubs 🍺, streets 🛣️)… or Oxford/Whitworth"
                     aria-label="Search places in Greater Manchester"
                     aria-autocomplete="list"
                     aria-expanded="false"
                     aria-controls="gmSuggest" />
              <div class="search-spinner" id="searchSpinner" aria-hidden="true"></div>
              <div id="gmSuggest" class="suggestions" role="listbox" aria-label="Search suggestions"></div>
            </div>

            <div class="tool-grid" id="toolGrid" aria-label="Tool links">
              <button type="button" data-tool="google">Google Maps</button>
              <button type="button" data-tool="bustimes">Bus Times</button>
              <button type="button" data-tool="waze_alerts">Waze Alerts</button>
              <button type="button" data-tool="waze_closures">Waze Closures</button>
              <button type="button" data-tool="tomtom">TomTom</button>
              <button type="button" data-tool="vms">VMS</button>
              <button type="button" data-tool="utc">UTC Sites</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Column 3 -->
      <div class="col3">
        <div class="frame" id="frame-d" aria-labelledby="frame-d-title">
          <div class="frame-header" id="frame-d-title">Waze Alerts</div>
          <div class="frame-body">
            <div class="waze-panel" id="waze-panel" aria-live="polite">
              <div class="section" id="sec-accidents">
                <div class="section-title">💥 Accidents</div>
                <div class="cards" id="cards-acc-high"></div>
                <div class="cards" id="cards-acc-low"></div>
              </div>
              <div class="section" id="sec-signals">
                <div class="section-title">🚦 Traffic Light Faults</div>
                <div class="cards" id="cards-signals"></div>
              </div>
              <div class="section" id="sec-weather">
                <div class="section-title">🌨️ Weather Reports</div>
                <div class="cards" id="cards-weather"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <footer class="titlebar" role="contentinfo" aria-label="Title bar">
      <div class="title-left">
        <img src="https://ryanocc.github.io/car.gif" class="car-icon" alt="car icon">
        <div id="connectedCitizens" class="connected-count">— Connected Citizens</div>
      </div>

      <div class="title-right" aria-label="Status and controls">
        <button id="unhideAllBtn" class="toolbar-btn" type="button"
                title="Unhide all hidden alerts" aria-label="Unhide all hidden alerts">
          Unhide all
        </button>

        <div id="statusPill" class="status-pill">Initialising…</div>

        <img id="beeLogo" src="https://tfgm.com/static/android-chrome-192x192.png"
             alt="Bee Network logo" width="64" height="64" decoding="async" />
      </div>
    </footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* =======================================================
       Utilities & helpers
       ======================================================= */
    function sumWazers(usersOnJams){
      try {
        const total = (Array.isArray(usersOnJams) ? usersOnJams : [])
          .reduce((acc,u) => acc + (Number(u.wazersCount)||0), 0);
        return Math.ceil(total);
      } catch {
        return 0;
      }
    }

    function updateConnectedCitizensDisplay(total){
      const el = document.getElementById('connectedCitizens');
      if (!el) return;
      const label = Number.isFinite(total) && total > 0 ? total.toLocaleString('en-GB') : '—';
      el.textContent = `${label} Connected Citizens`;
    }

    const API_BASE = "https://renderexpress-ebb0.onrender.com";

    function withCacheBust(url){
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}ts=${Date.now()}`;
    }

    async function fetchJsonFromAPI(pathOrUrl, signal){
      const url = pathOrUrl.startsWith("http") ? pathOrUrl : `${API_BASE}${pathOrUrl}`;
      const res = await fetch(withCacheBust(url), { cache: 'no-store', signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    function fmtHHMMSS(){
      try{
        return new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
          .format(new Date());
      }catch(e){
        const d = new Date();
        const pad = n => String(n).padStart(2,'0');
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }
    }

    function setStatusPill(ok, {animate=false}={}){
      const pill = document.getElementById('statusPill');
      const bee  = document.getElementById('beeLogo');
      const t = fmtHHMMSS();
      if (ok){
        pill.classList.remove('status-error');
        pill.textContent = `LIVE • ${t}`;
        if (animate && bee){
          bee.classList.remove('bee-wibble');
          void bee.offsetWidth;
          bee.classList.add('bee-wibble');
        }
      } else {
        pill.classList.add('status-error');
        pill.textContent = `Stand By • ${t}`;
      }
    }

    function escapeHTML(str){
      return String(str).replace(/[&<>"']/g, ch =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])
      );
    }

    /* Spinner helpers */
    function spinnerOn(){ document.getElementById('searchSpinner')?.classList.add('active'); }
    function spinnerOff(){ document.getElementById('searchSpinner')?.classList.remove('active'); }

    /* ========= HIDE / SUPPRESSION (60 minutes) ========= */
    const HIDE_MS = 60 * 60 * 1000;

    function hideStorageKey(prefix, id){ return `hide_${prefix}_${id}`; }

    function getHideEntry(prefix, id){
      const raw = localStorage.getItem(hideStorageKey(prefix, id));
      if (!raw) return null;
      if (/^\d+$/.test(raw)) return { until: Number(raw) };
      try{
        const obj = JSON.parse(raw);
        if (obj && typeof obj.until === 'number') return obj;
      }catch(e){}
      const n = Number(raw);
      return Number.isFinite(n) ? { until:n } : null;
    }

    function setHideEntry(prefix, id, entry){
      localStorage.setItem(hideStorageKey(prefix, id), JSON.stringify(entry));
    }

    function clearHide(prefix, id){
      localStorage.removeItem(hideStorageKey(prefix, id));
    }

    function hideForHour(prefix, id, baseline={}){
      setHideEntry(prefix, id, { until: Date.now() + HIDE_MS, baseline, createdAt: Date.now() });
    }

    function isHiddenWithAutoCheck(prefix, id, currentMetrics={}){
      const entry = getHideEntry(prefix, id);
      if (!entry) return false;

      if (Date.now() > (Number(entry.until)||0)){
        clearHide(prefix, id);
        return false;
      }

      const base = entry.baseline || {};
      let autoUnhide = false;

      if (prefix === 'corr'){
        const curr = Number(currentMetrics.delayMin);
        const b = Number(base.delayMin);
        if (Number.isFinite(curr) && Number.isFinite(b)){
          const threshold = b > 0 ? Math.max(b + 5, Math.round(b * 1.5)) : 10;
          if (curr >= threshold) autoUnhide = true;
        }
      } else if (prefix === 'acc'){
        const curr = Number(currentMetrics.conf);
        const b = Number(base.conf);
        if (Number.isFinite(curr) && Number.isFinite(b) && curr >= b + 2){
          autoUnhide = true;
        }
      }

      if (autoUnhide){
        clearHide(prefix, id);
        return false;
      }

      return true;
    }

    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.hide-btn');
      if (!btn) return;
      ev.preventDefault(); ev.stopPropagation();

      const prefix = btn.getAttribute('data-prefix') || '';
      const id     = btn.getAttribute('data-id') || '';
      if (!prefix || !id) return;

      const baseline = {};
      const delay = btn.getAttribute('data-baseline-delay');
      const conf  = btn.getAttribute('data-baseline-conf');

      if (delay != null && delay !== '' && isFinite(Number(delay))) baseline.delayMin = Number(delay);
      if (conf  != null && conf  !== '' && isFinite(Number(conf ))) baseline.conf    = Number(conf);

      hideForHour(prefix, id, baseline);

      const container = btn.closest('.card, .corridor');
      if (container) container.remove();
    }, { passive: false });

    /* Timers — declared ONCE only */
    let tvtTimer = null;
    let wazeTimer = null;

    function unhideAll(){
      const keys = [];
      for (let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith('hide_')) keys.push(k);

      keys.forEach(k => localStorage.removeItem(k));

      try{ clearTimeout(tvtTimer); }catch{}
      try{ clearTimeout(wazeTimer); }catch{}
      tvtTimer = null; wazeTimer = null;

      tvtCycle(); wazeCycle();
    }

    /* =======================================================
       MAP — Leaflet

    const MAP_STATE = { map: null, marker: null, last: null };

    /* =======================================================
       SEARCH — Option A: single Photon call, keep Photon order.
       Emoji shown but NOT used for sorting.
       ======================================================= */
    const GM_CENTER = { lat: 53.4808, lon: -2.2426 };
    const GM_BBOX = [-2.75, 53.30, -1.95, 53.72];

    const SEARCH_DEBOUNCE_MS = 260;
    const SEARCH_MIN_CHARS   = 2;
    const MAX_SUGGESTIONS    = 10;

    // Tuning knobs (feel free to tweak)
    const PHOTON_ZOOM = 15;                 // tighter than your old 11
    const PHOTON_BIAS_SCALE = 0.12;         // less prominence influence vs default 0.2

    let gmAbort = null;
    let searchSeq = 0;

    function debounce(fn, ms=250){
      let t = null;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }

    function inGmBbox(lon, lat){
      return lon >= GM_BBOX[0] && lon <= GM_BBOX[2] && lat >= GM_BBOX[1] && lat <= GM_BBOX[3];
    }

    function getLonLatFromFeature(f){
      const c = f?.geometry?.coordinates;
      if (!Array.isArray(c) || c.length < 2) return null;
      const lon = Number(c[0]), lat = Number(c[1]);
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) return null;
      if (!inGmBbox(lon, lat)) return null;
      return { lon, lat };
    }

    function stripPostcode(s){
      return String(s||'')
        .replace(/\b([A-Z]{1,2}\d[A-Z\d]?)\s?(\d[A-Z]{2})\b/ig,'')
        .replace(/\s+/g,' ')
        .trim();
    }

    function normalizeText(s){
      return String(s||'')
        .toLowerCase()
        .replace(/\s+/g,' ')
        .replace(/[^\w\s\-\(\)\/&]/g,'')
        .trim();
    }

    function featureLabel(f){
      const p = f?.properties || {};
      const name = p.name || p.street || 'Unknown';
      const locality = [p.city, p.county, p.state].filter(Boolean).join(', ');
      const main = `${name}${p.postcode ? ` ${p.postcode}` : ''}`.trim();
      const sub  = locality || p.country || '';
      return { main, sub, p };
    }

    function getFeatureCategoryAndEmoji(f){
      const p = f?.properties || {};
      const osmKey = String(p.osm_key || '').toLowerCase();
      const osmVal = String(p.osm_value || '').toLowerCase();
      const type   = String(p.type || '').toLowerCase();

      if (type === 'street') return { cat:'street', emoji:'🛣️' };
      if (type === 'house')  return { cat:'address', emoji:'🏠' };

      if (osmKey === 'highway' && osmVal === 'bus_stop') return { cat:'bus_stop', emoji:'🚏' };
      if (osmKey === 'public_transport' && (osmVal === 'platform' || osmVal === 'stop_position' || osmVal === 'stop_area')) return { cat:'bus_stop', emoji:'🚏' };

      if (osmKey === 'amenity'){
        if (osmVal === 'pub' || osmVal === 'bar') return { cat:'pub', emoji:'🍺' };
        if (osmVal === 'cafe') return { cat:'cafe', emoji:'☕' };
        if (osmVal === 'restaurant' || osmVal === 'fast_food') return { cat:'food', emoji:'🍽️' };
        if (osmVal === 'fuel') return { cat:'fuel', emoji:'⛽' };
        if (osmVal === 'parking') return { cat:'parking', emoji:'🅿️' };
        if (osmVal === 'hospital' || osmVal === 'clinic') return { cat:'health', emoji:'🏥' };
        if (osmVal === 'school' || osmVal === 'college' || osmVal === 'university') return { cat:'education', emoji:'🏫' };
        if (osmVal === 'police' || osmVal === 'fire_station' || osmVal === 'townhall') return { cat:'civic', emoji:'🏛️' };
      }

      if (osmKey === 'shop') return { cat:'shop', emoji:'🛍️' };
      if (osmKey === 'leisure'){
        if (osmVal === 'park') return { cat:'park', emoji:'🌳' };
        if (osmVal === 'stadium' || osmVal === 'sports_centre') return { cat:'venue', emoji:'🏟️' };
      }

      if (osmKey === 'railway' || osmKey === 'station') return { cat:'station', emoji:'🚉' };

      return { cat:'other', emoji:'📍' };
    }

    function canonicalKey(item){
      const p = item.raw?.properties || {};
      const type = String(p.type||'').toLowerCase();
      const osmKey = String(p.osm_key||'').toLowerCase();
      const osmVal = String(p.osm_value||'').toLowerCase();

      if ((osmKey==='highway' && osmVal==='bus_stop') || (osmKey==='public_transport' && osmVal==='platform')){
        const nm = normalizeText(stripPostcode(p.name || item.main || ''));
        const city = normalizeText(p.city || p.county || '');
        return `busstop:${nm}|${city}`;
      }

      if (type==='street' || type==='house' || p.street){
        const streetName = stripPostcode(p.street || p.name || item.main || '');
        const nm = normalizeText(streetName);
        const city = normalizeText(p.city || p.county || '');
        return `street:${nm}|${city}`;
      }

      const nm = normalizeText(stripPostcode(p.name || item.main || ''));
      const city = normalizeText(p.city || p.county || '');
      return `poi:${nm}|${city}`;
    }

    function dedupKeepFirst(items){
      const seen = new Set();
      const out = [];
      for (const it of items){
        const key = canonicalKey(it);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(it);
      }
      return out;
    }

    // Junction parsing (kept for future use; now uses real '&')
    function parseJunctionQuery(q){
      const s = String(q||'').trim();
      if (!s) return null;
      const l = s.toLowerCase();
      let parts = null;

      if (s.includes('/')) parts = s.split('/');
      else if (s.includes('&')) parts = s.split('&');
      else if (l.includes(' and ')) parts = s.split(/ and /i);
      else if (l.includes(' at ')) parts = s.split(/ at /i);
      else if (l.includes(' @ ')) parts = s.split(/ @ /i);

      if (!parts || parts.length < 2) return null;

      const a = String(parts[0]||'').trim();
      const b = String(parts.slice(1).join(' ')||'').trim();
      if (a.length < 2 || b.length < 2) return null;
      return { a, b };
    }

    // Build Photon URL (single call)
    function buildPhotonUrl(query, opts={}){
      const {
        limit = 10,
        layer = null,
        addGmSuffix = true,
        zoom = PHOTON_ZOOM,
        location_bias_scale = PHOTON_BIAS_SCALE
      } = opts;

      const u = new URL('https://photon.komoot.io/api');
      const q = addGmSuffix ? `${query} Greater Manchester` : query;

      u.searchParams.set('q', q);
      u.searchParams.set('lang', 'en');
      u.searchParams.set('limit', String(limit));

      // Location bias
      u.searchParams.set('lat', String(GM_CENTER.lat));
      u.searchParams.set('lon', String(GM_CENTER.lon));
      u.searchParams.set('zoom', String(zoom));
      u.searchParams.set('location_bias_scale', String(location_bias_scale));

      // Bounding box restrict
      u.searchParams.set('bbox', GM_BBOX.join(','));

      if (layer) u.searchParams.set('layer', layer);

      return u.toString();
    }

    function looksLikeStreetQuery(q){
      const s = String(q||'').trim();
      if (!s) return false;
      return (
        /\b(rd|road|st|street|ave|avenue|dr|drive|ln|lane|cl|close|ct|court|crescent|way|boulevard|blvd|place|pl|terrace|ter)\b/i.test(s) ||
        /\b(m|a|b)\d{1,4}\b/i.test(s)
      );
    }

    async function photonSearchOnce(qRaw, signal){
      const q = qRaw.trim();
const wantsBusStuff = /\bbus\b|\bstop\b|🚏/i.test(q);
const layer = (looksLikeStreetQuery(q) && !wantsBusStuff) ? 'street' : null;

      const url = buildPhotonUrl(q, {
        limit: 12,
        layer
      });

      const res = await fetch(url, { cache:'no-store', signal });
      if (!res.ok) throw new Error(`Photon HTTP ${res.status}`);
      const data = await res.json();
      return Array.isArray(data?.features) ? data.features : [];
    }

    function featuresToItems(features){
      return (features||[]).map(f=>{
        const ll = getLonLatFromFeature(f);
        if (!ll) return null;
        const { main, sub } = featureLabel(f);
        const tag = getFeatureCategoryAndEmoji(f);
        return {
          kind:'feature',
          lat: ll.lat,
          lon: ll.lon,
          main,
          sub,
          raw: f,
          cat: tag.cat,
          emoji: tag.emoji
        };
      }).filter(Boolean);
    }

    function openSuggestions(open){
      const box = document.getElementById('gmSuggest');
      if (!box) return;
      box.classList.toggle('open', !!open);
    }

    function renderSuggestions(items){
      const box = document.getElementById('gmSuggest');
      const input = document.getElementById('gmSearch');
      if (!box || !input) return;

      if (!items || items.length === 0){
        box.innerHTML = '';
        openSuggestions(false);
        input.setAttribute('aria-expanded', 'false');
        return;
      }

      const lis = items.map((it, idx) => {
        const emoji = it.emoji || '📍';
        const main = `${emoji} ${escapeHTML(it.main || 'Unknown')}`;
        const badge = `<small>${escapeHTML(it.sub || '')}</small>`;
        return `
          <li class="suggest-item" role="option"
              data-idx="${idx}" data-lat="${it.lat}" data-lon="${it.lon}"
              data-main="${escapeHTML(it.main||'')}">
            ${main}
            ${badge}
          </li>`;
      }).join('');

      box.innerHTML = `<ul class="suggest-list">${lis}</ul>`;
      openSuggestions(true);
      input.setAttribute('aria-expanded', 'true');
    }

    function clearSuggestions(){
      const box = document.getElementById('gmSuggest');
      const input = document.getElementById('gmSearch');
      if (box){ box.innerHTML=''; box.classList.remove('open'); }
      if (input) input.setAttribute('aria-expanded','false');
    }

    function bindGmSearch(){
      const input = document.getElementById('gmSearch');
      const box   = document.getElementById('gmSuggest');
      if (!input || !box) return;

      let activeIndex = -1;
      let currentItems = [];

      const setActive = (idx) => {
        activeIndex = idx;
        box.querySelectorAll('.suggest-item').forEach((el,i)=>el.classList.toggle('active', i===idx));
      };

      const choose = (lat, lon, label) => {
        if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lon))) return;
        if (label) input.value = label;
        clearSuggestions();
        setMapTarget(Number(lat), Number(lon), 16);
      };

      const doSearch = debounce(async () => {
        const qRaw = input.value.trim();
        if (qRaw.length < SEARCH_MIN_CHARS){
          currentItems = [];
          clearSuggestions();
          spinnerOff();
          return;
        }

        const mySeq = ++searchSeq;

        try { if (gmAbort) gmAbort.abort(); } catch {}
        gmAbort = new AbortController();
        const { signal } = gmAbort;

        try{
          const features = await photonSearchOnce(qRaw, signal);

          // Preserve Photon order; only map + dedupe-in-order
          let items = featuresToItems(features);
          items = dedupKeepFirst(items);

          const nextItems = items.slice(0, MAX_SUGGESTIONS);

          if (mySeq === searchSeq){
            currentItems = nextItems;
            renderSuggestions(currentItems);
            setActive(currentItems.length ? 0 : -1);
          }
        } catch (e){
          if (e?.name !== 'AbortError') console.warn('[Search] failed:', e);
        } finally {
          if (mySeq === searchSeq) spinnerOff();
        }
      }, SEARCH_DEBOUNCE_MS);

      input.addEventListener('input', () => {
        const q = input.value.trim();
        if (q.length >= SEARCH_MIN_CHARS) spinnerOn(); else spinnerOff();
        doSearch();
      }, { passive:true });

      input.addEventListener('keydown', (e) => {
        if (!box.classList.contains('open') || currentItems.length === 0) return;

        if (e.key === 'ArrowDown'){
          e.preventDefault();
          setActive(Math.min(currentItems.length - 1, activeIndex + 1));
        } else if (e.key === 'ArrowUp'){
          e.preventDefault();
          setActive(Math.max(0, activeIndex - 1));
        } else if (e.key === 'Enter'){
          e.preventDefault();
          const it = currentItems[activeIndex >= 0 ? activeIndex : 0];
          if (!it) return;
          choose(it.lat, it.lon, it.main);
        } else if (e.key === 'Escape'){
          e.preventDefault();
          clearSuggestions();
          spinnerOff();
        }
      });

      box.addEventListener('click', (e) => {
        const item = e.target.closest('.suggest-item');
        if (!item) return;
        choose(Number(item.dataset.lat), Number(item.dataset.lon), item.dataset.main || item.textContent.trim());
      }, { passive:true });

      document.addEventListener('click', (e) => {
        if (e.target.closest('#placeSearch')) return;
        clearSuggestions();
        spinnerOff();
      }, { passive:true });
    }

    /* =======================================================
       Shared haversine (used later for Waze clustering)
       ======================================================= */
    function toRad(deg){ return deg * Math.PI / 180; }
    function haversineMeters([lon1, lat1], [lon2, lat2]){
      const R = 6371000, dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    /* =======================================================
       TVT PANEL
       ======================================================= */
    const TVT_REFRESH_MS = 5 * 60 * 1000;
    let TVT_MIN_DELAY = 15;
    let lastTvtData = null;

    function corridorDisplayName(r){
      if (r?.name && r.name.trim()) return r.name.trim();
      const from = String(r?.fromName || '').trim();
      const to   = String(r?.toName   || '').trim();
      if (from || to) return [from, to].filter(Boolean).join(' → ');
      if (r?.leadAlert?.street) return String(r.leadAlert.street).trim();
      return 'Unnamed corridor';
    }

    function networkGradientFromUsersOnJams(usersOnJams){
      if (!Array.isArray(usersOnJams) || usersOnJams.length === 0) {
        return 'linear-gradient(90deg,#42BE4B,#ffe04a,#ff4d4f)';
      }
      const levelColors = { 0:'#42BE4B', 1:'#9ddc43', 2:'#ffe04a', 3:'#ff9a1f', 4:'#ff4d4f' };
      const total = usersOnJams.reduce((a,u)=>a + (Number(u.wazersCount)||0), 0) || 1;
      let acc = 0, stops=[];
      usersOnJams.slice().sort((a,b)=>a.jamLevel-b.jamLevel).forEach(u=>{
        const pct = (Number(u.wazersCount)||0)/total*100;
        const start = acc, end = acc + pct;
        stops.push(`${levelColors[u.jamLevel] || '#666'} ${start.toFixed(2)}% ${end.toFixed(2)}%`);
        acc = end;
      });
      return `linear-gradient(90deg, ${stops.join(', ')})`;
    }

    function delayColor(delayMin){
      if (delayMin >= 15) return '#FF4D4F';
      if (delayMin >= 10) return '#FF9A1F';
      if (delayMin >= 5)  return '#FFE04A';
      return '#9DDC43';
    }

    function computeDelayMin(r){
      const time = Number(r?.time);
      const hist = Number(r?.historicTime);
      if (!Number.isFinite(time) || !Number.isFinite(hist)) return 0;
      return Math.max(0, Math.round((time - hist) / 60));
    }

    function computeTopNDelays(routesRaw, n = 16, minDelay = 15){
      const routes = Array.isArray(routesRaw) ? routesRaw.slice() : [];
      const candidates = routes
        .map(r => ({ r, time:Number(r?.time)||0, hist:Number(r?.historicTime)||0, delayMin: computeDelayMin(r) }))
        .filter(x => Number.isFinite(x.delayMin) && x.delayMin >= minDelay);

      candidates.sort((a,b) => (b.delayMin - a.delayMin) || (b.time - a.time));
      return candidates.slice(0, n);
    }

    const routeKey = (r) => {
      const base = String(r?.id ?? r?.name ?? corridorDisplayName(r) ?? '').trim();
      const t = String(r?.type || '').toUpperCase();
      const bb = r?.bbox;
      const bbTok = (bb && [bb.minX, bb.minY, bb.maxX, bb.maxY].every(Number.isFinite))
        ? `${Number(bb.minX).toFixed(4)},${Number(bb.minY).toFixed(4)},${Number(bb.maxX).toFixed(4)},${Number(bb.maxY).toFixed(4)}`
        : '';
      return t === 'DYNAMIC' ? `${base}|DYN|${bbTok}` : base;
    };

    function getCorridorCenterLngLat(route){
      try{
        const bb = route?.bbox;
        if (bb){
          const minX = Number(bb.minX), maxX = Number(bb.maxX);
          const minY = Number(bb.minY), maxY = Number(bb.maxY);
          if ([minX, maxX, minY, maxY].every(Number.isFinite)){
            return [(minX + maxX) / 2, (minY + maxY) / 2];
          }
        }

        const pts = Array.isArray(route?.line) ? route.line : [];
        let sumX = 0, sumY = 0, n = 0;
        for (const p of pts){
          const x = Number(p?.x);
          const y = Number(p?.y);
          if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
          sumX += x; sumY += y; n++;
        }
        if (n > 0) return [sumX / n, sumY / n];
      }catch(e){}
      return null;
    }

    function renderTvtPanel(data){
      lastTvtData = data;

      const host = document.getElementById('abnormal-traffic');
      const list = document.getElementById('tvt-corridors');
      const net  = host?.querySelector('.network-bar');
      if (!host || !list) return;

      if (net){
        net.style.background = networkGradientFromUsersOnJams(data?.usersOnJams || []);
      }

      updateConnectedCitizensDisplay(sumWazers(data?.usersOnJams || []));

      const allRoutes = []
        .concat(Array.isArray(data?.routes) ? data.routes : [])
        .concat(Array.isArray(data?.irregularities) ? data.irregularities : []);

      const rows = computeTopNDelays(allRoutes, 16, TVT_MIN_DELAY);

      const filtered = rows
        .map(x => ({ ...x, id: routeKey(x.r) }))
        .filter(it => !isHiddenWithAutoCheck('corr', it.id, { delayMin: it.delayMin }));

      const itemHTML = (it) => {
        const label = corridorDisplayName(it.r);
        const id = escapeHTML(it.id);

        const delayMin = Math.max(0, Number(it.delayMin)||0);
        const col = delayColor(delayMin);

        const normMin = Math.max(0, Math.round((Number(it.hist)||0) / 60));
        const nowMin  = Math.max(0, Math.round((Number(it.time)||0) / 60));

        const center = getCorridorCenterLngLat(it.r);
        const cLon = center ? Number(center[0]) : NaN;
        const cLat = center ? Number(center[1]) : NaN;
        const hasCenter = Number.isFinite(cLon) && Number.isFinite(cLat);

        return `
          <div class="corridor" data-delay="${delayMin}" ${hasCenter ? `data-lon="${cLon}" data-lat="${cLat}"` : ''}>
            <div class="corridor-top">
              <div class="corridor-title"><span class="corridor-name">${escapeHTML(label)}</span></div>
              <button class="hide-btn" data-prefix="corr" data-id="${id}" data-baseline-delay="${delayMin}" type="button">Hide</button>
            </div>
            <div class="corridor-delay" style="--delay-col:${col}">+${delayMin}m</div>
            <div class="corridor-times">${normMin}m → ${nowMin}m</div>
          </div>
        `;
      };

      list.innerHTML = filtered.length ? filtered.map(itemHTML).join('') : `
        <div class="corridor" style="grid-column: 1 / -1;">
          <div class="corridor-top">
            <div class="corridor-title"><span class="corridor-name">No corridors above +${TVT_MIN_DELAY}m</span></div>
          </div>
          <div class="corridor-delay" style="--delay-col:rgba(255,255,255,0.7)">Normal</div>
          <div class="corridor-times">Use the filter buttons below to view smaller delays</div>
        </div>`;
    }

    function bindTvtFilters(){
      const wrap = document.getElementById('tvt-filters');
      if (!wrap) return;

      wrap.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-min]');
        if (!btn) return;
        TVT_MIN_DELAY = Number(btn.dataset.min) || 15;
        wrap.querySelectorAll('button[data-min]').forEach(b => b.classList.toggle('active', b === btn));
        if (lastTvtData) renderTvtPanel(lastTvtData);
      }, { passive:true });
    }

    async function fetchTVT(signal){
      return await fetchJsonFromAPI(`${API_BASE}/api/waze/tvt`, signal);
    }

    async function tvtCycle(){
      const ctrl = new AbortController();
      try{
        const data = await fetchTVT(ctrl.signal);
        renderTvtPanel(data);
        setStatusPill(true, { animate:true });
      }catch(e){
        console.error('[TVT] fetch failed:', e);
        setStatusPill(false);
      }finally{
        clearTimeout(tvtTimer);
        tvtTimer = setTimeout(tvtCycle, TVT_REFRESH_MS);
      }
    }

    function openWazePartnerhub(lon, lat){
      const u = new URL('https://www.waze.com/partnerhub/map-tool');
      u.searchParams.set('lon', String(lon));
      u.searchParams.set('lat', String(lat));
      window.open(u.toString(), '_blank', 'noopener');
    }

    function bindCorridorClicks(){
      const list = document.getElementById('tvt-corridors');
      if (!list) return;

      list.addEventListener('click', (ev) => {
        if (ev.target && ev.target.closest('.hide-btn')) return;
        const card = ev.target.closest('.corridor');
        if (!card) return;
        const lon = Number(card.getAttribute('data-lon'));
        const lat = Number(card.getAttribute('data-lat'));
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;
        setMapTarget(lat, lon, 11);
      }, { passive:true });

      list.addEventListener('dblclick', (ev) => {
        if (ev.target && ev.target.closest('.hide-btn')) return;
        const card = ev.target.closest('.corridor');
        if (!card) return;
        const lon = Number(card.getAttribute('data-lon'));
        const lat = Number(card.getAttribute('data-lat'));
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;
        openWazePartnerhub(lon, lat);
      }, { passive:true });
    }

    /* =======================================================
       WAZE ALERTS (from your endpoints)
       ======================================================= */
    const WAZE_REFRESH_MS = 30000;

    async function fetchViaProxies(_ignoredUrl, signal){
      return await fetchJsonFromAPI(`${API_BASE}/api/waze/partner-feed`, signal);
    }

    function stableClusterId(coord){
      const lon = Number(coord[0]).toFixed(4);
      const lat = Number(coord[1]).toFixed(4);
      return `cluster-${lon},${lat}`;
    }
    function readConfidence(a){ return Number(a.confidence ?? a.confidenceLevel ?? a.level ?? 0) || 0; }
    function readReliability(a){ return Number(a.reliability ?? a.reliabilityScore ?? 0) || 0; }
    function readType(a){ return String(a.type || a.alertType || '').toUpperCase(); }
    function readSubType(a){ return String(a.subtype || a.subType || a.sub_type || '').toUpperCase(); }
    function readDesc(a){ return String(a.description || a.reportDescription || a.title || '').toUpperCase(); }

    function getLngLatFromAlert(a){
      try{
        if(a){
          if(a.location){
            const loc = a.location;
            if(typeof loc.x==='number' && typeof loc.y==='number') return [loc.x, loc.y];
            if(typeof loc.lon==='number' && typeof loc.lat==='number') return [loc.lon, loc.lat];
            if(Array.isArray(loc.coordinates) && loc.coordinates.length>=2) return [loc.coordinates[0], loc.coordinates[1]];
            if(loc.point && typeof loc.point.x==='number' && typeof loc.point.y==='number') return [loc.point.x, loc.point.y];
          }
          if(a.geometry?.coordinates && a.geometry.coordinates.length>=2){
            const c = a.geometry.coordinates;
            if(typeof c[0]==='number' && typeof c[1]==='number') return [c[0], c[1]];
          }
          if(typeof a.longitude==='number' && typeof a.latitude==='number') return [a.longitude, a.latitude];
        }
      }catch(e){}
      return null;
    }

    function isAccident(a){
      const t = readType(a);
      const st = readSubType(a);
      return t.includes('ACCIDENT') || st.includes('ACCIDENT');
    }

    function isIceAlert(a){
      const st = String(a?.subtype ?? a?.subType ?? a?.sub_type ?? '').toUpperCase();
      if (st === 'HAZARD_ON_ROAD_ICE') return true;

      const t  = String(a?.type || a?.alertType || '').toUpperCase();
      const d  = String(a?.description || a?.reportDescription || a?.title || '').toUpperCase();
      return t.includes('ICE') || /\bICE\b|BLACK\s*ICE|RECENT(LY)?\s+FORMED\s+ICE/.test(d);
    }

    function isTrafficLightFault(a){
      const t = readType(a), st = readSubType(a), d = readDesc(a);
      return st === 'HAZARD_ON_ROAD_TRAFFIC_LIGHT_FAULT' ||
             (t.includes('TRAFFIC') && t.includes('LIGHT')) ||
             st.includes('TRAFFIC_LIGHT') || st.includes('LIGHT_FAULT') ||
             /TRAFFIC\s+LIGHT\s+FAULT|SIGNAL\s+FAULT/i.test(d);
    }

    function dedupAccidentClusters(clusters, opts={}){
      const { corridorMeters = 8000 } = opts;
      if (!Array.isArray(clusters) || clusters.length === 0) return [];
      const groups = new Map();
      for (const c of clusters){
        const token = (c.street||'').toUpperCase().match(/\b([MBA]\d{1,4})\b/);
        const key = token ? token[1] : (c.street||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim() || '___unknown___';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(c);
      }
      const kept = [];
      for (const arr of groups.values()){
        arr.sort((a,b)=>
          (Number(b.effectiveConfidence||0) - Number(a.effectiveConfidence||0)) ||
          (Number(b.time||0) - Number(a.time||0))
        );
        const chosen = [];
        for (const c of arr){
          let dup = false;
          for (const k of chosen){
            const dist = haversineMeters(c.coord, k.coord);
            if (dist <= corridorMeters){ dup = true; break; }
          }
          if (!dup) chosen.push(c);
        }
        kept.push(...chosen);
      }
      kept.sort((a,b)=>
        (Number(b.effectiveConfidence||0) - (Number(a.effectiveConfidence||0))) ||
        (Number(b.time||0) - (Number(a.time||0)))
      );
      return kept;
    }

    function ensureWazeFits(){
      const host = document.getElementById('waze-panel');
      if (!host) return;

      const toggleSection = (secId, wrapIds) => {
        const sec = document.getElementById(secId);
        const hasAny = wrapIds.some(id => {
          const el = document.getElementById(id);
          return el && el.children.length > 0;
        });
        if (sec) sec.style.display = hasAny ? 'grid' : 'none';
      };
      toggleSection('sec-accidents', ['cards-acc-high','cards-acc-low']);
      toggleSection('sec-weather',   ['cards-weather']);
      toggleSection('sec-signals',   ['cards-signals']);
    }

    function normalizeMillis(raw){
      const n = Number(raw) || 0;
      return n > Date.now() ? Date.now() : n;
    }

    async function wazeCycle(){
      const ctrl = new AbortController();
      try{
        const data = await fetchViaProxies('', ctrl.signal);

        // ACCIDENTS
        const accidentPoints = (()=>{
          const out = [], a = (data && Array.isArray(data.alerts)) ? data.alerts : [];
          for(const x of a){
            if(!isAccident(x)) continue;
            const c = readConfidence(x);
            if(!(c > 0)) continue;
            const coord = getLngLatFromAlert(x); if(!coord) continue;
            const rawTime = x.pubMillis || x.updateTime || x.reportMillis || 0;
            out.push({
              coord, conf10:c, rel10:readReliability(x),
              street:x.street||x.roadName||x.address||'Unknown road',
              city:x.city||x.town||'',
              time: normalizeMillis(rawTime),
              id:x.uuid||x.id||`${coord[0]},${coord[1]},${rawTime||''}`
            });
          }
          return out;
        })();

        const accidentClustersRaw = accidentPoints.length ? (function cluster(points, merge=200){
          if(points.length===0) return [];
          const parent=Array(points.length).fill(0).map((_,i)=>i);
          const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
          const union=(a,b)=>{ a=find(a); b=find(b); if(a!==b) parent[a]=b; };

          for(let i=0;i<points.length;i++){
            for(let j=i+1;j<points.length;j++){
              const d=haversineMeters(points[i].coord, points[j].coord);
              if(d<=merge) union(i,j);
            }
          }

          const groups=new Map();
          for(let i=0;i<points.length;i++){
            const r=find(i);
            if(!groups.has(r)) groups.set(r, []);
            groups.get(r).push(points[i]);
          }

          const clusters=[];
          for(const members of groups.values()){
            const count=members.length;
            const baseConf10=members.reduce((m,p)=>Math.max(m, Number(p.conf10)||0), 0);
            const bestRel10=members.reduce((m,p)=>Math.max(m, Number(p.rel10)||0), 0);
            let eff10=baseConf10 + (bestRel10>8?2:0);
            eff10=Math.max(0, Math.min(12, eff10));
            const eff5=Math.max(1, Math.min(5, Math.round(eff10/2)));

            const avg=members.reduce((acc,m)=>[acc[0]+m.coord[0], acc[1]+m.coord[1]],[0,0]).map(v=>v/count);
            const maxTime=members.reduce((t,m)=>Math.max(t, Number(m.time)||0), 0);

            const best=members.slice().sort((a,b)=>((Number(b.conf10)||0)-(Number(a.conf10)||0))||((Number(b.time)||0)-(Number(a.time)||0)))[0];
            clusters.push({ id: stableClusterId(avg), coord: avg, street: best.street, city: best.city, effectiveConfidence: eff5, time: maxTime, reportCount: count });
          }

          clusters.sort((a,b)=>(Number(b.effectiveConfidence||0)-(Number(a.effectiveConfidence||0)))||((Number(b.time||0)-(Number(a.time||0)))));
          return clusters;
        })(accidentPoints) : [];

        const accidentClusters = dedupAccidentClusters(accidentClustersRaw, { corridorMeters: 8000 });

        const highWrap = document.getElementById('cards-acc-high');
        const lowWrap  = document.getElementById('cards-acc-low');
        if (highWrap) highWrap.innerHTML = '';
        if (lowWrap)  lowWrap.innerHTML  = '';

        const HIGH_MIN = Number(getComputedStyle(document.documentElement).getPropertyValue('--highConfMin')) || 4;

        const accidentVisible = accidentClusters.filter(a => !isHiddenWithAutoCheck('acc', a.id, { conf: Number(a.effectiveConfidence||0) }));
        const highs = accidentVisible.filter(a => Number(a.effectiveConfidence||0) >= HIGH_MIN);
        const lows  = accidentVisible.filter(a => Number(a.effectiveConfidence||0) <  HIGH_MIN);

        const cardAccidentHTML = (item)=>{
          const conf = Number(item.effectiveConfidence)||0;
          const when = new Date(Number(item.time)||0).toLocaleString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit'});
          return `<div class="card" data-type="accident" data-lon="${item.coord[0]}" data-lat="${item.coord[1]}">
                  <div class="title">
                    ${escapeHTML(item.street || 'Unknown road')}
                    <span class="spacer"></span>
                    <button class="hide-btn" data-prefix="acc" data-id="${escapeHTML(item.id)}" data-baseline-conf="${conf}" type="button">Hide</button>
                  </div>
                  <div class="meta">Confidence: ${conf}/5 • ${when}</div>
                  <div class="desc">Accident</div>
                </div>`;
        };

        if (highWrap) highWrap.innerHTML = highs.map(cardAccidentHTML).join('');
        if (lowWrap)  lowWrap.innerHTML  = lows.map(cardAccidentHTML).join('');

        // SIGNALS
        const sigWrap = document.getElementById('cards-signals');
        if (sigWrap) {
          sigWrap.innerHTML = '';
          const signalsRaw = Array.isArray(data?.alerts) ? data.alerts : [];
          const signals = [];
          for (const x of signalsRaw) {
            if (!isTrafficLightFault(x)) continue;
            const coord = getLngLatFromAlert(x);
            if (!coord) continue;

            const rel10 = readReliability(x);
            const rawTime = x.pubMillis || x.updateTime || x.reportMillis || 0;
            const time  = normalizeMillis(rawTime);
            const id    = x.uuid || x.id || `${coord[0]},${coord[1]},${rawTime || ''}`;
            const street = x.street || x.roadName || x.address || 'Unknown road';
            const city = x.city || x.town || '';
            const desc = x.reportDescription || x.description || x.title || '';

            if (isHiddenWithAutoCheck('sig', id, { conf: rel10 })) continue;
            signals.push({ id, coord, street, city, time, rel10, desc });
          }

          signals.sort((a, b) => (b.rel10 - a.rel10) || (b.time - a.time));

          sigWrap.innerHTML = signals.map(item=>{
            const when = new Date(Number(item.time) || 0).toLocaleString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit'});
            return `<div class="card" data-type="signal" data-lon="${item.coord[0]}" data-lat="${item.coord[1]}">
              <div class="title">
                ${escapeHTML(item.street || 'Unknown road')}
                <span class="spacer"></span>
                <button class="hide-btn" data-prefix="sig" data-id="${escapeHTML(item.id)}" data-baseline-conf="${item.rel10}" type="button">Hide</button>
              </div>
              <div class="meta">Reliability: ${item.rel10}/10 • ${when}</div>
              <div class="desc">${escapeHTML(item.desc || 'Traffic light fault')}</div>
            </div>`;
          }).join('');
        }

        // WEATHER
        const weatherWrap = document.getElementById('cards-weather');
        if (weatherWrap) {
          weatherWrap.innerHTML = '';

          const wxRaw = Array.isArray(data?.alerts) ? data.alerts : [];
          const wx = [];
          for (const x of wxRaw) {
            if (!isIceAlert(x)) continue;
            const coord = getLngLatFromAlert(x);
            if (!coord) continue;

            const rawTime = x.pubMillis || x.updateTime || x.reportMillis || 0;
            const time    = normalizeMillis(rawTime);
            const id      = x.uuid || x.id || `${coord[0]},${coord[1]},${rawTime || ''}`;

            const street = x.street || x.roadName || x.address || 'Unknown road';
            const city   = x.city   || x.town   || '';
            const desc   = x.reportDescription || x.description || x.title || 'Ice alert';

            if (isHiddenWithAutoCheck('wx', id, {})) continue;
            wx.push({ id, coord, street, city, time, desc });
          }

          wx.sort((a,b)=>b.time-a.time);

          weatherWrap.innerHTML = wx.map(item=>{
            const when = new Date(Number(item.time) || 0).toLocaleString('en-GB',{hour12:false,hour:'2-digit',minute:'2-digit'});
            return `<div class="card" data-type="weather" data-lon="${item.coord[0]}" data-lat="${item.coord[1]}">
              <div class="title">
                ${escapeHTML(item.street || 'Unknown road')}
                <span class="spacer"></span>
                <button class="hide-btn" data-prefix="wx" data-id="${escapeHTML(item.id)}" type="button">Hide</button>
              </div>
              <div class="meta">${when}</div>
              <div class="desc">❄️ ${escapeHTML(item.desc || 'Ice alert')}</div>
            </div>`;
          }).join('');
        }

        requestAnimationFrame(ensureWazeFits);
        setStatusPill(true, { animate:true });

      }catch(e){
        console.error('[Waze] fetch failed:', e);
        setStatusPill(false);
      }finally{
        clearTimeout(wazeTimer);
        wazeTimer = setTimeout(wazeCycle, WAZE_REFRESH_MS);
      }
    }

    function bindWazeCardPanning(){
      const panel = document.getElementById('waze-panel');
      if (!panel) return;

      panel.addEventListener('click', (ev) => {
        if (ev.target && ev.target.closest('.hide-btn')) return;
        const card = ev.target.closest('.card');
        if (!card) return;

        const lon = Number(card.getAttribute('data-lon'));
        const lat = Number(card.getAttribute('data-lat'));
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) return;

        setMapTarget(lat, lon, 14);
      }, { passive: true });
    }

    /* =======================================================
       BOOT / VISIBILITY
       ======================================================= */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){
        clearTimeout(tvtTimer); tvtTimer = null;
        clearTimeout(wazeTimer); wazeTimer = null;
        spinnerOff();
      } else {
        tvtCycle();
        wazeCycle();
      }
    });

    window.addEventListener('load', () => {
      setStatusPill(false);

      initMap();
      bindToolButtons();

      setToolButtonsEnabled(false);
      bindGmSearch();

      const unhideBtn = document.getElementById('unhideAllBtn');
      if (unhideBtn){ unhideBtn.addEventListener('click', unhideAll, { passive: true }); }

      bindTvtFilters();
      bindCorridorClicks();
      bindWazeCardPanning();

      tvtCycle();
      wazeCycle();

      window.addEventListener('resize', () => requestAnimationFrame(ensureWazeFits));
    });
  </script>
</body>
