<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LST — Control Centre Wall Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Fonts (match your tool) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700;800&family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ================================
       THEME — match pasted tool
       ================================ */
    :root{
      --bg:#000;
      --panel: #0b0b0b;
      --text:#f2f2f2;
      --muted:#c9cacc;
      --danger:#ff2e34;

      --liveGreen:#42BE4B;
      --errorRed:#EA5540;

      --accent:#FFE04A;
      --line: rgba(255,255,255,0.08);  /* thin modern separators */

      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --radius: 12px;
      --gap: 12px;
      --frame-padding: 12px;

      --titlebar-h: 10vh;  /* bottom bar height (≈10%) */
      --highConfMin: 4;   /* accidents confidence threshold for "high" */
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Condensed","Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Helvetica Neue",sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

.hide-btn,
.toolbar-btn{
  appearance: none;
  background: rgba(255,255,255,0.04);
  color: #d8d8dd;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 4px 10px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .5px;
  text-transform: uppercase;
  cursor: pointer;
  transition:
      background 0.25s ease,
      color 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease,
      transform 0.05s ease;
}

/* Hover */
.hide-btn:hover,
.toolbar-btn:hover{
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,224,74,0.7);
  color: #fff;
  box-shadow: 0 0 10px rgba(255,224,74,0.15);
}

/* Active */
.hide-btn:active,
.toolbar-btn:active{
  transform: translateY(1px);
  background: rgba(255,255,255,0.15);
}

    /* ================================
       LAYOUT: Top content + bottom title bar
       ================================ */
    .app{
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr var(--titlebar-h);
      overflow: hidden;
    }

    .content{
      padding: var(--gap);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; /* three columns */
      gap: var(--gap);
      min-height: 0;
      overflow: hidden;
    }

    .col1{
      display: grid;
      grid-template-rows: 1fr 1fr;  /* two stacked frames */
      gap: var(--gap);
      min-height: 0;
    }
    .col2, .col3{
      display: grid;
      grid-template-rows: 1fr; min-height: 0;
    }

    .frame{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--frame-padding);
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr; /* header + body */
      gap: 8px;
    }
    .frame-header{
      font-size: clamp(12px, 1.8vh, 14px);
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .frame-body{
      min-height: 0;              /* critical for grid children to shrink */
      overflow: hidden;           /* parent can be hidden; child can still scroll */
      display: block;             /* simple block for predictable height inheritance */
    }

    /* ================================
       Bottom Title Bar (10%) + Status
       ================================ */
    .titlebar{
      border-top: 1px solid var(--line);
      background: linear-gradient(0deg, rgba(255,224,74,0.06), transparent);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .title-left{
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-dot{
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      flex: 0 0 auto;
    }
    .screen-title{
      font-size: clamp(16px, 2.2vh, 22px);
      font-weight: 800;
      letter-spacing: .3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-right{
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .status-pill{
      padding: 10px 16px;
      border-radius: 999px 999px;
      font-size: clamp(14px, 2.2vh, 18px);
      font-weight: 800;
      background: var(--liveGreen);
      color:#000;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 4px 14px rgba(0,0,0,0.25);
      transition: background .2s ease, color .2s ease;
      white-space: nowrap;
      user-select: none;
    }
    .status-error{ background: var(--errorRed); color:#fff; }

    #beeLogo{
      width: clamp(40px, 6vh, 64px);
      height: clamp(40px, 6vh, 64px);
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45));
      transition: transform 0.2s ease-out;
      user-select: none;
    }
    @keyframes wibble {
      0%   { transform: rotate(0deg) scale(1); }
      20%  { transform: rotate(4deg) scale(1.05); }
      40%  { transform: rotate(-4deg) scale(1.05); }
      60%  { transform: rotate(3deg) scale(1.03); }
      80%  { transform: rotate(-3deg) scale(1.03); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .bee-wibble{ animation: wibble 650ms ease-out; }

    /* ================================
       ABNORMAL TRAFFIC PANEL (TVT clone)
       ================================ */
    .tvt-panel{
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 10px;
      min-height: 0;  /* important */
      height: 100%;   /* ensure child 1fr gets a definite size */
      overflow: hidden;
    }
    .network-health { margin: 0 2px; }
    .network-row { display:flex; align-items:center; gap:10px; }
    .network-bar{
      flex:1 1 auto;
      height: clamp(10px, 1.8vh, 16px);
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 4px 10px rgba(0,0,0,0.30);
    }
    .corridor-list{
      display: block;
      height: 100%;
      overflow: auto;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }
    .corridor{ margin: 0 0 8px 0; }
    .corridor:last-child{ margin-bottom: 0; }
    .corridor-list{ scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.35) transparent; }
    .corridor-list::-webkit-scrollbar{ width: 10px; }
    .corridor-list::-webkit-scrollbar-track{ background: transparent; }
    .corridor-list::-webkit-scrollbar-thumb{
      background-color: rgba(255,255,255,0.28);
      border-radius: 8px;
      border: 2px solid transparent;
    }
    .corridor-list::-webkit-scrollbar-thumb:hover{ background-color: rgba(255,255,255,0.40); }
    .corridor{
      display: grid;
      grid-template-rows: auto auto auto;
      align-content: center;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25) inset, 0 1px 0 rgba(255,255,255,0.04);
      min-height: 0;
    }
    .corridor .title{
      display:flex; align-items:center; gap:10px;
      font-size: clamp(16px, 2.5vh, 24px);
      font-weight: 900; line-height: 1.12; letter-spacing: .3px;
      overflow: hidden;
    }
    .corridor .title .name{
      flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .corridor .bar{
      height: clamp(10px, 2vh, 16px);
      border-radius: 999px;
      background: #2ecc71;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.18) inset, 0 4px 10px rgba(0,0,0,0.25);
    }
    .corridor .meta{
      font-size: clamp(12px, 2.0vh, 18px);
      font-weight: 900; color:#fff; letter-spacing:.1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
      opacity: 0.95;
    }

    /* ================================
       WAZE ALERTS LIST (Right column)
       ================================ */
    .waze-panel{
      display: grid;
      grid-auto-rows: auto;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .section{
      display: grid;
      grid-auto-rows: auto;
      gap: 8px;
      min-height: 0;
    }
    .section-title{
      font-size: clamp(11px, 1.6vh, 13px);
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: var(--muted);
      opacity: 0.95;
      border-left: 3px solid rgba(255,255,255,0.15);
      padding-left: 8px;
    }
    .cards{
      display: grid;
      grid-auto-rows: minmax(0, auto);
      gap: 8px;
      min-height: 0;
    }
    .card{
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 6px 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.045);
      box-shadow: 0 1px 0 rgba(255,255,255,0.045) inset, 0 2px 6px rgba(0,0,0,0.25) inset;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .card:hover{ background: rgba(255,255,255,0.065); }

    /* ==========================================================
       CENTRAL PANE (Key Travel Alerts) — 2×4 grid, refined
       ========================================================== */
    #diverts-grid{
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;        /* 2 columns */
      grid-template-rows: repeat(4, 1fr);    /* 4 rows => 8 cards */
      gap: 10px;
      overflow: hidden;
    }
    .divert-card{
      position: relative;
      display: grid;
      grid-template-rows: auto auto 1fr auto; /* header, street, spacer, times */
      gap: 6px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 6px rgba(0,0,0,0.22) inset;
      min-height: 0;
      overflow: hidden;
    }
    /* Persistent highlight for UFN */
    .divert-card.ufn-highlight{
      border-color: rgba(255,60,60,0.9);
      box-shadow:
        0 0 0 1px rgba(255,224,74,0.25),
        0 6px 18px rgba(0,0,0,0.35),
        0 1px 0 rgba(255,255,255,0.05) inset;
    }

.divert-card.placeholder{
  background: rgba(255,255,255,0.02);
  border: 1px dashed rgba(255,255,255,0.07);
}


    /* Header: routes left + operator right */
    .divert-header{
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .routes{
      display: inline-flex;
      align-items: center;
      gap: 4px;            /* tighter gaps */
      flex-wrap: nowrap;
      min-width: 0;
      overflow: hidden;
    }
    .route-chip{
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: clamp(11px, 1.6vh, 13px); /* smaller font */
      padding: 1px 6px;                    /* slimmer chip */
      border-radius: 6px;
      white-space: nowrap;
      user-select: none;
      box-shadow: 0 1px 0 rgba(0,0,0,0.25);
    }
    .route-chip.more{
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--muted);
    }

    /* Operator pill: fixed width + gentle code rotator */
    .op-tag{
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      min-width: 54px;   /* narrower */
      max-width: 54px;
      justify-content: center;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      font-weight: 800;
      font-size: clamp(10px, 1.5vh, 12px);
      color: #e8e9ec;
      white-space: nowrap;
    }
    .op-dot{
      width: 10px; height: 10px; border-radius: 50%;
      background-color:#cfcfd6;            /* use background-color for smooth transition */
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset;
      flex-shrink: 0;
      transition: background-color 600ms ease; /* gentle fade between colours */
    }
    .op-code-rotator{
      position: relative;
      height: 1.1em;
      line-height: 1.1em;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px; /* narrower text area */
    }
    .op-code{
      position: absolute;
      opacity: 0;
      transition: opacity 0.35s ease-in-out;
    }
    .op-code.active{ opacity: 1; }

    /* Street line (replaces reason text) */
    .street-line{
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(13px, 2.0vh, 16px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #fff;
    }
    .street-emoji{ font-size: 1.1em; line-height: 1; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.3)); }

    /* Location (town or fallback) */
    .location{
      font-size: clamp(12px, 1.7vh, 14px);
      color: #d7d9de;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Times footer */
    .times{
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.12);
      display: grid;
      grid-auto-rows: auto;
      gap: 2px;
      min-height: 0;
    }
    .time-row{
      font-size: clamp(11px, 1.5vh, 13px);
      color: #d6d7db;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .time-row .lab{ color: rgba(255,255,255,0.65); font-weight: 700; }
    .time-row .val{ color: #fff; font-weight: 900; }
    .ufn { color: var(--accent) !important; }

    /* Subtle one-time flash when a NEW UFN arrives */
    @keyframes flashBorder {
      0%   { box-shadow: 0 0 0 0 rgba(255,224,74,0.6); border-color: rgba(255,224,74,0.9); transform: scale(1.00); }
      50%  { box-shadow: 0 0 0 10px rgba(255,224,74,0.10); border-color: rgba(255,224,74,1.0); transform: scale(1.02); }
      100% { box-shadow: 0 0 0 0 rgba(255,224,74,0.0); border-color: rgba(255,255,255,0.12); transform: scale(1.00); }
    }
    .new-ufn-flash{ animation: flashBorder 1400ms ease-out 1; }

    /* ================================
       ROUTE OPERATOR CHECKER styles
       ================================ */
    .visually-hidden {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden; clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }

    .roc-panel{
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      height: 100%;
      min-height: 0;
    }

    .roc-input-row{
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .roc-input{
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-weight: 800;
      font-size: clamp(14px, 2.2vh, 18px);
      letter-spacing: .2px;
      outline: none;
      transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .roc-input::placeholder{ color: rgba(255,255,255,0.45); font-weight: 600; }
    .roc-input:focus{
      border-color: rgba(255,224,74,0.7);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 3px rgba(255,224,74,0.12);
    }

    .roc-result{
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 8px;
      padding-right: 2px;
      scrollbar-gutter: stable;
    }
    .roc-result::-webkit-scrollbar{ width: 10px; }
    .roc-result::-webkit-scrollbar-thumb{
      background-color: rgba(255,255,255,0.28);
      border-radius: 8px;
      border: 2px solid transparent;
    }
    .roc-result::-webkit-scrollbar-thumb:hover{ background-color: rgba(255,255,255,0.40); }

    .roc-card{
      display: grid;
      grid-auto-rows: auto;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 6px rgba(0,0,0,0.22) inset;
    }

    .roc-line{
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .roc-pill{
      background: var(--accent);
      color: #000;
      font-weight: 900;
      font-size: clamp(11px, 1.6vh, 13px);
      padding: 2px 8px;
      border-radius: 999px;
      user-select: none;
      box-shadow: 0 1px 0 rgba(0,0,0,0.25);
      flex: 0 0 auto;
    }

    .roc-title{
      font-size: clamp(14px, 2.2vh, 18px);
      font-weight: 900;
      color: #fff;
    }

    .roc-sub{
      font-size: clamp(12px, 1.7vh, 14px);
      color: #d7d9de;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .roc-operator{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      font-weight: 800;
      font-size: clamp(10px, 1.5vh, 12px);
      color: #e8e9ec;
      white-space: nowrap;
    }
    .roc-op-swatch{
      width: 10px; height: 10px; border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35) inset;
      flex-shrink: 0;
    }

    .roc-empty{
      color: #c7cbd1;
      text-align: center;
      padding: 18px 8px;
      border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 10px;
    }

    .roc-status{
      font-size: clamp(11px, 1.5vh, 13px);
      color: var(--muted);
      opacity: .95;
    }
    
    /* ===========================================
   ROUTE CHECKER — NEW BIG MATCHED RESULT STYLE
   =========================================== */

.roc-card {
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 14px;
  padding: 20px;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow: 0 2px 6px rgba(0,0,0,0.25) inset;
}

/* Big central route chip — match travel alerts route-chip */
.roc-route-big {
  display: inline-flex;              /* enables centring */
  align-items: center;               /* vertical centring */
  justify-content: center;           /* horizontal centring */

  background: var(--accent);
  color: #000;
  font-weight: 900;
  font-size: clamp(26px, 4vh, 34px);
  
  padding: 10px 28px;                /* balanced vertical padding */
  border-radius: 12px;
  box-shadow: 0 2px 0 rgba(0,0,0,0.35);
  white-space: nowrap;
  line-height: 1.1;                  /* prevents tall text box */
}

/* Description under chip */
.roc-desc {
  max-width: 95%;
  font-size: clamp(16px, 2.4vh, 20px);
  font-weight: 700;
  color: #eaeaea;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Operator chip — same centre alignment */
.roc-operator-big {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 22px;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: clamp(14px, 2.2vh, 18px);
  font-weight: 900;
  color: #fff;
  white-space: nowrap;
}

.roc-op-swatch-big {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(0,0,0,0.4) inset;
}

/* FULL WIDTH search bar (no clear button) */

.roc-input-row {
  width: 100%;
  display: block;              /* no columns, no grid */
  overflow: hidden;            /* prevent any creeping */
}



.roc-input-full {
  display: block;
  width: 100%;
  box-sizing: border-box;      /* critical fix: prevents overflow */
  
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.06);

  color: var(--text);
  font-weight: 800;
  font-size: clamp(15px, 2.4vh, 20px);
  letter-spacing: .3px;

  outline: none;
  transition: border-color .2s ease,
              background .2s ease,
              box-shadow .2s ease;
}

.roc-input-full:focus {
  border-color: rgba(255,224,74,0.7);
  background: rgba(255,255,255,0.10);
  box-shadow: 0 0 0 3px rgba(255,224,74,0.15);
}

  </style>
</head>
<body>
  <div class="app">
    <!-- =========================
         CONTENT (Top 90%)
         ========================= -->
    <section class="content" aria-label="Main dashboard area">
      <!-- Column 1 -->
      <div class="col1">
        <!-- Top-left: Abnormal Traffic -->
        <div class="frame" id="frame-a" aria-labelledby="frame-a-title">
          <div class="frame-header" id="frame-a-title">Highways Health &amp; Abnormal Traffic</div>

  <script>
    /* =======================================================
       Utilities & Aesthetic helpers
       ======================================================= */
    function withCacheBust(url){
      const sep = url.includes('?') ? '&' : '?';
      return `${url}${sep}ts=${Date.now()}`;
    }
    function fmtHHMMSS(){
      try{
        return new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
          .format(new Date());
      }catch(e){
        const d = new Date();
        const pad = n => String(n).padStart(2,'0');
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }
    }
    function setStatusPill(ok, {animate=false}={}){
      const pill = document.getElementById('statusPill');
      const bee  = document.getElementById('beeLogo');
      const t = fmtHHMMSS();
      if (ok){
        pill.classList.remove('status-error');
        pill.textContent = `LIVE • ${t}`;
        if (animate && bee){
          bee.classList.remove('bee-wibble');
          void bee.offsetWidth;
          bee.classList.add('bee-wibble');
        }
      } else {
        pill.classList.add('status-error');
        pill.textContent = `Stand By • ${t}`;
      }
    }

    /* ========= HIDE / SUPPRESSION (60 minutes) ========= */
    const HIDE_MS = 60 * 60 * 1000;
    function hideStorageKey(prefix, id){ return `hide_${prefix}_${id}`; }
    function getHideEntry(prefix, id){
      const raw = localStorage.getItem(hideStorageKey(prefix, id));
      if (!raw) return null;
      if (/^\d+$/.test(raw)) return { until: Number(raw) };
      try{
        const obj = JSON.parse(raw);
        if (obj && typeof obj.until === 'number') return obj;
      }catch(e){}
      const n = Number(raw);
      return Number.isFinite(n) ? { until:n } : null;
    }
    function setHideEntry(prefix, id, entry){
      localStorage.setItem(hideStorageKey(prefix, id), JSON.stringify(entry));
    }
    function clearHide(prefix, id){
      localStorage.removeItem(hideStorageKey(prefix, id));
    }
    function hideForHour(prefix, id, baseline={}){
      setHideEntry(prefix, id, { until: Date.now() + HIDE_MS, baseline, createdAt: Date.now() });
    }
    function isHiddenWithAutoCheck(prefix, id, currentMetrics={}){
      const entry = getHideEntry(prefix, id);
      if (!entry) return false;
      if (Date.now() > (Number(entry.until)||0)){
        clearHide(prefix, id);
        return false;
      }
      const base = entry.baseline || {};
      let autoUnhide = false;
      if (prefix === 'corr'){
        const curr = Number(currentMetrics.abnPct);
        const b = Number(base.abnPct);
        if (Number.isFinite(curr) && Number.isFinite(b) && b > 0 && curr >= b * 1.5){
          autoUnhide = true;
        }
      } else if (prefix === 'acc'){
        const curr = Number(currentMetrics.conf);
        const b = Number(base.conf);
        if (Number.isFinite(curr) && Number.isFinite(b) && curr >= b + 2){
          autoUnhide = true;
        }
      }
      if (autoUnhide){
        clearHide(prefix, id);
        return false;
      }
      return true;
    }

    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('.hide-btn');
      if (!btn) return;
      ev.preventDefault(); ev.stopPropagation();
      const prefix = btn.getAttribute('data-prefix') || '';
      const id     = btn.getAttribute('data-id') || '';
      if (!prefix || !id) return;
      const baseline = {};
      const abn = btn.getAttribute('data-baseline-abnpct');
      const conf = btn.getAttribute('data-baseline-conf');
      if (abn != null && abn !== '' && isFinite(Number(abn))) baseline.abnPct = Number(abn);
      if (conf != null && conf !== '' && isFinite(Number(conf))) baseline.conf = Number(conf);
      hideForHour(prefix, id, baseline);
      const container = btn.closest('.card, .corridor');
      if (container) {
        container.remove();
        const wazeHost = document.getElementById('waze-panel');
        if (wazeHost && wazeHost.contains(container)) {
          requestAnimationFrame(ensureWazeFits);
        }
      }
    }, { passive: false });

    function unhideAll(){
      const keys = [];
      for (let i=0; i<localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.startsWith('hide_')) keys.push(k);
      }
      keys.forEach(k => localStorage.removeItem(k));
      try{ clearTimeout(tvtTimer); }catch{}
      try{ clearTimeout(wazeTimer); }catch{}
      try{ clearTimeout(divTimer); }catch{}
      tvtTimer = null; wazeTimer = null; divTimer = null;
      tvtCycle(); wazeCycle(); divertsCycle();
    }

    /* =======================================================
       TVT PANEL (left) — trimmed logic
       ======================================================= */
    const TVT_URL = 'https://occproxy-6dem.vercel.app/api/proxy?url=https://www.waze.com/row-partnerhub-api/feeds-tvt/?id=1709296452339';
    const TVT_REFRESH_MS = 5 * 60 * 1000;
    let tvtTimer = null;

    function escapeHTML(str){
      return String(str).replace(/[&<>\"']/g, ch =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])
      );
    }
    function corridorDisplayName(r){
      const base = String(r?.name || r?.toName || 'Unnamed corridor');
      const parts = base.split(' - ');
      return (parts[0] || base).trim();
    }
    function fmtMins(secOrMs){
      const s = typeof secOrMs === 'number' && secOrMs > 5e6 ? Math.round(secOrMs/1000) : Math.round(secOrMs||0);
      const m = Math.max(0, Math.round(s/60));
      return `${m} min`;
    }
    function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
    function lerp(a,b,t){ return a + (b-a)*t; }

    function networkGradientFromUsersOnJams(usersOnJams){
      if (!Array.isArray(usersOnJams) || usersOnJams.length === 0) {
        return 'linear-gradient(90deg,#42BE4B,#ffe04a,#ff4d4f)';
      }
      const levelColors = { 0:'#42BE4B', 1:'#9ddc43', 2:'#ffe04a', 3:'#ff9a1f', 4:'#ff4d4f' };
      const total = usersOnJams.reduce((a,u)=>a + (Number(u.wazersCount)||0), 0) || 1;
      let acc = 0, stops=[];
      usersOnJams.slice().sort((a,b)=>a.jamLevel-b.jamLevel).forEach(u=>{
        const pct = (Number(u.wazersCount)||0)/total*100;
        const start = acc, end = acc + pct;
        stops.push(`${levelColors[u.jamLevel] || '#666'} ${start.toFixed(2)}% ${end.toFixed(2)}%`);
        acc = end;
      });
      return `linear-gradient(90deg, ${stops.join(', ')})`;
    }
    function computeTopNAbnormal(routesRaw, n = 15){
      const routes = Array.isArray(routesRaw) ? routesRaw.slice() : [];
      const candidates = routes
        .map(r => {
          const time = Number(r.time)||0;
          const hist = Number(r.historicTime)||0;
          const abn  = (hist > 0 && time > 0) ? (time - hist) / hist : -Infinity;
          return { r, time, hist, abn };
        })
        .filter(x => Number.isFinite(x.abn));
      const topN = candidates
        .sort((a,b)=> b.abn - a.abn || b.time - a.time)
        .slice(0, n)
        .map(x => x.r);
      return topN;
    }
    const prevShownRoutes = new Map();
    const routeKey = (r) => String(r?.id ?? r?.name ?? corridorDisplayName(r) ?? '').trim();

    function renderTvtPanel(data){
      const host = document.getElementById('abnormal-traffic');
      const list = document.getElementById('tvt-corridors');
      const net = host.querySelector('.network-bar');
      if (net){ net.style.background = networkGradientFromUsersOnJams(data?.usersOnJams || []); }
      const rawTop = computeTopNAbnormal(data?.routes || [], 15);
      const withMetrics = rawTop.map(r => {
        const time = Number(r.time)||0, hist = Number(r.historicTime)||0;
        const abnPct = (hist>0 && time>0) ? Math.round(((time - hist)/hist)*100) : 0;
        return { r, id: routeKey(r), time, hist, abnPct };
      });
      const filtered = withMetrics.filter(it => !isHiddenWithAutoCheck('corr', it.id, { abnPct: it.abnPct }));
      const itemHTML = (it) => {
        const { r, time, hist, abnPct, id } = it;
        const color = '#2ecc71';
        const title = escapeHTML(corridorDisplayName(r));
        return `
          <div class="corridor" title="${escapeHTML(r?.name||'')}">
            <div class="title">
              <span class="name">${title}</span>
              <span class="spacer"></span>
              <button class="hide-btn" data-prefix="corr" data-id="${escapeHTML(id)}" data-baseline-abnpct="${abnPct}" type="button">Hide</button>
            </div>
            <div class="bar" style="background:${color}"></div>
            <div class="meta">Now: ${fmtMins(time)} • Historic: ${fmtMins(hist)} ${Number.isFinite(abnPct)? `• ${abnPct>=0?'+':''}${abnPct}%` : ''}</div>
          </div>
        `;
      };
      list.innerHTML = filtered.length
        ? filtered.map(itemHTML).join('')
        : `<div class="corridor"><div class="title"><span class="name">No abnormal corridors</span></div><div class="bar"></div><div class="meta">—</div></div>`;
      filtered.forEach(it => prevShownRoutes.set(it.id, { time: Number(it.time)||0 }));
      list.scrollTop = 0;
    }
    async function fetchTVT(signal){
      const res = await fetch(withCacheBust(TVT_URL), { cache:'no-store', signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      const trimmed = text.replace(/^\uFEFF/, '').trim();
      return JSON.parse(trimmed);
    }
    async function tvtCycle(){
      let ctrl = new AbortController();
      try{
        const data = await fetchTVT(ctrl.signal);
        renderTvtPanel(data);
        setStatusPill(true, { animate:true });
      }catch(e){
        console.error('[TVT] fetch failed:', e);
        setStatusPill(false, { animate:false });
      }finally{
        clearTimeout(tvtTimer);
        tvtTimer = setTimeout(tvtCycle, TVT_REFRESH_MS);
      }
    }

    /* =======================================================
       WAZE ALERTS (right) — trimmed logic
       ======================================================= */
    const WAZE_URL = 'https://www.waze.com/row-partnerhub-api/partners/11867436614/waze-feeds/4e8ef399-d6b9-4338-9840-7c2beacd235b?format=1';
    const WAZE_REFRESH_MS = 30000;
    const PROXIES = [
      (url) => `https://occproxy-6dem.vercel.app/api/proxy?url=${encodeURIComponent(url)}`,
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    ];
    async function fetchViaProxies(url, signal){
      const busted = withCacheBust(url);
      const errors = [];
      for(const build of PROXIES){
        const proxied = build(busted);
        try{
          const res = await fetch(proxied, { cache:'no-store', signal });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          const trimmed = text.replace(/^\uFEFF/, '').trim();
          if(!trimmed || trimmed[0] !== '{') throw new Error('Non-JSON response');
          return JSON.parse(trimmed);
        }catch(e){ errors.push(`${proxied}: ${e.message}`); }
      }
      throw new Error(`All proxies failed\n${errors.join('\n')}`);
    }
    function toRad(deg){ return deg * Math.PI / 180; }
    function haversineMeters([lon1, lat1], [lon2, lat2]){
      const R = 6371000, dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function stableClusterId(coord){
      const lon = Number(coord[0]).toFixed(4);
      const lat = Number(coord[1]).toFixed(4);
      return `cluster-${lon},${lat}`;
    }
    function readConfidence(a){ return Number(a.confidence ?? a.confidenceLevel ?? a.level ?? 0) || 0; }
    function readReliability(a){ return Number(a.reliability ?? a.reliabilityScore ?? 0) || 0; }
    function readType(a){ return String(a.type || a.alertType || '').toUpperCase(); }
    function readSubType(a){ return String(a.subtype || a.subType || a.sub_type || '').toUpperCase(); }
    function readDesc(a){ return String(a.description || a.reportDescription || a.title || '').toUpperCase(); }
    function getLngLatFromAlert(a){
      try{
        if(a){
          if(a.location){
            const loc = a.location;
            if(typeof loc.x==='number' && typeof loc.y==='number') return [loc.x, loc.y];
            if(typeof loc.lon==='number' && typeof loc.lat==='number') return [loc.lon, loc.lat];
            if(Array.isArray(loc.coordinates) && loc.coordinates.length>=2) return [loc.coordinates[0], loc.coordinates[1]];
            if(loc.point && typeof loc.point.x==='number' && typeof loc.point.y==='number') return [loc.point.x, loc.point.y];
          }
          if(a.geometry?.coordinates && a.geometry.coordinates.length>=2){
            const c = a.geometry.coordinates; if(typeof c[0]==='number' && typeof c[1]==='number') return [c[0], c[1]];
          }
          if(typeof a.longitude==='number' && typeof a.latitude==='number') return [a.longitude, a.latitude];
        }
      }catch(e){}
      return null;
    }
    function isAccident(a){
      const t = readType(a);
      const st = readSubType(a);
      return t.includes('ACCIDENT') || st.includes('ACCIDENT');
    }
    function isIceAlert(a){
      const t = readType(a), st = readSubType(a), d = readDesc(a);
      return ( t.includes('ICE') || st.includes('ICE') ||
               /RECENT(LY)?\s+FORMED\s+ICE|BLACK\s*ICE|\bICE\b|\BICY\b/.test(d) );
    }
    function isTrafficLightFault(a){
      const t = readType(a), st = readSubType(a), d = readDesc(a);
      return ( t.includes('TRAFFIC') && t.includes('LIGHT')
            || st.includes('TRAFFIC_LIGHT') || st.includes('LIGHT_FAULT')
            || /BROKEN\s+TRAFFIC\s+LIGHT|TRAFFIC\s+LIGHT\s+FAULT|SIGNAL\s+FAULT/i.test(d) );
    }
    function dedupAccidentClusters(clusters, opts={}){
      const { corridorMeters = 8000 } = opts;
      if (!Array.isArray(clusters) || clusters.length === 0) return [];
      const groups = new Map();
      for (const c of clusters){
        const token = (c.street||'').toUpperCase().match(/\b([MBA]\d{1,4})\b/);
        const key = token ? token[1] : (c.street||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim() || '___unknown___';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(c);
      }
      const kept = [];
      for (const arr of groups.values()){
        arr.sort((a,b)=>
          (Number(b.effectiveConfidence||0) - Number(a.effectiveConfidence||0)) ||
          (Number(b.time||0) - Number(a.time||0))
        );
        const chosen = [];
        const H = ([lon1,lat1],[lon2,lat2])=>{
          const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
          const A=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
          return 2*R*Math.atan2(Math.sqrt(A), Math.sqrt(1-A));
        };
        for (const c of arr){
          let dup = false;
          for (const k of chosen){
            const dist = H(c.coord, k.coord);
            if (dist <= corridorMeters){ dup = true; break; }
          }
          if (!dup) chosen.push(c);
        }
        kept.push(...chosen);
      }
      kept.sort((a,b)=>
        (Number(b.effectiveConfidence||0) - (Number(a.effectiveConfidence||0))) ||
        (Number(b.time||0) - (Number(a.time||0)))
      );
      return kept;
    }
    function ensureWazeFits(){
      const host = document.getElementById('waze-panel');
      if (!host) return;
      const highAccWrap = document.getElementById('cards-acc-high');
      const lowAccWrap  = document.getElementById('cards-acc-low');
      const weatherWrap = document.getElementById('cards-weather');
      let guard = 0;
      const fits = () => host.scrollHeight <= host.clientHeight + 2;
      while(!fits() && weatherWrap && weatherWrap.lastElementChild && guard++ < 500){
        weatherWrap.removeChild(weatherWrap.lastElementChild);
      }
      while(!fits() && lowAccWrap && lowAccWrap.lastElementChild && guard++ < 1000){
        lowAccWrap.removeChild(lowAccWrap.lastElementChild);
      }
      host.style.overflow = fits() ? 'hidden' : 'auto';
      const toggleSection = (secId, wrapIds) => {
        const sec = document.getElementById(secId);
        const hasAny = wrapIds.some(id => {
          const el = document.getElementById(id);
          return el && el.children.length > 0;
        });
        if (sec) sec.style.display = hasAny ? 'grid' : 'none';
      };
      toggleSection('sec-accidents', ['cards-acc-high','cards-acc-low']);
      toggleSection('sec-weather', ['cards-weather']);
      toggleSection('sec-signals', ['cards-signals']);
    }
    function bindCardClicks(){
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', (ev) => {
          if (ev.target && ev.target.closest('.hide-btn')) return;
          const lon = Number(card.getAttribute('data-lon'));
          const lat = Number(card.getAttribute('data-lat'));
          if (Number.isFinite(lon) && Number.isFinite(lat)){
            const u = new URL('https://www.waze.com/partnerhub/map-tool');
            u.searchParams.set('lon', String(lon));
            u.searchParams.set('lat', String(lat));
            window.open(u.toString(), '_blank', 'noopener');
          }
        }, { passive: true });
      });
    }
    let wazeTimer = null;
    async function wazeCycle(){
      const ctrl = new AbortController();
      try{
        const data = await fetchViaProxies(WAZE_URL, ctrl.signal);
        const accidentPoints = (()=>{
          const out=[], a=(data&&Array.isArray(data.alerts))?data.alerts:[];
          for(const x of a){
            if(!isAccident(x)) continue;
            const c=readConfidence(x);
            if(!(c>0)) continue;
            const coord=getLngLatFromAlert(x); if(!coord) continue;
            out.push({
              coord, conf10:c, rel10:readReliability(x),
              street:x.street||x.roadName||x.address||'Unknown road',
              city:x.city||x.town||'',
              time:x.pubMillis||x.updateTime||x.reportMillis||0,
              id:x.uuid||x.id||`${coord[0]},${coord[1]},${x.pubMillis||''}`
            });
          } return out;
        })();
        const accidentClustersRaw = accidentPoints.length? (function cluster(points, merge=200){
          if(points.length===0) return [];
          const parent=Array(points.length).fill(0).map((_,i)=>i);
          const find=x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
          const union=(a,b)=>{ a=find(a); b=find(b); if(a!==b) parent[a]=b; };
          for(let i=0;i<points.length;i++){
            for(let j=i+1;j<points.length;j++){
              const d=haversineMeters(points[i].coord, points[j].coord);
              if(d<=merge) union(i,j);
            }
          }
          const groups=new Map();
          for(let i=0;i<points.length;i++){
            const r=find(i);
            if(!groups.has(r)) groups.set(r, []);
            groups.get(r).push(points[i]);
          }
          const clusters=[];
          for(const members of groups.values()){
            const count=members.length;
            const baseConf10=members.reduce((m,p)=>Math.max(m, Number(p.conf10)||0), 0);
            const bestRel10=members.reduce((m,p)=>Math.max(m, Number(p.rel10)||0), 0);
            let eff10=baseConf10 + (bestRel10>8?2:0);
            eff10=Math.max(0, Math.min(12, eff10));
            const eff5=Math.max(1, Math.min(5, Math.round(eff10/2)));
            const avg=members.reduce((acc,m)=>[acc[0]+m.coord[0], acc[1]+m.coord[1]],[0,0]).map(v=>v/count);

            const best=members.slice().sort((a,b)=>((Number(b.conf10)||0)-(Number(a.conf10)||0))||((Number(b.time)||0)-(Number(a.time)||0)))[0];
            clusters.push({ id: stableClusterId(avg), coord: avg, street: best.street, city: best.city, effectiveConfidence: eff5, time: maxTime, reportCount: count });
          }
          clusters.sort((a,b)=>(Number(b.effectiveConfidence||0)-(Number(a.effectiveConfidence||0)))||((Number(b.time||0)-(Number(a.time||0)))));
          return clusters;
        })(accidentPoints) : [];

    function dTodayBounds(){
      const now = new Date();
      const s = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0,0);
      const e = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59,999);
      return { start:s, end:e };
    }
    function dIsToday(d){
      if (!d) return false;
      const {start, end} = dTodayBounds();
      return d >= start && d <= end;
    }
    function dFmtHM(d){ return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(d); }
    function dWeekday(d){ return new Intl.DateTimeFormat('en-GB',{weekday:'long'}).format(d); }
    function dFullMonth(d){ return new Intl.DateTimeFormat('en-GB',{month:'long'}).format(d); }
    function dOrdinal(n){ const s=["th","st","nd","rd"], v=n%100; return n + (s[(v-20)%10] || s[v] || s[0]); }
    function dFormatLabel(d){
      if(!d) return "—";
      if (dIsToday(d)) return `${dFmtHM(d)} Today`;
      const now = new Date();
      const weekStart = new Date(now);
      weekStart.setDate(now.getDate() - ((now.getDay()+6)%7));
      weekStart.setHours(0,0,0,0);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate()+6);
      weekEnd.setHours(23,59,59,999);
      if (d>=weekStart && d<=weekEnd) return dWeekday(d);
      return `${dOrdinal(d.getDate())} ${dFullMonth(d)}`;
    }
    function dDuration(start, end){
      if(!start) return "—";
      const now = new Date();
      const endTime = end || now;
      let ms = endTime - start;
      if (ms < 0) return "—";
      const s = ms/1000;
      if (s < 60)  return `${Math.round(s)}s`;
      const m = s/60;
      if (m < 60)  return `${Math.round(m)}m`;
      const h = m/60;
      if (h < 24)  return `${Math.round(h)}h`;
      const d = h/24;
      return `${Math.round(d)}d`;
    }

    function divGetOperatorRefs(sit){
      const refs = new Set();
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;

    function divGetSingleOperatorRef(sit){
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      if(Array.isArray(avj) && avj.length && avj[0]?.OperatorRef) return String(avj[0].OperatorRef);
      if(avj && avj.OperatorRef) return String(avj.OperatorRef);
      if(sit?.OperatorRef) return String(sit.OperatorRef);
      if(sit?.__operatorRefs && sit.__operatorRefs.length) return sit.__operatorRefs[0];

    function divGetLineRefs(sit){
      const lines = new Set();
      const avj = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney;
      const pushVal = (val)=>{ if(val == null) return; const s = String(val).trim(); if(s) lines.add(s); };
      if(Array.isArray(avj)){
        for(const j of avj){ pushVal(j?.LineRef || j?.PublishedLineName || j?.LineName); }
      }else if(avj){ pushVal(avj?.LineRef || avj?.PublishedLineName || avj?.LineName); }
      if(Array.isArray(sit.__lineRefs)){ for(const v of sit.__lineRefs) pushVal(v); }
      if(lines.size === 0){
        const fallback = sit?.Affects?.VehicleJourneys?.AffectedVehicleJourney?.[0]?.LineRef;

      return Array.from(lines);

    function divParseSummaryParts(summaryText){
      if(!summaryText) return null;
      const str = String(summaryText);
      const hyIdx = str.indexOf(" - ");
      if(hyIdx === -1) return null;
      const left = str.slice(0, hyIdx).trim();
      const lastComma = left.lastIndexOf(",");
      if(lastComma === -1) return null;
      const place = left.slice(0, lastComma).trim();
      const town  = left.slice(lastComma + 1).trim();
      if(!place || !town) return null;
      return { place, town };
    }

            ParticipantRef: T("ParticipantRef"),

    function divBuildOpTag(operatorRefs){
      const tag = document.createElement('div');
      tag.className = 'op-tag';

      const dot = document.createElement('span');
      dot.className = 'op-dot';

      const upperRefs = (operatorRefs || []).map(r => String(r).toUpperCase());
      const codes = upperRefs.map(r => DIV_OP_MAP[r] || r);
      const colors = upperRefs.map(r => DIV_OP_COLORS[r]).filter(Boolean);

      dot.style.backgroundColor = colors[0] || '#cfcfd6';

      const rot = document.createElement('div');

      if (codes.length <= 1){
        const c = document.createElement('span');
        c.textContent = codes[0] || '—';
        c.className = 'op-code active';
        rot.appendChild(c);
      } else {
        codes.forEach((c, i) => {
          const el = document.createElement('span');
          el.textContent = c;
          el.className = 'op-code' + (i === 0 ? ' active' : '');
          rot.appendChild(el);
        });

        let idx = 0;
        const rotateCodes = () => {
          const children = rot.querySelectorAll('.op-code');
          if (children.length <= 1) return;
          children[idx].classList.remove('active');
          idx = (idx + 1) % children.length;
          children[idx].classList.add('active');
        };
        const codeInterval = setInterval(rotateCodes, 3200);

        let cIdx = 0;
        const cycleDot = () => {
          if (colors.length <= 1) return;
          cIdx = (cIdx + 1) % colors.length;
          dot.style.backgroundColor = colors[cIdx] || '#cfcfd6';
        };
        const dotInterval = setInterval(cycleDot, 3200);

        const observer = new MutationObserver(() => {
          if (!document.body.contains(tag)){
            clearInterval(codeInterval);
            clearInterval(dotInterval);
            observer.disconnect();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      tag.appendChild(rot);
      return tag;
    }

    const ROC_CSV_URL = 'https://ryanocc.github.io/Routes.csv';

    const ROC_OPERATOR_PRIORITY = [
      { name: 'STAGECOACH MANCHESTER', code: 'SC', color: '#ff9a1f' },
      { name: 'METROLINE MANCHESTER',  code: 'ML', color: '#ff4d4f' },

    const ROC_OPERATOR_INDEX = ROC_OPERATOR_PRIORITY.reduce((m,o)=>{ m[o.name]=o; return m; }, {});

    const ROC_STATE = {
      rows: [],

    };

    function rocNormalizeRoute(raw){
      const s = String(raw||'').toUpperCase().replace(/\s+/g,'');
      const m = s.match(/^([A-Z]*)(\d+)?([A-Z]*)$/);
      if (!m) return s;
      const prefix = m[1] || '';
      const digits = (m[2] || '').replace(/^0+/, '') || (m[2] ? '0' : '');
      const suffix = m[3] || '';
      return `${prefix}${digits}${suffix}`;
    }

    function textColorForBg(hex){
      try{
        const h = hex.replace('#','');
        const r = parseInt(h.substring(0,2),16);
        const g = parseInt(h.substring(2,4),16);
        const b = parseInt(h.substring(4,6),16);
        const yiq = (r*299 + g*587 + b*114) / 1000;
        return yiq >= 150 ? '#000' : '#fff';
      }catch{ return '#000'; }
    }

    async function rocFetchCSV(){
      if (ROC_STATE.fetching || ROC_STATE.fetched) return;
      ROC_STATE.fetching = true;

      const status = document.getElementById('roc-status');
      if (status) status.textContent = 'Loading route list…';

      try{
        const res = await fetch(ROC_CSV_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();

        const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
        const header = lines.shift() || '';
        const delim = header.includes(';') ? ';' : ',';

        const h = header.split(delim).map(s => s.trim().toLowerCase());
        const idxRoute = h.indexOf('route');
        const idxDesc  = h.indexOf('description');
        const idxOper  = h.indexOf('operator');

        if (idxRoute === -1 || idxDesc === -1 || idxOper === -1){
          throw new Error('Unexpected CSV header. Expected: route, description, operator');
        }

        const rows = [];
        for (const line of lines){
          const parts = line.split(delim);
          if (parts.length < 3) continue;
          const route = (parts[idxRoute] || '').trim();
          const description = (parts[idxDesc] || '').trim();
          const operator = (parts[idxOper] || '').trim();
          if (!route) continue;
          rows.push({ route, description, operator });
        }

        ROC_STATE.rows = rows;
        ROC_STATE.fetched = true;

        if (status) status.textContent = `Loaded ${rows.length} routes`;
      }catch(e){
        console.error('[ROC] CSV fetch failed:', e);
        const status = document.getElementById('roc-status');
        if (status) status.textContent = 'Unable to load routes (stand by)';
      }finally{
        ROC_STATE.fetching = false;
      }
    }

      const host = document.getElementById('roc-result');
      if (!host) return;

      const opName = String(row.operator || '').trim().toUpperCase();
      const map = ROC_OPERATOR_INDEX[opName] || mappedOp || null;

      const code  = map?.code  || '';
      const color = map?.color || '';
      const pillStyle = color ? `background:${color}; border-color: rgba(255,255,255,0.22); color:${textColorForBg(color)}` : '';

const html = `
  <div class="roc-card">

    <div class="roc-route-big">
      ${escapeHTML(row.route)}
    </div>

    <div class="roc-desc">
      ${escapeHTML(row.description || '—')}
    </div>

    <div class="roc-operator-big" style="${pillStyle}">
      <span class="roc-op-swatch-big" style="${color ? `background:${color}` : ''}"></span>
      <span>${code || '—'}</span>
      <span>• ${escapeHTML(row.operator || 'Unknown')}</span>
    </div>

  </div>
`;
host.innerHTML = html;
    }

    function chooseBestRowForExactRoute(candidates){
      if (!Array.isArray(candidates) || candidates.length === 0) return null;
      const byName = new Map();
      candidates.forEach((r,i) => byName.set(String(r.operator||'').trim().toUpperCase(), i));
      for (const pref of ROC_OPERATOR_PRIORITY){
        const idx = byName.get(pref.name);
        if (idx != null) return { row: candidates[idx], mapped: pref };
      }
      return { row: candidates[0], mapped: null };
    }

    function rocSearch(q){
      const status = document.getElementById('roc-status');
      const host = document.getElementById('roc-result');
      if (!host) return;

      const normInput = rocNormalizeRoute(q);
      if (!normInput){
        rocRenderPrompt();
        if (status) status.textContent = '';
        return;
      }

      const exactCandidates = ROC_STATE.rows.filter(r => rocNormalizeRoute(r.route) === normInput);

      if (exactCandidates.length === 0){
        rocRenderNoMatch();
        if (status) status.textContent = '';
        return;
      }

      const picked = chooseBestRowForExactRoute(exactCandidates);
      if (!picked){
        rocRenderNoMatch();
        if (status) status.textContent = '';
        return;
      }

      rocRenderResult(picked.row, picked.mapped);
      if (status) status.textContent = exactCandidates.length > 1
        ? `Found ${exactCandidates.length} entries • showing best operator match`
        : `Found 1 match`;
    }

    function rocBind(){
      const input = document.getElementById('roc-input');

      if (!input) return;

      let t = null;
      const onChange = () => {
        const q = input.value || '';
        ROC_STATE.lastQuery = q;
        clearTimeout(t);
        t = setTimeout(() => rocSearch(q), 120);
      };

      input.addEventListener('input', onChange, { passive: true });
      input.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          clearTimeout(t);
          rocSearch(input.value || '');
        }
      });



      rocRenderPrompt();
    }

    /* =======================================================
       BOOT / VISIBILITY
       ======================================================= */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){
        clearTimeout(tvtTimer); tvtTimer = null;
        clearTimeout(wazeTimer); wazeTimer = null;
        clearTimeout(divTimer);  divTimer  = null;
      } else {
        tvtCycle();
        wazeCycle();
        divertsCycle();
      }
    });
    window.addEventListener('load', () => {
      setStatusPill(false, { animate:false });
      const unhideBtn = document.getElementById('unhideAllBtn');
      if (unhideBtn){ unhideBtn.addEventListener('click', unhideAll, { passive: true }); }
      tvtCycle();     // left
      wazeCycle();    // right
      divertsCycle(); // centre

      // ROC
      rocBind();
      rocFetchCSV().then(() => {
        if ((ROC_STATE.lastQuery || '').trim()){
          rocSearch(ROC_STATE.lastQuery);
        }
      });

      window.addEventListener('resize', () => requestAnimationFrame(ensureWazeFits));
    });
  </script>
</body>
</html>
